<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>阿里云 ACP 大模型 · 离线题库</title>
<style>
  /* ============ 设计变量：白底 / 黑字 / 蓝着重 ============ */
  :root{
    --bg:#ffffff;
    --fg:#14171c;            /* 正文近黑 */
    --fg2:#3f4753;           /* 次级文字 */
    --muted:#8b939e;         /* 弱化文字 */
    --pri:#1668ff;           /* 蓝色着重 */
    --pri-hi:#0b4fd1;        /* 深蓝（悬停/按下） */
    --pri-soft:#f0f5ff;      /* 淡蓝底 */
    --pri-line:#cfe0ff;      /* 淡蓝描边 */
    --ok:#0b8a4d;
    --ok-soft:#edf9f2;
    --ok-line:#b7e6cc;
    --bad:#d3242f;
    --bad-soft:#fdefef;
    --bad-line:#f6c9cc;
    --line:#e8ebef;
    --line-2:#f2f4f7;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
    --shadow-hi:0 2px 6px rgba(22,104,255,.14), 0 10px 30px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  b,strong{font-weight:650}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}

  /* ============ 顶栏 ============ */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  /* 顶部蓝色细条 */
  header::before{
    content:"";position:absolute;left:0;right:0;top:0;height:2.5px;
    background:linear-gradient(90deg,var(--pri) 0%,#4d94ff 55%,#9cc4ff 100%);
  }
  .hdr{max-width:900px;margin:0 auto;padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
  .brand{min-width:0;flex:1}
  .brand h1{
    margin:0;font-size:16px;font-weight:700;letter-spacing:.15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);
  }
  .brand .sub{
    margin-top:3px;font-size:11.5px;color:var(--muted);
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  }
  .brand .sub b{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}
  .brand .sub i{font-style:normal;opacity:.45}

  .iconbtn{
    flex:none;border:1px solid var(--line);background:#fff;color:var(--fg2);
    height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    white-space:nowrap;transition:.15s;
  }
  .iconbtn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .iconbtn.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .iconbtn.on:hover{background:var(--pri-hi);color:#fff}

  /* ============ 计时条 ============ */
  .clock-outer{
    max-width:900px;margin:0 auto;padding:0 16px 9px;
    display:flex;align-items:center;gap:12px;
  }
  /* 数字区可横向滚动，按钮固定在右侧不参与滚动 */
  .clock{
    display:flex;align-items:center;gap:16px;
    overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;
  }
  .clock::-webkit-scrollbar{display:none}
  .clock-i{display:flex;align-items:baseline;gap:5px;flex:none}
  .clock-lb{font-size:11px;color:var(--muted);letter-spacing:.3px}
  .clock-v{
    font-size:14.5px;font-weight:700;color:var(--pri);
    font-variant-numeric:tabular-nums;
  }
  .clock-v.dim{color:var(--muted)}
  .clock-v.warn{color:var(--bad)}
  .clock-sep{flex:none;width:1px;height:12px;background:var(--line)}
  .clock-btn{
    flex:none;border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:11.5px;padding:3px 10px;border-radius:7px;
    cursor:pointer;transition:.15s;font-weight:500;
  }
  .clock-btn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .clock-btn.paused{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri);font-weight:600}

  /* ============ 进度条 + 标签 ============ */
  .bar{max-width:900px;margin:0 auto;padding:0 16px}
  .bar .track{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:9px}
  .bar .fill{height:100%;width:0;background:var(--pri);border-radius:2px;transition:width .3s cubic-bezier(.4,0,.2,1)}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:500;
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .tab:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(22,104,255,.22)}
  .tab.on:hover{background:var(--pri-hi);color:#fff}
  .tab .n{opacity:.72;font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums}

  /* ============ 卡片 ============ */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:15px;
    box-shadow:var(--shadow);padding:20px 20px 18px;margin-bottom:14px;
  }
  .qhead{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .badge{
    font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line);
  }
  .badge.t2{background:#fff8ec;color:#a56a00;border-color:#f5e0b8}
  .qidx{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qidx b{color:var(--pri);font-weight:700}
  .spacer{flex:1}
  .qclock{
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;gap:5px;
  }
  /* 用 CSS 画的小圆环代替 emoji 秒表，任何字体下都能稳定显示 */
  .qclock::before{
    content:"";width:8px;height:8px;border-radius:50%;
    border:2px solid var(--pri);opacity:.85;flex:none;
  }
  .qclock b{color:var(--pri);font-weight:700}
  .star{
    background:none;border:0;cursor:pointer;font-size:19px;line-height:1;padding:2px 4px;
    color:#c9d1de;transition:.15s;
  }
  .star:hover{color:#f0b429;transform:scale(1.1)}
  .star.on{color:#f0b429}
  .qtext{
    font-size:17px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
    margin:0 0 18px;color:var(--fg);font-weight:450;
  }

  /* ============ 选项 ============ */
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1.5px solid var(--line);background:#fff;color:var(--fg);
    border-radius:11px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;
    font:inherit;line-height:1.6;transition:.14s;
  }
  .opt:hover:not(.locked){border-color:var(--pri-line);background:var(--pri-soft)}
  .opt .k{
    flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;
    color:var(--muted);margin-top:1px;transition:.14s;
  }
  .opt .v{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
  .opt.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(22,104,255,.07)}
  .opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
  .opt.sel .v{color:var(--pri-hi);font-weight:500}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.ok .v{color:#0a6e3f;font-weight:500}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.bad .v{color:#a81a23}
  .opt.locked{cursor:default}

  /* ============ 按钮 ============ */
  .actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:9px 18px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:.14s;font-family:inherit;
  }
  .btn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .btn.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--pri-hi);border-color:var(--pri-hi);color:#fff;box-shadow:var(--shadow-hi)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--line);color:var(--fg2);background:#fff;box-shadow:none}
  .btn.primary:disabled:hover{background:var(--pri);border-color:var(--pri);color:#fff;opacity:.4}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--pri-soft);color:var(--pri);border-color:transparent}

  /* ============ 答案 / 解析 ============ */
  .result{
    margin-top:18px;border-radius:12px;padding:15px 17px;
    border:1px solid var(--line);background:var(--line-2);
  }
  .result .rt{
    display:flex;align-items:center;gap:8px;font-weight:700;
    font-size:15px;margin-bottom:7px;
  }
  .result.ok{border-color:var(--ok-line);background:var(--ok-soft)}
  .result.bad{border-color:var(--bad-line);background:var(--bad-soft)}
  .result.ok .rt{color:var(--ok)}
  .result.bad .rt{color:var(--bad)}
  .result.plain .rt{color:var(--pri)}
  .ansline{font-size:13.5px;color:var(--fg2);margin-top:4px;line-height:1.7}
  .ansline b{color:var(--pri);font-weight:700;font-size:14.5px;letter-spacing:.5px}
  .ansline.wrong b{color:var(--bad)}
  .tline{
    display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-top:9px;padding:5px 11px;border-radius:8px;
    background:#fff;border:1px solid var(--line);
    font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;
  }
  .tline b{color:var(--pri);font-weight:700;font-size:13px}
  .tline .tag{
    font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;
    background:var(--pri-soft);color:var(--pri);
  }
  .tline .tag.slow{background:#fff8ec;color:#a56a00}
  .ana{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line);
    font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;
    color:var(--fg);padding-left:13px;border-left:3px solid var(--pri-line);
    border-top:0;margin-left:-2px;
  }
  .ana .lb{
    display:block;font-size:11.5px;font-weight:700;color:var(--pri);
    margin-bottom:5px;letter-spacing:1px;
  }

  /* ============ 空状态 / 杂项 ============ */
  .empty{text-align:center;padding:64px 20px;color:var(--muted)}
  .empty .big{font-size:38px;margin-bottom:12px;opacity:.5}
  .empty h3{margin:0 0 7px;font-size:16.5px;color:var(--fg);font-weight:650}
  .empty p{margin:0 0 18px;font-size:13.5px;line-height:1.7}
  .jump{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;color:var(--muted)}
  .jump input{
    width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--fg);font:inherit;font-size:12.5px;text-align:center;
    font-variant-numeric:tabular-nums;transition:.14s;
  }
  .jump input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(22,104,255,.1)}
  .srch{display:flex;gap:9px;margin-bottom:15px}
  .srch input{
    flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--fg);font:inherit;font-size:14.5px;transition:.14s;
  }
  .srch input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(22,104,255,.1)}
  .srch input::placeholder{color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);text-align:center;padding:24px 0 0;line-height:1.8}
  kbd{
    display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;background:var(--line-2);font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2);
  }

  /* ============ 模拟考试 ============ */
  .examsetup{display:flex;flex-direction:column;gap:16px;align-items:flex-start;width:100%}
  .setup-row{display:flex;flex-direction:column;gap:8px;width:100%}
  .setup-lb{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:8px 17px;border-radius:999px;font-size:13.5px;cursor:pointer;
    transition:.14s;font-family:inherit;font-weight:500;
  }
  .chip:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .chip.on:hover{background:var(--pri-hi);color:#fff}
  .score{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .score .big{
    font-size:44px;font-weight:750;color:var(--pri);
    font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-1px;
  }
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:14px 0}
  .stat{
    background:var(--line-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;text-align:center;
  }
  .stat .v{font-size:18px;font-weight:750;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .review{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-height:380px;overflow:auto}
  .rrow{
    display:flex;gap:10px;align-items:center;padding:9px 12px;
    border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:#fff;
    transition:.13s;
  }
  .rrow:hover{border-color:var(--pri-line);background:var(--pri-soft)}
  .rrow .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .rrow .dot.o{background:var(--ok)} .rrow .dot.x{background:var(--bad)} .rrow .dot.n{background:#cfd6df}
  .rrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .tm{color:var(--pri);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .rrow .r{color:var(--muted);font-size:11.5px;flex:none;min-width:28px;text-align:right}
  .rrow .r.ok{color:var(--ok);font-weight:600}
  .rrow .r.x{color:var(--bad);font-weight:600}

  /* ============ 统计页 ============ */
  .statwrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .statrow{
    display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;
    padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;
  }
  .statrow .sname{font-size:14.5px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px}
  .statrow .sname .tag{
    font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;
    background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line);
  }
  .statrow .srate{font-size:19px;font-weight:750;color:var(--pri);font-variant-numeric:tabular-nums}
  .statrow .srate.none{color:var(--muted);font-size:15px;font-weight:600}
  .bar2{grid-column:1/-1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
  .bar2 i{display:block;height:100%;border-radius:3px;background:var(--pri);transition:width .3s}
  .bar2 i.low{background:var(--bad)}
  .bar2 i.mid{background:#e8a33d}
  .smeta{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .smeta b{color:var(--fg2);font-weight:650;font-variant-numeric:tabular-nums}
  .smeta .w b{color:var(--bad)}

  /* ============ 错题排行 ============ */
  .rank{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .rk{
    display:flex;align-items:center;gap:11px;padding:10px 13px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    cursor:pointer;transition:.13s;text-align:left;width:100%;font:inherit;
  }
  .rk:hover{border-color:var(--pri-line);background:var(--pri-soft)}
  .rk .no{
    flex:none;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;font-size:11.5px;font-weight:700;
    background:var(--line-2);color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .rk.top1 .no{background:var(--bad);color:#fff}
  .rk.top2 .no{background:#e8a33d;color:#fff}
  .rk.top3 .no{background:#d8b04a;color:#fff}
  .rk .body{flex:1;min-width:0}
  .rk .qt{
    font-size:13.5px;line-height:1.5;color:var(--fg);
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .rk .mt{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .rk .mt .badge-s{color:var(--pri);border:1px solid var(--pri-line);background:var(--pri-soft);padding:0 5px;border-radius:4px}
  .rk .cnt{
    flex:none;font-size:15px;font-weight:750;color:var(--bad);
    font-variant-numeric:tabular-nums;min-width:44px;text-align:right;
  }
  .rk .cnt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:1px}

  /* ============ 分段按钮 ============ */
  .seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--line-2);gap:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 13px;border-radius:7px;cursor:pointer;font-weight:500;transition:.13s;
  }
  .seg button:hover{color:var(--fg2)}
  .seg button.on{background:#fff;color:var(--pri);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.08)}

  /* ============ 备份 / 恢复按钮 ============ */
  .backup{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    background:var(--line-2);margin-top:12px;
  }
  .backup .bk-lb{font-size:12px;color:var(--muted);flex:1;min-width:120px}
  .backup .bk-lb b{color:var(--fg2);font-weight:600}
  .btn.sm{padding:6px 13px;font-size:13px;border-radius:8px}

  /* ============ 考试规格表 ============ */
  .examspec{
    display:flex;flex-direction:column;gap:0;
    border:1px solid var(--line);border-radius:11px;overflow:hidden;
    margin:14px 0;background:#fff;
  }
  .specrow{
    display:flex;align-items:center;gap:10px;padding:9px 14px;
    border-bottom:1px solid var(--line-2);font-size:13.5px;
  }
  .specrow:last-child{border-bottom:0}
  .specrow .sk{color:var(--fg2);font-weight:600;min-width:72px}
  .specrow .sv{flex:1;color:var(--muted);font-size:12.5px}
  .specrow .sp{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}

  /* 本题分值标签 */
  .ptbadge{
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;

  .drow.today{background:var(--pri-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
  .drow .ddate{width:96px;flex:none;color:var(--fg2);font-weight:600;font-variant-numeric:tabular-nums}
  .drow .dstat{flex:1;min-width:0;color:var(--muted);line-height:1.5}
  .drow .dstat b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}

  /* ============ 趋势标签 ============ */
  .trendtag{
    display:inline-block;font-size:11.5px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:12px 0 8px;

  .trendtag.flat{background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line)}
  .trendnote{font-size:13.5px;line-height:1.75;color:var(--fg2)}

  /* ============ 考试历史柱状图 ============ */
  .examhist{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
  .histlb{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .histbars{display:flex;gap:5px;align-items:flex-end;height:110px}

  .hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}
  .hbtrack{
    flex:1;width:100%;max-width:40px;background:var(--line-2);
    border-radius:5px 5px 0 0;position:relative;
    display:flex;align-items:flex-end;overflow:hidden;
  }
  .hbtrack i{display:block;width:100%;border-radius:4px 4px 0 0;transition:height .3s}
  .hbtrack i.pass{background:linear-gradient(180deg,#34c06a,var(--ok))}

  .hbpass{

  .hbv{
    font-size:10.5px;font-weight:700;color:var(--fg2);

  .hb.ok .hbv{color:var(--ok)}

  /* ============ 提示条 ============ */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
    background:#14171c;color:#fff;padding:11px 22px;border-radius:11px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.24s cubic-bezier(.4,0,.2,1);z-index:99;

  /* ============ 响应式 ============ */

<script id="bankdata" type="application/json">__DATA__</script>
<script>
(function(){
  "use strict";

  var BANK = JSON.parse(document.getElementById('bankdata').textContent);
  var QS = BANK.questions;
  var BY = Object.create(null);
  QS.forEach(function(q){ BY[q.gid] = q; });

  var LS = 'offline_tiku_' + (BANK.key || 'bank') + '_v1';

  /* 低于这个时长的作答不计入「平均用时」统计：
     通常是手滑连点，不代表真实思考时间。
     但也别设太高（比如 800ms），否则快速作答的题永远进不了统计。 */
  var MIN_T_MS = 300;

  /* 选项文本里出现这些前缀，说明它指向「其它选项」。
     一旦打乱顺序，「以上所有」「上述均不正确」就指向了错的选项。
     这类题必须保持选项原顺序。 */
  var ORDER_DEPENDENT_RE = /^(以上|上述|前[一二三四五六七八九1-9]项)/;

  /* 判断一道题的选项是否可以打乱 */
  function canShuffleOptions(q){
    for(var i=0;i<q.options.length;i++){
      if(ORDER_DEPENDENT_RE.test(String(q.options[i].t || '').trim())) return false;
    }
    return true;
  }

  /* ============================================================
     选项打乱
     难点：解析正文里大量用「A 对」「B 错」「选项 A」「故选 B」指代选项。
     直接打乱会让解析和选项对不上，比不打乱更糟。
     所以：打乱选项的同时，把解析里所有引用字母重映射。
     ============================================================ */

  /* 用题号做种子，同一道题每次都得到同一个排列（不会刷新就变） */
  function seededShuffle(arr, seed){
    var a = arr.slice();
    var s = seed >>> 0;
    if(s === 0) s = 0x9e3779b9;
    for(var i=a.length-1;i>0;i--){
      /* xorshift32，简单且确定性好 */
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;
      var j = s % (i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* 把字符串里作为「选项代号」出现的字母替换掉。
     只换真正的代号，不碰普通英文单词里的字母。 */
  function remapLetters(text, map){
    var t = String(text || '');
    if(!t || !map) return t;
    function L(i){ return String.fromCharCode(65 + i); }
    function M(letter){
      var i = letter.charCodeAt(0) - 65;
      var ni = map[i];
      return (ni == null) ? letter : L(ni);
    }

    /* 关键：不能一条条规则去改同一个字符串。
       因为第一条规则把 A 改成 B 之后，第二条规则会把新出现的 B 当成原字母再改一遍，
       造成级联替换（A→B→C）。
       做法：一次性用一个正则把所有「选项代号位置」标出来，
       在回调里统一替换，全程只扫一遍原文。 */

    /* 一个字母算「选项代号」必须满足以下任一上下文：
         · 「选项A」「选项 A」「A选项」「A 选项」
         · 「A对/错/正确/错误」
         · 「（A对）」「(A错)」
         · 「故选A」「应选A」「选A」
         · 「答案：A」「答案：A、B」
         · 并列列表 A、B / A,B
       其它位置的 A-F（比如 API、ABC、CPU）一律不动。 */
    var RE = new RegExp(
      '(选项\\s*)([A-F])' +                                    // 选项A
      '|([A-F])(\\s*选项)' +                                     // A选项
      '|([（(]\\s*)([A-F])(\\s*)([对错])(\\s*[）)])' +            // （A对）
      '|(故选|应选|选)(\\s*)([A-F])' +                            // 故选A
      '|(答案[:：]\\s*)([A-F](?:\\s*[、,，]\\s*[A-F])*)' +          // 答案：A、B
      '|([A-F])(\\s*)(对|错|正确|错误|不正确)' +                   // A对
      '|([A-F](?:\\s*[、,，]\\s*[A-F])+)'                          // A、B
    , 'g');

    return t.replace(RE, function(){
      var m = arguments;
      /* 各分支按捕获组位置处理 */
      if(m[1] !== undefined) return m[1] + M(m[2]);              // 选项A
      if(m[3] !== undefined) return M(m[3]) + m[4];              // A选项
      if(m[5] !== undefined) return m[5] + M(m[6]) + m[7] + m[8] + m[9]; // （A对）
      if(m[10] !== undefined) return m[10] + m[11] + M(m[12]);   // 故选A
      if(m[13] !== undefined) return m[13] + m[14].replace(/[A-F]/g, M); // 答案：A、B
      if(m[15] !== undefined) return M(m[15]) + m[16] + m[17];   // A对
      if(m[18] !== undefined) return m[18].replace(/[A-F]/g, M); // A、B 列表
      return m[0];
    });
  }

  /* 取一道题在当前模式下的选项显示顺序
     返回 { order: [原索引...], q: 使用该顺序的题目对象 }
     order[i] = 显示在第 i 位的选项在原数据中的下标 */
  function optionView(q){
    /* 考试中（及交卷后看解析）：用开考时固定下来的顺序 */
    if(S.exam && S.exam.optOrder && S.exam.optOrder[q.gid]){
      return { order: S.exam.optOrder[q.gid].slice(), shuffled: true };
    }
    /* 只有「随机刷题」才打乱；
       顺序刷题 / 错题本 / 收藏 / 搜索 保持原顺序，
       这样对照答案和记忆位置更方便。 */
    var shouldShuffle = (S.mode === 'random') && S.shuffleOpt !== false;
    if(!shouldShuffle || !canShuffleOptions(q)){
      return { order: q.options.map(function(_, i){ return i; }), shuffled: false };
    }

    /* 用 gid 的简单哈希当种子：同一题永远同一个排列 */
    var seed = 2166136261;
    var g = q.gid || '';
    for(var k=0;k<g.length;k++){
      seed ^= g.charCodeAt(k);
      seed = (seed * 16777619) >>> 0;
    }
    var idx = q.options.map(function(_, i){ return i; });
    var out = seededShuffle(idx, seed);
    /* 小概率（40题中约2题）打乱后恰好还是原序，那就白打乱了。
       检测到这种情况就整体旋转一位，保证「说打乱就真的打乱了」。 */
    var same = true;
    for(var t=0;t<out.length;t++){ if(out[t] !== t){ same = false; break; } }
    if(same && out.length > 1){ out.push(out.shift()); }
    return { order: out, shuffled: true };
  }

  /* 把「原下标集合」转成「显示位置集合」 */
  function toDisplayIdx(origIdxList, order){
    var out = [];
    for(var i=0;i<order.length;i++){
      if(origIdxList.indexOf(order[i]) >= 0) out.push(i);
    }
    return out;
  }
  /* 反向：显示位置 → 原下标 */
  function toOrigIdx(displayIdx, order){
    return order[displayIdx];
  }

  /* 把解析正文里的选项字母，按当前显示顺序重写。
     map: dispOf[原始下标] = 显示位置 */
  function analysisText(q, body, dispOf, shuffled){
    if(!shuffled || !body) return body;
    return remapLetters(body, dispOf);
  }

  /* 题库自带的「答案：D」行，也要跟着重写（否则标题与选项对不上） */
  function analysisAnswerLetters(sp, dispOf, shuffled){
    var s = sp.ans || '';
    if(!shuffled || !s) return s;
    return remapLetters(s, dispOf);
  }

  /* ============================================================
     状态
     ============================================================ */
  var S = {
    mode:'seq',
    pos:{seq:0,random:0,wrong:0,star:0,search:0},
    order:[],
    ans:{},        // gid -> {sel:[int], ok:bool, t:毫秒}
    wrong:[],      // 答错过的题（答对后自动移出）
    star:[],       // 收藏
    wcnt:{},       // gid -> 累计答错次数（错题排行用）
    wlast:{},      // gid -> 最后一次答错的时间戳
    memorizing:false,
    exam:null,
    examReview:null,
    pend:{},       // 多选题未提交的临时选择
    search:'',
    examSize:50,
    examLimit:false,          // 考试是否限时
    stats:{ day:'', dayMs:0, totalMs:0 },
    statsTab:'type',          // 统计页维度：type（题型） / diff（难度）
    rankSize:20,              // 错题排行显示条数
    shuffleOpt:true,          // 随机刷题时是否同时打乱选项

    /* 真实考试规格：50 单选×1分 + 25 多选×2分 = 100 分，120 分钟，80 分及格 */
    examSpec:{
      singleCount: 50,
      singlePoint: 1,
      multiCount: 25,
      multiPoint: 2,
      limitMin: 120,
      passScore: 80
    },
    /* 考试历史：每次交卷追加一条，用于「成绩走势」 */
    examHistory:[],           // [{at, score, full, rate, right, total, rightCount, ms, pass, shortfall}]
    /* 每日答题记录：用于「最近几天正确率」 */
    daily:{},                 // 'YYYY-MM-DD' -> {ans, right, ms, examN}
  };

  /* ============================================================
     计时器
     - sessMs      本次打开页面的累计练习时长（刷新即归零）
     - qGid/qMs    当前这道题的累计时长
     - stats.dayMs  今日累计（跨刷新保留）
     - stats.totalMs 总累计（跨刷新保留）
     ============================================================ */
  var TMR = {
    sessMs: 0,
    qGid: null,
    qMs: 0,
    running: true,       // 是否在计时（用户可暂停）
    lastTick: Date.now(),
    lastSave: 0
  };

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function ensureDay(){
    var k = todayKey();
    if(S.stats.day !== k){ S.stats.day = k; S.stats.dayMs = 0; }
  }

  /* 00:00 / 0:00:00 */
  function fmtDur(ms){
    if(ms == null || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    if(h > 0) return h + ':' + pad2(m) + ':' + pad2(ss);
    return pad2(m) + ':' + pad2(ss);
  }
  /* 18 秒 / 1 分 20 秒 */
  function fmtShort(ms){
    if(ms == null || ms < 0) ms = 0;
    var s = Math.round(ms / 1000);
    if(s < 60) return s + ' 秒';
    var m = Math.floor(s / 60), ss = s % 60;
    return m + ' 分' + (ss ? ' ' + ss + ' 秒' : '');
  }

  /* 平均每题用时：只统计真正记录过时间的题（至少 3 题才有参考意义） */
  function avgMs(){
    var n = 0, sum = 0;
    for(var g in S.ans){
      var r = S.ans[g];
      if(r && typeof r.t === 'number' && r.t > MIN_T_MS){ sum += r.t; n++; }
    }
    if(n < 3) return null;
    return sum / n;
  }

  /* ============================================================
     统计：按题型 / 难度聚合
     注意：原始题库只有【题型】一个可用分类字段，没有章节/知识点信息，
     所以这里不做「按章节统计」——那是编不出来的东西。
     难度也不是题库提供的，而是用作答表现推导出来的，UI 上会明确标注。
     ============================================================ */
  /* 难度推导规则（基于你自己的作答表现，不是题库官方难度）：
       未做过                              -> 未练
       ［看历史］错过 2 次以上 -> 较难；错过 1 次 -> 一般
       ［看本次］首次接触时用时远超平均 -> 较难；否则 -> 简单

     重要：先看「历史错过次数」再看「本次对错」，
     这样一道「以前错过、今天答对了」的题会被归为「一般/较难」，
     而不是被洗成「简单」，否则统计就没意义了。 */
  function difficultyOf(q){
    var r = S.ans[q.gid];
    if(!r) return '未练';
    var c = S.wcnt[q.gid] || 0;
    if(c >= 2) return '较难';
    if(c === 1) return '一般';
    var avg = avgMs();
    if(avg && typeof r.t === 'number' && r.t > avg * 1.5) return '较难';
    return r.ok ? '简单' : '一般';
  }

  /* 分组聚合：返回 [{key, total, done, right, wrong, ms, avgMs, rate}] */
  function groupStats(getKey){
    var map = Object.create(null);
    for(var i=0;i<QS.length;i++){
      var q = QS[i];
      var k = getKey(q) || '未分组';
      if(!map[k]) map[k] = { key:k, total:0, done:0, right:0, wrong:0, ms:0, tN:0 };
      var g = map[k];
      g.total++;
      var r = S.ans[q.gid];
      if(r){
        g.done++;
        if(r.ok) g.right++;
        if(typeof r.t === 'number' && r.t > MIN_T_MS){ g.ms += r.t; g.tN++; }
      }
      g.wrong += (S.wcnt[q.gid] || 0) > 0 ? 1 : 0;
    }
    var out = [];
    for(var key in map){
      var x = map[key];
      x.rate = x.done ? Math.round(x.right / x.done * 100) : null;
      x.avgMs = x.tN ? Math.round(x.ms / x.tN) : null;
      delete x.ms;
      delete x.tN;
      out.push(x);
    }
    return out;
  }

  /* 错题排行：按累计答错次数降序，次数相同则最近错的在前 */
  function wrongRank(){
    var out = [];
    for(var g in S.wcnt){
      var n = S.wcnt[g] || 0;
      if(n <= 0) continue;
      var q = BY[g];
      if(!q) continue;
      out.push({ gid:g, q:q, n:n, last:S.wlast[g] || 0 });
    }
    out.sort(function(a, b){
      if(b.n !== a.n) return b.n - a.n;
      return (b.last || 0) - (a.last || 0);
    });
    return out;
  }
  /* rankAll 就是 wrongRank 的别名，保持调用处可读 */
  function rankAll(){ return wrongRank(); }

  /* ============================================================
     每日答题记录 / 考试成绩历史
     ============================================================ */
  function dailyKey(ts){
    var d = ts ? new Date(ts) : new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function ensureDaily(k){
    if(!S.daily[k]) S.daily[k] = { ans:0, right:0, ms:0, examN:0 };
    return S.daily[k];
  }
  /* 每次答完一题就往当天的记录里累加 */
  function recordDailyAnswer(ok, ms, gid){
    var k = dailyKey();
    var d = ensureDaily(k);
    d.ans++;
    if(ok) d.right++;
    if(ms && ms > MIN_T_MS) d.ms += ms;
    /* 用 guid 去重计数意义不大，这里只统计「作答次数」 */
    return d;
  }
  /* 交卷时记录一条成绩 */
  function recordExamResult(E, auto){
    var total = E.gids.length;
    var right = E.rightCount || 0;
    var rec = {
      at: Date.now(),
      score: E.score || 0,
      full: E.fullScore || total,
      passScore: E.passScore || 80,
      total: total,
      rightCount: right,
      rate: total ? Math.round(right / total * 100) : 0,
      ms: E.msAcc || 0,
      pass: (E.score || 0) >= (E.passScore || 80),
      auto: !!auto,
      shortfall: !!E.shortfall
    };
    S.examHistory.push(rec);
    /* 只保留最近 100 次，避免本地存储无限膨胀 */
    if(S.examHistory.length > 100) S.examHistory = S.examHistory.slice(-100);

    var d = ensureDaily(dailyKey());
    d.examN = (d.examN || 0) + 1;
    return rec;
  }

  /* 取最近 n 天的每日数据（含今天），按日期升序 */
  function recentDays(n){
    var out = [];
    var today = new Date();
    for(var i = n - 1; i >= 0; i--){
      var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var k = dailyKey(dt.getTime());
      var d = S.daily[k] || { ans:0, right:0, ms:0, examN:0 };
      out.push({
        key: k,
        label: (dt.getMonth()+1) + '/' + dt.getDate(),
        weekday: '日一二三四五六'.charAt(dt.getDay()),
        ans: d.ans || 0,
        right: d.right || 0,
        ms: d.ms || 0,
        examN: d.examN || 0,
        rate: (d.ans ? Math.round((d.right || 0) / d.ans * 100) : null),
        isToday: i === 0
      });
    }
    return out;
  }

  /* ============================================================
     鼓励语与批注
     —— 依据真实数据给出针对性评语，不是无脑夸。
        每条批注都对应一个具体的观测事实，方便你判断该练什么。
     ============================================================ */
  function pick(arr, seedStr){
    if(!arr.length) return '';
    var h = 0;
    var s = String(seedStr || 'x');
    for(var i=0;i<s.length;i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return arr[h % arr.length];
  }

  /* 针对「今天」的鼓励语 */
  function todayEncouragement(day){
    if(!day || !day.ans){
      return {
        mood:'idle',
        title:'今天还没开始',
        text:'哪怕只做 5 道题也比不动强。先从「顺序刷题」热个身吧。'
      };
    }
    var r = day.rate;
    if(r >= 95) return { mood:'great', title:'今天状态极好',
      text:'正确率 ' + r + '%，' + day.ans + ' 道题几乎全对。这种手感保持住，考前别松劲。' };
    if(r >= 85) return { mood:'good', title:'稳步推进中',
      text:'正确率 ' + r + '%，已经相当扎实。把今天错的几道再看一遍解析，收益最大。' };
    if(r >= 70) return { mood:'ok', title:'还在爬坡',
      text:'正确率 ' + r + '%，正常的练习状态。错题本里那几道反复错的，才是真正要攻的地方。' };
    if(r >= 50) return { mood:'warn', title:'别急，这很正常',
      text:'正确率 ' + r + '%。这个题库本来就偏难，前几遍错一半是常态。重点看解析，不要只看答案。' };
    return { mood:'low', title:'今天有点吃力',
      text:'正确率 ' + r + '%。别硬撑，先挑「错题本」里的题做，把已经见过的捡回来，比刷新题有效。' };
  }

  /* 针对「最近几天趋势」的批注 */
  function trendAnnotation(days){
    var withData = days.filter(function(d){ return d.ans > 0; });
    if(withData.length < 2){
      return { tag:'', text:'多练几天后，这里会显示你的趋势变化。' };
    }
    var first = withData[0], last = withData[withData.length - 1];
    var diff = (last.rate || 0) - (first.rate || 0);
    var totalAns = withData.reduce(function(s, d){ return s + d.ans; }, 0);
    var avgRate = Math.round(
      withData.reduce(function(s, d){ return s + (d.rate || 0) * d.ans; }, 0) / totalAns
    );

    if(diff >= 10){
      return { tag:'上升', text:'最近 ' + withData.length + ' 天正确率从 ' + first.rate + '% 提到 ' + last.rate + '%，涨了 ' + diff + ' 个百分点。趋势是向上的，按现在节奏走。' };
    }
    if(diff <= -10){
      return { tag:'回落', text:'最近 ' + withData.length + ' 天从 ' + first.rate + '% 降到 ' + last.rate + '%。可能是题变难了，也可能状态波动——先看错题原因，不用慌。' };
    }
    if(avgRate >= 85){
      return { tag:'稳定', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%，很稳。可以考虑加量或开始完整模拟考。' };
    }
    if(avgRate >= 70){
      return { tag:'稳定', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%。基础在，再把错题嚼透就能往上走。' };
    }
    return { tag:'待提升', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%。建议减少新题量，先把错题本刷到能一次做对。' };
  }

  /* 针对单次考试的批注 */
  function examAnnotation(rec){
    if(!rec) return '';
    var s = rec.score, full = rec.full, ps = rec.passScore || 80;
    var gap = ps - s;
    if(s >= full){
      return '满分。这个题库你已经吃透了，可以换更难的材料或直接去考。';
    }
    if(s >= ps){
      return '过了及格线（' + s + '/' + full + '），还差 ' + (full - s) + ' 分满分。稳了，但别掉以轻心。';
    }
    if(gap <= 5){
      return '差 ' + gap + ' 分就及格了，非常接近。把这次错的题过一遍，下次基本就能过。';
    }
    if(gap <= 15){
      return '距及格还差 ' + gap + ' 分。重点攻多选题——每题 2 分，提分效率最高。';
    }
    return '距及格差 ' + gap + ' 分。先把错题本刷完再考，比反复裸考有效得多。';
  }

  /* ============================================================
     持久化
     ============================================================ */
  function save(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        pos:S.pos, order:S.order, ans:S.ans, wrong:S.wrong, star:S.star,
        wcnt:S.wcnt, wlast:S.wlast,
        memorizing:S.memorizing, mode:S.mode, examSize:S.examSize,
        examLimit:S.examLimit, pend:S.pend, stats:S.stats,
        statsTab:S.statsTab, rankSize:S.rankSize, shuffleOpt:S.shuffleOpt,
        examSpec:S.examSpec, examHistory:S.examHistory, daily:S.daily
      }));
    }catch(e){}
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(LS) || 'null');
      if(!d){
        /* 首次打开：把小程序里已有的错题 / 收藏带过来 */
        if(Array.isArray(BANK.initialWrong)) S.wrong = BANK.initialWrong.slice();
        if(Array.isArray(BANK.initialStar)) S.star = BANK.initialStar.slice();
        S.stats.day = todayKey();
        save();
        return;
      }
      if(d.pos) S.pos = Object.assign(S.pos, d.pos);
      if(Array.isArray(d.order)) S.order = d.order.filter(function(g){ return BY[g]; });
      if(d.ans && typeof d.ans === 'object') S.ans = d.ans;
      if(Array.isArray(d.wrong)) S.wrong = d.wrong.filter(function(g){ return BY[g]; });
      if(Array.isArray(d.star)) S.star = d.star.filter(function(g){ return BY[g]; });
      if(d.pend && typeof d.pend === 'object') S.pend = d.pend;
      if(d.wcnt && typeof d.wcnt === 'object') S.wcnt = d.wcnt;
      if(d.wlast && typeof d.wlast === 'object') S.wlast = d.wlast;
      if(d.statsTab) S.statsTab = d.statsTab;
      if(d.rankSize) S.rankSize = d.rankSize;
      if(typeof d.shuffleOpt === 'boolean') S.shuffleOpt = d.shuffleOpt;
      if(d.examSpec && typeof d.examSpec === 'object') S.examSpec = Object.assign(S.examSpec, d.examSpec);
      if(Array.isArray(d.examHistory)) S.examHistory = d.examHistory;
      if(d.daily && typeof d.daily === 'object') S.daily = d.daily;
      if(typeof d.memorizing === 'boolean') S.memorizing = d.memorizing;
      if(d.mode) S.mode = d.mode;
      if(d.examSize) S.examSize = d.examSize;
      if(typeof d.examLimit === 'boolean') S.examLimit = d.examLimit;
      if(d.stats && typeof d.stats === 'object'){
        S.stats.day   = d.stats.day || todayKey();
        S.stats.dayMs = Number(d.stats.dayMs) || 0;
        S.stats.totalMs = Number(d.stats.totalMs) || 0;
      }
      ensureDay();
    }catch(e){}
  }

  /* ============================================================
     小工具
     ============================================================ */
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }
  var toastT = null;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }
  function letter(i){ return String.fromCharCode(65 + i); }

  function correctIdx(q){
    var out = [];
    for(var i=0;i<q.options.length;i++) if(q.options[i].ok) out.push(i);
    return out;
  }
  function sameSet(a, b){
    if(a.length !== b.length) return false;
    var x = a.slice().sort(function(p,q){return p-q;});
    var y = b.slice().sort(function(p,q){return p-q;});
    for(var i=0;i<x.length;i++) if(x[i] !== y[i]) return false;
    return true;
  }
  function isCorrect(q, sel){ return sameSet(sel, correctIdx(q)); }

  function splitAnalysis(txt){
    var ans = '', body = String(txt || '');
    var m = /^\s*答案[:：]\s*([^\n]*)\n?/.exec(body);
    if(m){ ans = m[1].trim(); body = body.slice(m[0].length); }
    body = body.replace(/^\s*解析[:：]?\s*\n?/, '');
    return { ans: ans, body: body.trim() };
  }

  function shuffle(a){
    var r = a.slice();
    for(var i=r.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function ensureOrder(){
    if(S.order.length !== QS.length){
      S.order = shuffle(QS.map(function(q){ return q.gid; }));
      save();
    }
  }
  function searchList(){
    var kw = (S.search || '').trim().toLowerCase();
    if(!kw) return [];
    return QS.filter(function(q){
      if((q.q || '').toLowerCase().indexOf(kw) >= 0) return true;
      if((q.analysis || '').toLowerCase().indexOf(kw) >= 0) return true;
      for(var i=0;i<q.options.length;i++){
        if((q.options[i].t || '').toLowerCase().indexOf(kw) >= 0) return true;
      }
      return false;
    });
  }
  function modeList(){
    switch(S.mode){
      case 'seq': return QS;
      case 'random': ensureOrder(); return S.order.map(function(g){ return BY[g]; }).filter(Boolean);
      case 'wrong': return S.wrong.map(function(g){ return BY[g]; }).filter(Boolean);
      case 'star': return S.star.map(function(g){ return BY[g]; }).filter(Boolean);
      case 'search': return searchList();
      default: return QS;
    }
  }

  /* ============================================================
     计时：驱动 + 显示
     ============================================================ */
  function examRunning(){
    return S.mode === 'exam' && S.exam && !S.exam.finished;
  }
  function examQid(){
    return examRunning() ? S.exam.gids[S.exam.pos] : null;
  }

  /* 主循环：每秒累加一次（用真实时间差，避免定时器漂移） */
  function tick(){
    var now = Date.now();
    var dt = now - TMR.lastTick;
    TMR.lastTick = now;

    if(!TMR.running) return;
    if(dt < 0) dt = 0;
    if(dt > 3000) dt = 3000;          /* 电脑休眠/切后台回来，不把这段算进去 */

    TMR.sessMs += dt;
    ensureDay();
    S.stats.dayMs += dt;
    S.stats.totalMs += dt;

    if(examRunning()){
      var E = S.exam;
      E.msAcc = (E.msAcc || 0) + dt;
      var g = examQid();
      if(g) E.qMs[g] = (E.qMs[g] || 0) + dt;
      /* 限时倒计时：到点自动交卷 */
      if(E.limitMs > 0 && E.msAcc >= E.limitMs && !E.autoSubmitting){
        E.autoSubmitting = true;
        finishExam(true);
        return;
      }
    }else if(TMR.qGid){
      TMR.qMs += dt;
    }

    updateClock();

    /* 每 5 秒落一次盘，防止关页面丢时间 */
    if(now - TMR.lastSave > 5000){ TMR.lastSave = now; save(); }
  }

  function updateClock(){
    var eS = $('tmSession');
    if(!eS) return;

    var inExam = examRunning();
    var dimQ = true;

    /* --- 第一格：本次 / 考试 / 剩余 --- */
    var lb = $('lbSession');
    if(inExam && S.exam.limitMs > 0){
      var left = Math.max(0, S.exam.limitMs - (S.exam.msAcc || 0));
      lb.textContent = '剩余';
      eS.textContent = fmtDur(left);
      eS.classList.toggle('warn', left <= 60000);
    }else if(inExam){
      lb.textContent = '考试';
      eS.textContent = fmtDur(S.exam.msAcc || 0);
      eS.classList.remove('warn');
    }else{
      lb.textContent = '本次';
      eS.textContent = fmtDur(TMR.sessMs);
      eS.classList.remove('warn');
    }

    /* --- 第二格：本题 --- */
    var eQ = $('tmQuestion');
    var qtxt = '—';
    if(inExam){
      var g = examQid();
      qtxt = fmtDur((S.exam.qMs[g] || 0));
      dimQ = false;
    }else if(TMR.qGid){
      qtxt = fmtDur(TMR.qMs);
      dimQ = false;
    }
    eQ.textContent = qtxt;
    eQ.classList.toggle('dim', dimQ);

    /* --- 第三格：今日 --- */
    $('tmToday').textContent = fmtDur(S.stats.dayMs);

    /* --- 第四格：平均 --- */
    var a = avgMs();
    $('tmAvg').textContent = a == null ? '—' : fmtShort(a);

    /* --- 暂停按钮 --- */
    var bp = $('btPause');
    if(bp){
      bp.textContent = TMR.running ? '暂停' : '继续';
      bp.classList.toggle('paused', !TMR.running);
    }
  }

  /* 告诉计时器“现在在做哪道题” */
  function trackQuestion(gid){
    if(examRunning()){ TMR.qGid = null; return; }
    if(!gid || S.ans[gid]){ TMR.qGid = null; TMR.qMs = 0; return; }
    if(TMR.qGid !== gid){ TMR.qGid = gid; TMR.qMs = 0; }
  }

  function setPaused(p){
    TMR.running = !p;
    TMR.lastTick = Date.now();
    updateClock();
    toast(p ? '计时已暂停' : '计时已继续');
  }

  /* ============================================================
     顶栏
     ============================================================ */
  function updateHeader(){
    var done = Object.keys(S.ans).length;
    var okc = 0;
    for(var g in S.ans) if(S.ans[g] && S.ans[g].ok) okc++;
    $('total').textContent = QS.length;
    $('done').textContent = done;
    $('rate').textContent = done ? Math.round(okc / done * 100) + '%' : '—';
    $('prog').style.width = (done / QS.length * 100).toFixed(1) + '%';
    $('btMemorize').classList.toggle('on', S.memorizing);
    updateClock();
  }

  var TABS = [
    {k:'seq',   label:'顺序刷题'},
    {k:'random',label:'随机刷题'},
    {k:'wrong', label:'错题本'},
    {k:'star',  label:'收藏'},
    {k:'exam',  label:'模拟考试'},
    {k:'stats', label:'统计'},
    {k:'trend', label:'成绩走势'},
    {k:'rank',  label:'错题排行'},
    {k:'search',label:'搜索'}
  ];
  function renderTabs(){
    var box = $('tabs');
    box.innerHTML = '';
    TABS.forEach(function(t){
      var b = el('button', 'tab' + (S.mode === t.k ? ' on' : ''));
      b.textContent = t.label;
      var n = '';
      if(t.k === 'wrong') n = S.wrong.length;
      else if(t.k === 'star') n = S.star.length;
      else if(t.k === 'rank') n = rankCount();
      if(n !== '' && n > 0){
        var s = el('span','n'); s.textContent = n; b.appendChild(s);
      }
      b.onclick = function(){
        if(S.mode === t.k) return;
        if(examRunning() && !S.exam.finished){
          if(!confirm('模拟考试还没交卷，确定离开吗？本次作答会作废。')) return;
          S.exam = null; S.examReview = null;
        }
        S.mode = t.k;
        save(); render();
      };
      box.appendChild(b);
    });
  }

  /* ============================================================
     渲染入口
     ============================================================ */
  function render(){
    updateHeader();
    renderTabs();
    var main = $('main');
    main.innerHTML = '';
    $('hint').innerHTML =
      '键盘：<kbd>A</kbd>–<kbd>F</kbd> 或 <kbd>1</kbd>–<kbd>6</kbd> 选择 · ' +
      '<kbd>Enter</kbd> 提交 / 下一题 · <kbd>←</kbd> <kbd>→</kbd> 切题 · <kbd>空格</kbd> 暂停计时';

    if(S.mode === 'exam'){ renderExam(main); return; }
    if(S.mode === 'stats'){ renderStats(main); return; }
    if(S.mode === 'trend'){ renderTrend(main); return; }
    if(S.mode === 'rank'){ renderRank(main); return; }
    if(S.mode === 'search'){ renderSearch(main); return; }
    renderPractice(main);
  }

  /* ============================================================
     成绩走势：每天的正确率 + 考试历史 + 鼓励批注
     ============================================================ */
  function renderTrend(main){
    var days = recentDays(7);
    var today = days[days.length - 1];

    /* ---------- 今天的鼓励语 ---------- */
    var enc = todayEncouragement(today);
    var encCard = el('div','card enc ' + enc.mood);
    var et = el('div','enctitle');
    et.innerHTML = '<span class="encdot"></span>' + enc.title;
    encCard.appendChild(et);
    encCard.appendChild(el('div','enctext', enc.text));
    main.appendChild(encCard);

    /* ---------- 最近 7 天正确率 ---------- */
    var dayCard = el('div','card');
    var dh = el('div','qhead');
    dh.appendChild(el('span','badge','最近 7 天'));
    var totalAns = days.reduce(function(s, d){ return s + d.ans; }, 0);
    var ds = el('span','qidx');
    ds.innerHTML = '共答 <b>' + totalAns + '</b> 题';
    dh.appendChild(ds);
    dayCard.appendChild(dh);

    if(totalAns === 0){
      var e = el('div','empty');
      e.appendChild(el('div','big','📈'));
      e.appendChild(el('h3',null,'这几天还没有练习记录'));
      e.appendChild(el('p',null,'答几道题，这里就会出现每天的进度和正确率'));
      var b = el('button','btn primary','去刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      dayCard.appendChild(e);
      main.appendChild(dayCard);

      /* 成绩走势批注（无数据时也给一句） */
      var ta0 = trendAnnotation(days);
      var noteCard0 = el('div','card');
      noteCard0.appendChild(el('div','trendnote', ta0.text));
      main.appendChild(noteCard0);
      return;
    }

    /* 每日条形图 */
    var chart = el('div','daychart');
    days.forEach(function(d){
      var col = el('div','dcol' + (d.isToday ? ' today' : ''));
      var rateTxt = (d.rate == null) ? '—' : d.rate + '%';
      var track = el('div','dtrack');
      var fill = document.createElement('i');
      if(d.rate != null){
        fill.style.height = Math.max(3, d.rate) + '%';
        if(d.rate >= 85) fill.className = 'hi';
        else if(d.rate >= 70) fill.className = 'mid';
        else fill.className = 'low';
      }else{
        fill.className = 'none';
        fill.style.height = '2px';
      }
      track.appendChild(fill);
      col.appendChild(track);
      col.appendChild(el('div','dv', rateTxt));
      col.appendChild(el('div','dl', d.label));
      col.appendChild(el('div','dw', d.weekday));
      if(d.ans > 0) col.appendChild(el('div','dn', d.ans + ' 题'));
      col.title = d.key + '：' + (d.ans ? d.ans + ' 题，正确 ' + d.right + ' 题，正确率 ' + d.rate + '%' : '未练习');
      chart.appendChild(col);
    });
    dayCard.appendChild(chart);

    /* 明细列表 */
    var tbl = el('div','daylist');
    days.slice().reverse().forEach(function(d){
      var row = el('div','drow' + (d.isToday ? ' today' : ''));
      row.appendChild(el('span','ddate', d.label + ' 周' + d.weekday));
      var stat = el('span','dstat');
      if(d.ans){
        stat.innerHTML = '答 <b>' + d.ans + '</b> 题 · 对 <b>' + d.right + '</b> · 正确率 <b>' +
          d.rate + '%</b>' + (d.examN ? ' · 考试 <b>' + d.examN + '</b> 次' : '');
      }else{
        stat.textContent = '未练习';
      }
      row.appendChild(stat);
      tbl.appendChild(row);
    });
    dayCard.appendChild(tbl);

    /* 趋势批注 */
    var ta = trendAnnotation(days);
    if(ta.tag){
      var tag = el('div','trendtag ' + (ta.tag === '上升' ? 'up' : ta.tag === '回落' ? 'down' : 'flat'), ta.tag);
      dayCard.appendChild(tag);
    }
    dayCard.appendChild(el('div','trendnote', ta.text));
    main.appendChild(dayCard);

    /* ---------- 考试历史 ---------- */
    var hs = S.examHistory || [];
    var examCard = el('div','card');
    var eh = el('div','qhead');
    eh.appendChild(el('span','badge','模拟考试'));
    var ehs = el('span','qidx');
    var passN = hs.filter(function(x){ return x.pass; }).length;
    ehs.innerHTML = hs.length
      ? '共 <b>' + hs.length + '</b> 次 · 及格 <b>' + passN + '</b> 次'
      : '还没有考试记录';
    eh.appendChild(ehs);
    examCard.appendChild(eh);

    if(!hs.length){
      examCard.appendChild(el('div','hint','去「模拟考试」考一次，成绩会记在这里。'));
      var gb = el('button','btn primary','去模拟考试');
      gb.onclick = function(){ S.mode = 'exam'; save(); render(); };
      examCard.appendChild(gb);
      main.appendChild(examCard);
      return;
    }

    /* 历史柱状图 */
    var recent = hs.slice(-15);
    var maxFull = Math.max.apply(null, recent.map(function(x){ return x.full || 100; }));
    var bars = el('div','histbars wide');
    recent.forEach(function(x){
      var col = el('div','hb' + (x.pass ? ' ok' : ''));
      var track = el('div','hbtrack');
      var fill = document.createElement('i');
      fill.style.height = Math.max(2, (x.score || 0) / maxFull * 100) + '%';
      fill.className = x.pass ? 'pass' : 'fail';
      track.appendChild(fill);
      var line = el('div','hbpass');
      line.style.bottom = ((x.passScore || 80) / maxFull * 100) + '%';
      track.appendChild(line);
      col.appendChild(track);
      col.appendChild(el('div','hbv', String(x.score)));
      var dt = new Date(x.at);
      col.title = dt.toLocaleString('zh-CN') + '｜' + x.score + '/' + x.full +
                  '｜正确率 ' + x.rate + '%' + (x.auto ? '｜超时自动交卷' : '');
      bars.appendChild(col);
    });
    examCard.appendChild(bars);
    examCard.appendChild(el('div','ansline',
      '柱高 = 得分，横线 = 及格线（' + ((hs[hs.length-1].passScore) || 80) + ' 分）。绿色为及格。'));

    /* 最近一次考试的批注 */
    var last = hs[hs.length - 1];
    var lc = el('div','comment ' + (last.pass ? 'good' : 'warn'));
    lc.textContent = examAnnotation(last);
    examCard.appendChild(lc);

    /* 每次考试明细 */
    var elist = el('div','daylist');
    hs.slice(-10).reverse().forEach(function(x){
      var row = el('div','drow');
      var dt = new Date(x.at);
      row.appendChild(el('span','ddate',
        pad2(dt.getMonth()+1) + '/' + pad2(dt.getDate()) + ' ' +
        pad2(dt.getHours()) + ':' + pad2(dt.getMinutes())));
      var st = el('span','dstat');
      st.innerHTML = '<b>' + x.score + '</b>/' + x.full + ' 分 · 正确率 <b>' + x.rate +
        '%</b> · 用时 ' + fmtDur(x.ms) +
        (x.pass ? ' · <span class="passmark">及格</span>'
                : ' · <span class="failmark">差 ' + ((x.passScore||80) - x.score) + ' 分</span>') +
        (x.auto ? ' · 超时交卷' : '');
      row.appendChild(st);
      elist.appendChild(row);
    });
    examCard.appendChild(elist);

    main.appendChild(examCard);
    updateClock();
  }

  /* ============================================================
     统计页：按题型 / 难度 分组
     ============================================================ */
  function rankCount(){
    var n = 0;
    for(var g in S.wcnt) if(S.wcnt[g] > 0 && BY[g]) n++;
    return n;
  }

  function renderStats(main){
    var head = el('div','card');
    var t = el('div','qhead');
    t.appendChild(el('span','qtext','学习统计'));
    head.appendChild(t);

    /* 总体概览 */
    var done = Object.keys(S.ans).length;
    var right = 0;
    for(var g in S.ans) if(S.ans[g] && S.ans[g].ok) right++;
    var rate = done ? Math.round(right / done * 100) : null;

    var grid = el('div','statgrid');
    [['总题量', QS.length + ' 题'],
     ['已练', done + ' 题'],
     ['未练', (QS.length - done) + ' 题'],
     ['总正确率', rate == null ? '—' : rate + '%'],
     ['累计错题', rankCount() + ' 题'],
     ['累计用时', fmtDur(S.stats.totalMs)]
    ].forEach(function(p){
      var s = el('div','stat');
      s.appendChild(el('div','v', p[1]));
      s.appendChild(el('div','l', p[0]));
      grid.appendChild(s);
    });
    head.appendChild(grid);

    /* 维度切换 */
    var segRow = el('div','actions');
    var seg = el('div','seg');
    [['type','按题型'],['diff','按难度']].forEach(function(p){
      var b = el('button', S.statsTab === p[0] ? 'on' : '', p[1]);
      b.onclick = function(){ S.statsTab = p[0]; save(); render(); };
      seg.appendChild(b);
    });
    segRow.appendChild(seg);
    head.appendChild(segRow);

    /* 说明：难度是推导出来的，要写明，不能假冒官方 */
    if(S.statsTab === 'diff'){
      head.appendChild(el('div','hint',
        '难度题库未提供，由你的作答表现推导：历史错过2次以上→较难；错过1次→一般；' +
        '首次接触就耗时超过平均1.5倍→较难；其余一次就对→简单。' +
        '遇到以前错过的题即使现在答对，也不会被归为「简单」。'));
    }
    main.appendChild(head);

    /* 分组数据 */
    var groups = S.statsTab === 'type'
      ? groupStats(function(q){ return q.type || '单选题'; })
      : groupStats(function(q){ return difficultyOf(q); });

    /* 排序：难度按 较难→一般→简单→未练；题型按 题量降序 */
    if(S.statsTab === 'diff'){
      var order = { '较难':0, '一般':1, '简单':2, '未练':3 };
      groups.sort(function(a, b){
        return (order[a.key] == null ? 9 : order[a.key]) - (order[b.key] == null ? 9 : order[b.key]);
      });
    }else{
      groups.sort(function(a, b){ return b.total - a.total; });
    }

    var list = el('div','card');
    var lh = el('div','qhead');
    lh.appendChild(el('span','badge', S.statsTab === 'type' ? '按题型' : '按难度'));
    lh.appendChild(el('span','spacer'));
    lh.appendChild(el('span','qidx','共 ' + groups.length + ' 组'));
    list.appendChild(lh);

    var wrap = el('div','statwrap');
    groups.forEach(function(g){
      var row = el('div','statrow');

      var name = el('div','sname');
      name.appendChild(document.createTextNode(g.key));
      row.appendChild(name);

      var rt = el('div','srate' + (g.rate == null ? ' none' : ''));
      rt.textContent = g.rate == null ? '未练' : g.rate + '%';
      row.appendChild(rt);

      var bar = el('div','bar2');
      var fill = document.createElement('i');
      var pct = g.done ? (g.right / g.done * 100) : 0;
      fill.style.width = pct.toFixed(1) + '%';
      if(g.rate != null){
        if(g.rate < 60) fill.className = 'low';
        else if(g.rate < 80) fill.className = 'mid';
      }
      bar.appendChild(fill);
      row.appendChild(bar);

      var meta = el('div','smeta');
      meta.innerHTML =
        '<span>已练 <b>' + g.done + '</b>/' + g.total + '</span>' +
        '<span>对 <b>' + g.right + '</b></span>' +
        '<span class="w">错题 <b>' + g.wrong + '</b></span>' +
        (g.avgMs != null ? '<span>平均 <b>' + fmtShort(g.avgMs) + '</b></span>' : '');
      row.appendChild(meta);

      wrap.appendChild(row);
    });
    list.appendChild(wrap);
    main.appendChild(list);

    /* 备份 / 恢复入口放在统计页底部，与「数据」相关的地方 */
    main.appendChild(backupBar());

    main.appendChild(el('div','hint','数据来自本机练习记录，重置后会一并清空'));
    updateClock();
  }

     错题排行：按累计答错次数降序

    var list = rankAll();

    var card = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge','错题排行'));
    var hcnt = el('span','qidx');
    hcnt.innerHTML = '共 <b>' + list.length + '</b> 道错过';

    card.appendChild(head);

    if(!list.length){
      var e = el('div','empty');
      e.appendChild(el('div','big','📊'));
      e.appendChild(el('h3',null,'还没有错题记录'));
      e.appendChild(el('p',null,'答错的题会按次数记在这里，错得越多的排越前'));
      var b = el('button','btn primary','去刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      main.appendChild(e);
      return;
    }

    /* 说明：只计「答错过几次」，不因为后来答对而减少 */
    card.appendChild(el('div','hint',
      '按累计答错次数排序；答对不会减少次数，这样能看出哪些题你反复错 '));

    /* 显示条数切换 */
    var segRow = el('div','actions');
    var seg = el('div','seg');
    [10,20,50,0].forEach(function(n){
      var b = el('button', S.rankSize === n ? 'on' : '', n === 0 ? '全部' : '前 ' + n);
      b.onclick = function(){ S.rankSize = n; save(); render(); };
      seg.appendChild(b);
    });
    segRow.appendChild(seg);
    card.appendChild(segRow);

    var show = S.rankSize === 0 ? list : list.slice(0, S.rankSize);
    var box = el('div','rank');
    show.forEach(function(item, i){
      var row = el('button','rk' + (i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : ''));
      row.appendChild(el('span','no', String(i + 1)));

      var body = el('div','body');
      body.appendChild(el('div','qt', item.q.q.replace(/\s+/g, ' ')));

      var mt = el('div','mt');
      var bg = el('span','badge-s', item.q.type || '单选题');
      mt.appendChild(bg);
      /* 说清楚三种状态，不要把「未做」和「做错」混成同一个破折号 */
      var rec = S.ans[item.gid];
      var stateTxt = !rec ? '尚未作答'
                    : (rec.ok ? '本次已答对' : '本次仍答错');
      mt.appendChild(el('span', null, stateTxt));
      if(item.last){
        var d = new Date(item.last);
        mt.appendChild(el('span', null, '最近错于 ' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate())));
      }
      body.appendChild(mt);
      row.appendChild(body);

      var cnt = el('div','cnt');
      cnt.innerHTML = item.n + '<small>次</small>';
      row.appendChild(cnt);

      row.onclick = function(){
        /* 直接跳到这道题：用「错题本」列表定位，没有就临时开一个 */
        var idx = S.wrong.indexOf(item.gid);
        if(idx >= 0){
          S.mode = 'wrong'; S.pos.wrong = idx;
        }else{
          /* 已答对移出错题本 → 用搜索模式定位 */
          S.mode = 'search';
          S.search = item.q.q.slice(0, 12);
          S.pos.search = 0;
        }
        save(); render();
      };
      box.appendChild(row);
    });
    card.appendChild(box);

    if(S.rankSize !== 0 && list.length > S.rankSize){
      card.appendChild(el('div','hint',
        '还有 ' + (list.length - S.rankSize) + ' 道未显示，点上方「全部」展开'));
    }

    main.appendChild(card);
    updateClock();
  }

     搜索
