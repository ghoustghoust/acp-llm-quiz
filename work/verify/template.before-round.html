  /* ============================================================
     练习
     ============================================================ */
  function renderPractice(main){
    var list = modeList();
    if(!list.length){
      var e = el('div','empty');
      if(S.mode === 'wrong'){
        e.appendChild(el('div','big','🎉'));
        e.appendChild(el('h3',null,'错题本是空的'));
        e.appendChild(el('p',null,'答错的题会自动收进来，答对后自动移出'));
      }else if(S.mode === 'star'){
        e.appendChild(el('div','big','⭐'));
        e.appendChild(el('h3',null,'还没有收藏题目'));
        e.appendChild(el('p',null,'点题目右上角的星标即可收藏'));
      }else{
        e.appendChild(el('div','big','📚'));
        e.appendChild(el('h3',null,'暂无题目'));
      }
      var b = el('button','btn primary','去顺序刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      main.appendChild(e);
      return;
    }

    /* 随机刷题时，顶部给一个「选项是否打乱」的小开关 */
    if(S.mode === 'random'){
      var row = el('div','actions');
      row.style.marginTop = '0';
      row.style.marginBottom = '12px';
      var seg = el('div','seg');
      [['on','选项也打乱'],['off','只打乱顺序']].forEach(function(p){
        var on = (p[0] === 'on') === (S.shuffleOpt !== false);
        var btn = el('button', on ? 'on' : '', p[1]);
        btn.onclick = function(){
          S.shuffleOpt = (p[0] === 'on');
          save(); render();
          toast(S.shuffleOpt ? '选项位置也打乱了' : '只打乱题目顺序，选项保持原顺序');
        };
        seg.appendChild(btn);
      });
      row.appendChild(seg);
      main.appendChild(row);
    }

    practiceCard(main, list, S.mode);
  }

  function practiceCard(main, list, modeKey){
    var pos = S.pos[modeKey] || 0;
    if(pos < 0) pos = 0;
    if(pos > list.length - 1) pos = list.length - 1;
    S.pos[modeKey] = pos;

    var q = list[pos];
    var rec = S.ans[q.gid];
    var answered = !!rec;
    var showAns = answered || S.memorizing;
    var sel = [];
    if(answered) sel = rec.sel.slice();
    else if(!showAns && S.pend && S.pend[q.gid]) sel = S.pend[q.gid].slice();

    /* 通知计时器当前题号 */
    trackQuestion(showAns ? null : q.gid);

    var card = el('div','card');

    /* ---------- 头部 ---------- */
    var head = el('div','qhead');
    var isMulti = q.type === '多选题';
    head.appendChild(el('span','badge' + (isMulti ? ' t2' : ''), q.type || '单选题'));

    var idx = el('span','qidx');
    idx.innerHTML = '第 <b>' + (pos + 1) + '</b> / ' + list.length + ' 题';
    head.appendChild(idx);

    head.appendChild(el('span','spacer'));

    /* 本题实时计时（未作答时才有意义） */
    if(!showAns){
      var qc = el('span','qclock');
      qc.innerHTML = '<b id="qLive">' + fmtDur(TMR.qMs) + '</b>';
      head.appendChild(qc);
    }else if(answered && typeof rec.t === 'number'){
      var qc2 = el('span','qclock');
      qc2.innerHTML = '<b>' + fmtShort(rec.t) + '</b>';
      head.appendChild(qc2);
    }

    var st = el('button','star' + (S.star.indexOf(q.gid) >= 0 ? ' on' : ''), S.star.indexOf(q.gid) >= 0 ? '★' : '☆');
    st.title = '收藏本题';
    st.onclick = function(){
      var i = S.star.indexOf(q.gid);
      if(i >= 0){ S.star.splice(i,1); toast('已取消收藏'); }
      else { S.star.push(q.gid); toast('已收藏'); }
      save(); render();
    };
    head.appendChild(st);
    card.appendChild(head);

    /* ---------- 题干 ---------- */
    card.appendChild(el('div','qtext', q.q));

    /* ---------- 选项 ----------
       存储层（S.ans / S.pend / correctIdx）永远用「原始下标」，
       只有显示层换成打乱后的顺序。这样选项打乱不会破坏已存的答案。 */
    var wrap = el('div','opts');
    var cidx = correctIdx(q);
    var view = optionView(q);
    view.order.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt');
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      var isPicked = sel.indexOf(oi) >= 0;
      if(showAns){
        b.classList.add('locked');
        if(cidx.indexOf(oi) >= 0) b.classList.add('ok');
        else if(isPicked) b.classList.add('bad');
      }else if(isPicked){
        b.classList.add('sel');
      }
      b.onclick = function(){
        if(showAns) return;
        /* 回写时用原始下标，不用显示位置 */
        if(!isMulti){ submitNow(q, [oi]); return; }
        var p = sel.indexOf(oi);
        if(p >= 0) sel.splice(p,1); else sel.push(oi);
        S.pend = S.pend || {};
        if(sel.length) S.pend[q.gid] = sel.slice();
        else delete S.pend[q.gid];
        save(); render();
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);

    /* ---------- 操作 ---------- */
    var acts = el('div','actions');
    if(!showAns){
      if(isMulti){
        var sb = el('button','btn primary','提交答案');
        sb.disabled = sel.length === 0;
        sb.onclick = function(){ if(sel.length) submitNow(q, sel); };
        acts.appendChild(sb);
      }
      var reveal = el('button','btn ghost','查看答案');
      reveal.onclick = function(){
        S.memorizing = true;
        save(); render();
        toast('已开启背题模式，答案常显示');
      };
      acts.appendChild(reveal);
    }else{
      if(answered){
        var redo = el('button','btn','重做本题');
        redo.onclick = function(){
          /* 重做只清「本次作答记录」，不动累计错次（那是统计依据） */
          delete S.ans[q.gid];
          TMR.qMs = 0;
          save(); render();
        };
        acts.appendChild(redo);
        if(modeKey === 'wrong'){
          var rm = el('button','btn ghost','移出错题本');
          rm.onclick = function(){
            /* 只从错题本移出；累计错次保留，否则排行页会缺掉这些题 */
            noteRight(q.gid);
            S.pos.wrong = Math.max(0, Math.min(S.pos.wrong, modeList().length - 1));
            save(); toast('已移出错题本（错题次数保留在排行里）'); render();
          };
          acts.appendChild(rm);
        }
      }
      var nb = el('button','btn primary', pos >= list.length - 1 ? '已是最后一题' : '下一题 →');
      nb.disabled = pos >= list.length - 1;
      nb.onclick = function(){ goto(modeKey, pos + 1); };
      acts.appendChild(nb);

      if(modeKey !== 'search'){
        var jw = el('div','jump');
        jw.appendChild(document.createTextNode('跳转到'));
        var ji = document.createElement('input');
        ji.type = 'number'; ji.min = 1; ji.max = list.length;
        ji.placeholder = String(pos + 1);
        var jb = el('button','btn ghost','Go');
        jb.onclick = function(){
          var v = parseInt(ji.value, 10);
          if(!v || v < 1 || v > list.length){ toast('请输入 1–' + list.length); return; }
          goto(modeKey, v - 1);
        };
        ji.onkeydown = function(e){ if(e.key === 'Enter') jb.click(); };
        jw.appendChild(ji); jw.appendChild(jb);
        acts.appendChild(jw);
      }
    }
    card.appendChild(acts);

    /* ---------- 答案 / 解析 ----------
       注意：选项可能被打乱显示，所以：
         · 「正确答案」字母要用【显示位置】
         · 解析正文里引用的字母也要按同一映射重写
         否则会出现「正确答案写 D，但 D 所在的那行是错的」这种错位 */
    if(showAns){
      var sp = splitAnalysis(q.analysis);
      var res = el('div','result');
      if(answered) res.classList.add(rec.ok ? 'ok' : 'bad');
      else res.classList.add('plain');

      var rt = el('div','rt');
      rt.textContent = answered ? (rec.ok ? '✓ 回答正确' : '✕ 回答错误') : '答案与解析';
      res.appendChild(rt);

      /* 原始下标 → 显示位置 的映射数组 */
      var dispOf = [];
      for(var di=0;di<view.order.length;di++) dispOf[view.order[di]] = di;

      var al = el('div','ansline');
      al.innerHTML = '正确答案：<b>' +
        cidx.map(function(oi){ return letter(dispOf[oi]); }).join('、') + '</b>';
      res.appendChild(al);

      if(answered){
        var yl = el('div','ansline' + (rec.ok ? '' : ' wrong'));
        yl.innerHTML = '你的选择：<b>' +
          (sel.length ? sel.slice().sort(function(a,b){return a-b;})
                           .map(function(oi){ return letter(dispOf[oi]); }).join('、') : '未作答') + '</b>';
        res.appendChild(yl);

        /* 用时对比 */
        if(typeof rec.t === 'number' && rec.t > 0){
          var avg = avgMs();
          var tl = el('div','tline');
          var html = '本题用时 <b>' + fmtShort(rec.t) + '</b>';
          if(avg != null){
            html += ' · 平均 <b>' + fmtShort(avg) + '</b>';
            var ratio = rec.t / avg;
            if(ratio <= 0.75) html += ' <span class="tag">比平时快</span>';
            else if(ratio >= 1.6) html += ' <span class="tag slow">偏慢，注意</span>';
          }else{
            html += ' <span class="tag">累计 3 题后显示平均</span>';
          }
          tl.innerHTML = html;
          res.appendChild(tl);
        }
      }

      if(sp.body){
        var ana = el('div','ana');
        ana.appendChild(el('span','lb','解 析'));
        ana.appendChild(document.createTextNode(
          analysisText(q, sp.body, dispOf, view.shuffled)));
        res.appendChild(ana);
      }
      card.appendChild(res);
    }

    main.appendChild(card);

    /* ---------- 上一题 / 下一题 ---------- */
    var nav = el('div','actions');
    var prev = el('button','btn','← 上一题');
    prev.disabled = pos === 0;
    prev.onclick = function(){ goto(modeKey, pos - 1); };
    nav.appendChild(prev);
    nav.appendChild(el('span','spacer'));
    var nxt = el('button','btn','下一题 →');
    nxt.disabled = pos >= list.length - 1;
    nxt.onclick = function(){ goto(modeKey, pos + 1); };
    nav.appendChild(nxt);
    main.appendChild(nav);

    main.appendChild(el('div','hint','进度与计时都自动保存在本机浏览器中'));
    updateClock();
  }

  function goto(modeKey, i){
    /* 切题时，把上一题的计时收尾 */
    S.pos[modeKey] = i;
    save();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* 统一记录一次「答错」：用于错题本、错题次数、最后答错时间 */
  function noteWrong(gid){
    var wi = S.wrong.indexOf(gid);
    if(wi < 0) S.wrong.push(gid);
    S.wcnt[gid] = (S.wcnt[gid] || 0) + 1;
    S.wlast[gid] = Date.now();
  }
  /* 统一记录一次「答对」：只从错题本移出，不清算次数，
     因为次数是「历史累计错了几次」，是统计依据，不能让一次答对就洗白 */
  function noteRight(gid){
    var wi = S.wrong.indexOf(gid);
    if(wi >= 0) S.wrong.splice(wi, 1);
  }

  function submitNow(q, sel){
    var ok = isCorrect(q, sel);
    /* 记录本题耗时 */
    var spent = TMR.qGid === q.gid ? TMR.qMs : 0;
    S.ans[q.gid] = { sel: sel.slice(), ok: ok, t: Math.round(spent) };
    if(S.pend) delete S.pend[q.gid];
    TMR.qGid = null;
    TMR.qMs = 0;

    var wasInWrong = S.wrong.indexOf(q.gid) >= 0;
    if(!ok){
      noteWrong(q.gid);
      toast('答错了，已加入错题本');
    }else{
      noteRight(q.gid);
      toast(wasInWrong ? '答对了，已移出错题本' : '答对了');
    }
    /* 记进当天统计，供「最近几天正确率」使用 */
    recordDailyAnswer(ok, spent, q.gid);
    save(); render();
  }

  /* ============================================================
     模拟考试
     ============================================================ */
  function renderExam(main){
    var E = S.exam;

    /* 看某一题解析 */
    if(E && E.finished && S.examReview && BY[S.examReview]){
      renderReview(main); return;
    }

    /* 未开始 / 已结束（成绩单） */
    if(!E || E.finished){
      /* ---- 设置 ---- */
      var EX = S.examSpec;
      var card = el('div','card');
      card.appendChild(el('div','qtext','模拟考试'));
      card.appendChild(el('div','ansline',
        '按真实考试结构出卷，每次从题库随机抽题并打乱题序。'));

      /* 卷面说明 */
      var spec = el('div','examspec');
      var specRows = [
        ['单选题', EX.singleCount + ' 题 × ' + EX.singlePoint + ' 分', (EX.singleCount*EX.singlePoint) + ' 分'],
        ['多选题', EX.multiCount + ' 题 × ' + EX.multiPoint + ' 分', (EX.multiCount*EX.multiPoint) + ' 分'],
        ['总分', '', (EX.singleCount*EX.singlePoint + EX.multiCount*EX.multiPoint) + ' 分'],
        ['限时', EX.limitMin + ' 分钟', ''],
        ['及格线', EX.passScore + ' 分', '']
      ];
      specRows.forEach(function(r){
        var row = el('div','specrow');
        row.appendChild(el('span','sk', r[0]));
        row.appendChild(el('span','sv', r[1]));
        row.appendChild(el('span','sp', r[2]));
        spec.appendChild(row);
      });
      card.appendChild(spec);

      /* 抽题上限提示（题库不够时说明一下） */
      var nSingle = QS.filter(function(x){ return x.type === '单选题'; }).length;
      var nMulti  = QS.filter(function(x){ return x.type === '多选题'; }).length;
      if(nSingle < EX.singleCount || nMulti < EX.multiCount){
        card.appendChild(el('div','hint',
          '注意：题库当前只有单选 ' + nSingle + ' 题、多选 ' + nMulti + ' 题，' +
          '不足部分会按实际题量出卷。'));
      }else{
        card.appendChild(el('div','hint',
          '题库现有单选 ' + nSingle + ' 题、多选 ' + nMulti + ' 题，每次随机抽取，每次卷子都不一样。'));
      }

      var setup = el('div','examsetup');
      var st = el('button','btn primary','开始考试（' + EX.singleCount + '+' + EX.multiCount + ' 题）');
      st.onclick = startExam;
      setup.appendChild(st);
      card.appendChild(setup);
      main.appendChild(card);

      /* ---- 成绩单 ---- */
      if(E && E.finished){
        main.appendChild(renderExamScoreCard(E));
      }
      return;
    }

    /* ---- 考试进行中 ---- */
    var g = E.gids[E.pos];
    var q = BY[g];
    var sel = (E.ans[g] || []).slice();
    var isMulti = q.type === '多选题';

    var card2 = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge' + (isMulti ? ' t2' : ''), q.type || '单选题'));
    /* 本题分值 */
    var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
    head.appendChild(el('span','ptbadge', pt + ' 分'));
    var idx2 = el('span','qidx');
    idx2.innerHTML = '第 <b>' + (E.pos + 1) + '</b> / ' + E.gids.length + ' 题';
    head.appendChild(idx2);
    head.appendChild(el('span','spacer'));

    var qc = el('span','qclock');
    qc.innerHTML = '本题 <b id="qLive">' + fmtDur(E.qMs[g] || 0) + '</b>';
    head.appendChild(qc);

    /* 答题卡进度点 */
    var answeredN = E.gids.filter(function(x){ return E.ans[x] && E.ans[x].length; }).length;
    var sheet = el('span','qclock');
    sheet.innerHTML = '已答 <b>' + answeredN + '</b>/' + E.gids.length;
    head.appendChild(sheet);

    /* 当前已得分：只统计已作答且答对的题，给个大致把握（未交卷前不算最终成绩） */
    var liveScore = 0;
    for(var li = 0; li < E.gids.length; li++){
      var lg = E.gids[li];
      var la = E.ans[lg];
      if(la && la.length && isCorrect(BY[lg], la)){
        liveScore += (E.points && E.points[lg] != null) ? E.points[lg] : 1;
      }
    }
    var scChk = el('span','qclock');
    scChk.innerHTML = '约 <b>' + liveScore + '</b> 分';
    scChk.title = '按已作答的题估算，未作答的题不计分';
    head.appendChild(scChk);

    card2.appendChild(head);
    card2.appendChild(el('div','qtext', q.q));

    var wrap = el('div','opts');
    /* 用开考时固定的顺序，而不是重新算（这样交卷前后一致） */
    var eorder = (E.optOrder && E.optOrder[g]) ? E.optOrder[g].slice()
                 : optionView(q).order;
    eorder.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt' + (sel.indexOf(oi) >= 0 ? ' sel' : ''));
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      b.onclick = function(){
        /* 一律存原始下标 */
        if(!isMulti){
          E.ans[g] = [oi];
        }else{
          var p = sel.indexOf(oi);
          if(p >= 0) sel.splice(p,1); else sel.push(oi);
          if(sel.length) E.ans[g] = sel.slice();
          else delete E.ans[g];
        }
        save(); render();
      };
      wrap.appendChild(b);
    });
    card2.appendChild(wrap);

    var acts = el('div','actions');
    var prev = el('button','btn','← 上一题');
    prev.disabled = E.pos === 0;
    prev.onclick = function(){ E.pos--; save(); render(); };
    acts.appendChild(prev);
    acts.appendChild(el('span','spacer'));

    if(E.pos < E.gids.length - 1){
      var nx = el('button','btn primary','下一题 →');
      nx.onclick = function(){ E.pos++; save(); render(); };
      acts.appendChild(nx);
    }
    var sub = el('button','btn' + (E.pos === E.gids.length - 1 ? ' primary' : ''),'交卷');
    sub.onclick = function(){
      var un = E.gids.filter(function(x){ return !(E.ans[x] && E.ans[x].length); }).length;
      if(un && !confirm('还有 ' + un + ' 题未作答，确定交卷？')) return;
      finishExam(false);
    };
    acts.appendChild(sub);
    card2.appendChild(acts);
    main.appendChild(card2);

    var nav = el('div','actions');
    nav.appendChild(el('span','spacer'));
    var quit = el('button','btn ghost','放弃本次考试');
    quit.onclick = function(){
      if(!confirm('确定放弃？本次作答不会计入统计。')) return;
      S.exam = null; S.examReview = null; save(); render();
    };
    nav.appendChild(quit);
    main.appendChild(nav);
    updateClock();
  }

  /* ============================================================
     成绩单
     ============================================================ */
  function renderExamScoreCard(E){
    var r = el('div','card');

    /* 总分 + 及格判定 */
    var full = E.fullScore || E.gids.length;
    var pass = E.passScore || 80;
    var passed = (E.score || 0) >= pass;

    var sc = el('div','score');
    sc.appendChild(el('span','big', (E.score || 0) + ''));
    sc.appendChild(el('span','sc-of','/ ' + full + ' 分'));
    r.appendChild(sc);

    var verdict = el('div','verdict ' + (passed ? 'pass' : 'fail'));
    verdict.textContent = passed
      ? '✓ 及格（及格线 ' + pass + ' 分）'
      : '✗ 未及格（差 ' + (pass - (E.score || 0)) + ' 分）';
    r.appendChild(verdict);

    /* 批注 */
    var note = el('div','comment ' + (passed ? 'good' : 'warn'));
    note.textContent = examAnnotation({
      score: E.score || 0, full: full, passScore: pass
    });
    r.appendChild(note);

    if(E.shortfall){
      r.appendChild(el('div','hint','本次题库题量不足，已按实际可用题目出卷，总分可能低于 100。'));
    }

    /* 统计格子 */
    var answered = E.gids.filter(function(g){ return E.ans[g] && E.ans[g].length; }).length;
    var rightN = E.rightCount || 0;
    var totalMs = E.msAcc || 0;
    var perMs = E.gids.length ? totalMs / E.gids.length : 0;
    var rate = E.gids.length ? Math.round(rightN / E.gids.length * 100) : 0;

    /* 分类得分 */
    var singleTotal = 0, singleGot = 0, multiTotal = 0, multiGot = 0;
    E.gids.forEach(function(g){
      var q = BY[g];
      var isMulti = q && q.type === '多选题';
      var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
      var got = isCorrect(q, E.ans[g] || []);
      if(isMulti){ multiTotal += pt; if(got) multiGot += pt; }
      else { singleTotal += pt; if(got) singleGot += pt; }
    });

    var grid = el('div','statgrid');
    [['正确率', rate + '%'],
     ['答对', rightN + ' 题'],
     ['答错/未答', (E.gids.length - rightN) + ' 题'],
     ['用时', fmtDur(totalMs)],
     ['平均每题', fmtShort(perMs)],
     ['及格线', pass + ' 分']
    ].forEach(function(p){
      var s = el('div','stat');
      s.appendChild(el('div','v', p[1]));
      s.appendChild(el('div','l', p[0]));
      grid.appendChild(s);
    });
    r.appendChild(grid);

    /* 分项得分 */
    var brk = el('div','scorebreak');
    [['单选题', singleGot, singleTotal],
     ['多选题', multiGot, multiTotal]].forEach(function(p){
      var row = el('div','sbrow');
      row.appendChild(el('span','sbname', p[0]));
      var bar = el('div','sbbar');
      var fill = document.createElement('i');
      fill.style.width = (p[2] ? (p[1] / p[2] * 100) : 0) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el('span','sbnum', p[1] + ' / ' + p[2]));
      brk.appendChild(row);
    });
    r.appendChild(brk);

    r.appendChild(el('div','ansline','点击下方条目查看每题解析'));

    var list = el('div','review');
    E.gids.forEach(function(g, i){
      var q = BY[g];
      var a = E.ans[g];
      var ok = a && a.length ? isCorrect(q, a) : false;
      var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
      var row = el('div','rrow');
      row.appendChild(el('span','dot ' + (a && a.length ? (ok ? 'o' : 'x') : 'n')));
      row.appendChild(el('span','t', (i+1) + '. ' + q.q.replace(/\s+/g,' ').slice(0,50)));
      var qms = E.qMs[g] || 0;
      if(qms > MIN_T_MS) row.appendChild(el('span','tm', fmtShort(qms)));
      if(pt > 1) row.appendChild(el('span','pt', pt + '分'));
      var rr = el('span','r' + (a && a.length ? (ok ? ' ok' : ' x') : ''), a && a.length ? (ok ? '正确' : '错误') : '未答');
      row.appendChild(rr);
      row.onclick = function(){ S.examReview = g; save(); render(); };
      list.appendChild(row);
    });
    r.appendChild(list);

    var again = el('button','btn primary','再考一次');
    again.onclick = function(){ S.exam = null; S.examReview = null; save(); render(); };
    r.appendChild(again);

    /* 历史成绩走势 */
    r.appendChild(renderExamHistory());

    return r;
  }

  /* 考试成绩走势（简要版，完整版在统计页） */
  function renderExamHistory(){
    var box = el('div','examhist');
    var hs = S.examHistory || [];
    if(!hs.length) return box;

    var lb = el('div','histlb','考试成绩记录（最近 ' + Math.min(hs.length, 10) + ' 次）');
    box.appendChild(lb);

    var recent = hs.slice(-10);
    var bars = el('div','histbars');
    var maxFull = Math.max.apply(null, recent.map(function(x){ return x.full || 100; }));
    recent.forEach(function(x, i){
      var col = el('div','hb');
      var track = el('div','hbtrack');
      var fill = document.createElement('i');
      fill.style.height = ((x.score || 0) / maxFull * 100) + '%';
      if(x.pass) fill.className = 'pass';
      track.appendChild(fill);
      /* 及格线刻度 */
      var line = el('div','hbpass');
      line.style.bottom = ((x.passScore || 80) / maxFull * 100) + '%';
      track.appendChild(line);
      col.appendChild(track);
      col.appendChild(el('div','hbv', String(x.score)));
      bars.appendChild(col);
    });
    box.appendChild(bars);

    var summary = S.examHistory.filter(function(x){ return x.pass; }).length;
    box.appendChild(el('div','hint',
      '累计考试 ' + S.examHistory.length + ' 次，及格 ' + summary + ' 次（' +
      (S.examHistory.length ? Math.round(summary / S.examHistory.length * 100) : 0) + '%）'));
    return box;
  }

  function startExam(){
    /* 真实考试结构：50 道单选（每题 1 分）+ 25 道多选（每题 2 分）
       满分 50×1 + 25×2 = 100 分，限时 120 分钟，80 分及格。
       两类题分别从题库里随机抽，然后整体打乱题序。 */
    var EX = S.examSpec;
    var singles = shuffle(QS.filter(function(q){ return q.type === '单选题'; }))
                    .slice(0, EX.singleCount);
    var multis  = shuffle(QS.filter(function(q){ return q.type === '多选题'; }))
                    .slice(0, EX.multiCount);

    /* 题量不足时降级（题库更新变少也不至于开不了考） */
    var shortfall = (singles.length < EX.singleCount) || (multis.length < EX.multiCount);

    var gids = shuffle(singles.map(function(q){ return q.gid; })
                 .concat(multis.map(function(q){ return q.gid; })));

    /* 每题分值：多选 2 分，单选 1 分 */
    var points = {};
    gids.forEach(function(g){
      points[g] = (BY[g] && BY[g].type === '多选题') ? EX.multiPoint : EX.singlePoint;
    });

    var fullScore = 0;
    gids.forEach(function(g){ fullScore += points[g]; });

    S.exam = {
      gids: gids,
      ans: {},
      qMs: {},                             /* 每题耗时 */
      pos: 0,
      msAcc: 0,                            /* 考试累计用时 */
      limitMs: EX.limitMin * 60 * 1000,    /* 120 分钟 */
      points: points,
      fullScore: fullScore,
      passScore: EX.passScore,
      shortfall: shortfall,
      autoSubmitting: false,
      startedAt: Date.now(),
      finished: false,
      /* 开考时就把每道题的选项显示顺序固定下来，
         否则交卷后 examRunning() 变 false，选项会变回原顺序，
         跟考试时看到的对不上。 */
      optOrder: (function(){
        var m = {};
        gids.forEach(function(gid){
          var q = BY[gid];
          if(q) m[gid] = optionView(q).order;
        });
        return m;
      })()
    };
    S.examReview = null;
    save(); render();
  }

  function finishExam(auto){
    var E = S.exam;
    if(!E || E.finished) return;
    var score = 0;          /* 加权得分（单选 1 分、多选 2 分） */
    var rightCount = 0;     /* 答对题数（不分权重，用于正确率） */

    E.gids.forEach(function(g){
      var q = BY[g], a = E.ans[g];
      var has = a && a.length;
      var ok = has ? isCorrect(q, a) : false;
      if(ok){
        rightCount++;
        score += (E.points && E.points[g] != null) ? E.points[g] : 1;
      }

      /* 并入总练习统计 */
      var prev = S.ans[g];
      S.ans[g] = {
        sel: has ? a.slice() : [],
        ok: ok,
        t: (typeof E.qMs[g] === 'number' && E.qMs[g] > MIN_T_MS) ? Math.round(E.qMs[g])
             : (prev && typeof prev.t === 'number' ? prev.t : 0)
      };

      var wi = S.wrong.indexOf(g);
      if(!ok){ noteWrong(g); }
      else { noteRight(g); }
    });

    E.score = score;
    E.rightCount = rightCount;
    E.elapsed = Math.round((E.msAcc || 0) / 1000);
    E.finished = true;

    /* 记录一次考试成绩，供「成绩走势」板块使用 */
    recordExamResult(E, auto);

    save(); render();
    window.scrollTo({top:0, behavior:'smooth'});
    if(auto) toast('时间到，已自动交卷');
  }

  function renderReview(main){
    var E = S.exam;
    var g = S.examReview;
    var q = BY[g];
    var a = E.ans[g] || [];
    main.innerHTML = '';

    var back = el('button','btn ghost','← 返回成绩单');
    back.onclick = function(){ S.examReview = null; save(); render(); };
    main.appendChild(back);

    var card = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge' + (q.type === '多选题' ? ' t2' : ''), q.type || '单选题'));
    var ix = el('span','qidx');
    ix.innerHTML = '第 <b>' + (E.gids.indexOf(g) + 1) + '</b> / ' + E.gids.length + ' 题';
    head.appendChild(ix);
    head.appendChild(el('span','spacer'));
    var qms = E.qMs[g] || 0;
    if(qms > MIN_T_MS){
      var qc = el('span','qclock');
      qc.innerHTML = '本题 <b>' + fmtShort(qms) + '</b>';
      head.appendChild(qc);
    }
    card.appendChild(head);
    card.appendChild(el('div','qtext', q.q));

    var cidx = correctIdx(q);
    var rview = optionView(q);          /* 考试中已固定顺序，这里能拿到 */
    var rdisp = [];
    for(var rr=0;rr<rview.order.length;rr++) rdisp[rview.order[rr]] = rr;

    var wrap = el('div','opts');
    rview.order.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt locked');
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      if(cidx.indexOf(oi) >= 0) b.classList.add('ok');
      else if(a.indexOf(oi) >= 0) b.classList.add('bad');
      wrap.appendChild(b);
    });
    card.appendChild(wrap);

    var ok = a.length ? isCorrect(q, a) : false;
    var res = el('div','result ' + (ok ? 'ok' : 'bad'));
    res.appendChild(el('div','rt', ok ? '✓ 回答正确' : (a.length ? '✕ 回答错误' : '○ 未作答')));

    var al = el('div','ansline');
    al.innerHTML = '正确答案：<b>' +
      cidx.map(function(oi){ return letter(rdisp[oi]); }).join('、') + '</b>';
    res.appendChild(al);

    var yl = el('div','ansline' + (ok ? '' : ' wrong'));
    yl.innerHTML = '你的选择：<b>' +
      (a.length ? a.slice().sort(function(x,y){return x-y;})
                    .map(function(oi){ return letter(rdisp[oi]); }).join('、') : '未作答') + '</b>';
    res.appendChild(yl);

    if(qms > MIN_T_MS){
      var tl = el('div','tline');
      var per = E.gids.length ? (E.msAcc || 0) / E.gids.length : 0;
      tl.innerHTML = '本题用时 <b>' + fmtShort(qms) + '</b> · 全卷平均 <b>' + fmtShort(per) + '</b>';
      res.appendChild(tl);
    }

    var sp = splitAnalysis(q.analysis);
    if(sp.body){
      var ana = el('div','ana');
      ana.appendChild(el('span','lb','解 析'));
      ana.appendChild(document.createTextNode(
        analysisText(q, sp.body, rdisp, rview.shuffled)));
      res.appendChild(ana);
    }
    card.appendChild(res);
    main.appendChild(card);
  }

  /* ============================================================
     备份 / 恢复
     localStorage 会被浏览器清理、也不会跟着 HTML 文件走。
     所以提供一条「导出为文件 / 从文件恢复」的退路。
     ============================================================ */
  function buildBackup(){
    return {
      __type: 'offline-tiku-backup',
      __version: 1,
      __bank: BANK.key || 'bank',
      __title: BANK.title || '',
      __exportedAt: new Date().toISOString(),
      data: {
        ans: S.ans, wrong: S.wrong, star: S.star,
        wcnt: S.wcnt, wlast: S.wlast,
        stats: S.stats, memorizing: S.memorizing
      }
    };
  }

  function exportBackup(){
    var obj = buildBackup();
    var json = JSON.stringify(obj, null, 1);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var name = '题库进度备份-' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) +
               '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
    toast('已导出备份文件' + name);
  }

  function importBackup(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var obj;
      try{ obj = JSON.parse(String(reader.result)); }
      catch(e){ toast('文件不是合法的 JSON'); return; }

      if(!obj || obj.__type !== 'offline-tiku-backup' || !obj.data){
        toast('这不是本题库的备份文件');
        return;
      }
      var d = obj.data;
      var n = d.ans ? Object.keys(d.ans).length : 0;
      if(!confirm('确认用这个备份覆盖当前进度吗？' + '\n\n' +
                  '备份时间：' + (obj.__exportedAt || '未知') + '\n' +
                  '已答题数：' + n + ' 题\n' +
                  '错题本：' + ((d.wrong || []).length) + ' 题\n' +
                  '收藏：' + ((d.star || []).length) + ' 题\n\n' +
                  '当前的进度会被全部替换。')) return;

      // 逐项恢复，并过滤掉不存在的题号
      S.ans = {};
      if(d.ans) for(var g in d.ans) if(BY[g]) S.ans[g] = d.ans[g];
      S.wrong = (d.wrong || []).filter(function(g){ return BY[g]; });
      S.star  = (d.star  || []).filter(function(g){ return BY[g]; });
      S.wcnt = {};
      if(d.wcnt) for(var g2 in d.wcnt) if(BY[g2]) S.wcnt[g2] = Number(d.wcnt[g2]) || 0;
      S.wlast = {};
      if(d.wlast) for(var g3 in d.wlast) if(BY[g3]) S.wlast[g3] = Number(d.wlast[g3]) || 0;
      if(d.stats && typeof d.stats === 'object'){
        S.stats.day = d.stats.day || todayKey();
        S.stats.dayMs = Number(d.stats.dayMs) || 0;
        S.stats.totalMs = Number(d.stats.totalMs) || 0;
      }
      ensureDay();
      if(typeof d.memorizing === 'boolean') S.memorizing = d.memorizing;

      save(); render();
      toast('已恢复备份：' + Object.keys(S.ans).length + ' 题记录');
    };
    reader.readAsText(file);
  }

  function backupBar(){
    var box = el('div','backup');
    var lb = el('div','bk-lb');
    var answeredN = Object.keys(S.ans).length;
    lb.innerHTML = '进度已存在<b>本机浏览器</b>里。换电脑、重装系统、清浏览器数据都会丢。' +
                   '想做一分保险，导个备份文件（' + answeredN + ' 题）；换电脑时再导回来。';
    box.appendChild(lb);

    var btExp = el('button','btn sm','导出备份');
    btExp.onclick = exportBackup;
    box.appendChild(btExp);

    var btImp = el('button','btn sm','从备份恢复');
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.style.display = 'none';
    fileInput.onchange = function(){
      if(fileInput.files && fileInput.files[0]) importBackup(fileInput.files[0]);
      fileInput.value = '';
    };
    box.appendChild(fileInput);
    btImp.onclick = function(){ fileInput.click(); };
    box.appendChild(btImp);

    return box;
  }

  /* ============================================================
     顶部按钮
     ============================================================ */
  $('btReset').onclick = function(){
    if(!confirm('确定重置全部练习进度？\n\n将清空：已答题记录、错题本、收藏、当前进度、\n以及计时统计（本次 / 今日 / 累计）。\n\n题目内容不受影响，可重新开始刷。')) return;
    S.pos = {seq:0,random:0,wrong:0,star:0,search:0};
    S.order = [];
    S.ans = {};
    S.wrong = [];
    S.star = [];
    S.wcnt = {};
    S.wlast = {};
    S.pend = {};
    S.exam = null;
    S.examReview = null;
    S.mode = 'seq';
    S.memorizing = false;
    S.stats = { day: todayKey(), dayMs: 0, totalMs: 0 };
    S.examHistory = [];
    S.daily = {};
    TMR.sessMs = 0;
    TMR.qGid = null;
    TMR.qMs = 0;
    TMR.lastTick = Date.now();
    try{ localStorage.removeItem(LS); }catch(e){}
    save(); render();
    toast('已重置，可以从头刷了');
  };

  $('btMemorize').onclick = function(){
    S.memorizing = !S.memorizing;
    save(); render();
    toast(S.memorizing ? '背题模式：答案常显示' : '答题模式：作答后显示答案');
  };

  $('btPause').onclick = function(){ setPaused(TMR.running); };

  /* ============================================================
     键盘
     ============================================================ */
  document.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

    /* 空格：暂停 / 继续计时 */
    if(e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      setPaused(TMR.running);
      return;
    }

    /* 考试中：左右切题 */
    if(examRunning()){
      var E = S.exam;
      if(e.key === 'ArrowLeft' && E.pos > 0){ E.pos--; save(); render(); e.preventDefault(); }
      if(e.key === 'ArrowRight' && E.pos < E.gids.length-1){ E.pos++; save(); render(); e.preventDefault(); }
      var eg = E.gids[E.pos];
      var eq = BY[eg];
      var en = keyToIndex(e.key, eq);
      if(en >= 0){
        e.preventDefault();
        var cur = (E.ans[eg] || []).slice();
        if(eq.type !== '多选题'){ E.ans[eg] = [en]; }
        else {
          var pp = cur.indexOf(en);
          if(pp >= 0) cur.splice(pp,1); else cur.push(en);
          if(cur.length) E.ans[eg] = cur; else delete E.ans[eg];
        }
        save(); render();
      }
      return;
    }

    var list = modeList();
    if(!list.length) return;
    var pos = S.pos[S.mode] || 0;
    var q = list[pos];
    var rec = S.ans[q.gid];
    var showAns = rec || S.memorizing;

    if(e.key === 'ArrowLeft'){ if(pos > 0){ goto(S.mode, pos-1); e.preventDefault(); } return; }
    if(e.key === 'ArrowRight'){ if(pos < list.length-1){ goto(S.mode, pos+1); e.preventDefault(); } return; }

    if(showAns){
      if(e.key === 'Enter' && pos < list.length-1){ goto(S.mode, pos+1); e.preventDefault(); }
      return;
    }

    if(e.key === 'Enter'){
      var pend = (S.pend || {})[q.gid];
      if(pend && pend.length){ submitNow(q, pend); e.preventDefault(); return; }
    }

    var n = keyToIndex(e.key, q);
    if(n < 0) return;
    e.preventDefault();

    if(q.type !== '多选题'){ submitNow(q, [n]); return; }

    var cur2 = ((S.pend || {})[q.gid] || []).slice();
    var p2 = cur2.indexOf(n);
    if(p2 >= 0) cur2.splice(p2,1); else cur2.push(n);
    S.pend = S.pend || {};
    if(cur2.length) S.pend[q.gid] = cur2; else delete S.pend[q.gid];
    save(); render();
  });

  function keyToIndex(key, q){
    var n = -1;
    if(/^[a-fA-F]$/.test(key)) n = key.toUpperCase().charCodeAt(0) - 65;
    else if(/^[1-6]$/.test(key)) n = parseInt(key, 10) - 1;
    if(n < 0 || !q || n >= q.options.length) return -1;
    return n;
  }

  /* ============================================================
     页面可见性：切走就暂停累加，回来重新对齐时钟
     ============================================================ */
  document.addEventListener('visibilitychange', function(){
    TMR.lastTick = Date.now();
    if(document.hidden){
      /* 切走页面（切 App、锁屏、关标签）立刻落盘一次，
         不等 5 秒周期，避免最后几秒的进度丢 */
      try{ save(); }catch(e){}
    }else{
      updateClock();
    }
  });
  /* pagehide 比 beforeunload 在移动端更可靠（手机上 beforeunload 经常不触发） */
  window.addEventListener('pagehide', function(){ try{ save(); }catch(e){} });
  window.addEventListener('beforeunload', function(){ try{ save(); }catch(e){} });

  /* ============================================================
     启动
     ============================================================ */
  load();
  $('ttl').textContent = BANK.title || '离线题库';
  if(!S.mode) S.mode = 'seq';
  TMR.lastTick = Date.now();
  render();

  /* 每秒跑一次计时主循环 */
  setInterval(tick, 1000);

  /* 供自动化测试 / 控制台调试使用 */
  window.__bank = {
    S:S, TMR:TMR, BY:BY, QS:QS,
    save:save, render:render,
    fmtDur:fmtDur, fmtShort:fmtShort, avgMs:avgMs,
    setPaused:setPaused, trackQuestion:trackQuestion,
    groupStats:groupStats, difficultyOf:difficultyOf,
    wrongRank:wrongRank, rankCount:rankCount,
    noteWrong:noteWrong, noteRight:noteRight,
    buildBackup:buildBackup, exportBackup:exportBackup, importBackup:importBackup,
    optionView:optionView, canShuffleOptions:canShuffleOptions, remapLetters:remapLetters,
    seededShuffle:seededShuffle,
    recentDays:recentDays, todayEncouragement:todayEncouragement,
    trendAnnotation:trendAnnotation, examAnnotation:examAnnotation,
    recordDailyAnswer:recordDailyAnswer, recordExamResult:recordExamResult,
    dailyKey:dailyKey
  };
})();
</script>
