  /* ============================================================
     练习
     ============================================================ */
  function renderPractice(main){
    var list = modeList();
    if(!list.length){
      var e = el('div','empty');
      if(S.mode === 'wrong'){
        e.appendChild(el('div','big','🎉'));
        e.appendChild(el('h3',null,'错题本是空的'));
        e.appendChild(el('p',null,'答错的题会自动收进来，答对后自动移出'));
      }else if(S.mode === 'star'){
        e.appendChild(el('div','big','⭐'));
        e.appendChild(el('h3',null,'还没有收藏题目'));
        e.appendChild(el('p',null,'点题目右上角的星标即可收藏'));
      }else{
        e.appendChild(el('div','big','📚'));
        e.appendChild(el('h3',null,'暂无题目'));
      }
      var b = el('button','btn primary','去顺序刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      main.appendChild(e);
      return;
    }

    /* 顺序刷题：说明选项顺序会随重置变化，并把当前轮次显示出来 */
    if(S.mode === 'seq'){
      var seqNote = el('div','actions');
      seqNote.style.marginTop = '0';
      seqNote.style.marginBottom = '12px';
      var badge = el('span','roundbadge');
      badge.innerHTML = '第 <b>' + ((S.optRound || 0) + 1) + '</b> 轮 · 选项位置每轮重排';
      badge.title = '重置本板块（或右上角总重置）会换一套选项位置，避免记住位置';
      seqNote.appendChild(badge);
      seqNote.appendChild(seqResetBtn('本轮'));
      main.appendChild(seqNote);
    }

    /* 随机刷题时，顶部给一个「选项是否打乱」的小开关 */
    if(S.mode === 'random'){
      var row = el('div','actions');
      row.style.marginTop = '0';
      row.style.marginBottom = '12px';
      var seg = el('div','seg');
      [['on','选项也打乱'],['off','只打乱顺序']].forEach(function(p){
        var on = (p[0] === 'on') === (S.shuffleOpt !== false);
        var btn = el('button', on ? 'on' : '', p[1]);
        btn.onclick = function(){
          S.shuffleOpt = (p[0] === 'on');
          save(); render();
          toast(S.shuffleOpt ? '选项位置也打乱了' : '只打乱题目顺序，选项保持原顺序');
        };
        seg.appendChild(btn);
      });
      row.appendChild(seg);
      row.appendChild(seqResetBtn('本板块'));
      main.appendChild(row);
    }

    /* 错题本 / 收藏 / 搜索：也给一个本板块重置，不用每次都动总重置 */
    if(S.mode === 'wrong' || S.mode === 'star' || S.mode === 'search'){
      var r2 = el('div','actions');
      r2.style.marginTop = '0';
      r2.style.marginBottom = '12px';
      r2.appendChild(labNote(S.mode));
      r2.appendChild(seqResetBtn('本板块'));
      main.appendChild(r2);
    }

    practiceCard(main, list, S.mode);
  }

  /* 各练习板块顶部那条提示语 */
  function labNote(mode){
    var map = {
      wrong: '答错的题会自动收进来，连续答对 3 次移出',
      star:  '手动星标的题',
      search:'搜索结果'
    };
    return el('span','roundbadge', map[mode] || '');
  }

  /* 通用「重置本板块」按钮：只清本板块题池里的作答记录，能重做。
     顺序 / 随机 / 错题本 / 收藏 / 搜索 共用。 */
  function seqResetBtn(label){
    var b = el('button','btn ghost','重置' + label);
    b.title = '清掉本板块的作答记录，做完的题可以重新做一遍';
    b.onclick = function(){
      var list = modeList();
      var mine = boardAns(S.mode);
      var n = list.filter(function(q){ return !!mine[q.gid]; }).length;
      var name = { seq:'顺序刷题', random:'随机刷题', wrong:'错题本', star:'收藏', search:'搜索结果' }[S.mode] || '本板块';
      var extra = '';
      if(S.mode === 'wrong' || S.mode === 'star'){
        extra = '\n\n不会把题从「' + name + '」里移出去（名单保留，只清作答记录）。';
      }
      var msg = '重置「' + name + '」？\n\n' +
                '会清空本板块的作答记录（当前已做 ' + n + ' 题），做完的题可以重新做一遍；' +
                '同时回到第 1 题，并换一套选项位置。' + extra + '\n\n' +
                '不会动：其他板块的作答记录、错题本、收藏、累计错题次数、成绩走势。\n' +
                '（想全部清空，用右上角的总「重置」。）';
      if(!confirm(msg)) return;
      var cleared = resetPractice(S.mode);
      toast(cleared > 0 ? ('已重置「' + name + '」，' + cleared + ' 题可以重新做了')
                        : ('已重置「' + name + '」'));
    };
    return b;
  }

  /* 读写「当前第几题」：专项模式用 S.drill[key].pos，其他模式用 S.pos[key]。
     这样三个专项各自独立记进度，互不干扰。 */
  function getPos(modeKey){
    if(isDrillMode(modeKey)) return (S.drill[modeKey] && S.drill[modeKey].pos) || 0;
    return S.pos[modeKey] || 0;
  }
  function setPos(modeKey, v){
    if(isDrillMode(modeKey)){
      if(S.drill[modeKey]) S.drill[modeKey].pos = v;
    }else{
      S.pos[modeKey] = v;
    }
  }

  function practiceCard(main, list, modeKey){
    var pos = getPos(modeKey);
    if(pos < 0) pos = 0;
    if(pos > list.length - 1) pos = list.length - 1;
    setPos(modeKey, pos);

    var q = list[pos];
    /* 只读**当前板块**的记录：在顺序刷题做过的题，
       到单选专项 / 错题本里就是「没做过」，要能重新作答。
       这正是「各板块各刷各的」的核心。 */
    var mine = boardAns(modeKey);
    var rec = mine[q.gid];
    var answered = !!rec;
    /* showAns 的三个来源，优先级从高到低：
       1. 本板块已作答 —— 必须显示答案与解析
       2. 本题被单独「查看答案」过（S.reveal[gid]）—— 只影响这一道题
       3. 全局背题模式（顶部「背题」按钮）—— 用户显式开启才生效 */
    var revealed = !!(S.reveal && S.reveal[q.gid]);
    var showAns = answered || revealed || S.memorizing;
    var sel = [];
    if(answered) sel = rec.sel.slice();
    else if(!showAns){
      var pendSel = pendGet(q.gid, modeKey);
      if(pendSel) sel = pendSel.slice();
    }

    /* 通知计时器当前题号 */
    trackQuestion(showAns ? null : q.gid);

    var card = el('div','card');

    /* ---------- 头部 ---------- */
    var head = el('div','qhead');
    var isMulti = q.type === '多选题';
    head.appendChild(el('span','badge' + (isMulti ? ' t2' : ''), q.type || '单选题'));

    var idx = el('span','qidx');
    idx.innerHTML = '第 <b>' + (pos + 1) + '</b> / ' + list.length + ' 题';
    head.appendChild(idx);

    /* 当前板块的正确率，紧跟在「第 N / M 题」旁边。
       小字灰色徽标，不占额外一行（在同一个 flex 行里），不影响布局。
       只统计「本板块题池内已作答的题」，与页面上看到的题范围一致。 */
    var sectionRate = rateOfList(list, modeKey);
    if(sectionRate.total > 0){
      var rt2 = el('span','qrate');
      rt2.innerHTML = '正确率 <b>' + sectionRate.rate + '%</b>' +
                      '<i>' + sectionRate.right + '/' + sectionRate.total + '</i>';
      rt2.title = '本板块已作答 ' + sectionRate.total + ' 题，答对 ' + sectionRate.right + ' 题';
      head.appendChild(rt2);
    }

    head.appendChild(el('span','spacer'));

    /* 本题实时计时（未作答时才有意义） */
    if(!showAns){
      var qc = el('span','qclock');
      qc.innerHTML = '<b id="qLive">' + fmtDur(TMR.qMs) + '</b>';
      head.appendChild(qc);
    }else if(answered && typeof rec.t === 'number'){
      var qc2 = el('span','qclock');
      qc2.innerHTML = '<b>' + fmtShort(rec.t) + '</b>';
      head.appendChild(qc2);
    }

    var st = el('button','star' + (S.star.indexOf(q.gid) >= 0 ? ' on' : ''), S.star.indexOf(q.gid) >= 0 ? '★' : '☆');
    st.title = '收藏本题';
    st.onclick = function(){
      var i = S.star.indexOf(q.gid);
      if(i >= 0){ S.star.splice(i,1); toast('已取消收藏'); }
      else { S.star.push(q.gid); toast('已收藏'); }
      save(); render();
    };
    head.appendChild(st);
    card.appendChild(head);

    /* ---------- 题干 ---------- */
    card.appendChild(el('div','qtext', q.q));

    /* ---------- 作答前的提示（绝不能泄露答案） ----------
       ⚠️ 这里曾经踩过一个大坑：题库里有 7 道多选题是「所有选项都为正确答案」，
       当时为了消除「为什么全选才对」的困惑，在题干下面加了一句
       「这道题全部选项都设为正确答案，需要全选」——
       结果等于**在作答前直接把答案告诉了用户**。
       提示语只要提到「正确答案有几个」，就是泄题，
       哪怕它的本意是解释数据异常。

       现在的分界线很明确：
         · 作答前：只给**题型规则**（多选题需选全），不给任何关于本题的信息
         · 作答后：才说明这道题为什么是这个答案

       题型规则对所有多选题一视同仁，不针对某道题，
       所以既提醒了规则、又不透露任何一道题的答案。 */
    if(isMulti && !showAns){
      var ruleHint = el('div','hint','多选题：需选全所有正确选项，漏选或错选都算错');
      ruleHint.style.marginTop = '-4px';
      card.appendChild(ruleHint);
    }

    /* ---------- 选项 ----------
       存储层（S.ansAll / S.pendAll / correctIdx）永远用「原始下标」，
       只有显示层换成打乱后的顺序。这样选项打乱不会破坏已存的答案。 */
    var wrap = el('div','opts');
    var cidx = correctIdx(q);
    var view = optionView(q);
    view.order.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt');
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      var isPicked = sel.indexOf(oi) >= 0;
      if(showAns){
        b.classList.add('locked');
        if(cidx.indexOf(oi) >= 0) b.classList.add('ok');
        else if(isPicked) b.classList.add('bad');
      }else if(isPicked){
        b.classList.add('sel');
      }
      b.onclick = function(){
        if(showAns) return;
        /* 回写时用原始下标，不用显示位置 */
        if(!isMulti){ submitNow(q, [oi]); return; }
        var p = sel.indexOf(oi);
        if(p >= 0) sel.splice(p,1); else sel.push(oi);
        pendSet(q.gid, sel, modeKey);
        save(); render();
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);

    /* ---------- 操作 ---------- */
    var acts = el('div','actions');
    if(!showAns){
      if(isMulti){
        var sb = el('button','btn primary','提交答案');
        sb.disabled = sel.length === 0;
        sb.onclick = function(){ if(sel.length) submitNow(q, sel); };
        acts.appendChild(sb);
      }
      var reveal = el('button','btn ghost','查看答案');
      reveal.onclick = function(){
        /* 只揭示这一道题，不改全局背题模式。
           原来的写法是 S.memorizing = true; save();
           —— 点一次「查看答案」就永久把所有板块都变成背题模式，
              下次打开还是背题，用户以为「怎么默认不让我刷了」。 */
        S.reveal = S.reveal || {};
        S.reveal[q.gid] = true;
        save(); render();          /* save() 不持久化 reveal，刷新即失效 */
        toast('已显示本题答案（只这一题，切题即恢复答题）');
      };
      acts.appendChild(reveal);
    }else{
      if(answered){
        var redo = el('button','btn','重做本题');
        redo.onclick = function(){
          /* 重做只清「本次作答记录」，不动累计错次（那是统计依据） */
          delRec(q.gid, modeKey);
          TMR.qMs = 0;
          save(); render();
        };
        acts.appendChild(redo);
        if(modeKey === 'wrong'){
          var rm = el('button','btn ghost','移出错题本');
          rm.onclick = function(){
            /* 【真实缺陷修复】原来这里调的是 noteRight(q.gid)，而 noteRight 内部
               只在 streak>=3 时才真正从 S.wrong 里删。于是：点了按钮、提示说
               「已移出错题本」，实际一条都没删，还顺手把掌握度 +1（凭空多算一次答对）。
               按钮在说谎，这是最糟的一种：用户以为看过了，其实还在。

               正确语义：「移出错题本」= 用户明确表示「这题我不想再看到它了」，
               它**不等于掌握**。所以：
                 · 直接从 S.wrong 删掉（不问 streak）
                 · 不动 S.streak（掌握度只能靠真答对积累）
                 · 不动 S.wcnt（历史错次是排行的依据，清了排行就缺题）
               想真正「判为已掌握」得连续答对 3 次，那是另一条路径。 */
            var wi = S.wrong.indexOf(q.gid);
            if(wi >= 0) S.wrong.splice(wi, 1);
            /* 列表收缩了，位置要夹回范围内，否则会停到越界/跳到别的题 */
            var nl = modeList().length;
            S.pos.wrong = nl ? Math.max(0, Math.min(S.pos.wrong, nl - 1)) : 0;
            save();
            toast('已移出错题本（错题次数仍保留在排行里，连续答对 3 次才算掌握）');
            render();
          };
          acts.appendChild(rm);
        }
      }
      var nb = el('button','btn primary', pos >= list.length - 1 ? '已是最后一题' : '下一题 →');
      nb.disabled = pos >= list.length - 1;
      nb.onclick = function(){ goto(modeKey, pos + 1); };
      acts.appendChild(nb);

      /* 只是「看了眼答案」、还没真正作答的题：给个回到作答状态的出口。
         没有这个按钮，看过答案就只能靠切题/刷新才恢复，体验上像卡在背题里。 */
      if(revealed && !answered && !S.memorizing){
        var back = el('button','btn ghost','继续作答');
        back.onclick = function(){
          delete S.reveal[q.gid];
          TMR.qMs = 0;
          save(); render();
        };
        acts.appendChild(back);
      }

      if(modeKey !== 'search'){
        var jw = el('div','jump');
        jw.appendChild(document.createTextNode('跳转到'));
        var ji = document.createElement('input');
        ji.type = 'number'; ji.min = 1; ji.max = list.length;
        ji.placeholder = String(pos + 1);
        var jb = el('button','btn ghost','Go');
        jb.onclick = function(){
          var v = parseInt(ji.value, 10);
          if(!v || v < 1 || v > list.length){ toast('请输入 1–' + list.length); return; }
          goto(modeKey, v - 1);
        };
        ji.onkeydown = function(e){ if(e.key === 'Enter') jb.click(); };
        jw.appendChild(ji); jw.appendChild(jb);
        acts.appendChild(jw);
      }
    }
    card.appendChild(acts);

    /* ---------- 答案 / 解析 ----------
       注意：选项可能被打乱显示，所以：
         · 「正确答案」字母要用【显示位置】
         · 解析正文里引用的字母也要按同一映射重写
         否则会出现「正确答案写 D，但 D 所在的那行是错的」这种错位 */
    if(showAns){
      var sp = splitAnalysis(q.analysis);
      var res = el('div','result');
      if(answered) res.classList.add(rec.ok ? 'ok' : 'bad');
      else res.classList.add('plain');

      var rt = el('div','rt');
      rt.textContent = answered ? (rec.ok ? '✓ 回答正确' : '✕ 回答错误') : '答案与解析';
      res.appendChild(rt);

      /* 原始下标 → 显示位置 的映射数组 */
      var dispOf = [];
      for(var di=0;di<view.order.length;di++) dispOf[view.order[di]] = di;

      var al = el('div','ansline');
      al.innerHTML = '正确答案：<b>' +
        cidx.map(function(oi){ return letter(dispOf[oi]); }).join('、') + '</b>';
      res.appendChild(al);

      if(answered){
        var yl = el('div','ansline' + (rec.ok ? '' : ' wrong'));
        yl.innerHTML = '你的选择：<b>' +
          (sel.length ? sel.slice().sort(function(a,b){return a-b;})
                           .map(function(oi){ return letter(dispOf[oi]); }).join('、') : '未作答') + '</b>';
        res.appendChild(yl);

        /* 用时对比 */
        if(typeof rec.t === 'number' && rec.t > 0){
          var avg = avgMs();
          var tl = el('div','tline');
          var html = '本题用时 <b>' + fmtShort(rec.t) + '</b>';
          if(avg != null){
            html += ' · 平均 <b>' + fmtShort(avg) + '</b>';
            var ratio = rec.t / avg;
            if(ratio <= 0.75) html += ' <span class="tag">比平时快</span>';
            else if(ratio >= 1.6) html += ' <span class="tag slow">偏慢，注意</span>';
          }else{
            html += ' <span class="tag">累计 3 题后显示平均</span>';
          }
          tl.innerHTML = html;
          res.appendChild(tl);
        }
      }

      /* 答案已揭示之后，才说明「这道题所有选项都是正确答案」这种数据异常。
         放在这里不构成泄题 —— 用户已经看到正确答案了。
         这也解释了「为什么我少选一个就判错」，消掉那种「是不是系统算错了」的困惑。 */
      if(isMulti && q.options.length > 1 && !q.options.some(function(o){ return !o.ok; })){
        var allNote = el('div','tline');
        allNote.innerHTML = '<span class="tag">题库数据说明</span> ' +
          '这道题的选项在源题库里全部标记为正确答案，因此只有全选才算对。' +
          '（导出的原始数据如此，不是判分出错）';
        res.appendChild(allNote);
      }

      if(sp.body){
        var ana = el('div','ana');
        ana.appendChild(el('span','lb','解 析'));
        ana.appendChild(document.createTextNode(
          analysisText(q, sp.body, dispOf, view.shuffled)));
        res.appendChild(ana);
      }
      card.appendChild(res);
    }

    main.appendChild(card);

    /* ---------- 上一题 / 下一题 ---------- */
    var nav = el('div','actions');
    var prev = el('button','btn','← 上一题');
    prev.disabled = pos === 0;
    prev.onclick = function(){ goto(modeKey, pos - 1); };
    nav.appendChild(prev);
    nav.appendChild(el('span','spacer'));
    var nxt = el('button','btn','下一题 →');
    nxt.disabled = pos >= list.length - 1;
    nxt.onclick = function(){ goto(modeKey, pos + 1); };
    nav.appendChild(nxt);
    main.appendChild(nav);

    main.appendChild(el('div','hint','进度与计时都自动保存在本机浏览器中'));
    updateClock();
  }

  function goto(modeKey, i){
    /* 切题了 → 上一题的「临时保留」失效，这时才真正从错题本移除 */
    S.keepAfterRemove = null;
    S.keepAfterRemoveMode = null;
    setPos(modeKey, i);
    /* 切题就清掉「临时揭示」：下一题要保持答题状态，
       否则揭示会像多米诺一样一题题扩散，等于变相开了背题模式。 */
    S.reveal = {};
    save();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ============================================================
     掌握度：靠「连续答对次数」判断，而不是「答对过一次就当我学会了」
     ------------------------------------------------------------
     一道题做错 -> 连续对 0
     再答对一次 -> 连续对 1（还不算掌握）
     连续对到 MASTER_STREAK 次 -> 判定已掌握，可以移出攻坚名单

     为什么用连续：错过的题一次性蒙对，很可能还是没真懂。
     要求连续 3 次答对，才说明稳定会了。
     ============================================================ */
  var MASTER_STREAK = 3;      // 连续答对几次算掌握
  var STUBBORN_MIN = 3;       // 历史错过几次算「顽固」

  /* 统一记录一次「答错」：用于错题本、错题次数、最后答错时间、连续对归零 */
  function noteWrong(gid){
    /* 新错的题放到最前面 —— 但**不能影响用户当前正在看的那道题**。
       ------------------------------------------------------------
       【真实缺陷】原来直接 splice + unshift，整个列表顺序变，
       而 S.pos.wrong 没跟着调整。于是：
         用户在错题本看第 3 题 → 答错 → 这道题被挪到第 1 位
         → 第 3 个位置变成了原来第 2 题 → 屏幕上的题「闪走」了，
           刚答完的结果和解析根本来不及看。
       用户原话：「现在三次后的打错了直接闪走了，我错了什么，错在哪都看不见」

       修法：移动后，把 pos 修正到「这道题的新位置」，
       这样答完仍然停在同一道题上，能看到解析。
       注意：只对「错题本」板块做这个修正 ——
       其他板块（顺序/随机/专项）的池子顺序不受 S.wrong 影响。 */
    var wi = S.wrong.indexOf(gid);
    if(wi >= 0) S.wrong.splice(wi, 1);
    S.wrong.unshift(gid);

    /* 如果用户当前正在「错题本」里做这道题，把他钉在这道题上 ——
       它刚被挪到第 1 位，pos 也要跟着回到 0。
       （这个函数只在答题路径里调用，所以 S.mode==='wrong' 就说明
         用户正在错题本里做这道题） */
    if(S.mode === 'wrong'){
      S.pos.wrong = 0;
    }

    S.wcnt[gid] = (S.wcnt[gid] || 0) + 1;
    S.wlast[gid] = Date.now();
    S.streak[gid] = 0;
  }
  /* 统一记录一次「答对」：连续对 +1；错题本按掌握度决定是否移出。
     注意：不清算 wcnt，那是「历史错过几次」，是判断顽固程度的依据 */
  /* keepVisible：是否保留「刚移出的这道题」供用户看完解析。
     只有**真实答题路径**（submitNow）才传 true；
     批量/程序化调用（比如统计、测试）不需要，否则池子会莫名多一题。 */
  function noteRight(gid, keepVisible){
    S.streak[gid] = (S.streak[gid] || 0) + 1;
    /* 只答对一次还留在错题本里；连续对够了才移出 */
    if(S.streak[gid] >= MASTER_STREAK){
      var wi = S.wrong.indexOf(gid);
      if(wi >= 0){
        /* 先记住「用户是不是正在做这道题」—— 决定之后要不要补一题在原地。
           注意：错题攻坚（hard）的池子也由 S.wrong 参与构成，
           答对到掌握同样会把题移出，所以这里两个板块都要管。 */
        var curPos = (S.mode === 'hard') ? (S.drill.hard.pos || 0) : (S.pos.wrong || 0);
        var wasCurrent = !!keepVisible &&
                         (S.mode === 'wrong' || S.mode === 'hard') &&
                         wi === curPos;

        S.wrong.splice(wi, 1);

        if(wasCurrent){
          /* 【真实缺陷】用户正在做这道题、答对后它被移出题库。
             列表短一位后，pos 不变就会显示**原来下一道题** ——
             刚答对的那道题连同解析一起「闪走」，看不到自己对了什么。
             用户原话：「现在三次后的打错了直接闪走了，我错了什么，错在哪都看不见」

             修法：把刚移出的题临时留在池子里（只这一次渲染），
             让用户能看到「✓ 回答正确 + 解析 + 已掌握」的完整反馈。
             他点「下一题」时（goto 会清掉 keepAfterRemove），才真正移除。 */
          S.keepAfterRemove = gid;
          S.keepAfterRemoveMode = S.mode;      /* 记住是哪个板块要保留 */
        }else if(S.mode === 'wrong' && wi < (S.pos.wrong || 0)){
          /* 移除点落在当前位置之前 → 后面的题整体前移，pos 要减 1 才能停在原来那道题 */
          S.pos.wrong = Math.max(0, (S.pos.wrong || 0) - 1);
        }

        var nl = S.wrong.length;
        if(!wasCurrent && S.pos.wrong > nl - 1) S.pos.wrong = Math.max(0, nl - 1);
      }
    }
  }

  /* 该题是否已掌握（连续答对够数） */
  function isMastered(gid){
    return (S.streak[gid] || 0) >= MASTER_STREAK;
  }
  /* 掌握度等级：用于专项练习分组和难度推导。
     掌握度是**跨板块汇总**的概念（「这道题我到底掌握了没有」不分在哪个板块练的），
     所以这里读汇总视图，不读单个板块。 */
  function masteryOf(gid){
    var st = S.streak[gid] || 0;
    var c = S.wcnt[gid] || 0;
    var rec = aggregateAns()[gid];
    if(st >= MASTER_STREAK) return 'mastered';            // 已掌握
    /* 没碰过：既没作答记录，也没错过。
       注意不能只看作答记录 —— noteWrong 只记 wcnt，不改作答记录，
       所以「错过但还没重新做对」也要算做过。 */
    if(!rec && c === 0) return 'untouched';
    /* 做错过、且当前连续对数为 0 -> 顽固（重点攻） */
    if(st === 0 && c > 0) return 'stubborn';
    /* 做对了但次数还不够 -> 巩固中 */
    return 'learning';
  }

  function submitNow(q, sel){
    var ok = isCorrect(q, sel);
    /* 记录本题耗时 */
    var spent = TMR.qGid === q.gid ? TMR.qMs : 0;
    /* 只写「当前板块」那一份 —— 顺序刷题里答题不该点亮单选专项 */
    setRec(q.gid, { sel: sel.slice(), ok: ok, t: Math.round(spent), at: Date.now() });
    pendClear(q.gid);
    TMR.qGid = null;
    TMR.qMs = 0;

    var wasInWrong = S.wrong.indexOf(q.gid) >= 0;
    if(!ok){
      noteWrong(q.gid);
      toast('答错了，已加入错题本');
    }else{
      /* true = 如果这一答让题「移出错题本/攻坚池」，保留它在原地一屏，
         让用户能看到「✓ 回答正确 + 解析 + 已掌握」（否则会立刻跳走） */
      noteRight(q.gid, true);
      /* 提示语要说清楚「还要连续对几次才移出」，
         否则用户会以为答对一次就该移出错题本了 */
      var stN = S.streak[q.gid] || 0;
      if(!wasInWrong){
        toast('答对了');
      }else if(stN >= MASTER_STREAK){
        toast('连续答对 ' + stN + ' 次，已掌握，移出错题本');
      }else{
        toast('答对了 · 连续 ' + stN + '/' + MASTER_STREAK + ' 次，再对 ' +
              (MASTER_STREAK - stN) + ' 次移出错题本');
      }
    }
    /* 记进当天统计，供「最近几天正确率」使用 */
    recordDailyAnswer(ok, spent, q.gid);
    save(); render();
  }

  /* ============================================================
     模拟考试
     ============================================================ */
  function renderExam(main){
    var E = S.exam;

    /* 看某一题解析 */
    if(E && E.finished && S.examReview && BY[S.examReview]){
      renderReview(main); return;
    }

    /* 未开始 / 已结束（成绩单） */
    if(!E || E.finished){
      /* ---- 设置 ---- */
      var EX = S.examSpec;
      var card = el('div','card');
      card.appendChild(el('div','qtext','模拟考试'));
      card.appendChild(el('div','ansline',
        '按真实考试结构出卷，每次从题库随机抽题并打乱题序。'));

      /* 卷面说明 */
      var spec = el('div','examspec');
      var specRows = [
        ['单选题', EX.singleCount + ' 题 × ' + EX.singlePoint + ' 分', (EX.singleCount*EX.singlePoint) + ' 分'],
        ['多选题', EX.multiCount + ' 题 × ' + EX.multiPoint + ' 分', (EX.multiCount*EX.multiPoint) + ' 分'],
        ['总分', '', (EX.singleCount*EX.singlePoint + EX.multiCount*EX.multiPoint) + ' 分'],
        ['限时', EX.limitMin + ' 分钟', ''],
        ['及格线', EX.passScore + ' 分', '']
      ];
      specRows.forEach(function(r){
        var row = el('div','specrow');
        row.appendChild(el('span','sk', r[0]));
        row.appendChild(el('span','sv', r[1]));
        row.appendChild(el('span','sp', r[2]));
        spec.appendChild(row);
      });
      card.appendChild(spec);

      /* 抽题上限提示（题库不够时说明一下） */
      var nSingle = QS.filter(function(x){ return x.type === '单选题'; }).length;
      var nMulti  = QS.filter(function(x){ return x.type === '多选题'; }).length;
      if(nSingle < EX.singleCount || nMulti < EX.multiCount){
        card.appendChild(el('div','hint',
          '注意：题库当前只有单选 ' + nSingle + ' 题、多选 ' + nMulti + ' 题，' +
          '不足部分会按实际题量出卷。'));
      }else{
        card.appendChild(el('div','hint',
          '题库现有单选 ' + nSingle + ' 题、多选 ' + nMulti + ' 题，每次随机抽取，每次卷子都不一样。'));
      }

      var setup = el('div','examsetup');
      var st = el('button','btn primary','开始考试（' + EX.singleCount + '+' + EX.multiCount + ' 题）');
      st.onclick = startExam;
      setup.appendChild(st);
      card.appendChild(setup);
      main.appendChild(card);

      /* ---- 成绩单 ---- */
      if(E && E.finished){
        main.appendChild(renderExamScoreCard(E));
      }
      return;
    }

    /* ---- 考试进行中 ---- */
    var g = E.gids[E.pos];
    var q = BY[g];
    var sel = (E.ans[g] || []).slice();
    var isMulti = q.type === '多选题';

    var card2 = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge' + (isMulti ? ' t2' : ''), q.type || '单选题'));
    /* 本题分值 */
    var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
    head.appendChild(el('span','ptbadge', pt + ' 分'));
    var idx2 = el('span','qidx');
    idx2.innerHTML = '第 <b>' + (E.pos + 1) + '</b> / ' + E.gids.length + ' 题';
    head.appendChild(idx2);
    head.appendChild(el('span','spacer'));

    var qc = el('span','qclock');
    qc.innerHTML = '本题 <b id="qLive">' + fmtDur(E.qMs[g] || 0) + '</b>';
    head.appendChild(qc);

    /* 答题卡进度点 —— 考试中只给「数量」类信息，不给任何对错反馈 */
    var answeredN = E.gids.filter(function(x){ return E.ans[x] && E.ans[x].length; }).length;
    var sheet = el('span','qclock');
    sheet.innerHTML = '已答 <b>' + answeredN + '</b>/' + E.gids.length;
    head.appendChild(sheet);

    /* 这里原来有一个「约 X 分」实时估分。
       它不只是个数字 —— 它会**当场判卷**：
         答错 → 分数不动；改答对 → 分数立刻 +1（多选 +2）。
       于是考生每题答完看一眼分数就知道该不该改答案，
       模拟考试直接退化成「边考边对答案」，考不出真实水平。

       考试模式下所有对错反馈都必须等到交卷：
         · 不显示得分/估分
         · 不显示正确率
         · 不用 ok / bad 样式标选项（那样也能看出对错）
       只保留「还剩多少时间 / 本题几分 / 已答几题」这类与对错无关的信息。
       交卷后成绩单和逐题解析照常显示。

       （练习模式相反：答完必须立刻给反馈，那是学习。两条路径不要混。） */

    card2.appendChild(head);
    card2.appendChild(el('div','qtext', q.q));

    var wrap = el('div','opts');
    /* 用开考时固定的顺序，而不是重新算（这样交卷前后一致） */
    var eorder = (E.optOrder && E.optOrder[g]) ? E.optOrder[g].slice()
                 : optionView(q).order;
    eorder.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt' + (sel.indexOf(oi) >= 0 ? ' sel' : ''));
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      b.onclick = function(){
        /* 一律存原始下标 */
        if(!isMulti){
          E.ans[g] = [oi];
        }else{
          var p = sel.indexOf(oi);
          if(p >= 0) sel.splice(p,1); else sel.push(oi);
          if(sel.length) E.ans[g] = sel.slice();
          else delete E.ans[g];
        }
        save(); render();
      };
      wrap.appendChild(b);
    });
    card2.appendChild(wrap);

    var acts = el('div','actions');
    var prev = el('button','btn','← 上一题');
    prev.disabled = E.pos === 0;
    prev.onclick = function(){ E.pos--; save(); render(); };
    acts.appendChild(prev);
    acts.appendChild(el('span','spacer'));

    if(E.pos < E.gids.length - 1){
      var nx = el('button','btn primary','下一题 →');
      nx.onclick = function(){ E.pos++; save(); render(); };
      acts.appendChild(nx);
    }
    var sub = el('button','btn' + (E.pos === E.gids.length - 1 ? ' primary' : ''),'交卷');
    sub.onclick = function(){
      var un = E.gids.filter(function(x){ return !(E.ans[x] && E.ans[x].length); }).length;
      if(un && !confirm('还有 ' + un + ' 题未作答，确定交卷？')) return;
      finishExam(false);
    };
    acts.appendChild(sub);
    card2.appendChild(acts);
    main.appendChild(card2);

    var nav = el('div','actions');
    nav.appendChild(el('span','spacer'));
    var quit = el('button','btn ghost','放弃本次考试');
    quit.onclick = function(){
      if(!confirm('确定放弃？本次作答不会计入统计。')) return;
      S.exam = null; S.examReview = null; save(); render();
    };
    nav.appendChild(quit);
    main.appendChild(nav);
    updateClock();
  }

  /* ============================================================
     成绩单
     ============================================================ */
  function renderExamScoreCard(E){
    var r = el('div','card');

    /* 总分 + 及格判定 */
    var full = E.fullScore || E.gids.length;
    var pass = E.passScore || 80;
    var passed = (E.score || 0) >= pass;

    var sc = el('div','score');
    sc.appendChild(el('span','big', (E.score || 0) + ''));
    sc.appendChild(el('span','sc-of','/ ' + full + ' 分'));
    r.appendChild(sc);

    var verdict = el('div','verdict ' + (passed ? 'pass' : 'fail'));
    verdict.textContent = passed
      ? '✓ 及格（及格线 ' + pass + ' 分）'
      : '✗ 未及格（差 ' + (pass - (E.score || 0)) + ' 分）';
    r.appendChild(verdict);

    /* 批注 */
    var note = el('div','comment ' + (passed ? 'good' : 'warn'));
    note.textContent = examAnnotation({
      score: E.score || 0, full: full, passScore: pass
    });
    r.appendChild(note);

    if(E.shortfall){
      r.appendChild(el('div','hint','本次题库题量不足，已按实际可用题目出卷，总分可能低于 100。'));
    }

    /* 统计格子 */
    var answered = E.gids.filter(function(g){ return E.ans[g] && E.ans[g].length; }).length;
    var rightN = E.rightCount || 0;
    var totalMs = E.msAcc || 0;
    var perMs = E.gids.length ? totalMs / E.gids.length : 0;
    var rate = E.gids.length ? Math.round(rightN / E.gids.length * 100) : 0;

    /* 分类得分 */
    var singleTotal = 0, singleGot = 0, multiTotal = 0, multiGot = 0;
    E.gids.forEach(function(g){
      var q = BY[g];
      var isMulti = q && q.type === '多选题';
      var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
      var got = isCorrect(q, E.ans[g] || []);
      if(isMulti){ multiTotal += pt; if(got) multiGot += pt; }
      else { singleTotal += pt; if(got) singleGot += pt; }
    });

    var grid = el('div','statgrid');
    [['正确率', rate + '%'],
     ['答对', rightN + ' 题'],
     ['答错/未答', (E.gids.length - rightN) + ' 题'],
     ['用时', fmtDur(totalMs)],
     ['平均每题', fmtShort(perMs)],
     ['及格线', pass + ' 分']
    ].forEach(function(p){
      var s = el('div','stat');
      s.appendChild(el('div','v', p[1]));
      s.appendChild(el('div','l', p[0]));
      grid.appendChild(s);
    });
    r.appendChild(grid);

    /* 分项得分 */
    var brk = el('div','scorebreak');
    [['单选题', singleGot, singleTotal],
     ['多选题', multiGot, multiTotal]].forEach(function(p){
      var row = el('div','sbrow');
      row.appendChild(el('span','sbname', p[0]));
      var bar = el('div','sbbar');
      var fill = document.createElement('i');
      fill.style.width = (p[2] ? (p[1] / p[2] * 100) : 0) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el('span','sbnum', p[1] + ' / ' + p[2]));
      brk.appendChild(row);
    });
    r.appendChild(brk);

    r.appendChild(el('div','ansline','点击下方条目查看每题解析'));

    var list = el('div','review');
    E.gids.forEach(function(g, i){
      var q = BY[g];
      var a = E.ans[g];
      var ok = a && a.length ? isCorrect(q, a) : false;
      var pt = (E.points && E.points[g] != null) ? E.points[g] : 1;
      var row = el('div','rrow');
      row.appendChild(el('span','dot ' + (a && a.length ? (ok ? 'o' : 'x') : 'n')));
      row.appendChild(el('span','t', (i+1) + '. ' + q.q.replace(/\s+/g,' ').slice(0,50)));
      var qms = E.qMs[g] || 0;
      if(qms > MIN_T_MS) row.appendChild(el('span','tm', fmtShort(qms)));
      if(pt > 1) row.appendChild(el('span','pt', pt + '分'));
      var rr = el('span','r' + (a && a.length ? (ok ? ' ok' : ' x') : ''), a && a.length ? (ok ? '正确' : '错误') : '未答');
      row.appendChild(rr);
      row.onclick = function(){ S.examReview = g; save(); render(); };
      list.appendChild(row);
    });
    r.appendChild(list);

    var again = el('button','btn primary','再考一次');
    again.onclick = function(){ S.exam = null; S.examReview = null; save(); render(); };
    r.appendChild(again);

    /* 历史成绩走势 */
    r.appendChild(renderExamHistory());

    return r;
  }

  /* 考试成绩走势（简要版，完整版在统计页） */
  function renderExamHistory(){
    var box = el('div','examhist');
    var hs = S.examHistory || [];
    if(!hs.length) return box;

    var lb = el('div','histlb','考试成绩记录（最近 ' + Math.min(hs.length, 10) + ' 次）');
    box.appendChild(lb);

    var recent = hs.slice(-10);
    var bars = el('div','histbars');
    var maxFull = Math.max.apply(null, recent.map(function(x){ return x.full || 100; }));
    recent.forEach(function(x, i){
      var col = el('div','hb');
      var track = el('div','hbtrack');
      var fill = document.createElement('i');
      fill.style.height = ((x.score || 0) / maxFull * 100) + '%';
      if(x.pass) fill.className = 'pass';
      track.appendChild(fill);
      /* 及格线刻度 */
      var line = el('div','hbpass');
      line.style.bottom = ((x.passScore || 80) / maxFull * 100) + '%';
      track.appendChild(line);
      col.appendChild(track);
      col.appendChild(el('div','hbv', String(x.score)));
      bars.appendChild(col);
    });
    box.appendChild(bars);

    var summary = S.examHistory.filter(function(x){ return x.pass; }).length;
    box.appendChild(el('div','hint',
      '累计考试 ' + S.examHistory.length + ' 次，及格 ' + summary + ' 次（' +
      (S.examHistory.length ? Math.round(summary / S.examHistory.length * 100) : 0) + '%）'));
    return box;
  }

  function startExam(){
    /* 真实考试结构：50 道单选（每题 1 分）+ 25 道多选（每题 2 分）
       满分 50×1 + 25×2 = 100 分，限时 120 分钟，80 分及格。
       两类题分别从题库里随机抽，然后整体打乱题序。 */
    var EX = S.examSpec;
    var singles = shuffle(QS.filter(function(q){ return q.type === '单选题'; }))
                    .slice(0, EX.singleCount);
    var multis  = shuffle(QS.filter(function(q){ return q.type === '多选题'; }))
                    .slice(0, EX.multiCount);

    /* 题量不足时降级（题库更新变少也不至于开不了考） */
    var shortfall = (singles.length < EX.singleCount) || (multis.length < EX.multiCount);

    var gids = shuffle(singles.map(function(q){ return q.gid; })
                 .concat(multis.map(function(q){ return q.gid; })));

    /* 每题分值：多选 2 分，单选 1 分 */
    var points = {};
    gids.forEach(function(g){
      points[g] = (BY[g] && BY[g].type === '多选题') ? EX.multiPoint : EX.singlePoint;
    });

    var fullScore = 0;
    gids.forEach(function(g){ fullScore += points[g]; });

    S.exam = {
      gids: gids,
      ans: {},
      qMs: {},                             /* 每题耗时 */
      pos: 0,
      msAcc: 0,                            /* 考试累计用时 */
      limitMs: EX.limitMin * 60 * 1000,    /* 120 分钟 */
      points: points,
      fullScore: fullScore,
      passScore: EX.passScore,
      shortfall: shortfall,
      autoSubmitting: false,
      startedAt: Date.now(),
      finished: false,
      /* 开考时就把每道题的选项显示顺序固定下来，
         否则交卷后 examRunning() 变 false，选项会变回原顺序，
         跟考试时看到的对不上。 */
      optOrder: (function(){
        var m = {};
        gids.forEach(function(gid){
          var q = BY[gid];
          if(q) m[gid] = optionView(q).order;
        });
        return m;
      })()
    };
    S.examReview = null;
    save(); render();
  }

  function finishExam(auto){
    var E = S.exam;
    if(!E || E.finished) return;
    var score = 0;          /* 加权得分（单选 1 分、多选 2 分） */
    var rightCount = 0;     /* 答对题数（不分权重，用于正确率） */

    E.gids.forEach(function(g){
      var q = BY[g], a = E.ans[g];
      var has = a && a.length;
      var ok = has ? isCorrect(q, a) : false;
      if(ok){
        rightCount++;
        score += (E.points && E.points[g] != null) ? E.points[g] : 1;
      }

      /* 考试**不写进任何练习板块的作答记录**。
         原来这里把 75 道题全并进 S.ans，于是考完一场试，
         顺序/随机/单选专项/多选专项全部「做过了」——
         用户的原话是「我模拟考试考了，多选被选了，单选被选了」。
         考试成绩本身存在 S.exam / S.examHistory 里，不需要再借练习记录。

         但错题仍然要进错题本（用户要的）：那是一个全站汇总集合，
         「考错的题我想专项攻克」是合理需求，而且它不会点亮练习板块 ——
         错题本板块有自己独立的作答记录，进来仍是「未作答」。

         ⚠️ 但「没作答」不等于「答错」：
         原来这里无脑 !ok → noteWrong，于是交白卷会一次性塞 75 道「错题」进错题本，
         错次还全 +1，错题排行直接爆表 —— 用户根本没做过这些题。
         所以未作答的题既不算错、也不算对，单纯跳过。 */
      if(!has){ return; }          /* 没作答：不进错题本，也不算掌握 */
      if(!ok){ noteWrong(g); }
      else { noteRight(g, false); }
    });

    E.score = score;
    E.rightCount = rightCount;
    E.elapsed = Math.round((E.msAcc || 0) / 1000);
    E.finished = true;

    /* 记录一次考试成绩，供「成绩走势」板块使用 */
    recordExamResult(E, auto);

    save(); render();
    window.scrollTo({top:0, behavior:'smooth'});
    if(auto) toast('时间到，已自动交卷');
  }

  function renderReview(main){
    var E = S.exam;
    var g = S.examReview;
    var q = BY[g];
    var a = E.ans[g] || [];
    main.innerHTML = '';

    var back = el('button','btn ghost','← 返回成绩单');
    back.onclick = function(){ S.examReview = null; save(); render(); };
    main.appendChild(back);

    var card = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge' + (q.type === '多选题' ? ' t2' : ''), q.type || '单选题'));
    var ix = el('span','qidx');
    ix.innerHTML = '第 <b>' + (E.gids.indexOf(g) + 1) + '</b> / ' + E.gids.length + ' 题';
    head.appendChild(ix);
    head.appendChild(el('span','spacer'));
    var qms = E.qMs[g] || 0;
    if(qms > MIN_T_MS){
      var qc = el('span','qclock');
      qc.innerHTML = '本题 <b>' + fmtShort(qms) + '</b>';
      head.appendChild(qc);
    }
    card.appendChild(head);
    card.appendChild(el('div','qtext', q.q));

    var cidx = correctIdx(q);
    var rview = optionView(q);          /* 考试中已固定顺序，这里能拿到 */
    var rdisp = [];
    for(var rr=0;rr<rview.order.length;rr++) rdisp[rview.order[rr]] = rr;

    var wrap = el('div','opts');
    rview.order.forEach(function(oi, di){
      var o = q.options[oi];
      var b = el('button','opt locked');
      b.appendChild(el('span','k', letter(di)));
      b.appendChild(el('span','v', o.t));
      if(cidx.indexOf(oi) >= 0) b.classList.add('ok');
      else if(a.indexOf(oi) >= 0) b.classList.add('bad');
      wrap.appendChild(b);
    });
    card.appendChild(wrap);

    var ok = a.length ? isCorrect(q, a) : false;
    var res = el('div','result ' + (ok ? 'ok' : 'bad'));
    res.appendChild(el('div','rt', ok ? '✓ 回答正确' : (a.length ? '✕ 回答错误' : '○ 未作答')));

    var al = el('div','ansline');
    al.innerHTML = '正确答案：<b>' +
      cidx.map(function(oi){ return letter(rdisp[oi]); }).join('、') + '</b>';
    res.appendChild(al);

    var yl = el('div','ansline' + (ok ? '' : ' wrong'));
    yl.innerHTML = '你的选择：<b>' +
      (a.length ? a.slice().sort(function(x,y){return x-y;})
                    .map(function(oi){ return letter(rdisp[oi]); }).join('、') : '未作答') + '</b>';
    res.appendChild(yl);

    if(qms > MIN_T_MS){
      var tl = el('div','tline');
      var per = E.gids.length ? (E.msAcc || 0) / E.gids.length : 0;
      tl.innerHTML = '本题用时 <b>' + fmtShort(qms) + '</b> · 全卷平均 <b>' + fmtShort(per) + '</b>';
      res.appendChild(tl);
    }

    var sp = splitAnalysis(q.analysis);
    if(sp.body){
      var ana = el('div','ana');
      ana.appendChild(el('span','lb','解 析'));
      ana.appendChild(document.createTextNode(
        analysisText(q, sp.body, rdisp, rview.shuffled)));
      res.appendChild(ana);
    }
    card.appendChild(res);
    main.appendChild(card);
  }

  /* ============================================================
     备份 / 恢复
     localStorage 会被浏览器清理、也不会跟着 HTML 文件走。
     所以提供一条「导出为文件 / 从文件恢复」的退路。
     ============================================================ */
  function buildBackup(){
    return {
      __type: 'offline-tiku-backup',
      __version: 3,
      __bank: BANK.key || 'bank',
      __title: BANK.title || '',
      __exportedAt: new Date().toISOString(),
      /* v3 相比 v2：作答记录按板块分开存（ansAll），不再是一份全局 ans。
         v2 及更早只有 ans，导入时按「当前板块」归位，并保持各板块隔离。

         历史：
         · v1 只有错题本相关字段 → 换电脑导回后「已掌握」全变未掌握、成绩走势归零
         · v2 补了 streak / daily / examHistory / optRound / pos / drill
         · v3 补了板块隔离，不然一考完试所有板块都变「做过了」 */
      data: {
        ansAll: S.ansAll, wrong: S.wrong, star: S.star,
        wcnt: S.wcnt, wlast: S.wlast,
        stats: S.stats, memorizing: S.memorizing,
        streak: S.streak, daily: S.daily, examHistory: S.examHistory,
        optRound: S.optRound, pos: S.pos, drill: S.drill
      }
    };
  }
  /* 深拷贝一份再交出去：buildBackup 返回的是 S 的活引用，
     调用方若在序列化之前改了 S，备份内容会跟着变（曾经踩过）。 */
  function buildBackupSnapshot(){
    return JSON.parse(JSON.stringify(buildBackup()));
  }

  function exportBackup(){
    var obj = buildBackupSnapshot();
    var json = JSON.stringify(obj, null, 1);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var name = '题库进度备份-' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) +
               '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
    toast('已导出备份文件' + name);
  }

  function importBackup(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var obj;
      try{ obj = JSON.parse(String(reader.result)); }
      catch(e){ toast('文件不是合法的 JSON'); return; }

      if(!obj || obj.__type !== 'offline-tiku-backup' || !obj.data){
        toast('这不是本题库的备份文件');
        return;
      }
      var d = obj.data;
      /* 统计「已答多少题」：v3 用 ansAll，v2/v1 用 ans */
      var n = 0;
      if(d.ansAll && typeof d.ansAll === 'object'){
        var seenN = {};
        BOARD_KEYS.forEach(function(k){
          var m = d.ansAll[k];
          if(m && typeof m === 'object') for(var gg in m) if(BY[gg]) seenN[gg] = 1;
        });
        n = Object.keys(seenN).length;
      }else if(d.ans && typeof d.ans === 'object'){
        n = Object.keys(d.ans).length;
      }
      if(!confirm('确认用这个备份覆盖当前进度吗？' + '\n\n' +
                  '备份时间：' + (obj.__exportedAt || '未知') + '\n' +
                  '已答题数：' + n + ' 题\n' +
                  '错题本：' + ((d.wrong || []).length) + ' 题\n' +
                  '收藏：' + ((d.star || []).length) + ' 题\n' +
                  '已掌握：' + masteredCount(d.streak) + ' 题\n\n' +
                  '当前的进度会被全部替换。')) return;

      /* ---------- 作答记录：按板块恢复 ----------
         v3 用 ansAll 逐个板块恢复（保持隔离）；
         v2/v1 只有一份全局 ans —— 按「当前板块」归位，
         和首次加载旧存档的迁移口径保持一致。
         不整块 Object.assign 一把梭：那会把脏 gid 原样吞进来。 */
      BOARD_KEYS.forEach(function(k){ S.ansAll[k] = {}; });
      if(d.ansAll && typeof d.ansAll === 'object'){
        BOARD_KEYS.forEach(function(k){
          var m = d.ansAll[k];
          if(!m || typeof m !== 'object') return;
          for(var g in m){
            if(BY[g] && m[g] && Array.isArray(m[g].sel)) S.ansAll[k][g] = m[g];
          }
        });
      }else if(d.ans && typeof d.ans === 'object'){
        var home = BOARD_KEYS.indexOf(S.mode) >= 0 ? S.mode : 'seq';
        for(var g in d.ans){
          if(BY[g] && d.ans[g]) S.ansAll[home][g] = d.ans[g];
        }
      }
      S.wrong = (d.wrong || []).filter(function(g){ return BY[g]; });
      S.star  = (d.star  || []).filter(function(g){ return BY[g]; });
      S.wcnt = {};
      if(d.wcnt) for(var g2 in d.wcnt) if(BY[g2]) S.wcnt[g2] = Number(d.wcnt[g2]) || 0;
      S.wlast = {};
      if(d.wlast) for(var g3 in d.wlast) if(BY[g3]) S.wlast[g3] = Number(d.wlast[g3]) || 0;
      if(d.stats && typeof d.stats === 'object'){
        S.stats.day = d.stats.day || todayKey();
        S.stats.dayMs = Number(d.stats.dayMs) || 0;
        S.stats.totalMs = Number(d.stats.totalMs) || 0;
      }
      ensureDay();
      if(typeof d.memorizing === 'boolean') S.memorizing = d.memorizing;

      /* ---------- v2 字段 ----------
         v1 备份里没有这些字段，导入时保持当前值不变（不是清零），
         这样旧备份仍然能用，只是恢复不出当年没有的东西。 */
      if(d.streak && typeof d.streak === 'object'){
        S.streak = {};
        for(var g4 in d.streak) if(BY[g4]) S.streak[g4] = Number(d.streak[g4]) || 0;
      }
      if(d.daily && typeof d.daily === 'object') S.daily = d.daily;
      if(Array.isArray(d.examHistory)) S.examHistory = d.examHistory;
      if(typeof d.optRound === 'number' && d.optRound >= 0) S.optRound = d.optRound;
      if(d.pos && typeof d.pos === 'object') S.pos = Object.assign(S.pos, d.pos);
      if(d.drill && typeof d.drill === 'object'){
        ['single','multi','hard'].forEach(function(k){
          if(d.drill[k]) S.drill[k] = Object.assign(S.drill[k], d.drill[k]);
        });
      }

      save(); render();
      toast('已恢复备份：' + aggregateCount() + ' 题记录');
    };
    reader.readAsText(file);
  }

  /* 备份里「已掌握」的题数，只用于恢复确认框，避免把不存在/异常的键算进去 */
  function masteredCount(streak){
    if(!streak || typeof streak !== 'object') return 0;
    var c = 0;
    for(var g in streak) if(streak[g] >= MASTER_STREAK) c++;
    return c;
  }

  function backupBar(){
    var box = el('div','backup');
    var lb = el('div','bk-lb');
    var answeredN = aggregateCount();
    lb.innerHTML = '进度已存在<b>本机浏览器</b>里。换电脑、重装系统、清浏览器数据都会丢。' +
                   '想做一分保险，导个备份文件（' + answeredN + ' 题）；换电脑时再导回来。';
    box.appendChild(lb);

    var btExp = el('button','btn sm','导出备份');
    btExp.onclick = exportBackup;
    box.appendChild(btExp);

    var btImp = el('button','btn sm','从备份恢复');
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.style.display = 'none';
    fileInput.onchange = function(){
      if(fileInput.files && fileInput.files[0]) importBackup(fileInput.files[0]);
      fileInput.value = '';
    };
    box.appendChild(fileInput);
    btImp.onclick = function(){ fileInput.click(); };
    box.appendChild(btImp);

    return box;
  }

  /* ============================================================
     顶部按钮
     ============================================================ */
  $('btReset').onclick = function(){
    if(!confirm('确定重置全部练习进度？\n\n将清空：已答题记录、错题本、收藏、当前进度、\n计时统计、考试成绩与每日记录。\n\n同时会换一套选项位置，避免记住旧位置。\n题目内容不受影响，可重新开始刷。')) return;
    S.pos = {seq:0,random:0,wrong:0,star:0,search:0};
    S.order = [];
    /* 轮次 +1：所有题目的选项位置整体换一遍。
       这样上一轮刷熟的位置不会形成「位置记忆」，是真的重做。 */
    S.optRound = (S.optRound || 0) + 1;
    BOARD_KEYS.forEach(function(k){ S.ansAll[k] = {}; });
    S.wrong = [];
    S.star = [];
    S.wcnt = {};
    S.wlast = {};
    S.streak = {};
    /* 专项练习的进度也一起归零 */
    ['single','multi','hard'].forEach(function(k){
      S.drill[k] = {pos:0, order:null, shuffleSeq:false, round:(S.drill[k].round||0)+1};
    });
    BOARD_KEYS.forEach(function(k){ S.pendAll[k] = {}; });
    S.exam = null;
    S.examReview = null;
    S.mode = 'seq';
    S.memorizing = false;
    S.stats = { day: todayKey(), dayMs: 0, totalMs: 0 };
    S.examHistory = [];
    S.daily = {};
    TMR.sessMs = 0;
    TMR.qGid = null;
    TMR.qMs = 0;
    TMR.lastTick = Date.now();
    try{ localStorage.removeItem(LS); }catch(e){}
    save(); render();
    toast('已重置，选项位置也换了，可以从头刷了');
  };

  $('btMemorize').onclick = function(){
    S.memorizing = !S.memorizing;
    save(); render();
    toast(S.memorizing ? '背题模式：答案常显示' : '答题模式：作答后显示答案');
  };

  $('btPause').onclick = function(){ setPaused(TMR.running); };

  /* ============================================================
     键盘
     ============================================================ */
  document.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

    /* 空格：暂停 / 继续计时 */
    if(e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      setPaused(TMR.running);
      return;
    }

    /* 考试中：左右切题 + 按字母作答 */
    if(examRunning()){
      var E = S.exam;
      if(e.key === 'ArrowLeft' && E.pos > 0){ E.pos--; save(); render(); e.preventDefault(); }
      if(e.key === 'ArrowRight' && E.pos < E.gids.length-1){ E.pos++; save(); render(); e.preventDefault(); }
      var eg = E.gids[E.pos];
      var eq = BY[eg];
      /* 键盘按的是「屏幕上的第几个字母」，存的是「原始下标」。
         考试用开考时固定的排列（与题卡渲染同一个来源），不能直接用 optionView 现算以外的东西。 */
      var eo = (E.optOrder && E.optOrder[eg]) ? E.optOrder[eg].slice()
               : optionView(eq).order;
      var ed = keyToIndex(e.key, eq);        /* 显示位置 */
      if(ed >= 0){
        e.preventDefault();
        var en = toOrigIdx(ed, eo);
        var cur = (E.ans[eg] || []).slice();
        if(eq.type !== '多选题'){ E.ans[eg] = [en]; }
        else {
          var pp = cur.indexOf(en);
          if(pp >= 0) cur.splice(pp,1); else cur.push(en);
          if(cur.length) E.ans[eg] = cur; else delete E.ans[eg];
        }
        save(); render();
      }
      return;
    }

    /* 只有「能作答的练习页」才响应字母键 / 方向键 / Enter。
       考试设置页、成绩单、单题解析、统计、成绩走势、错题排行这些页面没有题卡，
       继续往下跑会拿错误的题号（S.pos[S.mode] 在这些模式下不存在 → 0）
       去改动作答记录 —— 用户只是在看成绩，后台却把 QS[0] 答了一遍。 */
    if(!isPracticeMode(S.mode)) return;

    var list = modeList();
    if(!list.length) return;
    /* 题号必须走 getPos：专项练习的进度存在 S.drill[key].pos 里，
       直接读 S.pos[S.mode] 永远是 0，会导致方向键把界面拽回第 2 题、
       字母键答成题池第 1 题。 */
    var pos = getPos(S.mode);
    if(pos < 0 || pos > list.length - 1) pos = 0;
    var q = list[pos];
    /* 键盘也必须读「当前板块」的记录，否则会与题卡显示不一致：
       题卡说这道题没做过（可以作答），键盘却因为别的板块做过而拒绝作答。 */
    var rec = recOf(q.gid);
    /* showAns 与题卡渲染保持同一口径：已作答 ∪ 单题揭示 ∪ 全局背题。
       漏掉 S.reveal 就会出现「答案已经摆在屏幕上，按个 A 还能记一次作答」。 */
    var revealed = !!(S.reveal && S.reveal[q.gid]);
    var showAns = rec || revealed || S.memorizing;

    if(e.key === 'ArrowLeft'){ if(pos > 0){ goto(S.mode, pos-1); e.preventDefault(); } return; }
    if(e.key === 'ArrowRight'){ if(pos < list.length-1){ goto(S.mode, pos+1); e.preventDefault(); } return; }

    if(showAns){
      if(e.key === 'Enter' && pos < list.length-1){ goto(S.mode, pos+1); e.preventDefault(); }
      return;
    }

    if(e.key === 'Enter'){
      var pend = pendGet(q.gid);
      if(pend && pend.length){ submitNow(q, pend); e.preventDefault(); return; }
    }

    /* 显示位置 → 原始下标：选项打乱后存储层一律用原始下标，
       直接拿显示位置当原下标会因为打乱而判错（4 选项时约 3/4 概率按错）。 */
    var disp = keyToIndex(e.key, q);
    if(disp < 0) return;
    var n = toOrigIdx(disp, optionView(q).order);
    e.preventDefault();

    if(q.type !== '多选题'){ submitNow(q, [n]); return; }

    /* 临时勾选也按板块存 —— 与鼠标点击路径同一口径 */
    var cur2 = (pendGet(q.gid) || []).slice();
    var p2 = cur2.indexOf(n);
    if(p2 >= 0) cur2.splice(p2,1); else cur2.push(n);
    pendSet(q.gid, cur2, S.mode);
    save(); render();
  });

  function keyToIndex(key, q){
    var n = -1;
    if(/^[a-fA-F]$/.test(key)) n = key.toUpperCase().charCodeAt(0) - 65;
    else if(/^[1-6]$/.test(key)) n = parseInt(key, 10) - 1;
    if(n < 0 || !q || n >= q.options.length) return -1;
    return n;
  }

  /* ============================================================
     页面可见性：切走就暂停累加，回来重新对齐时钟
     ============================================================ */
  document.addEventListener('visibilitychange', function(){
    TMR.lastTick = Date.now();
    if(document.hidden){
      /* 切走页面（切 App、锁屏、关标签）立刻落盘一次，
         不等 5 秒周期，避免最后几秒的进度丢 */
      try{ save(); }catch(e){}
    }else{
      updateClock();
    }
  });
  /* pagehide 比 beforeunload 在移动端更可靠（手机上 beforeunload 经常不触发） */
  window.addEventListener('pagehide', function(){ try{ save(); }catch(e){} });
  window.addEventListener('beforeunload', function(){ try{ save(); }catch(e){} });

  /* ============================================================
     启动
     ============================================================ */
  load();
  $('ttl').textContent = BANK.title || '离线题库';
  if(!S.mode) S.mode = 'seq';
  TMR.lastTick = Date.now();
  render();

  /* 每秒跑一次计时主循环 */
  setInterval(tick, 1000);

  /* 供自动化测试 / 控制台调试使用 */
  window.__bank = {
    S:S, TMR:TMR, BY:BY, QS:QS,
    save:save, render:render,
    fmtDur:fmtDur, fmtShort:fmtShort, avgMs:avgMs,
    setPaused:setPaused, trackQuestion:trackQuestion, resetQuestionTimer:resetQuestionTimer,
    groupStats:groupStats, difficultyOf:difficultyOf,
    wrongRank:wrongRank, rankCount:rankCount,
    noteWrong:noteWrong, noteRight:noteRight,
    buildBackup:buildBackup, buildBackupSnapshot:buildBackupSnapshot,
    exportBackup:exportBackup, importBackup:importBackup,
    optionView:optionView, canShuffleOptions:canShuffleOptions, remapLetters:remapLetters,
    seededShuffle:seededShuffle,
    recentDays:recentDays, todayEncouragement:todayEncouragement,
    trendAnnotation:trendAnnotation, examAnnotation:examAnnotation,
    recordDailyAnswer:recordDailyAnswer, recordExamResult:recordExamResult,
    dailyKey:dailyKey,
    drillPool:drillPool, drillList:drillList, drillStats:drillStats,
    resetDrill:resetDrill, resetPractice:resetPractice,
    clearAnsweredIn:clearAnsweredIn, modeList:modeList,
    masteryOf:masteryOf, isMastered:isMastered,
    MASTER_STREAK:MASTER_STREAK,
    /* 板块隔离相关的读写入口（测试用；页面内部也一律走这几个，不直接碰 S.ansAll） */
    boardKey:boardKey, boardAns:boardAns, recOf:recOf, setRec:setRec, delRec:delRec,
    aggregateAns:aggregateAns, aggregateCount:aggregateCount, BOARD_KEYS:BOARD_KEYS,
    /* 未提交勾选（多选题）也按板块隔离，和 ansAll 同一套设计 */
    pendOf:pendOf, pendGet:pendGet, pendSet:pendSet, pendClear:pendClear
  };
})();
</script>
</body>
</html>
