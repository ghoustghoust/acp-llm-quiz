  /* ============================================================
     每日答题记录 / 考试成绩历史
     ============================================================ */
  function dailyKey(ts){
    var d = ts ? new Date(ts) : new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function ensureDaily(k){
    if(!S.daily[k]) S.daily[k] = { ans:0, right:0, ms:0, examN:0 };
    return S.daily[k];
  }
  /* 每次答完一题就往当天的记录里累加 */
  function recordDailyAnswer(ok, ms, gid){
    var k = dailyKey();
    var d = ensureDaily(k);
    d.ans++;
    if(ok) d.right++;
    if(ms && ms > MIN_T_MS) d.ms += ms;
    /* 用 guid 去重计数意义不大，这里只统计「作答次数」 */
    return d;
  }
  /* 交卷时记录一条成绩 */
  function recordExamResult(E, auto){
    var total = E.gids.length;
    var right = E.rightCount || 0;
    var rec = {
      at: Date.now(),
      score: E.score || 0,
      full: E.fullScore || total,
      passScore: E.passScore || 80,
      total: total,
      rightCount: right,
      rate: total ? Math.round(right / total * 100) : 0,
      ms: E.msAcc || 0,
      pass: (E.score || 0) >= (E.passScore || 80),
      auto: !!auto,
      shortfall: !!E.shortfall
    };
    S.examHistory.push(rec);
    /* 只保留最近 100 次，避免本地存储无限膨胀 */
    if(S.examHistory.length > 100) S.examHistory = S.examHistory.slice(-100);

    var d = ensureDaily(dailyKey());
    d.examN = (d.examN || 0) + 1;
    return rec;
  }

  /* 取最近 n 天的每日数据（含今天），按日期升序 */
  function recentDays(n){
    var out = [];
    var today = new Date();
    for(var i = n - 1; i >= 0; i--){
      var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var k = dailyKey(dt.getTime());
      var d = S.daily[k] || { ans:0, right:0, ms:0, examN:0 };
      out.push({
        key: k,
        label: (dt.getMonth()+1) + '/' + dt.getDate(),
        weekday: '日一二三四五六'.charAt(dt.getDay()),
        ans: d.ans || 0,
        right: d.right || 0,
        ms: d.ms || 0,
        examN: d.examN || 0,
        rate: (d.ans ? Math.round((d.right || 0) / d.ans * 100) : null),
        isToday: i === 0
      });
    }
    return out;
  }

  /* ============================================================
     鼓励语与批注
     —— 依据真实数据给出针对性评语，不是无脑夸。
        每条批注都对应一个具体的观测事实，方便你判断该练什么。
     ============================================================ */
  function pick(arr, seedStr){
    if(!arr.length) return '';
    var h = 0;
    var s = String(seedStr || 'x');
    for(var i=0;i<s.length;i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return arr[h % arr.length];
  }

  /* 针对「今天」的鼓励语 */
  function todayEncouragement(day){
    if(!day || !day.ans){
      return {
        mood:'idle',
        title:'今天还没开始',
        text:'哪怕只做 5 道题也比不动强。先从「顺序刷题」热个身吧。'
      };
    }
    var r = day.rate;
    if(r >= 95) return { mood:'great', title:'今天状态极好',
      text:'正确率 ' + r + '%，' + day.ans + ' 道题几乎全对。这种手感保持住，考前别松劲。' };
    if(r >= 85) return { mood:'good', title:'稳步推进中',
      text:'正确率 ' + r + '%，已经相当扎实。把今天错的几道再看一遍解析，收益最大。' };
    if(r >= 70) return { mood:'ok', title:'还在爬坡',
      text:'正确率 ' + r + '%，正常的练习状态。错题本里那几道反复错的，才是真正要攻的地方。' };
    if(r >= 50) return { mood:'warn', title:'别急，这很正常',
      text:'正确率 ' + r + '%。这个题库本来就偏难，前几遍错一半是常态。重点看解析，不要只看答案。' };
    return { mood:'low', title:'今天有点吃力',
      text:'正确率 ' + r + '%。别硬撑，先挑「错题本」里的题做，把已经见过的捡回来，比刷新题有效。' };
  }

  /* 针对「最近几天趋势」的批注 */
  function trendAnnotation(days){
    var withData = days.filter(function(d){ return d.ans > 0; });
    if(withData.length < 2){
      return { tag:'', text:'多练几天后，这里会显示你的趋势变化。' };
    }
    var first = withData[0], last = withData[withData.length - 1];
    var diff = (last.rate || 0) - (first.rate || 0);
    var totalAns = withData.reduce(function(s, d){ return s + d.ans; }, 0);
    var avgRate = Math.round(
      withData.reduce(function(s, d){ return s + (d.rate || 0) * d.ans; }, 0) / totalAns
    );

    if(diff >= 10){
      return { tag:'上升', text:'最近 ' + withData.length + ' 天正确率从 ' + first.rate + '% 提到 ' + last.rate + '%，涨了 ' + diff + ' 个百分点。趋势是向上的，按现在节奏走。' };
    }
    if(diff <= -10){
      return { tag:'回落', text:'最近 ' + withData.length + ' 天从 ' + first.rate + '% 降到 ' + last.rate + '%。可能是题变难了，也可能状态波动——先看错题原因，不用慌。' };
    }
    if(avgRate >= 85){
      return { tag:'稳定', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%，很稳。可以考虑加量或开始完整模拟考。' };
    }
    if(avgRate >= 70){
      return { tag:'稳定', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%。基础在，再把错题嚼透就能往上走。' };
    }
    return { tag:'待提升', text:'最近 ' + withData.length + ' 天平均 ' + avgRate + '%。建议减少新题量，先把错题本刷到能一次做对。' };
  }

  /* 针对单次考试的批注 */
  function examAnnotation(rec){
    if(!rec) return '';
    var s = rec.score, full = rec.full, ps = rec.passScore || 80;
    var gap = ps - s;
    if(s >= full){
      return '满分。这个题库你已经吃透了，可以换更难的材料或直接去考。';
    }
    if(s >= ps){
      return '过了及格线（' + s + '/' + full + '），还差 ' + (full - s) + ' 分满分。稳了，但别掉以轻心。';
    }
    if(gap <= 5){
      return '差 ' + gap + ' 分就及格了，非常接近。把这次错的题过一遍，下次基本就能过。';
    }
    if(gap <= 15){
      return '距及格还差 ' + gap + ' 分。重点攻多选题——每题 2 分，提分效率最高。';
    }
    return '距及格差 ' + gap + ' 分。先把错题本刷完再考，比反复裸考有效得多。';
  }

  /* ============================================================
     板块隔离：作答记录的读写入口
     ------------------------------------------------------------
     「一个状态只要有两个来源，就必须只留一个读写入口」——
     前面记过这条教训（专项进度那次就是漏了第二个入口）。
     这次一开始就把所有读写收敛到这几个函数，别再散落。
     ============================================================ */

  /* 当前板块的存储键。考试不是练习板块，返回 null。 */
  function boardKey(mode){
    var m = mode || S.mode;
    return BOARD_KEYS.indexOf(m) >= 0 ? m : null;
  }

  /* 取某个板块的整张作答表（不存在就建） */
  function boardAns(mode){
    var k = boardKey(mode);
    if(!k) return {};                 /* 考试等非练习板块：不落任何记录 */
    if(!S.ansAll[k]) S.ansAll[k] = {};
    return S.ansAll[k];
  }

  /* 取某个板块的「未提交勾选表」 */
  function pendOf(mode){
    var k = boardKey(mode);
    if(!k) return {};
    if(!S.pendAll[k]) S.pendAll[k] = {};
    return S.pendAll[k];
  }

  /* 读一道题的临时勾选（只读当前板块） */
  function pendGet(gid, mode){
    var m = pendOf(mode);
    return m[gid] || null;
  }

  /* 写一道题的临时勾选；传空数组等于删除 */
  function pendSet(gid, sel, mode){
    var k = boardKey(mode);
    if(!k) return;
    if(!S.pendAll[k]) S.pendAll[k] = {};
    if(sel && sel.length) S.pendAll[k][gid] = sel.slice();
    else delete S.pendAll[k][gid];
  }

  /* 删一道题的临时勾选（任何板块）——提交/重做时用 */
  function pendClear(gid){
    for(var i=0;i<BOARD_KEYS.length;i++){
      var k = BOARD_KEYS[i];
      if(S.pendAll[k] && S.pendAll[k][gid]) delete S.pendAll[k][gid];
    }
  }

  /* 读一道题的作答记录 —— 只读「当前板块」那一份 */
  function recOf(gid, mode){
    var m = boardAns(mode);
    return m[gid];
  }

  /* 写一道题的作答记录 —— 只写「当前板块」那一份 */
  function setRec(gid, rec, mode){
    var k = boardKey(mode);
    if(!k) return;
    if(!S.ansAll[k]) S.ansAll[k] = {};
    S.ansAll[k][gid] = rec;
  }

  /* 删一道题的作答记录 */
  function delRec(gid, mode){
    var k = boardKey(mode);
    if(!k) return false;
    if(S.ansAll[k] && S.ansAll[k][gid]){ delete S.ansAll[k][gid]; return true; }
    return false;
  }

  /* 汇总：所有板块合起来「每道题最后一次练成什么样」。
     用于顶栏「已练/正确率」、统计页、备份的「总共练了多少」这类跨板块口径。
     同一道题在多个板块都做过时取「最近一次」（按记录里的 t/at 判定，
     没有时间就按板块顺序覆盖，保证结果稳定）。
     注意：这是**只读视图**，写回去没有任何意义。 */
  function aggregateAns(){
    var out = {};
    BOARD_KEYS.forEach(function(k){
      var m = S.ansAll[k];
      if(!m) return;
      for(var g in m){
        if(!BY[g]) continue;
        var prev = out[g];
        if(!prev){ out[g] = m[g]; continue; }
        /* 有 at 就按时间取新的，没有就保留先遇到的（板块顺序固定，结果稳定） */
        var a = typeof prev.at === 'number' ? prev.at : -1;
        var b = typeof m[g].at === 'number' ? m[g].at : -1;
        if(b > a) out[g] = m[g];
      }
    });
    return out;
  }

  function aggregateCount(){
    return Object.keys(aggregateAns()).length;
  }

  /* ============================================================
     持久化
     ============================================================ */
  function save(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        pos:S.pos, order:S.order, ansAll:S.ansAll, wrong:S.wrong, star:S.star,
        wcnt:S.wcnt, wlast:S.wlast,
        memorizing:S.memorizing, mode:S.mode, examSize:S.examSize,
        examLimit:S.examLimit, pendAll:S.pendAll, stats:S.stats,
        statsTab:S.statsTab, rankSize:S.rankSize, shuffleOpt:S.shuffleOpt,
        examSpec:S.examSpec, examHistory:S.examHistory, daily:S.daily,
        optRound:S.optRound, streak:S.streak, drill:S.drill
      }));
    }catch(e){}
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(LS) || 'null');
      if(!d){
        /* ===== 首次打开（本机没有存档）=====
           有两种来源要合并进来：
             1. BANK.initialProgress —— 发布版内置的完整进度快照
                （用于「把这个网页发给手机，打开就是我电脑上的进度」）
             2. BANK.initialWrong / initialStar —— 小程序里的错题/收藏
           两者都只在「没有本地存档」时生效，
           否则每次打开都会把用户自己后来的答题冲掉。 */
        if(BANK.initialProgress && typeof BANK.initialProgress === 'object'){
          var ip = BANK.initialProgress;
          /* 作答记录：优先新版 ansAll，兼容旧版 ans */
          if(ip.ansAll && typeof ip.ansAll === 'object'){
            BOARD_KEYS.forEach(function(k){
              var m = ip.ansAll[k];
              S.ansAll[k] = {};
              if(m && typeof m === 'object'){
                for(var g in m) if(BY[g]) S.ansAll[k][g] = m[g];
              }
            });
          }else if(ip.ans && typeof ip.ans === 'object'){
            /* 旧格式：没有板块信息，归到顺序刷题 */
            for(var g0 in ip.ans) if(BY[g0]) S.ansAll.seq[g0] = ip.ans[g0];
          }
          /* 汇总类数据 */
          S.wrong = (ip.wrong || []).filter(function(g){ return BY[g]; });
          S.star  = (ip.star  || []).filter(function(g){ return BY[g]; });
          S.wcnt = {};  if(ip.wcnt)  for(var a in ip.wcnt)  if(BY[a]) S.wcnt[a]  = Number(ip.wcnt[a])  || 0;
          S.wlast = {}; if(ip.wlast) for(var b in ip.wlast) if(BY[b]) S.wlast[b] = Number(ip.wlast[b]) || 0;
          S.streak = {}; if(ip.streak) for(var c in ip.streak) if(BY[c]) S.streak[c] = Number(ip.streak[c]) || 0;
          if(ip.daily && typeof ip.daily === 'object') S.daily = ip.daily;
          if(Array.isArray(ip.examHistory)) S.examHistory = ip.examHistory;
          if(typeof ip.optRound === 'number') S.optRound = ip.optRound;
          if(ip.pos && typeof ip.pos === 'object') S.pos = Object.assign(S.pos, ip.pos);
          if(ip.drill && typeof ip.drill === 'object'){
            ['single','multi','hard'].forEach(function(k){
              if(ip.drill[k]) S.drill[k] = Object.assign(S.drill[k], ip.drill[k]);
            });
          }
          S.stats.day = todayKey();
          save();
          return;
        }

        /* 没有内置进度：退回「小程序错题/收藏」的简单预置 */
        if(Array.isArray(BANK.initialWrong)){
          S.wrong = BANK.initialWrong.slice();
          /* 预置的错题也要记上错次，否则「错题排行」里看不到它们 ——
             排行的数据源是 S.wcnt，不是 S.wrong。
             计 1 次（不是编个更大的数）：这只能说明「错过至少一次」，
             具体错过几次我们没有可靠数据，不假装知道。 */
          S.wrong.forEach(function(g){
            if(!S.wcnt[g]) S.wcnt[g] = 1;
          });
        }
        if(Array.isArray(BANK.initialStar)) S.star = BANK.initialStar.slice();
        S.stats.day = todayKey();
        save();
        return;
      }
      if(d.pos) S.pos = Object.assign(S.pos, d.pos);
      if(Array.isArray(d.order)) S.order = d.order.filter(function(g){ return BY[g]; });
      /* ---- 作答记录：新版按板块分开存 ---- */
      if(d.ansAll && typeof d.ansAll === 'object'){
        BOARD_KEYS.forEach(function(k){
          var m = d.ansAll[k];
          S.ansAll[k] = {};
          if(m && typeof m === 'object'){
            for(var g in m) if(BY[g]) S.ansAll[k][g] = m[g];
          }
        });
      }else if(d.ans && typeof d.ans === 'object'){
        /* ---- 老版本（v2 及更早）只有一份全局 S.ans，迁移成按板块分开 ----
           没有板块信息，只能按「当前 mode + 进度」推断归属：
             · 当前板块记下全部记录（用户最近就在这个板块里刷）
             · 其余板块留空，用户下次点进去就是「一道没做」的干净状态
           这样迁移后不会出现「一打开所有板块都满了」——那正是要修的毛病。
           注：错题本 / 收藏 是汇总集合，它们的「作答记录」也留空，
           进去看到的是「这些题我没在这个板块刷过」，符合隔离语义。 */
        BOARD_KEYS.forEach(function(k){ S.ansAll[k] = {}; });
        var home = BOARD_KEYS.indexOf(d.mode) >= 0 ? d.mode : 'seq';
        for(var g0 in d.ans){
          if(!BY[g0]) continue;
          d.ans[g0].at = typeof d.ans[g0].at === 'number' ? d.ans[g0].at : Date.now();
          S.ansAll[home][g0] = d.ans[g0];
        }
        S._migrated = (S._migrated || 0) + 1;
      }
      if(Array.isArray(d.wrong)) S.wrong = d.wrong.filter(function(g){ return BY[g]; });
      if(Array.isArray(d.star)) S.star = d.star.filter(function(g){ return BY[g]; });
      /* 未提交勾选：新版按板块存（pendAll）；
         老版是全局 pend，没法反推板块，只归到当前板块 ——
         反正它本来就是「临时」状态，刷新即失效，丢掉也无所谓。 */
      if(d.pendAll && typeof d.pendAll === 'object'){
        BOARD_KEYS.forEach(function(k){
          S.pendAll[k] = {};
          var m = d.pendAll[k];
          if(m && typeof m === 'object'){
            for(var g in m) if(BY[g] && Array.isArray(m[g])) S.pendAll[k][g] = m[g];
          }
        });
      }else if(d.pend && typeof d.pend === 'object'){
        var homeP = BOARD_KEYS.indexOf(d.mode) >= 0 ? d.mode : 'seq';
        for(var gp in d.pend) if(BY[gp]) S.pendAll[homeP][gp] = d.pend[gp];
      }
      if(d.wcnt && typeof d.wcnt === 'object') S.wcnt = d.wcnt;
      if(d.wlast && typeof d.wlast === 'object') S.wlast = d.wlast;
      if(d.statsTab) S.statsTab = d.statsTab;
      if(d.rankSize) S.rankSize = d.rankSize;
      if(typeof d.shuffleOpt === 'boolean') S.shuffleOpt = d.shuffleOpt;
      if(d.examSpec && typeof d.examSpec === 'object') S.examSpec = Object.assign(S.examSpec, d.examSpec);
      if(Array.isArray(d.examHistory)) S.examHistory = d.examHistory;
      if(d.daily && typeof d.daily === 'object') S.daily = d.daily;
      if(typeof d.optRound === 'number' && d.optRound >= 0) S.optRound = d.optRound;
      if(d.streak && typeof d.streak === 'object') S.streak = d.streak;
      if(d.drill && typeof d.drill === 'object'){
        ['single','multi','hard'].forEach(function(k){
          if(d.drill[k]) S.drill[k] = Object.assign(S.drill[k], d.drill[k]);
        });
      }
      if(typeof d.memorizing === 'boolean') S.memorizing = d.memorizing;
      if(d.mode) S.mode = d.mode;
      if(d.examSize) S.examSize = d.examSize;
      if(typeof d.examLimit === 'boolean') S.examLimit = d.examLimit;
      if(d.stats && typeof d.stats === 'object'){
        S.stats.day   = d.stats.day || todayKey();
        S.stats.dayMs = Number(d.stats.dayMs) || 0;
        S.stats.totalMs = Number(d.stats.totalMs) || 0;
      }
      ensureDay();
    }catch(e){}
  }

  /* ============================================================
     小工具
     ============================================================ */
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }
  var toastT = null;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }
  function letter(i){ return String.fromCharCode(65 + i); }

  function correctIdx(q){
    var out = [];
    for(var i=0;i<q.options.length;i++) if(q.options[i].ok) out.push(i);
    return out;
  }
  function sameSet(a, b){
    if(a.length !== b.length) return false;
    var x = a.slice().sort(function(p,q){return p-q;});
    var y = b.slice().sort(function(p,q){return p-q;});
    for(var i=0;i<x.length;i++) if(x[i] !== y[i]) return false;
    return true;
  }
  function isCorrect(q, sel){ return sameSet(sel, correctIdx(q)); }

  function splitAnalysis(txt){
    var ans = '', body = String(txt || '');
    var m = /^\s*答案[:：]\s*([^\n]*)\n?/.exec(body);
    if(m){ ans = m[1].trim(); body = body.slice(m[0].length); }
    body = body.replace(/^\s*解析[:：]?\s*\n?/, '');
    return { ans: ans, body: body.trim() };
  }

  function shuffle(a){
    var r = a.slice();
    for(var i=r.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function ensureOrder(){
    if(S.order.length !== QS.length){
      S.order = shuffle(QS.map(function(q){ return q.gid; }));
      save();
    }
  }
  function searchList(){
    var kw = (S.search || '').trim().toLowerCase();
    if(!kw) return [];
    return QS.filter(function(q){
      if((q.q || '').toLowerCase().indexOf(kw) >= 0) return true;
      if((q.analysis || '').toLowerCase().indexOf(kw) >= 0) return true;
      for(var i=0;i<q.options.length;i++){
        if((q.options[i].t || '').toLowerCase().indexOf(kw) >= 0) return true;
      }
      return false;
    });
  }
  /* ============================================================
     三个专项练习：单选专项 / 多选专项 / 错题攻坚
     每个专项有自己独立的进度、随机状态、轮次，互不干扰
     ============================================================ */
  var DRILL_KEYS = ['single','multi','hard'];

  function isDrillMode(m){ return DRILL_KEYS.indexOf(m) >= 0; }

  /* 某个专项的题池（按类型/掌握度筛出来的原始集合） */
  function drillPool(key){
    if(key === 'single'){
      return QS.filter(function(q){ return q.type === '单选题'; });
    }
    if(key === 'multi'){
      return QS.filter(function(q){ return q.type === '多选题'; });
    }
    if(key === 'hard'){
      /* 错题攻坚：只收「还没掌握」且「做错过」的题。
         已掌握的自动移出，所以这个池子会随着你练而变小 —— 这正是目的。 */
      var pool = [];
      var seen = Object.create(null);
      S.wrong.forEach(function(g){ if(BY[g] && !seen[g]){ seen[g] = 1; pool.push(BY[g]); } });
      /* 也把「错过但已移出错题本、还没连续对够」的题收回来 */
      for(var g in S.wcnt){
        if(!BY[g] || seen[g]) continue;
        if((S.wcnt[g] || 0) > 0 && !isMastered(g)){ seen[g] = 1; pool.push(BY[g]); }
      }
      /* 【真实缺陷修复】刚答对「已掌握」被移出攻坚池的题，
         临时插回原位 —— 否则用户答完立刻看到下一题，
         连自己答对了什么、解析是什么都来不及看。
         （只保留一次渲染，切题即失效，见 goto） */
      /* 加一道保险：只有当保留的题**确实是用户当前正在看的那道**才插回去。
         否则（比如批量调用 noteRight 的场景）池子会莫名其妙多一题。 */
      var keepIsCurrent = S.keepAfterRemove &&
        BY[S.keepAfterRemove] &&
        S.mode === 'hard' &&
        S.drill.hard &&
        S.drill.hard.pos >= 0;
      if(keepIsCurrent && S.keepAfterRemoveMode === 'hard' &&
         BY[S.keepAfterRemove] && !seen[S.keepAfterRemove]){
        var keepAt = Math.min(S.drill.hard ? (S.drill.hard.pos || 0) : 0, pool.length);
        pool.splice(keepAt, 0, BY[S.keepAfterRemove]);
      }
      return pool;
    }
    return QS;
  }

  /* 某个专项当前显示的题目列表（考虑是否随机） */
  function drillList(key){
    var pool = drillPool(key);
    var st = S.drill[key];
    if(!st || !st.shuffleSeq) return pool;
    /* 随机顺序：按轮次固定一份打乱结果，不会每次渲染都变 */
    if(!st.order || st.order.length !== pool.length){
      st.order = seededShuffle(pool.map(function(q){ return q.gid; }),
                               (key.charCodeAt(0) * 7919 + (st.round || 0) * 104729) >>> 0);
    }
    var byG = Object.create(null);
    st.order.forEach(function(g){ if(BY[g]) byG[g] = BY[g]; });
    var out = [];
    st.order.forEach(function(g){ if(byG[g]) out.push(byG[g]); });
    /* 池子变过（比如攻坚池因掌握而减少）就按池子过滤 */
    var poolSet = Object.create(null);
    pool.forEach(function(q){ poolSet[q.gid] = 1; });
    return out.filter(function(q){ return poolSet[q.gid]; });
  }

  /* 重置某个板块：清掉本板块题池内的作答记录（这样才能重新做）、
     清进度与随机顺序、换一套选项排列。

     【为什么必须清 S.ans —— 这是一个真实缺陷】
     原来的实现只做 pos=0 / order=null / round+1 / optRound+1，**完全没碰 S.ans**。
     但题卡判断「这题做过没有」就看 S.ans[gid]：
         var showAns = answered || revealed || S.memorizing;
     重置后每道题仍然 answered=true → 直接显示答案 + 选项 locked → 点不动。
     所以那时的「重置本专项」实际语义只是「回到第 1 题」，不是「让我重做」。
     用户看到的就是「点了重置没反应，想重做只能点右上角总重置，结果全没了」。

     【清谁】只清这个板块题池里那些 gid 的作答记录，绝不动其他板块。
     【不清谁】
       · S.wrong / S.star —— 错题本和收藏本身就是那两个板块的题池，清了板块就空了
       · S.wcnt / S.wlast —— 累计错次是错题排行的依据，清掉排行就缺题
       · S.streak         —— 掌握度；清了会让已攻克的题重新掉回攻坚池
       · S.daily / S.examHistory —— 成绩走势是历史事实，不该被单板块重置抹掉
     想连这些一起清，用右上角的总重置。 */
  function clearAnsweredIn(gids, mode){
    var n = 0;
    var mine = boardAns(mode);
    var k = boardKey(mode);          /* 注意：上面写的 S.pendAll[k] 需要这个 k */
    if(!k) return 0;
    (gids || []).forEach(function(g){
      if(mine[g]){ delete mine[g]; n++; }
      if(S.pendAll[k] && S.pendAll[k][g]) delete S.pendAll[k][g];
      if(S.reveal && S.reveal[g]) delete S.reveal[g];
    });
    return n;
  }

  function resetDrill(key){
    var st = S.drill[key];
    /* 先取题池（必须在改 pos/round 之前取，保证拿到的是当前这一轮的池子） */
    var pool = drillList(key).map(function(q){ return q.gid; });
    var cleared = clearAnsweredIn(pool, key);

    st.pos = 0;
    st.order = null;
    st.round = (st.round || 0) + 1;
    S.optRound = (S.optRound || 0) + 1;   // 连选项位置一起换
    save(); render();
    return cleared;
  }

  /* 通用：重置任意一个练习板块。
     专项走上面那套（另有自己的 pos/order/round）；
     顺序 / 随机 / 错题本 / 收藏 / 搜索 走这里，清它们各自题池里的作答记录。 */
  function resetPractice(modeKey){
    var key = modeKey || S.mode;
    var list = modeList();
    var cleared = clearAnsweredIn(list.map(function(q){ return q.gid; }), key);

    if(isDrillMode(key)){
      /* 防御：正常不会走到（专项有自己的入口），真走到了也按专项口径处理 */
      return resetDrill(key);
    }

    /* 进度归零 */
    setPos(key, 0);

    /* 随机刷题：顺便换一套题序，否则「重置」后看到的还是同一份卷子 */
    if(key === 'random'){
      S.order = shuffle(QS.map(function(q){ return q.gid; }));
    }

    /* 换一套选项排列（和专项重置同一个口径） */
    S.optRound = (S.optRound || 0) + 1;

    /* 清掉的题如果刚好是「当前揭示」的那道，也要一并清 */
    save(); render();
    return cleared;
  }

  function modeList(){
    switch(S.mode){
      case 'seq': return QS;
      case 'random': ensureOrder(); return S.order.map(function(g){ return BY[g]; }).filter(Boolean);
      case 'wrong':
        var wl = S.wrong.map(function(g){ return BY[g]; }).filter(Boolean);
        /* 刚答对移出的那道题：临时插回它原来的位置，让用户看完解析 */
        if(S.keepAfterRemove && S.keepAfterRemoveMode === 'wrong' &&
           S.mode === 'wrong' && BY[S.keepAfterRemove] &&
           !wl.some(function(x){ return x.gid === S.keepAfterRemove; })){
          var keepPos = Math.min(S.pos.wrong || 0, wl.length);
          wl.splice(keepPos, 0, BY[S.keepAfterRemove]);
        }
        return wl;
      case 'star': return S.star.map(function(g){ return BY[g]; }).filter(Boolean);
      case 'search': return searchList();
      case 'single': return drillList('single');
      case 'multi':  return drillList('multi');
      case 'hard':   return drillList('hard');
      default: return QS;
    }
  }

  /* 当前板块是不是「有题卡、可以用键盘作答」的练习页。
     考试设置页 / 成绩单 / 单题解析 / 统计 / 成绩走势 / 错题排行 / 搜索空态 都不是。
     键盘逻辑必须先用它分流：这些页面没有题卡，继续往下跑会拿错题号，
     把作答记录写到用户根本没在看的那道题上。 */
  function isPracticeMode(m){
    return m === 'seq' || m === 'random' || m === 'wrong' || m === 'star' ||
           m === 'search' || isDrillMode(m);
  }

  /* ============================================================
     计时：驱动 + 显示
     ============================================================ */
  function examRunning(){
    return S.mode === 'exam' && S.exam && !S.exam.finished;
  }
  function examQid(){
    return examRunning() ? S.exam.gids[S.exam.pos] : null;
  }

  /* 主循环：每秒累加一次（用真实时间差，避免定时器漂移） */
  function tick(){
    var now = Date.now();
    var dt = now - TMR.lastTick;
    TMR.lastTick = now;

    if(!TMR.running) return;
    if(dt < 0) dt = 0;
    if(dt > 3000) dt = 3000;          /* 电脑休眠/切后台回来，不把这段算进去 */

    TMR.sessMs += dt;
    ensureDay();
    S.stats.dayMs += dt;
    S.stats.totalMs += dt;

    if(examRunning()){
      var E = S.exam;
      E.msAcc = (E.msAcc || 0) + dt;
      var g = examQid();
      if(g) E.qMs[g] = (E.qMs[g] || 0) + dt;
      /* 限时倒计时：到点自动交卷 */
      if(E.limitMs > 0 && E.msAcc >= E.limitMs && !E.autoSubmitting){
        E.autoSubmitting = true;
        finishExam(true);
        return;
      }
    }else if(TMR.qGid){
      TMR.qMs += dt;
    }

    updateClock();

    /* 每 5 秒落一次盘，防止关页面丢时间 */
    if(now - TMR.lastSave > 5000){ TMR.lastSave = now; save(); }
  }

  function updateClock(){
    var eS = $('tmSession');
    if(!eS) return;

    var inExam = examRunning();
    var dimQ = true;

    /* --- 第一格：本次 / 考试 / 剩余 --- */
    var lb = $('lbSession');
    if(inExam && S.exam.limitMs > 0){
      var left = Math.max(0, S.exam.limitMs - (S.exam.msAcc || 0));
      lb.textContent = '剩余';
      eS.textContent = fmtDur(left);
      eS.classList.toggle('warn', left <= 60000);
    }else if(inExam){
      lb.textContent = '考试';
      eS.textContent = fmtDur(S.exam.msAcc || 0);
      eS.classList.remove('warn');
    }else{
      lb.textContent = '本次';
      eS.textContent = fmtDur(TMR.sessMs);
      eS.classList.remove('warn');
    }

    /* --- 第二格：本题 --- */
    var eQ = $('tmQuestion');
    var qtxt = '—';
    if(inExam){
      var g = examQid();
      qtxt = fmtDur((S.exam.qMs[g] || 0));
      dimQ = false;
    }else if(TMR.qGid){
      qtxt = fmtDur(TMR.qMs);
      dimQ = false;
    }
    eQ.textContent = qtxt;
    eQ.classList.toggle('dim', dimQ);

    /* --- 第三格：今日 --- */
    $('tmToday').textContent = fmtDur(S.stats.dayMs);

    /* --- 第四格：平均 --- */
    var a = avgMs();
    $('tmAvg').textContent = a == null ? '—' : fmtShort(a);

    /* --- 暂停按钮 --- */
    var bp = $('btPause');
    if(bp){
      bp.textContent = TMR.running ? '暂停' : '继续';
      bp.classList.toggle('paused', !TMR.running);
    }
  }

  /* 告诉计时器“现在在做哪道题”。
     注意「这题做过没有」要按**当前板块**判断 —— 在顺序刷题做过，
     到单选专项里它就是没做过，计时器该正常计时。 */
  function trackQuestion(gid){
    if(examRunning()){ TMR.qGid = null; return; }
    if(!gid || recOf(gid)){ TMR.qGid = null; TMR.qMs = 0; return; }
    /* force 标记：切板块时置位，保证「同一道题跨板块」也能从零计时。
       否则 gid 没变就不归零，上一个板块的用时会被带过来（实测 1008ms 叠成 2022ms）。 */
    if(TMR.forceResetQ){
      TMR.qGid = gid; TMR.qMs = 0; TMR.forceResetQ = false;
      return;
    }
    if(TMR.qGid !== gid){ TMR.qGid = gid; TMR.qMs = 0; }
  }

  /* 切板块时把「本题计时」彻底归零。
     【真实缺陷修复】原来只靠 trackQuestion(gid) 在 gid 变化时归零，
     但两个板块可能有**同一道题**：顺序刷题第 1 题和单选专项第 1 题
     就是同一道（单选题池按题库顺序，第一道单选题就是她）。
     于是切板块后 gid 没变 → 计时没归零，接着往上累加 ——
     实测从 1008ms 直接跳到 2022ms，看起来像"这题我已经想了 2 秒"，
     其实是上一个板块的残留。 */
  function resetQuestionTimer(){
    TMR.qGid = null;
    TMR.qMs = 0;
    /* 关键：告诉下一次 trackQuestion「这是切板块，请务必归零」，
       否则它会以为「还是同一道题」，把旧的 qMs 留着。 */
    TMR.forceResetQ = true;
  }

  function setPaused(p){
    TMR.running = !p;
    TMR.lastTick = Date.now();
    updateClock();
    toast(p ? '计时已暂停' : '计时已继续');
  }

  /* ============================================================
     顶栏
     ============================================================ */
  function updateHeader(){
    /* 顶栏是「整体练了多少」——跨板块汇总。
        若改成只看当前板块，切一次标签数字就跳一次，反而看不懂；
        而且那正是用户说的「一考完所有板块都满了」要修的东西的另一面：
        汇总数字应该反映真实总量，但各板块内部要彼此独立。 */
    var agg = aggregateAns();
    var done = Object.keys(agg).length;
    var okc = 0;
    for(var g in agg) if(agg[g] && agg[g].ok) okc++;
    $('total').textContent = QS.length;
    $('done').textContent = done;
    $('rate').textContent = done ? Math.round(okc / done * 100) + '%' : '—';
    $('prog').style.width = (done / QS.length * 100).toFixed(1) + '%';
    $('btMemorize').classList.toggle('on', S.memorizing);
    updateClock();
  }

  var TABS = [
    {k:'seq',   label:'顺序刷题'},
    {k:'random',label:'随机刷题'},
    {k:'single',label:'单选专项'},
    {k:'multi', label:'多选专项'},
    {k:'hard',  label:'错题攻坚'},
    {k:'wrong', label:'错题本'},
    {k:'star',  label:'收藏'},
    {k:'exam',  label:'模拟考试'},
    {k:'stats', label:'统计'},
    {k:'trend', label:'成绩走势'},
    {k:'rank',  label:'错题排行'},
    {k:'search',label:'搜索'}
  ];
  function renderTabs(){
    var box = $('tabs');
    box.innerHTML = '';
    TABS.forEach(function(t){
      var b = el('button', 'tab' + (S.mode === t.k ? ' on' : ''));
      b.textContent = t.label;
      var n = '';
      if(t.k === 'wrong') n = S.wrong.length;
      else if(t.k === 'star') n = S.star.length;
      else if(t.k === 'rank') n = rankCount();
      else if(t.k === 'hard') n = drillPool('hard').length;
      if(n !== '' && n > 0){
        var s = el('span','n'); s.textContent = n; b.appendChild(s);
      }
      b.onclick = function(){
        if(S.mode === t.k) return;
        if(examRunning() && !S.exam.finished){
          if(!confirm('模拟考试还没交卷，确定离开吗？本次作答会作废。')) return;
          S.exam = null; S.examReview = null;
        }
        S.mode = t.k;
        S.keepAfterRemove = null;  /* 换板块了，临时保留失效 */
        S.keepAfterRemoveMode = null;
        resetQuestionTimer();      /* 切板块 → 本题计时从零开始 */
        save(); render();
      };
      box.appendChild(b);
    });
  }

  /* ============================================================
     渲染入口
     ============================================================ */
  function render(){
    updateHeader();
    renderTabs();
    var main = $('main');
    main.innerHTML = '';
    $('hint').innerHTML =
      '键盘：<kbd>A</kbd>–<kbd>F</kbd> 或 <kbd>1</kbd>–<kbd>6</kbd> 选择 · ' +
      '<kbd>Enter</kbd> 提交 / 下一题 · <kbd>←</kbd> <kbd>→</kbd> 切题 · <kbd>空格</kbd> 暂停计时';

    if(S.mode === 'exam'){ renderExam(main); return; }
    if(S.mode === 'stats'){ renderStats(main); return; }
    if(S.mode === 'trend'){ renderTrend(main); return; }
    if(S.mode === 'rank'){ renderRank(main); return; }
    if(S.mode === 'search'){ renderSearch(main); return; }
    if(isDrillMode(S.mode)){ renderDrill(main); return; }
    renderPractice(main);
  }

  /* ============================================================
     某个题池的正确率（题卡头部那个小徽标用）
     ------------------------------------------------------------
     只统计「list 里已作答的题」，**而且只看当前板块的记录** ——
     在顺序刷题做过的题，到单选专项里不算「本板块已做」，
     否则徽标会把别的板块的战绩算进来，和「各刷各的」矛盾。
     一道都没做时 total=0，调用方据此不渲染徽标（避免显示「0%」误导）。
     ============================================================ */
  function rateOfList(list, mode){
    var total = 0, right = 0;
    if(!Array.isArray(list)) return { total:0, right:0, rate:0 };
    var m = boardAns(mode);
    list.forEach(function(q){
      var rec = m[q.gid];
      if(!rec) return;
      total++;
      if(rec.ok) right++;
    });
    return {
      total: total,
      right: right,
      rate: total ? Math.round(right / total * 100) : 0
    };
  }

  /* ============================================================
     专项练习页（单选专项 / 多选专项 / 错题攻坚）
     ============================================================ */
  var DRILL_META = {
    single: { title:'单选专项', desc:'只练单选题，集中刷这一种题型。' },
    multi:  { title:'多选专项', desc:'只练多选题。多选题漏选、多选都算错，是提分重点。' },
    hard:   { title:'错题攻坚', desc:'只练做错过、且还没真正掌握的题。连续答对 3 次会自动移出。' }
  };

  /* 专项内的进度统计：做了多少、对多少、错多少。
     只数**本专项**的记录（各刷各的）；掌握度/顽固度是全站汇总的，不受此影响。 */
  function drillStats(key){
    var pool = drillPool(key);
    var mine = boardAns(key);
    var done = 0, right = 0, wrong = 0, mastered = 0, stubborn = 0;
    pool.forEach(function(q){
      var g = q.gid;
      var rec = mine[g];
      if(isMastered(g)) mastered++;
      if(masteryOf(g) === 'stubborn') stubborn++;
      if(rec){
        done++;
        if(rec.ok) right++; else wrong++;
      }
    });
    return {
      total: pool.length, done: done, right: right, wrong: wrong,
      rest: pool.length - done, mastered: mastered, stubborn: stubborn
    };
  }

  function renderDrill(main){
    var key = S.mode;
    var meta = DRILL_META[key] || { title:'专项练习', desc:'' };
    var st = S.drill[key];
    var list = modeList();
    var stat = drillStats(key);

    /* ---------- 概览卡 ---------- */
    var top = el('div','card drilltop');
    var th = el('div','qhead');
    th.appendChild(el('span','badge', meta.title));
    var tt = el('span','qidx');
    tt.innerHTML = '共 <b>' + stat.total + '</b> 题';
    th.appendChild(tt);
    th.appendChild(el('span','spacer'));
    top.appendChild(th);
    top.appendChild(el('div','ansline', meta.desc));

    /* 三个关键数字：做了多少 / 对多少 / 错多少 */
    var g3 = el('div','drillnums');
    [['已做', stat.done, 'n1'],
     ['做对', stat.right, 'n2'],
     ['做错', stat.wrong, 'n3']
    ].forEach(function(p){
      var box = el('div','dn ' + p[2]);
      box.appendChild(el('div','dnv', String(p[1])));
      box.appendChild(el('div','dnl', p[0]));
      g3.appendChild(box);
    });
    top.appendChild(g3);

    /* 进度条 */
    var pb = el('div','drillprog');
    var pbar = el('div','dpbar');
    var pfill = document.createElement('i');
    pfill.style.width = (stat.total ? (stat.done / stat.total * 100) : 0) + '%';
    pbar.appendChild(pfill);
    pb.appendChild(pbar);
    var pl = el('div','dplb');
    pl.innerHTML = '进度 <b>' + stat.done + '</b>/' + stat.total +
      (stat.rest > 0 ? ' · 还剩 ' + stat.rest + ' 题没做' : ' · 全部做过一遍了');
    pb.appendChild(pl);
    top.appendChild(pb);

    /* 攻坚专项额外显示掌握情况 */
    if(key === 'hard'){
      var hb = el('div','hardbar');
      hb.innerHTML = '待攻克 <b>' + stat.total + '</b> 题 · 其中已连续对 3 次可移出 <b>' + stat.mastered + '</b> 题';
      top.appendChild(hb);
    }

    /* ---------- 控制条：随机 / 重置 / 跳转 ---------- */
    var ctrl = el('div','drillctrl');

    var seg = el('div','seg');
    [['seq','按题号'],['rand','随机出题']].forEach(function(p){
      var on = (p[0] === 'rand') === !!st.shuffleSeq;
      var b = el('button', on ? 'on' : '', p[1]);
      b.onclick = function(){
        var want = (p[0] === 'rand');
        if(want === !!st.shuffleSeq) return;
        st.shuffleSeq = want;
        st.order = null;
        st.pos = 0;
        save(); render();
        toast(want ? '已切换为随机出题' : '已切换为按题号顺序');
      };
      seg.appendChild(b);
    });
    ctrl.appendChild(seg);

    var jumpWrap = el('div','jump');
    jumpWrap.appendChild(document.createTextNode('跳转到'));
    var ji = document.createElement('input');
    ji.type = 'number'; ji.min = 1; ji.max = Math.max(1, list.length);
    ji.placeholder = String((st.pos || 0) + 1);
    var jb = el('button','btn ghost','Go');
    jb.onclick = function(){
      var v = parseInt(ji.value, 10);
      if(!v || v < 1 || v > list.length){ toast('请输入 1–' + list.length); return; }
      st.pos = v - 1; save(); render();
    };
    ji.onkeydown = function(e){ if(e.key === 'Enter') jb.click(); };
    jumpWrap.appendChild(ji); jumpWrap.appendChild(jb);
    ctrl.appendChild(jumpWrap);

    /* 重置本专项：清的是「本专项题池里的作答记录」，让你能重新刷一遍。
       文案必须写清「会清什么 / 不会清什么」—— 原来只写「清进度」，
       用户以为是清记录，点了发现题还是已作答状态、选项点不动，
       于是以为按钮坏了，改用总重置把全部记录都清了。 */
    var rb = el('button','btn ghost','重置本专项');
    rb.onclick = function(){
      var mine = boardAns(key);
      var n = list.filter(function(q){ return !!mine[q.gid]; }).length;
      var msg = '重置「' + meta.title + '」？\n\n' +
                '会清空本专项的作答记录（当前已做 ' + n + ' 题），做完的题可以重新做一遍；' +
                '同时回到第 1 题，并换一套选项位置。\n\n' +
                '不会动：其他专项和板块的作答记录、错题本、收藏、累计错题次数。\n' +
                '（想连错题本和收藏一起清，用右上角的总「重置」。）';
      if(!confirm(msg)) return;
      var cleared = resetDrill(key);
      toast(cleared > 0 ? ('已重置「' + meta.title + '」，' + cleared + ' 题可以重新做了')
                        : ('已重置「' + meta.title + '」'));
    };
    ctrl.appendChild(rb);
    top.appendChild(ctrl);

    main.appendChild(top);

    /* ---------- 题卡 ---------- */
    if(!list.length){
      var e = el('div','empty');
      if(key === 'hard'){
        e.appendChild(el('div','big','🏆'));
        e.appendChild(el('h3',null,'没有待攻克的题了'));
        e.appendChild(el('p',null,'所有做错过的题都已经连续答对 3 次，算真正掌握了。如果想再练，可以去「错题本」或直接刷题。'));
      }else{
        e.appendChild(el('div','big','📚'));
        e.appendChild(el('h3',null,'这个专项暂时没有题目'));
      }
      var gb = el('button','btn primary','去顺序刷题');
      gb.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(gb);
      main.appendChild(e);
      return;
    }

    if(st.pos > list.length - 1) st.pos = list.length - 1;
    if(st.pos < 0) st.pos = 0;

    practiceCard(main, list, key);
  }

  /* ============================================================
     成绩走势：每天的正确率 + 考试历史 + 鼓励批注
     ============================================================ */
  function renderTrend(main){
    var days = recentDays(7);
    var today = days[days.length - 1];

    /* ---------- 今天的鼓励语 ---------- */
    var enc = todayEncouragement(today);
    var encCard = el('div','card enc ' + enc.mood);
    var et = el('div','enctitle');
    et.innerHTML = '<span class="encdot"></span>' + enc.title;
    encCard.appendChild(et);
    encCard.appendChild(el('div','enctext', enc.text));
    main.appendChild(encCard);

    /* ---------- 最近 7 天正确率 ---------- */
    var dayCard = el('div','card');
    var dh = el('div','qhead');
    dh.appendChild(el('span','badge','最近 7 天'));
    var totalAns = days.reduce(function(s, d){ return s + d.ans; }, 0);
    var ds = el('span','qidx');
    ds.innerHTML = '共答 <b>' + totalAns + '</b> 题';
    dh.appendChild(ds);
    dayCard.appendChild(dh);

    if(totalAns === 0){
      var e = el('div','empty');
      e.appendChild(el('div','big','📈'));
      e.appendChild(el('h3',null,'这几天还没有练习记录'));
      e.appendChild(el('p',null,'答几道题，这里就会出现每天的进度和正确率'));
      var b = el('button','btn primary','去刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      dayCard.appendChild(e);
      main.appendChild(dayCard);

      /* 成绩走势批注（无数据时也给一句） */
      var ta0 = trendAnnotation(days);
      var noteCard0 = el('div','card');
      noteCard0.appendChild(el('div','trendnote', ta0.text));
      main.appendChild(noteCard0);
      return;
    }

    /* 每日条形图 */
    var chart = el('div','daychart');
    days.forEach(function(d){
      var col = el('div','dcol' + (d.isToday ? ' today' : ''));
      var rateTxt = (d.rate == null) ? '—' : d.rate + '%';
      var track = el('div','dtrack');
      var fill = document.createElement('i');
      if(d.rate != null){
        fill.style.height = Math.max(3, d.rate) + '%';
        if(d.rate >= 85) fill.className = 'hi';
        else if(d.rate >= 70) fill.className = 'mid';
        else fill.className = 'low';
      }else{
        fill.className = 'none';
        fill.style.height = '2px';
      }
      track.appendChild(fill);
      col.appendChild(track);
      col.appendChild(el('div','dv', rateTxt));
      col.appendChild(el('div','dl', d.label));
      col.appendChild(el('div','dw', d.weekday));
      if(d.ans > 0) col.appendChild(el('div','dn', d.ans + ' 题'));
      col.title = d.key + '：' + (d.ans ? d.ans + ' 题，正确 ' + d.right + ' 题，正确率 ' + d.rate + '%' : '未练习');
      chart.appendChild(col);
    });
    dayCard.appendChild(chart);

    /* 明细列表 */
    var tbl = el('div','daylist');
    days.slice().reverse().forEach(function(d){
      var row = el('div','drow' + (d.isToday ? ' today' : ''));
      row.appendChild(el('span','ddate', d.label + ' 周' + d.weekday));
      var stat = el('span','dstat');
      if(d.ans){
        stat.innerHTML = '答 <b>' + d.ans + '</b> 题 · 对 <b>' + d.right + '</b> · 正确率 <b>' +
          d.rate + '%</b>' + (d.examN ? ' · 考试 <b>' + d.examN + '</b> 次' : '');
      }else{
        stat.textContent = '未练习';
      }
      row.appendChild(stat);
      tbl.appendChild(row);
    });
    dayCard.appendChild(tbl);

    /* 趋势批注 */
    var ta = trendAnnotation(days);
    if(ta.tag){
      var tag = el('div','trendtag ' + (ta.tag === '上升' ? 'up' : ta.tag === '回落' ? 'down' : 'flat'), ta.tag);
      dayCard.appendChild(tag);
    }
    dayCard.appendChild(el('div','trendnote', ta.text));
    main.appendChild(dayCard);

    /* ---------- 考试历史 ---------- */
    var hs = S.examHistory || [];
    var examCard = el('div','card');
    var eh = el('div','qhead');
    eh.appendChild(el('span','badge','模拟考试'));
    var ehs = el('span','qidx');
    var passN = hs.filter(function(x){ return x.pass; }).length;
    ehs.innerHTML = hs.length
      ? '共 <b>' + hs.length + '</b> 次 · 及格 <b>' + passN + '</b> 次'
      : '还没有考试记录';
    eh.appendChild(ehs);
    examCard.appendChild(eh);

    if(!hs.length){
      examCard.appendChild(el('div','hint','去「模拟考试」考一次，成绩会记在这里。'));
      var gb = el('button','btn primary','去模拟考试');
      gb.onclick = function(){ S.mode = 'exam'; save(); render(); };
      examCard.appendChild(gb);
      main.appendChild(examCard);
      return;
    }

    /* 历史柱状图 */
    var recent = hs.slice(-15);
    var maxFull = Math.max.apply(null, recent.map(function(x){ return x.full || 100; }));
    var bars = el('div','histbars wide');
    recent.forEach(function(x){
      var col = el('div','hb' + (x.pass ? ' ok' : ''));
      var track = el('div','hbtrack');
      var fill = document.createElement('i');
      fill.style.height = Math.max(2, (x.score || 0) / maxFull * 100) + '%';
      fill.className = x.pass ? 'pass' : 'fail';
      track.appendChild(fill);
      var line = el('div','hbpass');
      line.style.bottom = ((x.passScore || 80) / maxFull * 100) + '%';
      track.appendChild(line);
      col.appendChild(track);
      col.appendChild(el('div','hbv', String(x.score)));
      var dt = new Date(x.at);
      col.title = dt.toLocaleString('zh-CN') + '｜' + x.score + '/' + x.full +
                  '｜正确率 ' + x.rate + '%' + (x.auto ? '｜超时自动交卷' : '');
      bars.appendChild(col);
    });
    examCard.appendChild(bars);
    examCard.appendChild(el('div','ansline',
      '柱高 = 得分，横线 = 及格线（' + ((hs[hs.length-1].passScore) || 80) + ' 分）。绿色为及格。'));

    /* 最近一次考试的批注 */
    var last = hs[hs.length - 1];
    var lc = el('div','comment ' + (last.pass ? 'good' : 'warn'));
    lc.textContent = examAnnotation(last);
    examCard.appendChild(lc);

    /* 每次考试明细 */
    var elist = el('div','daylist');
    hs.slice(-10).reverse().forEach(function(x){
      var row = el('div','drow');
      var dt = new Date(x.at);
      row.appendChild(el('span','ddate',
        pad2(dt.getMonth()+1) + '/' + pad2(dt.getDate()) + ' ' +
        pad2(dt.getHours()) + ':' + pad2(dt.getMinutes())));
      var st = el('span','dstat');
      st.innerHTML = '<b>' + x.score + '</b>/' + x.full + ' 分 · 正确率 <b>' + x.rate +
        '%</b> · 用时 ' + fmtDur(x.ms) +
        (x.pass ? ' · <span class="passmark">及格</span>'
                : ' · <span class="failmark">差 ' + ((x.passScore||80) - x.score) + ' 分</span>') +
        (x.auto ? ' · 超时交卷' : '');
      row.appendChild(st);
      elist.appendChild(row);
    });
    examCard.appendChild(elist);

    main.appendChild(examCard);
    updateClock();
  }

  /* ============================================================
     统计页：按题型 / 难度 分组
     ============================================================ */
  function rankCount(){
    var n = 0;
    for(var g in S.wcnt) if(S.wcnt[g] > 0 && BY[g]) n++;
    return n;
  }

  function renderStats(main){
    var head = el('div','card');
    var t = el('div','qhead');
    t.appendChild(el('span','qtext','学习统计'));
    head.appendChild(t);

    /* 总体概览（跨板块汇总：统计页回答「整体学得怎么样」） */
    var agg = aggregateAns();
    var done = Object.keys(agg).length;
    var right = 0;
    for(var g in agg) if(agg[g] && agg[g].ok) right++;
    var rate = done ? Math.round(right / done * 100) : null;

    var grid = el('div','statgrid');
    [['总题量', QS.length + ' 题'],
     ['已练', done + ' 题'],
     ['未练', (QS.length - done) + ' 题'],
     ['总正确率', rate == null ? '—' : rate + '%'],
     /* 【口径修正】「累计错题」原来用 rankCount()（wcnt>0 的题数），
        但这个数在两种情况下会和「错题本」对不上：
          · 预置错题只有名单、没有错次时（老版本问题，现已补上）
          · 用户点「移出错题本」后：名单清了，但错次保留 → rankCount 仍算它
        统计页这里想表达的是「我现在有多少道错题待处理」，
        那应该看错题本的真实大小；历史错次是排行页的事。 */
     ['错题本', S.wrong.length + ' 题'],
     ['累计用时', fmtDur(S.stats.totalMs)]
    ].forEach(function(p){
      var s = el('div','stat');
      s.appendChild(el('div','v', p[1]));
      s.appendChild(el('div','l', p[0]));
      grid.appendChild(s);
    });
    head.appendChild(grid);

    /* 维度切换 */
    var segRow = el('div','actions');
    var seg = el('div','seg');
    [['type','按题型'],['diff','按难度']].forEach(function(p){
      var b = el('button', S.statsTab === p[0] ? 'on' : '', p[1]);
      b.onclick = function(){ S.statsTab = p[0]; save(); render(); };
      seg.appendChild(b);
    });
    segRow.appendChild(seg);
    head.appendChild(segRow);

    /* 说明：难度是推导出来的，要写明，不能假冒官方 */
    if(S.statsTab === 'diff'){
      head.appendChild(el('div','hint',
        '难度题库未提供，由你的作答表现推导：历史错过2次以上→较难；错过1次→一般；' +
        '首次接触就耗时超过平均1.5倍→较难；其余一次就对→简单。' +
        '遇到以前错过的题即使现在答对，也不会被归为「简单」。'));
    }
    main.appendChild(head);

    /* 分组数据 */
    var groups = S.statsTab === 'type'
      ? groupStats(function(q){ return q.type || '单选题'; })
      : groupStats(function(q){ return difficultyOf(q); });

    /* 排序：难度按 较难→一般→简单→未练；题型按 题量降序 */
    if(S.statsTab === 'diff'){
      var order = { '较难':0, '一般':1, '简单':2, '未练':3 };
      groups.sort(function(a, b){
        return (order[a.key] == null ? 9 : order[a.key]) - (order[b.key] == null ? 9 : order[b.key]);
      });
    }else{
      groups.sort(function(a, b){ return b.total - a.total; });
    }

    var list = el('div','card');
    var lh = el('div','qhead');
    lh.appendChild(el('span','badge', S.statsTab === 'type' ? '按题型' : '按难度'));
    lh.appendChild(el('span','spacer'));
    lh.appendChild(el('span','qidx','共 ' + groups.length + ' 组'));
    list.appendChild(lh);

    var wrap = el('div','statwrap');
    groups.forEach(function(g){
      var row = el('div','statrow');

      var name = el('div','sname');
      name.appendChild(document.createTextNode(g.key));
      row.appendChild(name);

      var rt = el('div','srate' + (g.rate == null ? ' none' : ''));
      rt.textContent = g.rate == null ? '未练' : g.rate + '%';
      row.appendChild(rt);

      var bar = el('div','bar2');
      var fill = document.createElement('i');
      var pct = g.done ? (g.right / g.done * 100) : 0;
      fill.style.width = pct.toFixed(1) + '%';
      if(g.rate != null){
        if(g.rate < 60) fill.className = 'low';
        else if(g.rate < 80) fill.className = 'mid';
      }
      bar.appendChild(fill);
      row.appendChild(bar);

      var meta = el('div','smeta');
      meta.innerHTML =
        '<span>已练 <b>' + g.done + '</b>/' + g.total + '</span>' +
        '<span>对 <b>' + g.right + '</b></span>' +
        '<span class="w">错题 <b>' + g.wrong + '</b></span>' +
        (g.avgMs != null ? '<span>平均 <b>' + fmtShort(g.avgMs) + '</b></span>' : '');
      row.appendChild(meta);

      wrap.appendChild(row);
    });
    list.appendChild(wrap);
    main.appendChild(list);

    /* 备份 / 恢复入口放在统计页底部，与「数据」相关的地方 */
    main.appendChild(backupBar());

    main.appendChild(el('div','hint','数据来自本机练习记录，重置后会一并清空'));
    updateClock();
  }

  /* ============================================================
     错题排行：按累计答错次数降序
     ============================================================ */
  function renderRank(main){
    var list = rankAll();

    var card = el('div','card');
    var head = el('div','qhead');
    head.appendChild(el('span','badge','错题排行'));
    var hcnt = el('span','qidx');
    hcnt.innerHTML = '共 <b>' + list.length + '</b> 道错过';
    head.appendChild(hcnt);
    head.appendChild(el('span','spacer'));
    card.appendChild(head);

    if(!list.length){
      var e = el('div','empty');
      e.appendChild(el('div','big','📊'));
      e.appendChild(el('h3',null,'还没有错题记录'));
      e.appendChild(el('p',null,'答错的题会按次数记在这里，错得越多的排越前'));
      var b = el('button','btn primary','去刷题');
      b.onclick = function(){ S.mode = 'seq'; save(); render(); };
      e.appendChild(b);
      main.appendChild(e);
      return;
    }

    /* 说明：只计「答错过几次」，不因为后来答对而减少 */
    card.appendChild(el('div','hint',
      '按累计答错次数排序；答对不会减少次数，这样能看出哪些题你反复错 '));

    /* 显示条数切换 */
    var segRow = el('div','actions');
    var seg = el('div','seg');
    [10,20,50,0].forEach(function(n){
      var b = el('button', S.rankSize === n ? 'on' : '', n === 0 ? '全部' : '前 ' + n);
      b.onclick = function(){ S.rankSize = n; save(); render(); };
      seg.appendChild(b);
    });
    segRow.appendChild(seg);
    card.appendChild(segRow);

    var show = S.rankSize === 0 ? list : list.slice(0, S.rankSize);
    var box = el('div','rank');
    show.forEach(function(item, i){
      var row = el('button','rk' + (i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : ''));
      row.appendChild(el('span','no', String(i + 1)));

      var body = el('div','body');
      body.appendChild(el('div','qt', item.q.q.replace(/\s+/g, ' ')));

      var mt = el('div','mt');
      var bg = el('span','badge-s', item.q.type || '单选题');
      mt.appendChild(bg);
      /* 说清楚三种状态，不要把「未做」和「做错」混成同一个破折号 */
      var rec = aggregateAns()[item.gid];
      var stateTxt = !rec ? '尚未作答'
                    : (rec.ok ? '本次已答对' : '本次仍答错');
      mt.appendChild(el('span', null, stateTxt));
      if(item.last){
        var d = new Date(item.last);
        mt.appendChild(el('span', null, '最近错于 ' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate())));
      }
      body.appendChild(mt);
      row.appendChild(body);

      var cnt = el('div','cnt');
      cnt.innerHTML = item.n + '<small>次</small>';
      row.appendChild(cnt);

      row.onclick = function(){
        /* 直接跳到这道题：用「错题本」列表定位，没有就临时开一个 */
        var idx = S.wrong.indexOf(item.gid);
        if(idx >= 0){
          S.mode = 'wrong'; S.pos.wrong = idx;
        }else{
          /* 已答对移出错题本 → 用搜索模式定位 */
          S.mode = 'search';
          S.search = item.q.q.slice(0, 12);
          S.pos.search = 0;
        }
        save(); render();
      };
      box.appendChild(row);
    });
    card.appendChild(box);

    if(S.rankSize !== 0 && list.length > S.rankSize){
      card.appendChild(el('div','hint',
        '还有 ' + (list.length - S.rankSize) + ' 道未显示，点上方「全部」展开'));
    }

    main.appendChild(card);
    updateClock();
  }
