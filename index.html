,{"t":"增加训练集迭代次数（epoch）","ok":true},{"t":"增加 lora_rank 值","ok":true},{"t":"学习率增加一倍","ok":false}],"analysis":"**答案**：B、C\n\n**解析**：\n欠拟合指模型未充分学习数据特征，训练误差较高。\nA项：增加数据量会增加拟合难度，常用于缓解过拟合，排除；\nB项：增加epoch能让模型更充分地学习数据，降低训练误差，正确；\nC项：增加lora_rank可提升模型参数量与表达能力，增强拟合能力，正确；\nD项：盲目倍增学习率易导致梯度震荡或Loss发散，并非解决欠拟合的有效措施，排除。"},{"gid":"0f949e97-0e9d-4cbe-8657-33334430765d","type":"多选题","q":"你通过 RAG 为用户提供商品推荐服务。用户反馈说，在搜索 “包子” 时，推荐结果中经常出现 “书包” 的商品信息。后台分析发现，召回阶段确实会夹杂部分无关商品的信息。以下哪些措施能够有效提升该系统的推荐效果？","options":[{"t":"降低检索阶段的相似度阈值","ok":false},{"t":"优化大模型的 prompt，强调要重点关注用户问题，避免输出无关商品信息","ok":true},{"t":"在知识库中剔除书包相关的内容","ok":false},{"t":"微调大模型，提高其在面对包含噪声数据的信息时筛选有效信息的能力","ok":true}],"analysis":"**答案**：B、D\n\n**解析**：\nA错误，降低相似度阈值会召回更多无关内容，加剧问题；C错误，剔除“书包”会破坏知识库完整性，影响用户的正常搜索。B、D正确，针对召回阶段引入的噪声，可通过优化Prompt（B）或微调大模型（D），增强大模型在生成阶段的抗噪与信息筛选能力，使其自动忽略“书包”等无关内容，精准聚焦“包子”生成推荐。"},{"gid":"d6f22667-bfc6-49b5-8b84-2acbd39df8ce","type":"多选题","q":"你写了一个提示词 “请用适合简报的形式，以每篇 100 字的篇幅总结今早的十大新闻”。你希望大模型能按照提示词完成任务，以下哪些方案可行？","options":[{"t":"设计提示词，明确要求大模型要基于今天最新的新闻来总结，避免基于历史新闻总结","ok":false},{"t":"设计提示词，结合 function call，让大模型回答时效性问题时，调用搜索工具","ok":true},{"t":"整理历史新闻库，构建一个 RAG应用，让大模型回答时参考知识库中的新闻","ok":false},{"t":"使用阿里云百炼平台的 qwen-plus，并且调用 API 时设置 enable_search=True","ok":true}],"analysis":"答案：B、D\n\n解析：\n本题核心是获取“今早”新闻，强调**时效性**。大模型受限于训练数据截止日期，无法凭空获知实时信息。\nA项仅靠提示词无法突破知识限制，会导致幻觉；C项RAG依赖“历史”新闻库，无法满足“今早”的实时需求。\nB项通过Function Call调用外部搜索工具，D项开启百炼平台内置联网搜索（enable_search=True），均能赋予模型实时获取最新数据的能力，从而准确完成任务。"},{"gid":"ee913cbb-242d-4d34-944c-26988c1657c1","type":"单选题","q":"以下哪个提示词框架要素用于提供参考案例，帮助大模型理解预期输出？","options":[{"t":"输入数据 (Input Parameters)","ok":false},{"t":"样例 (Sampl","ok":true},{"t":"任务目标 (Object)","ok":false},{"t":"角色 (Role)","ok":false}],"analysis":"**答案**：B\n\n**解析**：\n在提示词框架中，“样例（Sample）”通过提供具体的输入与输出参考案例，能直观地向大模型展示预期的输出格式、风格和逻辑，帮助其准确理解任务要求。A项“输入数据”是待处理的具体内容；C项“任务目标”用于明确模型要执行的动作；D项“角色”则设定模型的身份背景。因此，提供参考案例的要素是样例。"},{"gid":"067ac5db-1a96-40b4-9886-ac7fc152db25","type":"单选题","q":"构建微调数据集时最重要的原则是？","options":[{"t":"包含丰富的问题场景","ok":true},{"t":"数据尽量由大模型生成","ok":false},{"t":"数据量越大越好","ok":false},{"t":"使用单一的问题模板","ok":false}],"analysis":"答案：A\n\n解析：构建微调数据集的核心在于提升模型的泛化与鲁棒性，因此**包含丰富的问题场景（A）** 最为重要，能让模型适应真实世界中复杂多变的需求。B项过度依赖大模型易引入幻觉与同质化偏差；C项违背了“质量重于数量”原则，低质海量数据反会损害模型；D项单一模板会导致模型过拟合，丧失应对多样化问题的能力。故选A。"},{"gid":"13a34dac-1b48-4b71-be27-87a4c4b9458d","type":"单选题","q":"RAG（检索增强生成）技术在大模型应用中的核心作用是什么？","options":[{"t":"直接扩展大模型的训练数据，使其掌握新知识","ok":false},{"t":"在大模型生成内容时，像开卷考试一样提供相关知识作为参考，提高回答质量","ok":true},{"t":"通过微调大模型参数，使其适应特定领域的任务","ok":false},{"t":"替代大模型的训练过程，完全依靠检索结果生成答案","ok":false}],"analysis":"**答案：B**\n\n**解析：**\nRAG的核心机制是在大模型生成回答前，先从外部知识库检索相关信息，并作为上下文输入模型。这如同“开卷考试”，能有效缓解幻觉，提高回答准确性与时效性。A项属于继续预训练；C项属于模型微调，两者均需更新模型参数，而RAG无需改变参数；D项错误，RAG不替代训练过程，且最终生成仍依赖大模型自身的理解与总结能力。"},{"gid":"29f709be-86cd-4bc6-a17c-9fe1931cf183","type":"单选题","q":"以下哪种方式可以更好地处理大模型返回结果中可能存在的错误或异常?","options":[{"t":"假设大模型总是返回正确的结果。","ok":false},{"t":"使用try-except 块捕获潜在的异常。","ok":true},{"t":"在调用大模型之前进行输入验证。","ok":false},{"t":"不处理，直接使用返回结果。","ok":false}],"analysis":"答案：B\n\n解析：大模型调用过程中，常因网络波动、API限流或返回格式不符预期等引发异常。使用try-except块能有效捕获这些运行时错误，进行重试或降级处理，防止程序崩溃。选项A和D完全忽视异常，极易导致系统故障；选项C的输入验证虽有必要，但无法处理“返回结果”阶段产生的异常。因此，B是处理此类异常的最直接有效的方式。"},{"gid":"f52def76-af7f-489c-b1d6-9f9b7580a913","type":"单选题","q":"如果将 top_p 设置为一个非常小的值，例如0.1,模型的生成结果会有什么特点?","options":[{"t":"生成结果长度会变短。","ok":false},{"t":"生成结果更加保守，倾向于选择概率最高的少数几个词，多样性降低。","ok":true},{"t":"生成结果长度会变长。","ok":false},{"t":"生成结果更加多样化。","ok":false}],"analysis":"答案：B\n\n解析：top_p（核采样）控制采样时的候选词范围。设为极小值（如0.1）时，模型仅从累积概率达10%的最高概率词集中选词。这大幅缩小了候选范围，使模型倾向于选择概率最高的少数几个词，导致生成结果更保守、确定性增强，多样性显著降低。top_p主要影响选词多样性，不直接决定生成文本的长度。"},{"gid":"0522a76f-f1d8-4784-89e5-5a12f3bcc89d","type":"单选题","q":"在使用Assistant API的 Assistant 类操作智能体过程中使用了如下代码，分析这段代码主要的作用是什么?from dashscope import Assistantsassistant=Assistants.retrieve('assistant_id')","options":[{"t":"检索智能体","ok":true},{"t":"删除智能体","ok":false},{"t":"创建智能体","ok":false},{"t":"更新智能体","ok":false}],"analysis":"答案：A\n\n解析：在DashScope的Assistant API中，`retrieve`方法意为“检索”，专门用于根据传入的智能体ID从服务端查询并获取已存在的智能体详细信息。相比之下，创建、更新和删除智能体分别对应`create`、`update`和`delete`方法。因此，该代码的主要作用是检索智能体。"},{"gid":"139c3232-f66d-4893-80d3-ca72ef5aea3e","type":"单选题","q":"在RAG流程中，如何提高检索的效率?","options":[{"t":"增加embedding的维度","ok":false},{"t":"使用更大的预训练语言模型。","ok":false},{"t":"对向量数据库中的向量构建索引。","ok":true},{"t":"增加文档切片的粒度(例如将段落切成更小的片段）","ok":false}],"analysis":"正确答案：C\n\n解析：在RAG流程中，对向量构建索引（如HNSW、IVF等算法）能将全局遍历转化为近似最近邻搜索，大幅降低计算复杂度，显著提升检索速度。相反，增加embedding维度（A）和切分更小的文档片段（D）会增加向量数据量与计算开销，反而降低效率；使用更大的预训练模型（B）主要用于提升生成质量，且计算成本更高，与提高检索效率无关。"},{"gid":"f2eb0b6b-a567-4fa5-8cb7-a1f6f4b9d6cd","type":"单选题","q":"以下哪个步骤最能体现 RAG 中的 “知识增强” 的思想？","options":[{"t":"文段召回，从数据库中匹配合适的文段用于回答问题。","ok":true},{"t":"语义化分割，基于段落为主体进行语义化分割。","ok":false},{"t":"文档解析，将 PDF 转换为 Markdown。","ok":false},{"t":"表格单元格改写，kv 形式补充单元格信息，增强语义信息。","ok":false}],"analysis":"答案：A\n\n解析：RAG的核心思想是通过检索外部知识来“增强”大模型的生成能力，以弥补知识盲区并减少幻觉。选项A“文段召回”直接获取外部知识作为上下文输入给模型，最能体现“知识增强”的核心机制。选项B、C属于前期的数据预处理与索引构建阶段；选项D属于文档内部的数据清洗与语义补全，并非利用外部知识增强模型生成。因此选A。"},{"gid":"438434d6-0809-4fcd-8a6a-4d02b06b9851","type":"单选题","q":"下面的Python代码执行了哪种文本预处理操作? import recleaned_text=re.sub(r'\\W+',\",text)","options":[{"t":"词形还原","ok":false},{"t":"文本去噪(正则表达式清洗)","ok":true},{"t":"文本分类","ok":false},{"t":"文本翻译","ok":false}],"analysis":"答案：B\n\n解析：\n代码使用了Python的`re`模块。正则表达式`r'\\W+'`用于匹配一个或多个非单词字符（如标点、特殊符号等）。`re.sub`函数将这些匹配到的噪声字符替换掉（通常替换为空格），从而去除文本中的无关符号，实现文本去噪。词形还原需借助专业NLP库，而文本分类和翻译属于更高级的NLP任务，均不符合该代码功能。"},{"gid":"f5e08eae-d776-434c-b2b5-07283c76f54e","type":"单选题","q":"以下哪个选项最适合用于请求大模型总结一篇文章的主要内容？","options":[{"t":"用简洁的语言概括以下文章的核心观点：(文章内容)","ok":true},{"t":"文章的主要内容是什么？(文章内容)","ok":false},{"t":"重写这篇文章。","ok":false},{"t":"这篇文章写了什么？","ok":false}],"analysis":"答案：A\n\n解析：选项A的提示词最清晰具体。它不仅明确了任务目标（概括核心观点），规定了输出要求（语言简洁），还清晰界定了输入内容，能有效引导大模型生成高质量总结。选项B和D缺乏对输出格式的具体约束，且D缺失输入文本；选项C的任务是“重写”而非“总结”，完全偏离题意。因此A为最佳选项。"},{"gid":"f6fb41bf-027b-4077-8654-5af687f15ecf","type":"单选题","q":"在 RAGAS 评分之后，你对其中一些指标有些疑问，你可以查看哪个字段来追溯大模型评分的原因？","options":[{"t":"source","ok":false},{"t":"reason","ok":true},{"t":"json_object","ok":false},{"t":"source_node","ok":false}],"analysis":"答案：B\n\n解析：在RAGAS评估框架中，大模型对各项指标（如忠实度、相关性等）打分时，会同步生成评分的推理过程与依据。这些解释性信息被专门存储在`reason`字段中。当对评分有疑问时，查看`reason`字段即可追溯大模型的具体评判逻辑，便于调试优化。而`source`和`source_node`通常指代数据来源或检索节点，`json_object`仅为数据格式，均不包含评分原因。"},{"gid":"be9e4098-d90f-47b7-890e-95ce67809bf8","type":"单选题","q":"RAG应用建立索引过程中的四个关键步骤按正确顺序排列是？","options":[{"t":"文档解析 → 文本向量化 → 文本分段 → 存储索引","ok":false},{"t":"文档解析 → 文本分段 → 文本向量化 → 存储索引","ok":true},{"t":"文本分段 → 文档解析 → 文本向量化 → 存储索引","ok":false},{"t":"文本向量化 → 文档解析 → 文本分段 → 存储索引","ok":false}],"analysis":"答案：B\n\n解析：RAG建立索引遵循数据处理的自然逻辑。首先进行**文档解析**，将各类格式文件提取为纯文本；其次进行**文本分段**，将长文本切分为适合模型处理的小块（Chunk）；接着进行**文本向量化**，利用Embedding模型将文本块转化为高维向量；最后**存储索引**，将向量及原文存入向量数据库以便后续检索。步骤环环相扣，不可颠倒。"},{"gid":"37fae1ee-b090-4391-8838-b3763eaa1be6","type":"单选题","q":"在RAG应用的检索阶段，使用embedding模型的主要目的是什么？","options":[{"t":"对用户问题进行文本向量化，以便与向量数据库中的段落进行语义相似度比较","ok":true},{"t":"对大模型生成的回复进行质量评估和优化","ok":false},{"t":"将检索到的文本段自动转换为用户需要的多种语言","ok":false},{"t":"对用户问题进行语法检查和纠错","ok":false}],"analysis":"答案：A\n\n解析：在RAG的检索阶段，核心任务是召回相关知识。Embedding模型的主要作用是将用户问题和知识库文本转化为高维向量。通过计算向量间的距离（如余弦相似度），系统能突破字面匹配限制，实现深度的语义相似度比较，从而精准检索出相关段落。选项B属于生成后评估，C属于机器翻译，D属于语法纠错，均非检索阶段Embedding模型的功能。"},{"gid":"07012c1d-c623-464a-ad1b-4dedfd56ea3a","type":"单选题","q":"RAG应用中实现多轮对话时面临的主要挑战是什么？","options":[{"t":"大模型无法处理长时间的对话历史","ok":false},{"t":"用户后续问题可能依赖对话历史中的上下文，如果只用当前问题检索会召回错误内容","ok":true},{"t":"向量数据库无法存储多轮对话产生的向量数据","ok":false},{"t":"多轮对话会显著增加RAG应用的响应延迟","ok":false}],"analysis":"答案：B\n\n解析：在RAG多轮对话中，用户后续提问常包含指代词（如“它”）或省略主语。若仅用当前问题直接检索，会因语义不完整导致召回错误内容。因此，核心挑战是如何结合对话历史进行查询重写（Query Rewrite），补全当前问题的完整检索意图。选项A和C不符合当前技术现状，选项D的延迟问题可通过工程优化缓解，并非核心痛点。"},{"gid":"e138e125-fc77-4028-b323-8cb0bb42061d","type":"单选题","q":"LlamaIndex中实现RAG多轮对话问题改写功能的推荐方案是什么？","options":[{"t":"直接将完整的对话历史输入检索系统进行匹配","ok":false},{"t":"利用大模型根据对话历史对当前问题进行改写，将上下文信息融入问题中","ok":true},{"t":"在用户输入每个问题时都要求补充完整的上下文信息","ok":false},{"t":"使用关键词匹配代替语义相似度比较","ok":false}],"analysis":"答案：B\n\n解析：在多轮对话中，用户提问常包含指代或省略。直接输入历史记录（A）会引入噪声，要求用户补充（C）体验极差，关键词匹配（D）缺乏语义理解。LlamaIndex推荐利用大模型结合对话历史对当前问题进行改写，补全上下文并消除指代，生成语义完整的独立查询。这能显著提升向量检索的准确率与RAG的最终生成质量。"},{"gid":"9c80a34a-7315-4107-9503-83312c4c7e90","type":"单选题","q":"在RAG应用中保存和加载索引的主要优势是什么？","options":[{"t":"减少向量数据库的存储空间占用","ok":false},{"t":"提升回复速度，避免每次使用时都重新建立索引","ok":true},{"t":"提高embedding模型的向量化精度","ok":false},{"t":"简化大模型的提示词模板设计","ok":false}],"analysis":"答案：B\n\n解析：在RAG应用中，构建索引（文档切分、向量化等）是计算密集且耗时的过程。保存和加载索引可实现数据的持久化复用，避免每次使用时重新计算和构建，从而大幅提升回复速度并节省算力（B正确）。保存索引需占用存储而非减少空间（A错）；向量化精度由Embedding模型本身决定（C错）；此操作与提示词模板设计无关（D错）。"},{"gid":"5fc9ba49-7b77-4d43-81a0-c071d852f6b7","type":"单选题","q":"在RAG应用中，上下文工程（Context Engineering）的核心目标是什么？","options":[{"t":"尽可能多地向大模型提供信息，确保回答的全面性","ok":false},{"t":"为大模型的'上下文窗口'填充恰到好处的信息，信息太少模型会'不知道'，太多或无关则会降低性能和增加成本","ok":true},{"t":"优化大模型的训练过程，减少训练数据量","ok":false},{"t":"替代大模型的提示词工程，简化开发流程","ok":false}],"analysis":"答案：B\n\n解析：在RAG中，上下文工程的核心是精准管理输入大模型的信息。A错在信息过多会引发“迷失在中间”效应，降低准确率并增加成本；C错在其作用于推理阶段而非训练阶段；D错在它与提示词工程相辅相成而非替代。B选项准确指出其目标：在有限的上下文窗口内提供精准、适量的相关信息，从而在模型性能、回答质量与计算成本之间取得最佳平衡。"},{"gid":"60977360-1eb7-4f08-ab0c-c1428824d07a","type":"单选题","q":"上下文工程（Context Engineering）的核心目标是什么？","options":[{"t":"尽可能多地向大模型提供信息以确保回答全面","ok":false},{"t":"为大模型的'上下文窗口'填充恰到好处的信息，引导其完成特定任务","ok":true},{"t":"替代大模型的训练过程，完全依靠上下文生成答案","ok":false},{"t":"优化大模型的参数配置以提高推理速度","ok":false}],"analysis":"答案：B\n\n解析：上下文工程的核心在于“精准”而非“量大”。大模型的上下文窗口有限，填入过多冗余信息（选项A）会导致注意力分散或超出限制；它不能替代模型训练（选项C），也不涉及底层参数优化（选项D）。其真正目标是通过筛选、组织并注入恰到好处的背景知识、指令与示例，高效利用上下文窗口，从而精准引导大模型理解意图并高质量完成特定任务。"},{"gid":"df7f69f9-3fe9-4854-96b9-aaabcb508772","type":"多选题","q":"以下哪些情况可能导致大模型检索不准确？","options":[{"t":"文档中包含大量的图片信息，而当前的文档解析器无法有效提取和理解图片内容。","ok":true},{"t":"使用了基于深度学习的语义搜索引擎，但模型训练数据不足，导致检索结果不准确。","ok":true},{"t":"文档中包含复杂的表格结构，而简单的文本解析器无法理解表格单元格之间的关系。","ok":true},{"t":"使用了复杂的文档解析器，导致解析速度慢，影响检索效率。","ok":false},{"t":"索引构建过程中使用了错误的 embedding 模型，导致语义相似度计算错误。","ok":true},{"t":"文档切片时，仅简单地按照字符长度进行分割，丢失了文档的语义信息。","ok":true}],"analysis":"答案：A、B、C、E、F\n\n解析：大模型检索准确性受数据解析、模型能力及索引构建影响。A、C项图片与表格解析失败会导致关键信息丢失；B项训练数据不足会降低语义理解能力；E项错误的embedding模型直接导致相似度计算错误；F项机械切片会破坏上下文语义。D项解析速度慢仅影响检索“效率”，不影响结果“准确性”，故排除。"},{"gid":"776b6b1c-ee36-4046-82a6-62ff77c21a68","type":"多选题","q":"关于 Qwen-Max、CosyVoice 和 moviepy 的协同使用，以下哪些说法是正确的？","options":[{"t":"CosyVoice 可以将文本转换为音频。","ok":true},{"t":"CosyVoice 的主要功能是视频剪辑。","ok":false},{"t":"moviepy 可以直接将文本转换为视频。","ok":false},{"t":"Qwen-Max 主要用于生成视频字幕。","ok":false},{"t":"moviepy 可以用来获取音频文件的持续时间，用于生成字幕。","ok":true},{"t":"使用这三个工具的典型流程是，Qwen-Max -\u003e CosyVoice -\u003emoviepy。","ok":true}],"analysis":"答案：A、E、F\n\n解析：\nA正确，CosyVoice是语音合成模型，支持文本转音频；B错误，它无视频剪辑功能。\nC错误，moviepy是视频编辑库，不能直接将文本转视频；D错误，Qwen-Max是大语言模型，核心是文本生成与理解，非专门生成字幕。\nE正确，moviepy可获取音频时长以对齐字幕时间轴。\nF正确，典型工作流为：Qwen-Max生成文案，CosyVoice生成配音，moviepy合成最终视频。"},{"gid":"03951946-f92b-49af-8c8b-641e00ebec4c","type":"单选题","q":"多个Agent像开会讨论一样头脑风暴，互相补充、质疑、完善，没有明确领导者。这种协作方式的特点是?","options":[{"t":"有一个总控Agent负责分配任务和汇总结果","ok":false},{"t":"各Agent地位平等，相互激发，共同迭代完善方案","ok":true},{"t":"根据讨论主题把任务路由给最擅长的Agent","ok":false},{"t":"每个Agent只能看到自己的输入，无法获取他人观点","ok":false}],"analysis":"答案：B\n\n解析：题干中“没有明确领导者”直接排除了有总控Agent的A项；“互相补充、质疑”说明Agent间信息完全共享且深度互动，排除了信息隔离的D项和仅做任务路由的C项。这种“头脑风暴”模式的核心是去中心化，各Agent地位平等，通过多轮交流相互激发灵感，共同迭代完善方案，故B项最准确。"},{"gid":"99808b98-30fd-41f9-9d77-31e85e9a71e8","type":"多选题","q":"小李正在使用阿里云百炼大模型服务平台开发一款 AI 语音助手 APP。为了确保 APP 能够顺利上线，小李在开发过程中应注意哪些事项？","options":[{"t":"关注《生成式人工智能服务管理暂行办法》的最新动态，及时调整 APP 的功能和策略。","ok":true},{"t":"在 APP 上线前完成算法备案手续。","ok":true},{"t":"忽略备案要求，尽快上线抢占市场。","ok":false},{"t":"对用户生成的 AIGC 内容进行审核和过滤，避免传播违规信息。","ok":true},{"t":"收集用户数据前需获得用户明确同意，并保障用户数据安全。","ok":true},{"t":"在 APP 中明确告知用户该应用使用了 AIGC 技术。","ok":true}],"analysis":"**答案**：A, B, D, E, F\n\n**解析**：\n开发AIGC应用需严格遵守国家法规。A、B项涉及政策合规与算法备案，是合法上线的前提，C项违规不可取；D项强调内容安全审核，防范违规信息传播；E项符合数据安全与用户隐私保护要求；F项满足AIGC标识与用户告知义务。综上，除C外均为确保APP合规顺利上线的必要事项。"},{"gid":"a0274162-42c3-450e-948e-cc1b6fa96c3b","type":"多选题","q":"在初步构建好大模型应用后，应该对它进行 “自动化评测”，如何理解自动化？","options":[{"t":"自动化的评测指标由大模型制定","ok":false},{"t":"自动化的评测集由大模型生成","ok":false},{"t":"自动化指的是通过引入大模型来减少人为查验的工作方式","ok":true},{"t":"自动化的前提是要有业务专家参与构建评测集","ok":true}],"analysis":"答案：C、D\n\n解析：自动化评测的核心是引入大模型（如LLM-as-a-Judge）或脚本替代人工逐条查验，从而大幅降低人力成本（C正确）。但自动化的前提是具备高质量的评测集和科学的指标，这必须依赖业务专家结合真实场景来构建和定义。若完全交由大模型自行制定指标或生成评测集，会导致评测脱离业务实际（A、B错误，D正确）。"},{"gid":"0de29585-9ff6-4b98-86ab-d0468efcbcea","type":"多选题","q":"某公司正在开发一款智能客服系统，用于为用户提供多语言支持。在处理用户问题时，系统需要准确翻译并解释一些内部非公开的领域术语。为了确保翻译和解释的高准确性，以下哪两个方案能有效解决这一问题？","options":[{"t":"手动整理所有术语及其翻译，并作为提示词提供给模型","ok":true},{"t":"要求模型在遇到未知术语时直接跳过，避免错误翻译","ok":false},{"t":"提供3条术语的翻译示例，依赖模型自行推断其余术语的含义","ok":false},{"t":"通过RAG技术接入该领域术语数据库，动态检索并翻译术语","ok":true}],"analysis":"答案：A、D\n\n解析：A项通过提示词注入术语表，适合术语量较小的场景，能直接约束模型保证准确性；D项利用RAG技术动态检索外部术语库，适合大规模术语，精准提供上下文以避免幻觉。B项跳过术语无法满足翻译解释需求；C项因术语为内部非公开，模型缺乏先验知识，仅靠少量示例无法准确推断。故选AD。"},{"gid":"39660e3c-777a-4340-b8a8-cc3ffd699e2a","type":"多选题","q":"某团队计划为法律咨询场景微调一个大模型。在正式启动微调前，团队需优先评估以下哪三点？","options":[{"t":"通过设计专业法律术语提示词优化输出结果","ok":true},{"t":"使用法律条文数据库构建知识检索增强生成（RAG）系统","ok":true},{"t":"验证现有法律案例数据量是否满足微调的数据规模要求","ok":true},{"t":"采购10块专业显卡用于本地训练","ok":false}],"analysis":"**答案**：A、B、C\n\n**解析**：\n在启动大模型微调前，应遵循“先轻后重”的技术落地原则。首先需评估提示词工程（A）和RAG系统（B）能否以更低成本、更高时效性满足法律咨询需求，避免盲目微调。若确需微调，则必须优先评估法律数据的质量与规模是否达标（C）。D选项过于绝对，算力可通过云租赁解决，且具体显卡数量需依模型规模精确计算，不属于前期优先评估的核心策略。"},{"gid":"61ff8cfc-788a-4b4b-9e36-742ea95a9332","type":"多选题","q":"以下哪三种场景更需要防范AI模型“幻觉”的风险？","options":[{"t":"医疗诊断报告生成系统","ok":true},{"t":"社交媒体趋势话题预测系统","ok":false},{"t":"法律合同条款自动生成器","ok":true},{"t":"教育领域历史知识问答系统","ok":true}],"analysis":"答案：A、C、D\n\n解析：防范AI“幻觉”的核心在于评估错误信息的后果严重性。医疗诊断（A）关乎生命健康，法律合同（C）涉及重大财产与权益，历史问答（D）影响知识准确传承。这三者对事实准确性要求极高，容错率极低。而社交媒体趋势预测（B）本身具不确定性，预测偏差后果较轻，容错率较高。故选ACD。"},{"gid":"bc566446-8b26-4604-acc3-1ee2101de016","type":"多选题","q":"某教育类AI产品出现以下现象，哪些属于“幻觉”风险？","options":[{"t":"将“牛顿三大定律”解释为四条定律","ok":true},{"t":"回答“泰坦尼克号唯一幸存者”时虚构人物","ok":true},{"t":"将古代文言文翻译成现代白话文","ok":false},{"t":"理解作文题意，自动生成800字高考作文","ok":false}],"analysis":"答案：A、B\n\n解析：\nAI“幻觉”指模型生成看似合理但违背事实、无中生有或逻辑错误的信息。A项将“三大定律”说成四条，属于事实性错误；B项虚构幸存者，属于捏造虚假信息，两者均典型体现了幻觉风险。C项文言文翻译和D项自动生成作文，属于AI正常的语言理解与文本生成任务，本身不构成幻觉。因此选AB。"},{"gid":"27d05e0d-168d-4181-9f9a-d9b5ca940497","type":"多选题","q":"在微调模型并使用模型检查点(checkpointing）时，哪些策略可以帮助选择和保存最佳模型？","options":[{"t":"仅保存每个epoch的模型","ok":false},{"t":"当验证准确率提升时保存模型","ok":true},{"t":"保存训练损失最低的模型","ok":false},{"t":"定期保存模型以防训练中断","ok":true},{"t":"保存验证损失最低的模型","ok":true},{"t":"每当模型参数更新时保存","ok":false}],"analysis":"答案：B, D, E\n\n解析：选择最佳模型需基于验证集指标以防过拟合，故验证准确率提升(B)或验证损失降低(E)时保存是核心策略。定期保存(D)是检查点的基础功能，能有效防止中断导致进度丢失。仅按epoch保存(A)不够灵活；依赖训练损失(C)易选出过拟合模型；每次参数更新均保存(F)会严重浪费存储与I/O资源。因此B、D、E为正确策略。"},{"gid":"6b4b4273-f988-476c-b7ab-16c6d2d84273","type":"多选题","q":"在通过Llamalndex创建RAG应用时，以下关于流式输出相比于非流式输出的优势的说法正确的有哪些?","options":[{"t":"能够提升大模型回复的效果","ok":false},{"t":"能够加快大模型回复的速度","ok":false},{"t":"能够给用户带来良好的阅读体验","ok":true},{"t":"如果返回的内容很长可以逐步返回结果，避免超时","ok":true}],"analysis":"**答案：C、D**\n\n**解析：**\n流式输出不改变模型生成逻辑，无法提升回复内容本身的效果（A错）。其核心优势在于：\n1.选项 C 错误，“加快回复速度”表述不准确——流式输出降低的是 首Token延迟（TTFT）感知等待时间 ，但整体生成耗时并未缩短\n2. **提升交互体验**：逐字输出的“打字机”效果能缓解用户等待焦虑，阅读体验更好（C对）；\n3. **防止连接超时**：持续返回数据块可保持网络连接活跃，有效避免长文本生成时因等待过久触发的超时断开问题（D对）。"},{"gid":"f86c4a27-2d8f-4f32-9370-292150c972ae","type":"多选题","q":"在实际工作中，哪些因素可能影响你构建RAG应用的速度？","options":[{"t":"需要更快地捕捉业务机会","ok":true},{"t":"没有时间投入到细节完善中","ok":true},{"t":"模型训练速度","ok":false},{"t":"数据存储需求","ok":true}],"analysis":"**答案：A、B、D\n\n**解析：**\nRAG的核心优势在于无需训练模型即可快速落地。在实际业务中，企业为更快捕捉业务机会（A），通常要求敏捷开发、快速上线；同时受限于项目周期，往往没有时间投入到数据清洗、分块策略等细节完善中（B），这两大业务与时间压力直接影响构建速度与深度。而RAG无需模型训练（排除C），企业需要处理的数据规模、文档格式复杂度（如多模态、复杂表格）以及向量数据库的选型与搭建（如大规模数据的向量化、索引构建和存储架构设计），都会直接影响数据准备和后端基建的搭建周期，进而影响整体构建速度。故选ABD。"},{"gid":"86ebd28d-956f-4b15-a037-94cb580b6c5f","type":"单选题","q":"下列哪项不是向量数据库的主要作用？","options":[{"t":"检索向量数据","ok":false},{"t":"为向量数据构建索引","ok":false},{"t":"训练 Embedding模型","ok":true},{"t":"存储向量数据","ok":false}],"analysis":"答案：C\n\n解析：\n向量数据库的核心功能是存储、管理和检索高维向量数据。选项A（检索）、B（构建索引加速查询）和D（存储）均是其基础作用。而选项C（训练Embedding模型）属于深度学习框架（如PyTorch等）的任务。向量数据库仅负责接收、存储和检索由Embedding模型生成的向量结果，本身不具备训练AI模型的功能。因此，C项不是其主要作用。"},{"gid":"2acd1741-4035-488c-80da-37049c5406b0","type":"单选题","q":"句子窗口检索的优势在于：","options":[{"t":"提高检索阶段的精确性同时，保证了生成阶段的信息完整性","ok":true},{"t":"对大模型的注意力机制进行了针对性改善","ok":false},{"t":"提高大模型生成的速度","ok":false},{"t":"可以降低对数据库存储空间要求","ok":false}],"analysis":"答案：A\n\n解析：句子窗口检索是RAG的优化技术。在检索阶段，它将文档切分为较小的独立句子进行匹配，因小块语义更聚焦，显著提高了检索精确性；在生成阶段，它会将命中句子及其前后的上下文（即“窗口”）一同输入大模型，避免了文本切分导致的语境丢失，保证了生成阶段的信息完整性。该技术不改变模型注意力机制，不提升生成速度，也未降低存储要求。"},{"gid":"2e2291b9-64fb-4a8c-b7c5-6be67c64b913","type":"单选题","q":"在模型训练循环中，哪段代码用于更新模型权重（梯度更新）？","options":[{"t":"loss = criterion(outputs, labels)","ok":false},{"t":"optimizer.step()","ok":true},{"t":"model.train()","ok":false},{"t":"loss.backward()","ok":false}],"analysis":"答案：B\n\n解析：在模型训练循环中，各代码功能如下：A选项用于计算预测值与真实标签的损失值；D选项用于反向传播并计算各参数的梯度；C选项用于将模型切换至训练模式（如启用Dropout）；而B选项`optimizer.step()`则是根据计算出的梯度，实际执行模型权重更新的操作。因此正确答案为B。"},{"gid":"7f811d90-8fbf-446c-9d04-7615ea1d20e8","type":"单选题","q":"top_p (nucleus sampling) 参数的主要作用是什么？","options":[{"t":"控制模型使用的 CPU 核心数量。","ok":false},{"t":"控制模型生成文本的长度。","ok":false},{"t":"控制模型输出的格式。","ok":false},{"t":"控制模型只考虑概率最高的几个词，例如这里设置 0.9，则模型只考虑累积概率前 90% 的词","ok":true}],"analysis":"答案：D\n\n解析：\ntop_p（核采样）是大模型生成文本时的采样策略，用于动态限制候选词范围。当设置 top_p=0.9 时，模型会将候选词按概率降序排列，仅保留累积概率达到 90% 的词集进行采样，舍弃剩余低概率词。这种机制能在保持文本多样性和创造力的同时，有效过滤掉低概率的荒谬或无意义词汇，从而提升生成内容的质量与合理性。"},{"gid":"5af70597-83bd-4b26-b200-fa710dafc884","type":"单选题","q":"以下哪种用法不能有效利用 system 角色提示词？","options":[{"t":"限制模型的输出行为","ok":false},{"t":"设定对话的背景和目标","ok":false},{"t":"直接回答用户问题","ok":true},{"t":"提供特定领域的知识","ok":false}],"analysis":"答案：C\n\n解析：\n`system`（系统）角色提示词主要用于在对话前为模型设定全局上下文，包括设定背景与目标（B）、限制输出行为与格式（A）以及注入特定领域知识或规则（D）。而“直接回答用户问题”是 `assistant`（助手）角色的核心职责。`system` 提示词仅起幕后指导和约束作用，本身不直接作为回答内容输出给用户。因此，C选项不能有效利用 `system` 角色。"},{"gid":"0d0c4260-8e6c-4f19-809c-43d5c2bbeb6c","type":"单选题","q":"根据 “Multi-Agent” 的思想，以下哪种方式更适合处理复杂的 RAG 优化任务？","options":[{"t":"只使用 DashScopeParse 解析文档，其他优化步骤都手动完成。","ok":false},{"t":"根据任务特点，将复杂任务拆分成多个子任务，每个子任务使用不同的模型、prompt 或代码逻辑进行处理。","ok":true},{"t":"将所有任务步骤整合到一个大型 prompt 中，一次调用大模型完成所有处理。","ok":false},{"t":"仅使用通义千问 API 完成所有处理，不使用其他工具。","ok":false}],"analysis":"答案：B\n\n解析：“Multi-Agent”的核心思想是任务拆解与分工协作，由多个具备特定角色或工具的智能体协同解决复杂问题。选项B将RAG任务拆分为子任务，并分配不同的模型、prompt或代码逻辑，完美契合多智能体协同理念。选项A依赖人工，选项C是单智能体单次调用，选项D局限于单一API且无工具扩展，均违背了Multi-Agent的设计初衷。"},{"gid":"253827ea-720a-4773-8434-9912e3ce2736","type":"单选题","q":"以下哪种情况最适合在 “输出的内容安全合规检查” 中处理？","options":[{"t":"用户上传的图片格式不符合要求。","ok":false},{"t":"机器人的回答包含公司内部代码片段。","ok":true},{"t":"用户输入的问题包含辱骂性词汇。","ok":false},{"t":"机器人无法理解用户的问题。","ok":false}],"analysis":"答案：B\n\n解析：\n“输出的内容安全合规检查”旨在过滤系统返回给用户的**输出内容**，防止泄露机密或产生违规信息。\nA项属于输入格式校验；C项针对用户输入，属于“输入安全检查”；D项属于模型理解能力问题。\nB项中机器人的回答（即输出内容）包含内部代码，涉及企业机密泄露风险，正是输出安全合规检查需要拦截和处理的核心场景。因此选B。"},{"gid":"d4c8d5ee-bf65-474d-954c-60d68b1f7b98","type":"多选题","q":"以下哪些代码片段可以用于检测用户输入中是否包含敏感词？","options":[{"t":"pythondef detect_sensitive_words(text, sensitive_words):for word in text.split():if word in sensitive_words:return Truereturn False","ok":true},{"t":"pythondef detect_sensitive_words(text, sensitive_words):return any(word in text for word in sensitive_words)","ok":true},{"t":"pythondef detect_sensitive_words(text, sensitive_words): # added error handlingtry:return any(word in text.lower() for word in [w.lower() for w in sensitive_words])except AttributeError: # in case text is not a stringreturn False","ok":true},{"t":"pythonimport nltkdef detect_sensitive_words(text, sensitive_words):tokens = nltk.word_tokenize(text)return any(token in sensitive_words for token in tokens)","ok":true},{"t":"pythondef detect_sensitive_words(text, sensitive_words):return text in sensitive_words","ok":false}],"analysis":"答案：A, B, C, D\n\n解析：A通过空格分词匹配，适用于英文等；B、C通过子串匹配检测是否包含敏感词，C增加了忽略大小写和异常处理，更健壮；D利用nltk专业分词后匹配。四者均能实现“包含”检测。E判断的是整个输入是否完全等于敏感词，无法检测“包含”关系，故排除。"},{"gid":"35dc5fdf-3cb1-4610-8ed8-656e46ad8cf1","type":"单选题","q":"为缩短响应时延，你想在索引前减少切片数量，每个切片包含 2 - 3 页内容。结果发现，回答容易混进无关信息。导致无关信息的根本原因是什么？","options":[{"t":"文档内没有标题","ok":false},{"t":"切片过大，且主题混杂","ok":true},{"t":"切片过短，信息量不足","ok":false},{"t":"大模型出现故障","ok":false}],"analysis":"答案：B\n\n解析：题目中“每个切片包含2-3页内容”表明切片过大。过大的切片通常会跨越多个段落，导致单个切片内主题混杂。当检索命中该切片时，大模型会将整个切片作为上下文，从而容易把切片内其他不相关的主题信息也提取并混入最终回答中。因此，切片过大且主题混杂是引入无关信息的根本原因。"},{"gid":"0c3f9150-f7d6-4034-9314-2b83c11d3c87","type":"单选题","q":"开发医疗问答系统时发现模型频繁产生 “幻觉”，应优先采取哪种优化组合？","options":[{"t":"降低 LoRA 秩值 + 增大学习率","ok":false},{"t":"增加训练 epoch + 提高相似度阈值","ok":false},{"t":"RAG 增强知识库 + LoRA 微调领域数据","ok":true},{"t":"更换主参微调 + 减少 batch_size","ok":false}],"analysis":"答案：C\n\n解析：医疗问答对准确性要求极高，“幻觉”多因缺乏专业事实依据。RAG（检索增强生成）可引入外部权威知识库，为模型提供实时、准确的事实参考，直接遏制幻觉；LoRA微调则能让模型更好地掌握医疗专业术语与表达范式，提升领域适配度。两者结合既保障了知识准确性，又增强了领域理解力，是解决垂直领域幻觉的最优组合。其他选项易导致过拟合、训练不稳定或成本过高。"},{"gid":"162e2c7a-9799-4d5a-ad21-5086102c3f9f","type":"单选题","q":"你开发了一个 RAG 应用，发现用户经常连续提问（多轮对话），但是当前应用还不支持多轮对话，你应该怎么改造检索步骤来进行适配？\n选项：","options":[{"t":"检索时，先用大模型对历史对话以及用户输入进行总结，生成一个新的 query，然后用新 query 输入向量数据库进行检索；","ok":true},{"t":"检索时，由大模型判断哪些文本段是相关的；","ok":false},{"t":"检索时将历史对话信息输入向量数据库进行检索；","ok":false},{"t":"检索时，将用户的问题输入向量数据库进行检索；","ok":false}],"analysis":"答案：A\n\n解析：在多轮对话中，用户提问常包含指代或省略，直接检索当前问题（D）会因缺失上下文导致召回失败；直接检索历史对话（C）会引入大量噪声；大模型判断文本段（B）属于重排步骤，未解决查询缺陷。选项A采用“查询重写”技术，利用大模型结合历史上下文，将当前问题补全为独立、完整的新Query再进行检索，能有效解决上下文依赖问题，是适配多轮对话的标准方案。"},{"gid":"da2a7bd6-133a-4768-a4f4-aaec2584908b","type":"单选题","q":"在 qwen2.5 - 1.5b 微调训练时，训练损失、验证损失都收敛到较低水平，不再明显波动变化，你应该？","options":[{"t":"模型开始过拟合，应终止训练","ok":false},{"t":"模型处于欠拟合状态，需要继续训练","ok":false},{"t":"训练失败，重新调整训练策略","ok":false},{"t":"训练成功，停止训练并进一步评估其效果","ok":true}],"analysis":"答案：D\n\n解析：\n当训练损失与验证损失均收敛至较低水平且趋于平稳时，说明模型已充分学习数据特征，既无欠拟合（损失偏高），也未过拟合（验证损失反弹）。此时模型达到理想拟合状态，训练成功。继续训练不仅浪费算力，还可能引发过拟合风险。因此，应停止训练，并使用测试集或实际业务指标进一步评估模型的泛化能力与最终效果。"},{"gid":"9b27048e-9608-4395-97ea-f885c007b7e4","type":"单选题","q":"在一次评审会上，大家针对同一条问答的准确性产生分歧，工程师认为回答和问题语义相似度高，业务负责人则认为回答中有错误细节。该争议主要反映了什么？","options":[{"t":"词法分析不完善","ok":false},{"t":"纯粹的向量相似度不足以衡量业务正确性","ok":true},{"t":"检索速度过慢","ok":false},{"t":"大模型对中文支持度不足","ok":false}],"analysis":"答案：B\n\n解析：工程师关注的“语义相似度”通常基于向量检索，而业务负责人关注的“错误细节”指向事实与业务逻辑的准确性。两者的分歧表明，向量相似度只能衡量文本在语义空间的接近程度，无法保证具体业务细节的绝对正确。因此，纯粹的向量相似度不足以全面衡量业务正确性，实际应用中还需结合知识校验或大模型重排等手段来保障细节准确。"},{"gid":"af662c23-c0b5-4382-b0d6-58cf69cdd64a","type":"单选题","q":"技术负责人说”Agent每一步决策质量取决于我们给它提供了什么信息\"，他强调的核心理念是?","options":[{"t":"用更简短的提示词来减少不必要的Token消耗","ok":false},{"t":"让模型根据任务需求自己决定需要什么信息","ok":false},{"t":"通过持续训练让模型学会更多专业领域的知识","ok":false},{"t":"精心组织每一步传递给模型的上下文信息","ok":true}],"analysis":"答案：D\n\n解析：题干强调“我们提供的信息”决定Agent的决策质量，即外部输入的核心作用。A项侧重降本而非提质；B项让模型自主决定，与“我们提供”矛盾；C项侧重模型内部训练，非外部信息输入。D项“精心组织上下文信息”精准契合题意，强调在Agent执行的每一步中，通过人为构建和传递高质量的上下文（Context），来引导和保障大模型做出准确、高效的决策。"},{"gid":"4c69b92e-8b33-4aa3-bc79-d5beafb9dd43","type":"单选题","q":"Agent写的代码声称正确但运行报TypeError，把报错信息发给Agent后它立刻修正了。这说明什么最有效?","options":[{"t":"在提示词里要求Agent输出前先自查","ok":false},{"t":"反复追问Agent让它多想几遍","ok":false},{"t":"把真实的运行结果反馈给Agent","ok":true},{"t":"让另一个更强的模型来检查代码","ok":false}],"analysis":"答案：C\n\n解析：\n题干中Agent在收到“报错信息”（即真实的运行结果）后立刻修正了错误，直接证明了提供客观运行反馈的有效性。大模型写代码时易产生幻觉，自称正确但实际报错。真实的报错信息能提供精准的错误定位和上下文，帮助Agent快速修复问题。相比之下，提示词自查、反复追问或引入其他模型，都不如直接提供真实的运行反馈来得直接、高效。因此选C。"},{"gid":"430134ea-dc4a-4cfc-8ee6-a824d90e743f","type":"单选题","q":"客服系统需判断问题类型:退款转售后组，技术转技术组，投诉转客诉组。如何设计?","options":[{"t":"把三个组合并成一个全能客服组","ok":false},{"t":"让三个组同时处理每个问题，取最快的回复","ok":false},{"t":"先识别问题类型，再路由到对应的组","ok":true},{"t":"按固定顺序让三个组依次处理","ok":false}],"analysis":"答案：C\n\n解析：本题考查系统任务路由设计。业务要求按问题类型精准分发，选项C“先识别再路由”符合专业分工与单一职责原则，能最大化处理效率与服务质量，是标准的策略路由模式。A项取消专业分工，降低专业度；B项并行处理严重浪费人力成本；D项串行处理效率极低且逻辑错误。故选C。"},{"gid":"0e4c6169-b02b-4ccb-a1b0-8a331da282c5","type":"单选题","q":"订票Agent成功率60%，意图识别95%、AP调用98%，但最终确认环节常出错。只看最终指标难定位问题。需要什么评测方式?","options":[{"t":"同时上线新旧两个版本做A/B测试","ok":false},{"t":"把Agent的执行过程拆开，每个步骤单独设置评测指标","ok":true},{"t":"收集更多用户的订票请求样本来扩大测试规模","ok":false},{"t":"给用户发满意度问卷收集反馈","ok":false}],"analysis":"答案：B\n\n解析：题干明确指出“只看最终指标难定位问题”，且已知问题集中在“最终确认环节”。Agent属于多步骤复杂系统，仅看整体成功率会掩盖局部缺陷。选项B采用链路评测思想，将执行过程拆解并为每个步骤设置独立指标，能精准量化和排查特定环节的Bug。A/B测试用于版本效果对比，扩大样本和问卷反馈均无法深入技术链路定位具体步骤问题，故选B。"},{"gid":"acdd18e2-3020-468a-9a13-72be751257fd","type":"单选题","q":"知识库问答机器人上线后，很多应该检索知识库的问题被错误地直接回答了。你应该重点关注哪个指标?","options":[{"t":"用户提问的平均字符长度","ok":false},{"t":"意图识别模块的分类准确率","ok":true},{"t":"模型生成回答的响应延迟","ok":false},{"t":"知识库的文档覆盖率和更新频率","ok":false}],"analysis":"答案：B\n\n解析：题干中“应该检索的问题被错误地直接回答”，说明系统未能正确判断问题是否需要调用知识库，即路由分发或意图判断失误。意图识别模块的核心作用正是将问题准确分类为“直接回答”或“知识库检索”等意图，因此需重点关注其分类准确率。A、C为无关指标；D影响的是检索后的内容质量，而非是否触发检索动作。"},{"gid":"46f1506c-a314-447d-ac4e-5404b6f16d4a","type":"单选题","q":"一家SaaS公司提供LLM推理服务。为满足高级别安全合规，必须技术性地阻止拥有主机root权限的员工访问运行时数据，并向客户提供一份由硬件生成的、可远程验证的加密报告以证明环境完整性。要实现此目标，哪项技术是不可或缺的?","options":[{"t":"基于硬件的可信执行环境(TEE)及其远程证明机制。","ok":true},{"t":"对服务器物理内存中的数据进行硬件级保护。","ok":false},{"t":"在操作系统底层实时监控并拦截异常操作。","ok":false},{"t":"采用极其复杂的数学算法对计算过程全程加密。","ok":false}],"analysis":"答案：A\n\n解析：题目核心需求是“防root访问”与“硬件级远程验证”。可信执行环境（TEE）通过硬件级内存隔离，确保拥有root权限的员工也无法读取运行时数据；其远程证明机制可生成硬件签名的加密报告，供客户验证环境完整性。B项缺失远程证明，C项软件监控无法防范root权限，D项纯数学算法无法提供硬件证明报告。故A项不可或缺。"},{"gid":"d335282a-1876-41a1-986d-b5654438961e","type":"多选题","q":"改用Function Caling接口后，和原来手动解析JSON的方式相比有什么好处","options":[{"t":"不需要在提示词里描述JSON格式要求，接口会自动处理","ok":true},{"t":"服务商接口内置了重试和错误处理，开发者代码更简洁","ok":false},{"t":"不需要给模型提供任何工具说明，它自己就知道有哪些工具","ok":false},{"t":"模型输出的工具调用格式更稳定，减少解析失败","ok":true}],"analysis":"答案：A、D\n\n解析：\nA正确：通过API参数（如tools）定义工具，无需在Prompt中手写繁琐的JSON格式约束，接口自动处理。\nD正确：模型经专门微调，输出的调用格式高度标准化，显著降低JSON解析失败率。\nB错误：接口不内置业务逻辑的重试与错误处理，仍需开发者编写代码处理异常。\nC错误：模型无法凭空知晓工具，必须通过API显式提供工具的名称、描述及参数说明。"},{"gid":"13385c62-7cb6-4862-91bb-584a103ef591","type":"多选题","q":"关于文档处理系统工作流模式的选择，以下哪些描述正确?","options":[{"t":"任务之间存在数据依赖(如后续步骤需前序结果)应该并行执行","ok":false},{"t":"步骤有依赖关系(如先翻译再排版)应该用流水线模式","ok":true},{"t":"根据文档类型走不同逻辑(如合同和论文)应该用分支选择","ok":true},{"t":"任务相互独立(如语法检查和格式检查)应该并行执行","ok":true}],"analysis":"答案：B、C、D\n\n解析：\nA错误：存在数据依赖的任务必须串行执行，无法并行。\nB正确：流水线模式适用于步骤间有严格先后依赖（如先翻译后排版）的场景。\nC正确：分支选择模式可根据条件（如文档类型）动态路由至不同的处理逻辑。\nD正确：相互独立的任务无数据依赖，并行执行可大幅提升系统处理效率。\n工作流设计需依据任务的依赖关系、条件判断及独立性来合理选择执行模式。"},{"gid":"4746be1a-5f66-4472-b63c-d5f31a43efbb","type":"多选题","q":"固定工作流Agent升级为能主动推荐替代选项的智能Agent，需要具备哪些能力?","options":[{"t":"在执行过程中根据实际情况灵活调整下一步","ok":true},{"t":"当某个API调不通时能想办法用其他方式获取信息","ok":true},{"t":"理解用户真正想要的是\"订到合适的机票\"而非执行固定步骤","ok":true},{"t":"收集更多的用户反馈，将所有可能出现的分支情况都补充进预设规则库中","ok":false}],"analysis":"答案：A、B、C\n\n解析：智能Agent的核心是从“规则驱动”升级为“目标驱动”。C项体现了对用户真实意图的深度理解；A、B项展现了动态规划、灵活调整及异常容错能力，能主动生成替代方案。D项依赖穷举预设规则，本质仍是传统固定工作流的僵化思维，缺乏自主决策与泛化能力，故排除。"},{"gid":"4feede6e-00ee-4f5d-90d1-9f15c6963e7f","type":"多选题","q":"通过 Llamaindex 创建 RAG 应用，这段代码有哪些问题？pythonquery_engine = index.as_query_engine(similarity_top_k=3,streaming=True,node_postprocessors=[DepthScopeRank(top_n=8, model=\"gte-rerank\"),SimilarityPostprocessor(similarity_cutoff=1)])response = query_engine.retrieve(\"需求分析使用的工具是什么？\")response.print_response_stream()","options":[{"t":"query_engine 不支持 retrieve","ok":true},{"t":"重排选中的 chunk 数大于初步召回的 chunk 数","ok":true},{"t":"相似度阈值设置过高","ok":true},{"t":"Llamaindex在 RAG 回答时不可以使用流式输出","ok":false}],"analysis":"答案：A、B、C\n\n解析：\nA正确：生成回答应使用`query()`方法，`retrieve()`仅返回检索节点列表，不支持`print_response_stream`。\nB正确：初步召回`top_k=3`，而重排`top_n=8`，重排选取数不能大于初步召回数。\nC正确：相似度阈值`cutoff=1`要求向量完全匹配，设置过高会导致节点被全部过滤。\nD错误：LlamaIndex的QueryEngine完全支持通过`streaming=True`进行流式输出。"},{"gid":"1b30bd5e-f721-42fa-a628-18b89fe36d23","type":"多选题","q":"以下哪些描述符合基于语义的文档切片的理念？","options":[{"t":"使用机器学习模型对文档进行语义分析，并根据语义边界进行切分。","ok":true},{"t":"在 Chunk 中添加上下文信息，例如标题、父级列表项等。","ok":true},{"t":"将代码模块单独切出来，并标注其编程语言。","ok":true},{"t":"将文档按照固定长度进行切分。","ok":false},{"t":"将表格的每个单元格作为一个独立的 Chunk。","ok":false},{"t":"根据文档的结构，例如标题、段落、列表等进行切分","ok":true}],"analysis":"**答案**：A, B, C, F\n\n**解析**：\n基于语义的文档切片核心理念是**保持内容的语义完整性**，避免机械截断。A通过模型识别语义边界直接切分；B通过补充上下文增强切片的独立语义；C按模块切分代码并标注语言，保留了代码的逻辑语义；F利用标题、段落等结构切分，顺应了作者组织语义的逻辑。D（固定长度）和E（单元格独立切分）会生硬破坏文本与表格的整体语义，故不符合。"},{"gid":"96243175-413f-4d1f-a2fd-ba385ed906c9","type":"多选题","q":"下列关于将AgentModule类设计为基类的原因，正确的有哪些?pythonclass AgentModule():def __init__(self, name: str, description: str):self.name = nameself.description = description def __call__(self, query:str):return self.query(query) def query(self, query:str):pass","options":[{"t":"简化子类中的构造函数，减少重复代码","ok":true},{"t":"由于 Python 不支持多重继承，因此需要这样设计","ok":false},{"t":"允许每个子类定义自己的 query 方法，增加灵活性","ok":true},{"t":"作为一个基类，可以方便地隐藏私有属性，保护数据","ok":false},{"t":"提供统一的 call 方法以便通过相同的方式调用所有子类","ok":true},{"t":"使得多个不同的代理模块可以共享相同的接口，实现代码复用","ok":true}],"analysis":"**答案**：A、C、E、F\n\n**解析**：\nA正确：基类封装通用初始化，子类继承可避免重复代码。\nB错误：Python原生支持多重继承。\nC正确：基类预留`query`方法，子类可重写以实现特定逻辑。\nD错误：隐藏私有属性依赖双下划线命名机制，与是否为基类无关。\nE正确：基类实现`__call__`，使所有子类实例能像函数一样被统一调用。\nF正确：基类定义标准接口，确保不同模块具有一致性，实现代码复用。"},{"gid":"e1bcd6a8-9400-4e7a-9c25-3110afb22cbe","type":"多选题","q":"关于大模型在文本处理中的局限性，以下哪些陈述是准确的？","options":[{"t":"即使有合适的系统提示词，大模型生成的内容仍需人工复审以保证质量。","ok":true},{"t":"大模型技术已经完全成熟，能够无差错地执行所有文本转换和润色任务。","ok":false},{"t":"大模型可能在处理特定领域专业术语时出现误解。","ok":true},{"t":"大模型对用户查询的依赖性强，如果查询表述不清，结果可能偏离预期。","ok":true},{"t":"在没有明确指示的情况下，大模型可能无法自动识别源语言和目标语言。","ok":true}],"analysis":"**答案**：A, C, D, E\n\n**解析**：\n大模型尚未完全成熟，存在“幻觉”且无法保证绝对无错（B错），故生成内容仍需人工复审（A对）。受训练数据限制，它易误解垂直领域的生僻专业术语（C对）。模型输出高度依赖提示词质量，表述不清会导致结果偏离预期（D对）。此外，在处理短文本、混合语言或复杂语境时，若无明确指令，模型可能无法准确识别源语言和目标语言（E对）。"},{"gid":"7bed5ce5-4e5c-4ff4-9adc-36c84a44ae67","type":"多选题","q":"在下面的代码片段中，哪些是微调大语言模型训练循环中必要的步骤？","options":[{"t":"model.train ()","ok":true},{"t":"loss = criterion (predictions, targets)","ok":true},{"t":"predictions = model (inputs)","ok":true},{"t":"optimizer.step ()","ok":true},{"t":"optimizer.zero_grad ()","ok":true},{"t":"loss.backward ()","ok":true}],"analysis":"**答案**：A, B, C, D, E, F\n\n**解析**：\n微调大模型的标准训练循环需完成完整的参数更新闭环。A设置训练模式以启用Dropout等机制；C前向传播获取预测值；B计算预测与标签的损失；E清空历史梯度防止累加；F反向传播计算梯度；D更新模型参数。此六步构成了单次迭代的核心逻辑，缺一不可。"},{"gid":"ba690e83-062c-4497-86cd-79ce130e4cdb","type":"单选题","q":"以下哪种做法不符合利用大模型提升开发效率的思路？","options":[{"t":"对于所有类型的图片，都使用视觉模型进行深层次解析，以确保信息的完整性。","ok":true},{"t":"使用 DashScopeParse 解析文档，而不是自己编写复杂的解析逻辑。","ok":false},{"t":"将复杂的文档处理任务拆分成多个子任务，分别使用不同的模型或工具处理。","ok":false},{"t":"对于简单的文本替换操作，使用正则表达式而不是调用大模型 API。","ok":false}],"analysis":"答案：A\n\n解析：利用大模型提升效率需兼顾成本与性能。A项对“所有”图片均做“深层次”视觉解析，会导致算力浪费、成本激增和响应延迟，违背了按需调用的降本增效原则。B项使用现成工具避免重复造轮子；C项拆解任务以发挥不同工具优势；D项对简单任务用正则处理，避免大模型的不必要开销。B、C、D均符合提升效率的最佳实践。"},{"gid":"5c9e5195-af7d-47ab-866e-c28017f8591a","type":"单选题","q":"要将索引持久化到磁盘，应使用以下哪个方法？","options":[{"t":"index.store()","ok":false},{"t":"index.persist()","ok":false},{"t":"index.save()","ok":false},{"t":"index.storage_context.persist()","ok":true}],"analysis":"正确答案：D\n\n**解析：**\n本题考查LlamaIndex框架中索引的持久化操作。在LlamaIndex中，构建的索引默认存在于内存中。为在程序重启后复用索引以避免重新计算，需将其持久化到磁盘。标准做法是调用索引的`storage_context`属性下的`persist()`方法（即`index.storage_context.persist()`），通常还会通过`persist_dir`参数指定保存路径。选项A、B、C均非该框架的标准持久化方法。"},{"gid":"95f46dcd-2c3a-4361-8e00-7f84bb3cd534","type":"单选题","q":"大模型如何判断什么时候应该停止输出？","options":[{"t":"只会在输出长度达到阈值时停止","ok":false},{"t":"需要用户手动打断","ok":false},{"t":"在输出长度达到阈值，或输出特殊 Token（如，end of sentence，即句子结束标记）","ok":true},{"t":"当模型检测到生成内容与输入主题无关时自动停止","ok":false}],"analysis":"**答案：C**\n\n**解析：**  \n大模型停止输出的机制主要依赖两种条件：一是达到预设的最大输出长度阈值，防止无限生成；二是生成特殊Token（如`\u003ceos\u003e`，即句子结束标记），表示内容自然结束。选项A和B仅覆盖单一情况，不全面；选项D的“主题无关”并非标准停止机制，模型无法实时判断语义相关性。因此，C正确，涵盖了长度限制和语义结束两种核心停止条件。"},{"gid":"0dfbc350-7709-4c1f-8ff7-b9de3ab06c0a","type":"单选题","q":"你正在基于某视觉理解大模型开发一个门店巡检系统（检查垃圾桶是否盖好、操作是否整洁、水池是否洗干净等），但发现用大模型同时识别判断场景、给出判断结果的效果总是不好，以下哪种改进方案能更低成本地解决这一问题？","options":[{"t":"增加更多的监控摄像头，给大模型更多的输入信息","ok":false},{"t":"收集一批高质量的监控画面数据，面向巡检任务微调大模型","ok":false},{"t":"改进当前的数据输入，减少监控画面的分辨率，避免引入干扰信息","ok":false},{"t":"用物体分割小模型圈出识别区域，然后抠图输入给大模型检测状态","ok":true}],"analysis":"答案：D\n\n解析：大模型同时处理“目标定位”与“状态判断”认知负担重，易出错。D选项采用“小模型定位+大模型判断”的级联方案，小模型推理成本极低，抠图后大模型仅需做单一状态分类，大幅降低任务复杂度，提升准确率且无需高昂的微调算力，成本最低。A增加硬件成本；B微调的数据与算力成本极高；C降低分辨率会丢失关键细节，适得其反。"},{"gid":"520bf667-e607-4fae-804c-d75c0c3798a1","type":"单选题","q":"某企业需要部署一个大模型，不定期自动地分析现有的产品文档，并产出改进建议，以下哪一种计费方式可以在满足业务需求的同时最大化降低运行成本？：","options":[{"t":"通过按量付费方式创建 GPU 资源","ok":false},{"t":"使用抢占式实例（Spot Instance），同时设计好任务中断的自动恢复机制","ok":true},{"t":"购买显卡并搭建本地服务器","ok":false},{"t":"通过预付费（包年包月）方式创建 GPU 资源","ok":false}],"analysis":"答案：B\n\n解析：该业务属于“不定期”执行的后台任务，对实时性要求低且允许中断。抢占式实例利用云平台闲置算力，价格远低于按量付费和包年包月，可最大化降低成本。配合中断自动恢复机制，能完美规避实例被回收的风险。相比之下，本地服务器初期投入大且闲置率高；包年包月和按量付费对于不定期任务会造成资源浪费或成本偏高，无法实现成本最优化。"},{"gid":"c77b5cd2-9f9c-4e17-9e0b-35febc6ae72b","type":"单选题","q":"你需要在资源受限的环境下部署一个大模型，以下哪种方案有助于你减少对显存的需求？","options":[{"t":"知识蒸馏，训练一个更小参数量的模型","ok":true},{"t":"扩大允许的输入 Token 长度","ok":false},{"t":"微调现有模型，改善其效果","ok":false},{"t":"提高模型批量任务的数量","ok":false}],"analysis":"答案：A\n\n解析：大模型显存占用主要来自模型参数、激活值和KV Cache。选项A通过知识蒸馏减小模型参数量，能直接且显著降低模型权重及推理时的显存开销。相反，选项B（扩大Token长度）和选项D（提高批处理数量）均会增加激活值与KV Cache的显存占用；选项C（微调）不改变模型大小，无法减少显存需求，全参微调反而会增加额外显存开销。故选A。"},{"gid":"843509ba-2f54-4a64-b7da-1cc8171312da","type":"单选题","q":"使用 LoRA 微调时，训练损失波动剧烈，以下哪种策略有可能解决这一问题？","options":[{"t":"继续训练，无须调整","ok":false},{"t":"把 batch_size 从 16 调到 4","ok":false},{"t":"将 lora_rank 从 8 提升到 32","ok":false},{"t":"将学习率降低至原来的 10 分之一","ok":true}],"analysis":"答案：D\n\n解析：训练损失波动剧烈通常由学习率过大引起，导致参数更新步长过大，在极小值附近反复震荡。将学习率降低至原来的1/10可减小更新步长，使优化轨迹更平滑，有效缓解波动。反之，减小batch_size（选项B）会增加梯度方差，加剧震荡；提升lora_rank（选项C）仅增加模型容量，无助于优化稳定性；盲目继续训练（选项A）可能导致模型发散。故选D。"},{"gid":"c3348e39-4440-417c-80c4-3bc11efc7a1c","type":"单选题","q":"你准备为企业内部人事系统搭建一个多轮问答功能，现有历史对话 “张三的办公楼在哪？”，在 A 轮 “他的主管是谁？”，你应该怎么设计检索步骤？","options":[{"t":"对 “主管” 进行同义词扩展，包含 “领导”、“上级” 等，提高召回率","ok":false},{"t":"提高检索的相似度阈值，确保不包含无用信息","ok":false},{"t":"混合使用关键词检索与向量检索策略","ok":false},{"t":"结合对话历史改写 query，再进行检索","ok":true}],"analysis":"答案：D\n\n解析：在多轮对话中，当前Query“他的主管是谁？”包含指代词“他”，直接检索会因语义缺失导致召回失败。多轮问答检索的核心是解决上下文依赖，必须先进行指代消解与Query改写，将“他”替换为历史中的“张三”，生成完整Query“张三的主管是谁？”后再检索。A、B、C项均为单轮检索的常规优化手段，未解决多轮指代问题，故选D。"},{"gid":"479db9f5-d4f7-4363-97ce-f795e222e15f","type":"单选题","q":"在 qwen2.5 - 1.5b 模型微调时，训练损失快速震荡甚至开始上升，说明模型当前处于？","options":[{"t":"过拟合","ok":false},{"t":"训练成功","ok":false},{"t":"训练失败","ok":true},{"t":"欠拟合","ok":false}],"analysis":"答案：C\n\n解析：在模型微调时，训练损失快速震荡或上升表明模型无法有效收敛，属于典型的**训练失败**。这通常由学习率设置过大、梯度爆炸或数据异常引起。作为对比，过拟合表现为训练损失下降而验证损失上升；欠拟合是损失下降缓慢且停滞在高位；训练成功则需损失平稳下降。因此，损失震荡或上升直接说明当前训练失败。"},{"gid":"dc394f58-28b5-4c81-b1c3-f7ce34e28dfd","type":"多选题","q":"下列哪些因素会影响大语言模型微调的效果？","options":[{"t":"是否采用数据增强技术","ok":true},{"t":"计算资源的限制","ok":true},{"t":"微调数据的质量和数量","ok":true},{"t":"预训练模型的选择","ok":true},{"t":"微调持续的轮数（epochs）","ok":true},{"t":"微调时使用的超参数设置","ok":true}],"analysis":"**答案**：A, B, C, D, E, F\n\n**解析**：\n大模型微调效果受多因素综合影响。预训练模型(D)决定能力上限；数据质量、数量(C)及数据增强(A)决定模型学到的知识分布。训练中，超参数(F)和微调轮数(E)关乎模型收敛状态，不当易致过/欠拟合。此外，计算资源限制(B)会制约批次大小和微调策略(如全参或LoRA)的选择，间接影响效果。故全选。"},{"gid":"86a6e247-a30e-43d1-990a-9e7e9bb0d6de","type":"多选题","q":"用户反馈你开发的客服机器人连续返回乱码，排查发现：1.用户语音已经成功上传网络存储，2.调用语音理解服务后日志显示「模型解析失败」，3.独立部署的模型服务的监控显示QPS突增500%，哪些项是可能的原因？","options":[{"t":"前端生成的语音文件格式与模型期望不匹配","ok":false},{"t":"模型在高并发下过载，处理能力达到上限","ok":true},{"t":"突增请求中包含大量触发模型Bug的异常音频","ok":true},{"t":"语言模型未针对专业术语做优化意图理解，准确率低","ok":false}],"analysis":"**答案：B、C**\n\n**解析：**\n核心线索是“乱码/解析失败”与“QPS突增”。\nB项：QPS突增导致模型高并发过载，处理能力达上限，易引发内存错乱或响应截断，导致乱码和解析失败。\nC项：大量异常音频请求会引发QPS突增，同时触发模型未知Bug，导致解析失败并输出乱码。\nA项格式不匹配通常直接报错拒收，且不直接导致QPS突增；D项准确率低不会引发乱码和系统级解析失败。故选BC。"},{"gid":"eca98299-8e3c-4d43-a8eb-3e7f0389a450","type":"多选题","q":"一家智能家居公司重新设计空调控制面板，需优化老年人使用体验。下列哪些改进符合交互设计原则？","options":[{"t":"模式切换时，联机播放防寒保暖的保健品广告或夏季登山潜水旅游好去处","ok":false},{"t":"待机界面显示放大版时钟，右上角固定显示空气质量指数，超过警戒值自动弹出红色警示框","ok":true},{"t":"将温度调节按钮放大，每次操作伴随“嘀”声反馈，持续按住按钮时数值变化速度逐渐加快","ok":true},{"t":"增加语音唤醒词，识别成功时面板呼吸灯闪烁","ok":true}],"analysis":"答案：B、C、D\n\n解析：\nA项播放广告干扰核心任务，违背避免干扰原则。B项放大时钟适配老年人视力，红色警示提供清晰环境反馈；C项放大按钮降低操作难度，声音与长按加速提供多感官反馈并提升效率；D项语音交互弥补触控不便，呼吸灯给予明确视觉状态反馈。B、C、D均遵循可见性、反馈及适老化原则，有效提升体验。"},{"gid":"0f542f83-1b00-459d-a396-0de2bc41414c","type":"多选题","q":"某顶尖医院计划开发一个“多模态肺癌风险筛查辅助系统”，目标是高精度地识别潜在的早期病灶，并对医生报告中可能存在的描述与影像不符之处进行高亮提示，准确性、可解释性和安全性是最高优先级。为了构建一个在临床上高度可靠、值得信赖的系统，你会采用哪些关键技术或设计?","options":[{"t":"为了快速提升模型泛化能力，参考ImageNet，需要大量获取互联网上公开的肺部影像数据集，与医院内部数据集直接合并进行训练。","ok":false},{"t":"采用多模态模型，输入丰富的各类医疗检测数据，端到端一次性输出风险评分和修正报告。","ok":false},{"t":"设计一个基于多智能体的“审核”流程:-个 Vision Agent 分析影像，一个 TextAgent 分析报告，一个Clinical Agent 参照权威医学知识库(如 UMLS)对前两者的发现进行交叉验证。","ok":true},{"t":"图像理解模型在输出“是否存在病灶”的结论时，可以同步生成注意力图(Attention Map)，在CT影像上标示出判断依据的区域。","ok":true}],"analysis":"**正确答案：C、D**\n\n**解析：**\nA项直接合并互联网数据存在隐私泄露、数据噪声及域偏移风险，违背安全与准确性；B项端到端黑盒模型缺乏可解释性，直接修正报告医疗风险极高；C项采用多智能体交叉验证并引入权威医学知识库，有效保障系统的准确性与安全性；D项通过注意力图可视化病灶区域，直观展示模型决策依据，满足高可解释性要求。因此选C、D。"},{"gid":"aa7a7e00-8767-42dc-b02e-3e7037476044","type":"多选题","q":"一家 A应用可以辅助有关部门制作案情推演材料，通过融合文档片段与证物照片来生成图文并茂的案情摘要。为确保交付给客户的产出是专业且负责任的，以下哪些流程是强制性的?","options":[{"t":"将 AI生成的内容提交给另一个知名的开源通用大模型进行事实核查。","ok":false},{"t":"对模型训练的案情资料进行彻底的、不可逆的匿名化和脱敏处理。","ok":true},{"t":"所有 AI生成的摘要在交付前，需交由人类法律专家进行审核确认。","ok":true},{"t":"为 AI生成的每一项关键事实建立可溯源机制，明确链接原始证物","ok":true}],"analysis":"**答案：B、C、D**\n\n**解析：**\nA错误：大模型存在“幻觉”，用AI核查AI无法保证司法事实的绝对准确。\nB正确：案情资料涉密且敏感，训练前必须彻底脱敏以保障数据隐私与安全。\nC正确：司法材料事关重大，必须落实“人类在环”机制，由专家审核把关以确保专业合法。\nD正确：建立证据可溯源机制能有效防止AI捏造，确保结论有据可查，是司法AI应用的核心合规要求。"},{"gid":"6cf9d26b-dc41-497a-bc47-d613922a38fe","type":"多选题","q":"通过 LlamaIndex 创建 RAG 应用，在修改默认 prompt 时，包含以下哪些步骤？","options":[{"t":"定义新的 prompt 字符串，将 chunk 和 query 的位置空出来","ok":true},{"t":"使用新的 prompt 初始化一个 PromptTemplat对象","ok":true},{"t":"对新的 prompt 进行保存，使得 LlamaIndex 中的源代码 prompt 也变成中文","ok":false},{"t":"用 index 的 update_prompts 方法将新的 prompt 同步上去","ok":true}],"analysis":"**答案**：A, B, D\n\n**解析**：\n在LlamaIndex中修改默认prompt的标准流程为：首先定义包含占位符（对应chunk和query）的新prompt字符串（A）；接着使用 `PromptTemplate` 将其封装为模板对象（B）；最后通过 `update_prompts` 方法将新模板同步更新到索引或查询引擎中（D）。框架支持运行时动态替换，无需且不应修改底层源代码（C错误）。"},{"gid":"6aa1aad3-20d8-4798-a4bb-bc04cab172fe","type":"多选题","q":"有关输出格式要素的描述，以下哪项是正确的？","options":[{"t":"输出格式不影响大模型的应答","ok":false},{"t":"不需要明确不期望输出的内容","ok":false},{"t":"可使用案例来提示大模型的输出","ok":true},{"t":"应明确指出枚举值的范围","ok":true},{"t":"明确提供要输出的内容类型","ok":true},{"t":"无需结合样例来明确输出格式","ok":false}],"analysis":"答案：C、D、E\n\n解析：输出格式直接影响大模型应答质量（A错），明确不期望的内容可减少冗余（B错），结合样例是规范格式的高效手段（F错）。正确做法为：使用案例提示模型以规范输出（C对）；明确枚举值范围以防模型越界或产生幻觉（D对）；清晰指定输出的内容类型（如JSON、列表等）以确保结果结构化（E对）。"},{"gid":"43545018-e38e-4c65-98f6-766f3414bcfc","type":"多选题","q":"以下哪些选项是把 DASHSCOPE_API_KEY 配置为环境变量的原因？","options":[{"t":"防止 KEY 泄漏","ok":true},{"t":"配置为环境变量可以减少代码的行数。","ok":false},{"t":"环境变量会自动被 SDK 读取和使用。","ok":true},{"t":"环境变量可以加快程序的运行速度。","ok":false}],"analysis":"**答案**：A、C\n\n**解析**：\n将 `DASHSCOPE_API_KEY` 配置为环境变量的核心原因是**安全**与**便捷**。\n1. **防止泄漏（A）**：避免将敏感密钥硬编码在代码中，防止代码提交到版本库或开源时造成密钥泄露。\n2. **SDK自动读取（C）**：DashScope SDK 默认会自动从环境变量中读取该 Key，无需在代码中手动传参，简化了开发配置。\n环境变量既不能实质性减少代码行数（B），也无法提升程序运行速度（D），故排除。"},{"gid":"6b2c8404-4674-41b7-be7f-4b266d56d06f","type":"多选题","q":"在进行 RAGAS 评测时，使用通过自定义 API 封装的 langchain LLM 对象主要有哪些优点？","options":[{"t":"可以在 API 中定义 langchain LLM 类中不支持指定的参数","ok":true},{"t":"由于 langchain 官方封装好的模型有限，因此通过自定义方法选择更多模型","ok":true},{"t":"可以打印出中间结果，帮助评测人员了解分数来源","ok":true},{"t":"无需输入 API Key 即可使用大模型","ok":false}],"analysis":"答案：A、B、C\n\n解析：\nA正确：自定义封装能灵活传递LangChain原生类不支持的特定参数或请求头。\nB正确：突破官方库限制，可自由接入私有部署、小众或最新的大模型。\nC正确：便于在请求和响应链路中拦截并打印中间结果（如Prompt和原始返回），辅助调试与分数溯源。\nD错误：是否需要API Key取决于模型服务提供方本身，与是否采用自定义封装无关。"},{"gid":"cc08a186-9a2b-4d7a-9533-071b24c0159a","type":"单选题","q":"大模型评判回答质量时，简洁回答总比冗长回答得分低，但人工评审认为前者更好。如何解决?","options":[{"t":"换一个参数量更大的模型，期望判断更接近人类","ok":false},{"t":"用人工评审建立黄金测试集，定期校准大模型的评分标准","ok":true},{"t":"让大模型对同一内容多评几次，取平均分","ok":false},{"t":"在评分前对所有回答做标准化处理，统一删减到相同长度","ok":false}],"analysis":"答案：B\n\n解析：大模型评估时普遍存在“长度偏见”，即盲目偏好长文本。A项更大参数模型未必能消除此系统性偏见；C项多次评分取平均无法纠正系统性偏差；D项强行删减会破坏文本原有语义。B项通过人工评审建立黄金测试集，能有效对齐人类偏好，定期校准并纠正大模型的评分标准，是解决此类评估偏差最科学有效的方法。"},{"gid":"d99856b7-ae12-4fe1-85cb-6b129ca4c597","type":"单选题","q":"测试时发现，RAG 应用的答案中仍包含大量无用细节，导致阅读困难。哪种做法可以最直接地减少无关细节？","options":[{"t":"在检索后用 ReRank 且设置更小的 Top N","ok":true},{"t":"把索引文件放进 Redis 数据库","ok":false},{"t":"增加大模型的 “max_tokens”","ok":false},{"t":"强制用户只提简单问题","ok":false}],"analysis":"答案：A\n\n解析：RAG答案含大量无用细节，多因检索了过多低相关性上下文。选项A使用ReRank（重排序）对初检结果精准打分，并设置更小的Top N（仅保留最相关的少量文档），能直接从源头过滤无关信息，减少输入大模型的冗余上下文。选项B仅改变存储介质；选项C增加max_tokens会使回答更长，适得其反；选项D限制提问不切实际且治标不治本。故A最直接有效。"},{"gid":"adeccea4-e04b-4a14-a3cf-8891248c46db","type":"单选题","q":"某大模型客服系统被攻击者通过提示词注入获取知识库元数据，以下哪个措施能更有效防范这一问题？\n选项：","options":[{"t":"改进提示词，确保模型在回答问题时避免回答列表形式的内容","ok":false},{"t":"改进提示词，让大模型避免回答这类问题","ok":false},{"t":"改进提示词，并且在输入阶段过滤无数据 “关键词","ok":false},{"t":"在知识库检索前严格限制应用的数据访问权限，避免泄露公开信息","ok":true}],"analysis":"答案：D\n\n解析：防范提示词注入获取敏感数据，单纯依赖提示词限制（A、B）或简单的关键词过滤（C）极易被同义词、编码等方式绕过，治标不治本。选项D从系统架构层面出发，遵循最小权限原则，在检索前严格隔离并控制数据访问权限。这样即使攻击者成功绕过提示词限制，也无法越权读取知识库元数据，是从根本上防范数据泄露的最有效手段。"},{"gid":"a0efa61a-e754-4890-a057-5c77148cf852","type":"单选题","q":"RAG 系统在回答时，返回了多位同名员工的信息，无法区分他们，最合理的改进方式是什么？","options":[{"t":"在检索前自动补充标签，例如 “姓名：张伟（IT 部）”","ok":true},{"t":"简单将 “张伟” 替换成 “张伟唯一”","ok":false},{"t":"大幅提高大模型的温度","ok":false},{"t":"默认检索 100 条切片，手动让用户筛选","ok":false}],"analysis":"答案：A\n\n解析：RAG系统处理同名实体混淆的核心是提升数据区分度。选项A通过补充部门等标签进行实体消歧，使检索与生成更精准，是最合理的方案。选项B篡改姓名脱离实际业务；选项C提高温度会增加大模型幻觉，无助于事实准确性；选项D让用户手动筛选严重破坏自动化体验，违背RAG初衷。故选A。"},{"gid":"490da97c-9064-4fd1-afa3-57b3661806c6","type":"单选题","q":"你在用大模型解答这个题：“一口 10 米的井，蜗牛从井底向上爬，每个白天向上爬 3 米，每晚滑下 2 米。请问蜗牛需要多少天能爬出这口井？”。以下哪种提示方法可以提升大模型的解答准确率？","options":[{"t":"要求大模型使用平均速度计算总天数","ok":false},{"t":"要求大模型在生成时解释逻辑推导过程","ok":true},{"t":"要求大模型直接输出最终结果","ok":false},{"t":"要求大模型面临陷阱时进行解答","ok":false}],"analysis":"答案：B\n\n解析：蜗牛爬井是经典逻辑陷阱题，大模型易直接套用公式算错。选项B运用了“思维链（CoT）”提示技术，引导模型逐步拆解问题并展示推导过程，能有效避免直觉错误，显著提升准确率。选项A会引入错误算法，选项C剥夺了思考过程反而易错，选项D表述模糊且不如CoT直接有效。故选B。"},{"gid":"8633fd0b-b778-419c-9009-c676c68d687b","type":"单选题","q":"你希望用户在向你的大模型应用提问 “我想预约医生” 时，能主动追问必要信息（如科室、时间），以下哪种提示词设计能更好地实现这一效果？","options":[{"t":"你是一个细心的医疗客服。注意每次回复后必须追加一个问题，例如请问需要补充什么信息？","ok":false},{"t":"你是一个医疗客服。对于预约就诊类问题，如果用户未说明就诊科室、预约时间，应向用户追问，如果是其他咨询，则正常回答。","ok":true},{"t":"你是一个医疗客服。如果用户的请求不完整，请追问所有可能缺失的信息（如科室、时间、症状描述、保险类型等）。","ok":false},{"t":"你是一个医疗客服。如果用户的请求不足以完成预约，请主动追问。","ok":false}],"analysis":"正确答案：B\n\n解析：B选项明确了触发场景（预约就诊）和具体缺失的必要信息（科室、时间），指令清晰且边界明确，能精准引导模型收集信息。A选项过于死板且未指明具体信息；C选项要求追问所有可能信息，易导致一次性提问过多，影响用户体验；D选项指令过于宽泛，模型易自由发挥，稳定性差。因此B效果最好。"},{"gid":"058c9f6d-1982-4b8f-a922-45543649786d","type":"单选题","q":"用户对你开发的聊天机器人提了反馈，总是要等 10s 以上才能看到答案。你考虑是否要采取流式输出策略。以下想法正确的是：","options":[{"t":"可以采取流式输出，但是我要在原有基础上调整一下 temperature 和 top_p 等参数","ok":false},{"t":"不能采取流式输出，将实时返回的结果立刻返回给前端界面是一件很难做到的事情","ok":false},{"t":"不能采取流式输出，我调了好久的 prompt 在流式输出时效果肯定会下降","ok":false},{"t":"可以采取流式输出，但是我要修改一下返回层面的代码，比如适配流式输出的数据格式，并且将 return 改为 yield","ok":true}],"analysis":"答案：D\n\n解析：流式输出可显著降低首字等待时间。实现它无需调整 temperature 等生成参数（排除A），也不会影响 prompt 效果（排除C）。前端通过 SSE 等技术接收流式数据已是成熟方案（排除B）。但在后端，必须修改返回逻辑，适配流式数据格式，并将 `return` 改为 `yield` 构建生成器，以实现数据逐块实时推送。故选D。"},{"gid":"59d84c8c-3dda-4cd0-b573-6a4c59d55c5e","type":"单选题","q":"一家科技公司基于自建向量数据库构建RAG应用。在业务高峰期，该数据库服务经常变慢甚至中断，需手动重启。为确保高可用和弹性，最合理的架构决策是?","options":[{"t":"为现有数据库服务器垂直扩容CPU和内存","ok":false},{"t":"使用全托管云原生服务如阿里云(DashVector)","ok":true},{"t":"优化Embedding模型以提升检索结果的相关性","ok":false},{"t":"基于Kubemetes自建跨可用区的高可用集群","ok":false}],"analysis":"答案：B\n\n解析：高峰期服务变慢、中断暴露出自建数据库缺乏弹性与高可用。A项垂直扩容无法解决单点故障和自动伸缩；C项优化模型与架构高可用无关；D项自建K8s集群运维成本极高且弹性配置复杂。B项采用全托管云原生服务（如DashVector），天然具备自动弹性伸缩、多可用区高可用及免运维特性，能以最低成本快速解决痛点，是最合理的决策。"},{"gid":"a6bf090f-39fb-458f-a5b7-c2d537b26b2f","type":"多选题","q":"一家金融机构的RAG系统在处理关于自研交易模型的查询时，常返回通用文档，而非知识库中具体的高级策略。为系统性地解决此问题，架构师应优先采取哪两项措施?(选择两项)","options":[{"t":"引入一个Cross-Encoder模型对初步召回结果进行精排","ok":false},{"t":"调整分块重叠和分块大小，对齐交易策略的章节","ok":true},{"t":"建立一个包含“查询-理想文档”的“黄金标准”评测集","ok":false},{"t":"实施混合检索，融合关键词(如BM25)与向量搜索","ok":true}],"analysis":"交易策略类内容属于 技术文档 ，根据参考资料推荐，应使用 600～1024 的分块大小 和 100～200 的重叠大小，以确保语义完整性和上下文连贯性\n。若当前分块过小或重叠不足，可能导致关键策略信息被割裂，影响召回质量。\n该问题表现为“返回通用文档而非具体策略”，说明系统可能因语义泛化而忽略精确术语（如特定模型名称、策略代号）。 混合检索 结合了 Dense 检索的语义理解能力和 Sparse 检索（如 BM25）的关键词精准匹配优势，特别适用于 关键词明确但需兼顾语义 的场景\n。\n选项 A（Cross-Encoder 精排）虽有效，但属于后处理优化，应在召回阶段问题解决后再考虑；选项 C（黄金标准评测集）用于评估，不直接改善召回结果。"},{"gid":"2d878486-5262-4b46-ba12-5812ae3794b5","type":"多选题","q":"一家航空公司的AI维修服务，在查询特定零件扭矩值时，检索模块总是返回宽泛的概述性章节而非精确的技术参数表。为系统性解决此问题，应采取哪两项措施?","options":[{"t":"为文档块添加“章节类型”元数据，并提升“参数表\"类型的检索权","ok":true},{"t":"建立一个包含标准问题和精确答案位置的评测集，以量化检索性能","ok":true},{"t":"增大分块尺寸(chunk_size)，确保向量包含更完整的上下文信息","ok":false},{"t":"切换生成环节的基模，采用更强的模型从宽泛章节中找到精确答案","ok":false}],"analysis":"答案：A、B\n\n解析：问题根源在于检索召回不精准。A项利用元数据过滤和权重调整，可直接引导系统精准定位参数表，解决召回偏差；B项构建评测集能量化检索性能，为持续优化提供客观依据，形成系统性解决闭环。C项增大分块会引入冗余信息，反而降低检索精度；D项症结在检索端而非生成端，强模型也无法解决上下文缺失的“无米之炊”。"},{"gid":"05c4d6d4-d7a2-4fed-ab16-8c2fdddcefb2","type":"单选题","q":"由于某项规定条款的定义与限制条件分散在法规文档的不同片段中，导致AI做合规审查时出现漏检。为系统性地降低此类风险，最有效的优化措施是什么?","options":[{"t":"引入重排模型，优化检索片段的相关性排序","ok":false},{"t":"更换超长上下文的大模型结合推理模式进行全局理解","ok":false},{"t":"对模型进行微调，增强其对特定领域的逻辑推理能力","ok":false},{"t":"入库前将描述同一语义主题的分散片段聚合成独立知识块","ok":true}],"analysis":"答案：D\n\n解析：题干痛点是“信息分散导致上下文割裂引发漏检”。A项重排仅优化排序，无法弥补信息缺失；B项超长上下文模型成本高且易受“中间迷失”效应影响；C项微调提升的是推理能力，无法解决数据源缺陷。D项从RAG数据源头入手，通过知识聚合重构文档结构，确保检索时能一次性召回完整的定义与限制条件，从根本上解决信息分散问题，是最有效且系统的优化措施。"},{"gid":"c9657a85-d53d-4c5c-989e-ba95b579c8c2","type":"单选题","q":"一款集成了多个学术数据库API的AI研究助手，最近频繁因参数格式错误(如date格式应为YYYY-MM-DD,author_id应为整数》而调用失败，导致运营成本激增。最有效的改进策略是什么?","options":[{"t":"强制采用基于统一Schema的API规范，并加入前置的自动化校验机制","ok":true},{"t":"部署更精细的日志与追踪系统，以量化分析每种参数错误的具体模式","ok":false},{"t":"收集失败调用日志对大模型进行微调，增强其生成正确参数的能力","ok":false},{"t":"在系统提示词中为每个工具补充详细的自然语言描述和正反参数示例","ok":false}],"analysis":"答案：A\n\n解析：大模型生成API参数时易出现格式幻觉。选项A通过统一Schema严格定义参数类型与格式，并结合前置自动化校验，能在实际调用前拦截或修正错误。这种工程化手段比依赖模型自身能力更稳定，能直接阻断无效调用，立竿见影地降低成本。B仅监控不解决问题；C微调成本高且难保绝对准确；D提示词优化无法彻底杜绝格式错误。因此A最有效。"},{"gid":"0a462ffe-1cb2-481e-a30b-3618ca428b2d","type":"单选题","q":"由于供应商频繁更换原材料，你工厂的AI视觉质检系统经常出错，迫使产线增加人工复检，严重影响产能。为确保系统能长期自适应，最关键的改进措施是什么?","options":[{"t":"部署数据漂移检测系统，实时告警原材料图像的统计变化","ok":false},{"t":"调整AI质检的判定阈值，以快速减少当前高发的误报数量","ok":false},{"t":"建立将人工纠错结果，自动回流做增量微调的闭环机制","ok":true},{"t":"升级为最先进的视觉理解模型，提升对新特征的泛化能力","ok":false}],"analysis":"答案：C\n\n解析：本题核心诉求是“长期自适应”。A项仅能告警无法解决；B项调阈值治标不治本，易引发漏报；D项换模型成本高且缺乏持续学习能力。C项建立数据闭环，将人工复检的纠错数据自动用于模型增量微调。这不仅盘活了人工成本，还能让模型随原材料变化不断自我进化（持续学习），是实现系统长期自适应最根本、关键的机制。"},{"gid":"e0244886-593e-4ffa-8cc8-b2b3697a5a9b","type":"单选题","q":"一家广告公司打造AI辅助视频制作系统，公司的创意总监要求必须能够对AI生成的初稿进行“像素级”的精细调整。要满足这种对自动化生成与后期精细编辑控制的双重需求，以下哪种系统设计理念最为关键?","options":[{"t":"部署跨模态像素级生成的扩散模型，当检测到标注笔触像素时动态调整潜空间的噪声模式。","ok":false},{"t":"优先保证生成速度，系统快速输出一个\"草稿版”视频，然后使用另一个更昂贵的AI大模型视频修复工具对不满意的片段进行反复的局部重绘或修复。","ok":false},{"t":"训练一个接受多模态指令的超大模型，允许用户通过“把那辆车换成XX品牌\"或“让解说快一点”等自然语言指令反复迭代视频。","ok":false},{"t":"设计一个\"分层可编辑”的输出格式，AI不直接生成最终的MP4视频，而是生成一个包含时间轴、资产清单、变换指令和脚本的结构化项目文件(如JSON或XML)。","ok":true}],"analysis":"答案：D\n\n解析：本题核心是平衡“AI自动化生成”与“像素级精细编辑”。A、B、C项均依赖AI直接修改画面，但AI生成的随机性难以实现专业级“像素级”精准控制。D项采用“分层可编辑”理念，让AI输出包含时间轴和资产的结构化项目文件。这样既发挥了AI的自动化生成优势，又能将文件导入专业后期软件（如PR/AE）进行像素级微调，完美满足双重需求。"},{"gid":"0b2da5a0-4a43-444d-b7d1-b0acb9126b6d","type":"单选题","q":"某公司计划上线HR问答机器人，其知识库中包含公司各级各类资料。在内部审核中，评审人员指出，机器人存在越级泄露资料的风险。为在当前架构下最直接且可靠地修复此访问控制漏洞，应优先采取哪项技术措施?","options":[{"t":"对本次泄露事件进行全面的复盘，并建立相应的应急响应和处罚机制。","ok":false},{"t":"在API出口部署内容过滤器，对所有响应强制进行关键词扫描。","ok":false},{"t":"设置知识库访问权限，在RAG检索时，基于用户授权返回知识块。","ok":true},{"t":"微调语言模型，增强其角色扮演能力，使其主动拒绝回答敏感问题。","ok":false}],"analysis":"答案：C\n\n解析：本题核心是解决问答机器人的“越权访问”漏洞。在RAG架构中，最直接可靠的方法是在检索阶段进行权限控制（选项C），确保模型仅获取当前用户有权访问的知识块，从数据源头阻断越级泄露。选项A属管理措施而非技术修复；选项B事后过滤易误杀漏报；选项D依赖模型自身拒绝，存在提示词越狱风险，不可靠。故选C。"},{"gid":"18e49efc-164f-47b6-9db3-f86c5154afd5","type":"多选题","q":"以下哪些选项属于提示词要素中的样例（Sample）？","options":[{"t":"请你扮演一位医生。","ok":false},{"t":"输入：汽车，输出：交通工具","ok":true},{"t":"用户输入：“我想了解一下人工智能。” 你的回复：“人工智能是……”","ok":true},{"t":"请用表格形式展示结果。","ok":false},{"t":"输入：苹果，输出：水果","ok":true},{"t":"请你总结这篇文章的中心思想 。","ok":false}],"analysis":"答案：B、C、E\n\n解析：\n提示词中的“样例”指为模型提供的输入与输出示例，用于展示期望的回答格式、逻辑或风格。选项B和E提供了清晰的“输入-输出”映射示例；选项C展示了具体的“问答”对话示例，三者均属于样例。而A属于角色设定，D属于输出格式要求，F属于任务指令，均不属于样例要素。"},{"gid":"5c066aac-06b3-4950-84c5-5a7ef66e9d06","type":"多选题","q":"小明开发了一款基于通义千问的 AI 写作助手小程序，计划在微信小程序平台上线。目前小程序已经开发完成，但尚未提交任何合规备案申请。根据相关规定，小明应该如何操作？","options":[{"t":"直接上线，后续再补充备案材料。","ok":false},{"t":"向应用商店提交应用，等待审核通过后再备案。","ok":false},{"t":"下架小程序，停止运营。","ok":false},{"t":"联系阿里云百炼大模型服务平台，咨询备案流程并按要求提交申请。","ok":true},{"t":"无需备案，直接上线即可。","ok":false},{"t":"先进行算法备案，获得备案号后再上线。","ok":true}],"analysis":"**答案**：D、F\n\n**解析**：\n根据《生成式人工智能服务管理暂行办法》及微信平台规范，提供生成式AI服务必须“先备案、后上线”，严禁无备案上线或先上线后补备（排除A、B、E）。因小程序尚未上线，无需“下架”（排除C）。由于底层调用通义千问，小明需联系阿里云百炼平台咨询应用级备案流程（选D），并在依法取得算法备案号后，方可提交审核并正式上线（选F）。"},{"gid":"14458a83-65eb-4f3c-b039-9a6b2343e7a9","type":"多选题","q":"以下哪些选项属于提示词要素中的 “输出格式（Output Format）”？","options":[{"t":"请你总结一下这篇文章的主要内容。","ok":false},{"t":"请用表格形式展示结果。","ok":true},{"t":"假设你是一个资深律师。","ok":false},{"t":"请使用 JSON 格式输出。","ok":true},{"t":"我希望你以第一人称的口吻写作。","ok":false},{"t":"结果需要包含姓名、年龄和地址。","ok":false}],"analysis":"答案：B、D\n\n解析：“输出格式”用于规定AI返回内容的排版或数据结构形式。选项B（表格）和D（JSON）明确了数据的呈现载体与序列化方式，属于典型的输出格式。选项A为任务指令，C为角色设定，E为语气风格，F为输出内容约束（规定具体字段而非排版形式）。故选B、D。"},{"gid":"ef57a160-d234-4a3c-b305-4ccb4d0fd7d1","type":"多选题","q":"以下关于 CosyVoice 的描述，哪些是正确的？","options":[{"t":"CosyVoice是一个文本转语音模型。","ok":true},{"t":"CosyVoice可以直接生成视频。","ok":false},{"t":"CosyVoice支持实时流式语音合成。","ok":true},{"t":"CosyVoice可以用于语音识别。","ok":false}],"analysis":"**答案：A、C**\n\n**解析：**\nCosyVoice是阿里通义实验室开源的多语言**文本转语音（TTS）** 模型，故A正确，D（语音识别）错误。它专注于音频生成，不具备直接生成视频的功能，B错误。此外，CosyVoice的架构设计支持**实时流式语音合成**，能大幅降低首包延迟，满足实时交互场景需求，故C正确。因此正确答案为A和C。"},{"gid":"76d7102b-f3ee-45dc-a24a-4ab0f3e4d436","type":"多选题","q":"在RAGAS 评测中，embedding模型的作用有哪些?","options":[{"t":"评估answer 与ground_truth的相似度，从而计算answer_correctness","ok":true},{"t":"评估每个chunk之间的相似度、从而剔除离群点","ok":false},{"t":"评估context 与answer 的相似度，从而计算faithfulness","ok":false},{"t":"评估answer与query的相似度，从而计算answer_relevancy","ok":true}],"analysis":"**答案：A、D**\n\n**解析：**\n在RAGAS中，embedding模型主要用于计算语义相似度。**A正确**：`answer_correctness`通过embedding计算answer与ground_truth的语义相似度，并结合事实重叠度得出。**D正确**：`answer_relevancy`利用embedding计算由answer生成的多个问题与原query的向量相似度。**C错误**：`faithfulness`依赖NLI模型或LLM判断answer的声明是否被context蕴含，而非直接计算相似度。**B错误**：剔除离群chunk属于数据预处理，并非RAGAS评测指标。"},{"gid":"2b6e1e3a-3661-4a42-8510-3437261950c1","type":"多选题","q":"通过 LlamaIndex 创建 RAG 应用，关于下面这段代码作用的描述正确的有哪些？pythondef get_documents(path):documents = SimpleDirectoryReader(path).load_data()document = Document(text=\"\\n\\n\".join([doc.text for doc in documents]))replacements = {'，': ',','！': '!','？': '?'}for src, dst in replacements.items():document.text = document.text.replace(src, dst)return document","options":[{"t":"将所有 Document 对象合并为一个 Document 对象","ok":true},{"t":"对乱码内容进行数据清洗","ok":false},{"t":"将中文的标点符号预先转化为英文标点符号，使得切分时不会使得 chunk 长度过长","ok":true},{"t":"将指定文件夹中的文件加载为 document 对象","ok":true}],"analysis":"答案：A、C、D\n\n解析：\n1. `SimpleDirectoryReader` 读取指定路径文件并加载为 Document 对象（D正确）。\n2. `join` 方法将多个 Document 文本拼接，合并封装为单一的 Document 对象（A正确）。\n3. 将中文标点转为英文标点，因 LlamaIndex 默认切分器对英文标点识别更好，此举能准确识别句子边界，避免无法切分导致 chunk 超长（C正确）。\n4. 代码未涉及乱码处理（B错误）。"},{"gid":"201f3269-1031-4002-809c-734975f1d174","type":"多选题","q":"视频合规检测的关键步骤包括下列哪些选项？","options":[{"t":"视频上传后的用户评论分析","ok":false},{"t":"视频预处理，例如视频分段和帧提取","ok":true},{"t":"音频合规检测","ok":true},{"t":"视频编码格式的选择","ok":false},{"t":"图片合规检测","ok":true},{"t":"文本合规检测（包括字幕和音频转录文本）","ok":true}],"analysis":"**答案**：B, C, E, F\n\n**解析**：\n视频合规检测旨在审查视频内容本身。B项预处理（分段、抽帧）是检测基础；C项音频、E项图片（针对视频帧）和F项文本（字幕及语音转写）检测构成了多模态内容审查的核心步骤。A项评论分析属于社区互动管理，D项编码选择属于底层转码技术，均不属于视频内容合规检测范畴。故选BCEF。"},{"gid":"95190e0c-990c-4139-9732-f543041c602e","type":"多选题","q":"已知 prompt_template 定义了让大模型生成摘要的具体要求，以下哪些措施可以提高摘要生成函数的生成质量？","options":[{"t":"将 document 分成多个段落，分别生成摘要，最后合并。","ok":true},{"t":"在 prompt_template中明确指出需要提取文章的主旨。","ok":true},{"t":"不使用 prompt_template，直接调用大模型。","ok":false},{"t":"在 prompt_template中提供一些示例摘要。","ok":true},{"t":"在 prompt_template中提供更详细的输出格式要求，例如指定摘要的长度、语气等。","ok":true}],"analysis":"答案：A、B、D、E\n\n解析：A项采用分治策略处理长文本，避免上下文超限并提升质量；B项明确任务目标，使模型聚焦核心主旨；D项引入少样本提示，通过示例引导模型对齐期望风格；E项细化输出约束，增强结果可控性。C项放弃提示词指导会导致输出随机不可控，降低质量。故选ABDE。"},{"gid":"8f80b7e6-4754-48fc-ac6d-653041b41026","type":"多选题","q":"你正在开发一个机器学习领域的答疑机器人，辅助学生学习，但你对该领域专业知识掌握有限，以下哪些策略更有助于你改进提示词设计？","options":[{"t":"邀请机器学习课程助教一起审核和改进提示词，要求其按照一定的结构来回答问题","ok":true},{"t":"要求大模型扮演「机器学习教授」，结合学生认知水平，重新写出更结构化的提示词","ok":true},{"t":"按照自己的理解要求大模型按照一定的结构来回答问题","ok":false},{"t":"保持提示词简单，避免引入错误的信息","ok":false}],"analysis":"答案：A、B\n\n解析：在自身专业知识有限时，引入领域专家（如助教）审核能确保内容的准确性与专业性（选A）；利用大模型角色扮演能力让其自我优化提示词，是提升质量的有效技巧（选B）。选项C依赖自身有限理解，易产生误导；选项D过于保守，简单提示词无法引导模型输出高质量、结构化的教学解答，难以实现答疑目标。"},{"gid":"bd4d6027-9cbd-4a17-ac77-720368824171","type":"多选题","q":"()关于多模态技术底层原理，正确的说法是？","options":[{"t":"图像理解模型也需要先将视频或图像分词化再做处理","ok":true},{"t":"实现「方言语音合成」需要训练模型建立方言音素与标准发音的映射关系","ok":true},{"t":"视频合成所花费的时间与可用的算力呈负相关","ok":true},{"t":"文生图模型生成不同尺寸图像时，必须重新训练模型","ok":false}],"analysis":"**答案**：A, B, C\n\n**解析**：\nA正确：视觉模型（如ViT）需将图像/视频切分为图块（Patch），即进行视觉“分词化”（Tokenization）后再处理。\nB正确：方言语音合成常需训练模型建立方言音素与标准发音或声学特征的映射关系。\nC正确：可用算力越强，视频合成耗时越短，二者呈负相关。\nD错误：文生图模型可通过调整潜空间分辨率或缩放算法直接生成不同尺寸图像，无需重新训练。"},{"gid":"fecb78bc-8539-4bc7-aea0-43f33dc7e9ec","type":"多选题","q":"一家旅游公司计划推出一款沉浸式个性化 AI 导游产品，以下哪些功能设计可以有效提升产品的吸引力和实用性？","options":[{"t":"使用大语言模型为游客实时生成个性化的景点介绍，结合游客的兴趣和历史游览记录。","ok":true},{"t":"开发一个路径规划系统，根据实时交通和天气情况为游客推荐最佳游览路线。","ok":true},{"t":"利用图像识别技术分析游客拍摄的照片，自动标注景点名称并提供相关背景信息。","ok":true},{"t":"提供一个语音讲解的随身 pad，确保所有游客听到的内容完全相同。","ok":false}],"analysis":"答案：A、B、C\n\n解析：该产品核心在于“沉浸式”与“个性化”。A项结合兴趣生成专属介绍，凸显个性化；B项基于实时数据动态规划路线，提升实用性；C项利用图像识别实现即时互动讲解，增强沉浸感。D项强调所有游客听到“完全相同”的内容，直接违背了“个性化”的设计初衷，且传统设备缺乏AI沉浸体验，故排除。"},{"gid":"d17d140b-30d3-4b49-9b8f-aadd61c97f84","type":"多选题","q":"某金融智能风控系统在高峰期偶尔出现模型不可用的情况，以下哪些方案可以作为降级策略？","options":[{"t":"增加 GPU 实例数量","ok":false},{"t":"切换至规则引擎兜底","ok":true},{"t":"使用备份模型继续服务","ok":true},{"t":"关闭部分非核心功能","ok":true}],"analysis":"答案：B、C、D\n\n解析：降级策略指在系统高负载或故障时，牺牲非核心功能或降低服务质量以保全核心业务。A项“增加GPU”属弹性扩容，非降级。B项“切换规则引擎”与C项“使用备份模型”属服务逻辑降级，可在主模型失效时兜底保障风控；D项“关闭非核心功能”属资源降级，能释放算力保障主链路。故选BCD。"},{"gid":"240814d9-0e44-4579-aef9-c4f09e6572d0","type":"多选题","q":"一家教育科技公司拟开发 AI 教学产品，以下哪些方案能体现 “个性化、智能化、普惠教育”？","options":[{"t":"自适应学习平台根据学生水平动态调整题库","ok":true},{"t":"用 VR 实验室模拟替代昂贵的物理实验，降低教学成本","ok":true},{"t":"方言识别系统辅助少数民族学生练习普通话","ok":true},{"t":"选择题自动判卷，问答题错别字纠正","ok":false}],"analysis":"答案：A、B、C\n\n解析：A项自适应学习因材施教，体现“个性化”与“智能化”；B项VR实验打破硬件资源壁垒，降低成本，体现“普惠”与“智能化”；C项方言识别助力少数民族学生，促进教育公平，体现“普惠”与“智能化”。D项自动判卷和纠错仅属基础自动化应用，未深度体现因材施教的“个性化”与促进公平的“普惠”理念，故排除。"},{"gid":"b4fe4cde-42cd-4abf-a60d-8d1ca93222a8","type":"多选题","q":"某跨境电商平台的客服系统需要处理多语言用户咨询，在进行文本合规检查时发现部分违规内容无法被检测出来。哪两个方案能提供多语言文本的合规检查效果？","options":[{"t":"强制要求用户使用英语提问，其他语言咨询转入人工处理","ok":false},{"t":"建立多语言同义词库，覆盖常见违规表述的变体（如 “免税代购” 的谐音 / 缩写形式）","ok":true},{"t":"使用跨语言语义理解模型，识别违规意图而非依赖关键词匹配","ok":true},{"t":"将非英语内容翻译为英语后复用单语种审核规则","ok":false}],"analysis":"答案：B、C\n\n解析：A项转人工会增加成本且未提升系统自动检测能力；D项机器翻译易丢失谐音、缩写等本土化变体特征导致漏检。B项建立多语言同义词库，能有效覆盖各语种违规词汇的变体与伪装，解决词法漏检；C项使用跨语言语义模型，可深入识别多语言背后的真实违规意图，突破关键词匹配局限。B和C从词汇和语义双管齐下，能显著提升检查效果。"},{"gid":"e39ae073-47e3-46e7-b693-ddf7694a65d2","type":"多选题","q":"当你在使用一款基于大模型构建的创意助手，要求它一次性产生 10 条宣传文案时，发现生成的文案千篇一律，缺乏多样性。为了在保证一定多样性的同时避免模型生成不符合主题的内容，可以优先考虑以下哪些改进措施？","options":[{"t":"使用模糊的指令，让模型自由发挥。","ok":false},{"t":"检查提示词是否过于局限，尝试在提示词中明确指定多个角度方向（如情感、风格、视角等）来扩展其灵活性。","ok":true},{"t":"固定 top_p=0.1 以确保最大范围的词汇选择。","ok":false},{"t":"小幅调高 temperature以保证生成内容的多样性。","ok":true}],"analysis":"答案：B、D\n\n解析：\nA项错误，模糊指令易导致内容跑题，无法保证符合主题。\nB项正确，在提示词中指定多角度（如情感、风格），能在紧扣主题的前提下引导模型输出多样化内容。\nC项错误，top_p=0.1会极大限制词汇选择范围，反而降低多样性。\nD项正确，小幅调高temperature能增加采样随机性，提升文案多样性，且“小幅”调整可避免内容失控。"},{"gid":"864ef09f-f8b3-4933-af4e-980cf53707ee","type":"多选题","q":"用户多次反馈 “AI 回答中有捏造内容”，排查后发现是当知识库没有相关内容时，大模型直接虚构答案。为减少此情况，你可以怎么做？","options":[{"t":"在百炼 RAG应用中将回答范围设置为“仅知识库范围”","ok":true},{"t":"调高 temperature值","ok":false},{"t":"使用 ReRank对检索结果再次排序","ok":false},{"t":"使用提示词，无匹配就明确回复\"无法回答\"","ok":true}],"analysis":"**答案**：A, D\n\n**解析**：\nA项设置“仅知识库范围”可切断模型利用自身预训练知识虚构的路径；D项通过提示词明确拒答规则，直接约束模型在无内容时的输出行为；选项 C（使用 ReRank 排序）用于提升检索结果相关性，但不能防止无相关结果时的虚构行为。B项调高temperature会增加生成的随机性与创造性，反而加剧幻觉，故排除。"},{"gid":"d111a8a5-1c04-4dc0-98e6-6044647d5540","type":"多选题","q":"某电商公司需开发一个客服机器人处理 “退换货政策咨询” 和 “商品推荐” 任务，下列哪两种角色应该深度参与提示词设计？","options":[{"t":"产品经理（定义用户场景和业务流程）","ok":true},{"t":"前端开发工程师（负责对话界面实现）","ok":false},{"t":"算法工程师（擅长模型调优和参数调整）","ok":false},{"t":"客服部门主管（熟悉用户高频问题和政策细节）","ok":true}],"analysis":"**答案**：A、D\n\n**解析**：\n提示词设计的核心是将业务需求与领域知识转化为模型指令。产品经理（A）熟悉用户场景与业务流程，能确保机器人的交互逻辑和推荐策略符合产品预期；客服主管（D）掌握退换货政策细节与高频问题，能提供精准的领域知识和专业话术。前端工程师（B）侧重界面实现，算法工程师（C）侧重模型底层调优，均非提示词业务设计的核心主导者。"},{"gid":"4e41235e-2473-48d7-ab9c-eb198fd90b46","type":"多选题","q":"构建高质量的数学题微调数据集应包含哪些要素？","options":[{"t":"包含详细分步推导","ok":true},{"t":"统一使用 LaTeX 公式或 Markdown 格式输出公式","ok":true},{"t":"大量的数学题解题数据","ok":true},{"t":"覆盖多种解题思路","ok":true}],"analysis":"**答案**：A, B, C, D\n\n**解析**：\n构建高质量数学微调数据集需兼顾规模、质量与多样性。A项详细分步推导提供思维链，强化逻辑推理；B项统一LaTeX等格式规范数学表达，降低解析错误；C项大量数据是基础，保障模型泛化能力；D项覆盖多种思路能拓宽视角，避免思维定势，提升解题灵活性。四者结合可全面提升模型的数学推理与生成质量。"},{"gid":"a741ad0f-0a56-4dad-95db-863ffc3f5815","type":"多选题","q":"你需要大模型从客户邮件中提取结构化数据（如姓名、订单号、问题类型），以下哪两个选项有助于你达成这一目标？","options":[{"t":"提供你期望的 JSON 结构示例","ok":true},{"t":"调低温度参数（Temperature）以降低随机性","ok":false},{"t":"在任务目标中明确“输出 JSON 格式”","ok":true},{"t":"要求模型分两步操作，先总结邮件内容，再提取字段","ok":false}],"analysis":"**答案：A、C**\n\n**解析：**\n提取结构化数据的核心是确保格式严格且内容准确。选项A提供JSON示例能直观约束模型的输出结构和字段，大幅减少格式错误；选项 B（调低 temperature）虽可降低随机性，但并非结构化提取的核心手段；选项 D（分两步操作）可能增加复杂度，且未被资料推荐。"},{"gid":"d4762404-e386-4d6f-ae97-52482a850434","type":"多选题","q":"关于 temperature 和 top_p参数的作用，以下哪三个描述是正确的?","options":[{"t":"较低的 top_p 可以提高生成内容的稳定性","ok":true},{"t":"较低的 temperature可以增加生成内容的多样性","ok":false},{"t":"通常情况下，只需调整其中一个参数即可。","ok":true},{"t":"较高的 temperature可以增加生成内容的多样性","ok":true}],"analysis":"答案：A、C、D\n\n解析：\n`temperature`和`top_p`均用于控制模型生成的随机性。较高的`temperature`会放大低概率词的权重，增加内容多样性（D对，B错）；较低的`top_p`会截断概率分布，仅从高概率词中采样，从而提高生成稳定性（A对）。由于两者作用机制相似且相互影响，通常建议只调整其中一个参数以达到预期效果，避免过度干预（C对）。"},{"gid":"d86a37ad-8a87-4bbc-9838-d321c2fcbbc9","type":"单选题","q":"某团队想用 RAG 做 “分步骤查询”，先找出人员名单，再分别查询每人的部门信息，以下哪项功能最适合？","options":[{"t":"ReRank（重排序）","ok":false},{"t":"MultiStepQueryEngine（多步查询）","ok":true},{"t":"SimpleDirectoryReader（读取本地文档）","ok":false},{"t":"HyDE（假想文档生成）","ok":false}],"analysis":"答案：B\n\n解析：\n本题核心需求是“分步骤查询”。A项ReRank用于检索结果重排序；C项SimpleDirectoryReader是读取本地文档的数据加载器；D项HyDE通过生成假想文档提升检索召回率。B项MultiStepQueryEngine（多步查询引擎）专为复杂任务设计，能将问题拆解为多个子步骤（如先查名单，再逐一查部门）分步执行并整合结果，完美契合分步查询需求，故选B。"},{"gid":"4f5325a6-8513-40a7-9545-70fc04e87b6d","type":"多选题","q":"以下哪些方案，有助于提升大模型应用的用户体验？","options":[{"t":"等全部内容生成后一次性返回","ok":false},{"t":"展示任务处理进度","ok":true},{"t":"生成的内容流式输出","ok":true},{"t":"将任务分解为多个步骤，并且将分步执行过程展示给用户","ok":true}],"analysis":"答案：B、C、D\n\n解析：大模型生成内容通常耗时较长，A选项一次性返回会导致用户长时间面对白屏，体验极差。B选项展示进度和C选项流式输出（打字机效果）能让用户即时获得反馈，有效减少感知等待时间，缓解焦虑。D选项将复杂任务分步并展示执行过程，能增加系统透明度，帮助用户理解模型逻辑并建立信任感。因此，B、C、D均能显著提升体验。"},{"gid":"c7a05eca-c890-41e7-bde8-2b3cc831bc0a","type":"多选题","q":"一家律所计划构建一个AI助手，辅助律师基于内部案件数据库(用于RAG)起草法律文书。为从技术架构层面有效缓解客户信息泄露风险，应集成哪些设计?","options":[{"t":"构建一个应用层中间件，基于用户身份验证与授权进行数据检索，再将结果传递给大模型。","ok":true},{"t":"在System Prompt中强调遵守律师-客户保密特权的重要性。","ok":false},{"t":"在数据注入知识库前，进行自动化的敏感实体识别与假名化处理。","ok":true},{"t":"为AI助手访问后端数据库设计基于角色的访问控制(RBAC)策略。","ok":true}],"analysis":"答案：A、C、D\n\n解析：\n本题强调“技术架构层面”防范泄露。A项中间件鉴权与D项RBAC策略均属于架构层的访问控制，能有效防止越权检索和数据泄露；C项在数据入库前进行假名化脱敏，从数据底层架构切断了敏感信息流入大模型的路径。而B项仅依赖提示词约束，不属于技术架构设计，且易被提示词注入攻击绕过，无法从底层保障数据安全。"},{"gid":"bcca75eb-5a39-4bee-955e-ef7ac93d2026","type":"多选题","q":"关于 Loss function & Cost function，下面描述正确的是？","options":[{"t":"拟合任意复杂函数","ok":false},{"t":"用于度量当前所设置的参数是否合适","ok":true},{"t":"决定神经元是否被激活并传递信息","ok":false},{"t":"帮助寻找函数的参数最优解","ok":true}],"analysis":"答案：B、D\n\n解析：损失函数（Loss）和代价函数（Cost）用于衡量模型预测值与真实值的差异。B正确，其值大小直接反映当前参数下的预测误差，用于度量参数是否合适；D正确，通过优化算法（如梯度下降）最小化该函数，可帮助寻找使误差最小的参数最优解。A描述的是神经网络模型本身的拟合能力；C描述的是激活函数（Activation function）的作用，故A、C错误。"},{"gid":"afe71db8-8234-4ad2-abba-786c495c932a","type":"多选题","q":"下列哪些 AIGC 应用场景需要进行算法备案？","options":[{"t":"基于 AIGC的智能客服系统","ok":true},{"t":"使用机器学习算法进行数据分析的企业内部工具","ok":false},{"t":"基于大模型的 AI 写作工具","ok":true},{"t":"利用深度学习进行图像生成的绘画软件","ok":true}],"analysis":"**答案：A、C、D**\n\n**解析：**\n根据《生成式人工智能服务管理暂行办法》等规定，面向公众提供、具有舆论属性或社会动员能力的AIGC服务需进行算法备案。选项A（智能客服）、C（AI写作）、D（AI绘画）均属于面向公众提供的生成式AI服务，涉及文本、图像等内容的生成，依法必须备案。而选项B为企业内部工具，不面向公众开放，不具备舆论属性或社会动员能力，无需备案。"},{"gid":"62922de1-a356-41ab-87e9-c94c59081e92","type":"多选题","q":"在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？","options":[{"t":"基于现有的评测集，增加自动化评测的频次","ok":false},{"t":"在构建测试集时，增加业务专家的打分环节","ok":true},{"t":"根据线上用户问题类型的分布，修正测试样本集的问题分布","ok":true},{"t":"调整自动化评测工程的提示词及阈值，让其更接近真实用户判断标准","ok":true}],"analysis":"答案：B、C、D\n\n解析：\n评分偏高且脱离反馈，说明评测标准或样本存在偏差。A项仅增频次无法纠正系统性偏差。B项引入专家打分可校准基准，对齐人类认知；C项修正样本分布能确保测试集真实反映线上场景，避免数据偏差；D项优化提示词与阈值可直接修正自动化评分的“宽容度”，使其与真实用户标准对齐。故选BCD。"},{"gid":"e935c3e8-d7bf-4b44-b8af-342626f5c638","type":"多选题","q":"选择 LoRA 权重时需考虑哪些因素？","options":[{"t":"GPU 显存容量","ok":true},{"t":"训练数据量","ok":true},{"t":"任务复杂度","ok":true},{"t":"基础模型参数量","ok":true}],"analysis":"**答案**：A, B, C, D\n\n**解析**：\n选择LoRA权重需综合考量：\n1. **GPU显存(A)**：决定可加载的模型大小及LoRA秩上限，防止显存溢出。\n2. **训练数据量(B)**：数据量大可支撑高秩防欠拟合，数据小需低秩防过拟合。\n3. **任务复杂度(C)**：复杂任务需高秩捕获丰富特征，简单任务低秩即可。\n4. **基础模型参数量(D)**：LoRA必须与基础模型维度严格匹配，且大模型表征力强，有时较小秩即可满足需求。"},{"gid":"95d84e08-fb09-48b1-b934-13d138e28cbd","type":"多选题","q":"你发现大量员工信息都存放在 PDF、Word 文档里，部分还包含表格和图片，RAG 无法正确提取关键信息。你可以怎么处理？","options":[{"t":"手动复制粘贴所有文档内容","ok":false},{"t":"使用 OCR 技术识别并提取图片中的文字","ok":true},{"t":"强制用户只上传纯文本","ok":false},{"t":"使用 DashScopeParse 等工具，对 PDF/Word 进行结构化解析","ok":true}],"analysis":"答案：B、D\n\n解析：处理含图表的复杂文档时，手动复制(A)效率极低，强制纯文本(C)脱离实际。应引入专业技术：使用OCR(B)可精准提取图片中的文字；使用DashScopeParse等工具(D)能对PDF/Word进行深度结构化解析，有效还原表格与复杂排版。两者结合可解决RAG提取难题，大幅提升检索准确率。"},{"gid":"f828647b-0593-4619-a3c2-13ec0305681e","type":"多选题","q":"RAG 应用在检索时共召回了 10 条切片，其中 3 条高度相关，但 3 条内容都来自相邻段落，却被系统拆分成不同切片，从而导致回答时缺失连贯的上下文信息。哪些方案可进一步提升答案准确度？","options":[{"t":"采用滑动窗口策略生成重叠的文本切片","ok":true},{"t":"使用按照语义的切片策略，切分出语义更完整的切片","ok":true},{"t":"提高 temperature 参数控制生成多样性","ok":false},{"t":"调整切片大小使其覆盖完整更大段落范围","ok":true}],"analysis":"**答案**：A、B、D\n\n**解析**：\n题目痛点是文本硬拆分导致上下文断裂。A项滑动窗口通过重叠保留边界上下文；B项语义切片按逻辑切分，保证语义完整；D项增大切片范围可容纳更多连贯段落，三者均能有效解决上下文缺失问题。C项提高temperature会增加大模型生成的随机性，无法解决检索阶段的上下文断裂问题，反而可能降低回答准确度。"},{"gid":"e2a51952-09ff-471d-ae4a-a1da6829978e","type":"多选题","q":"你正在优化一个 RAG 系统，发现某些相似文本对的向量相似度较低，以下哪两种方法可以改善这种情况？","options":[{"t":"更换效果更好的 embedding模型","ok":true},{"t":"将索引保存到本地并在运行时加载","ok":false},{"t":"减少向量数据库的存储容量","ok":false},{"t":"通过对比学习让相关文本对的向量相似度更高","ok":true}],"analysis":"答案：A、D\n\n解析：相似文本向量相似度低，本质是当前Embedding模型的语义表征能力不足。选项A直接更换更优模型，可提升整体语义捕捉能力；选项D利用对比学习微调模型，通过拉近正样本距离，针对性提高相关文本的相似度。而选项B（本地加载索引）和选项C（减少存储容量）均属于系统工程与资源优化，不改变向量本身的语义特征，无法改善相似度计算结果。因此选A和D。"},{"gid":"b4fe0c19-b7e0-4efb-8581-d7c7085f634c","type":"多选题","q":"你在开发的招聘答疑机器人，在回答 “产品经理的岗位职责有哪些” 时，输出的职责经常包含客户经理的工作职责。经排查发现，不同岗位的说明文档使用了相同的模板，文档切片时经常将 #客户经理# 岗位和 #产品经理# 岗位的职责主要是这样描述的。以下哪两种方法能有效解决这个问题？","options":[{"t":"使用 ReRank 对检索结果再次排序","ok":false},{"t":"在处理文档时，对于文档中的二级标题，自动拼接文档名称。如##岗位职责会被拼接为##客户经理\u003e岗位职责","ok":true},{"t":"在建立索引时，以文档名称建立标签，检索阶段使用标签 + 向量混合检索","ok":true},{"t":"调高大模型 temperature参数，提高大模型匹配正确答案数据的概率","ok":false}],"analysis":"答案：B、C\n\n解析：\n问题根源是文档切片丢失了岗位上下文，导致相似片段被错误召回。\nB项采用上下文增强，将岗位名拼入切片文本，提升了向量检索的区分度；\nC项采用元数据过滤，通过标签限定检索范围，从根本上杜绝跨岗位召回。\nA项ReRank难以解决源头切片语义混淆问题；D项调高temperature会增加大模型生成的随机性，加剧幻觉，均无效。"},{"gid":"38c2951d-6fb7-4bf4-b3be-7257118d2da4","type":"多选题","q":"为了尽量减少大模型应用的幻觉，以下哪些措施是有效的？","options":[{"t":"对生成内容进行后处理和验证","ok":true},{"t":"使用参数量小更适合本地部署的模型","ok":false},{"t":"引入知识库补充大模型缺少的行业知识","ok":true},{"t":"在提示词中要求禁止虚构内容，遇到无法回答的问题可以直接回复不知道","ok":true}],"analysis":"答案：A、C、D\n\n解析：\nA项通过后处理和事实核查可拦截错误信息；C项利用检索增强生成（RAG）引入外部知识库，提供准确事实依据，是减少幻觉的核心方法；D项通过提示词工程明确约束模型行为，降低其强行编造的概率。而B项中，参数量小的模型通常理解和推理能力较弱，反而更容易产生幻觉，故无效。"},{"gid":"5703998b-bf9b-4dea-9e6c-36809145a13c","type":"多选题","q":"一家航空公司搭建AI服务系统，该系统在响应用户针对业务手册的查询需求时，频繁返回宽泛的手册章节内容，无法精准定位到用户所需的具体条款或关键信息。若想系统性解决这一问题，应优先采取哪两项策略?","options":[{"t":"优化查询意图识别模型，结合航空业务场景(如订票、改签、行李托运)的语义特征，精准拆解用户查询的核心诉求","ok":true},{"t":"构建航空业务专属的知识图谱，关联手册章节、具体条款、业务场景、常见问题等信息，强化内容间的逻辑关联","ok":true},{"t":"简化AI服务系统的返回机制，减少冗余章节的展示，仅提取与用户查询高度匹配的关键句子片段","ok":false},{"t":"在用户输入查询时，引导用户补充精确的手册章节编号或核心关键词，缩小检索范","ok":false}],"analysis":"答案：A、B\n\n解析：该问题根源在于“意图理解不准”与“知识粒度过粗”。A项优化意图识别，精准拆解用户诉求，解决“查得准”的问题；B项构建知识图谱，将宽泛章节细化关联至具体条款，解决“找得精”的问题，二者结合可系统性提升精准度。C项强行截取片段易丢失上下文，治标不治本；D项要求用户提供章节编号，增加使用门槛，违背AI智能便捷的初衷。"},{"gid":"7c9b1ecd-d547-491d-9e87-70b98305e35a","type":"多选题","q":"以下哪两个参数的设置会影响训练时显存占用峰值的大小？","options":[{"t":"批量大小（batch_size）","ok":true},{"t":"验证损失计算步数（evaluation_step）","ok":false},{"t":"训练集迭代次数（epoch）","ok":false},{"t":"LoRA 秩（lora_rank）","ok":true}],"analysis":"答案：A、D\n\n解析：\nA（批量大小）：直接决定单次前向与反向传播时加载的数据量及中间激活值大小，显著影响显存峰值。\nD（LoRA秩）：决定微调时新增的可训练参数量。秩越大，梯度及优化器状态（如动量）占用的显存越多，从而推高显存峰值。\nB（验证步数）和C（迭代次数）仅控制评估频率与训练总轮数，不改变单次计算所需的显存大小。"},{"gid":"6d37e8a5-16ea-4b14-8f3b-05bb7056e14e","type":"单选题","q":"在进行 RAG 应用评测时，应该如何获取测试集中的正确答案（ground_truth）？","options":[{"t":"由性能最强的大模型进行编写","ok":false},{"t":"由该领域的专家进行编写","ok":true},{"t":"由数据工程师进行编写","ok":false},{"t":"由算法工程师进行编写","ok":false}],"analysis":"答案：B\n\n解析：在RAG评测中，ground_truth是衡量系统性能的基准，其准确性至关重要。领域专家具备深厚的专业知识，能确保答案的权威与精准，有效避免大模型生成时常见的“幻觉”问题，同时弥补数据或算法工程师在特定垂直领域专业认知上的不足。因此，由领域专家编写标准答案是保证评测结果客观、可靠的最佳实践。"},{"gid":"da0304f2-ef70-4130-b84f-40a1e03e9b34","type":"单选题","q":"用户只输入了 “张伟 部门” 这样非常简短的关键词，导致最后给出的答案不够完整，在这种情况下，若想自动补全或扩充用户的查询意图，以下哪种策略最合适？","options":[{"t":"增加 embedding维度","ok":false},{"t":"多步查询（MultiStepQuery）","ok":false},{"t":"使用 HyDE生成假想文档","ok":false},{"t":"问题改写（Question Rewriting）","ok":true}],"analysis":"答案：D\n\n解析：用户输入“张伟 部门”等极短关键词时，核心痛点是语义缺失和意图不明确。**问题改写（Question Rewriting）** 可将碎片化关键词扩充为完整的自然语言问题（如“张伟属于哪个部门？”），直接补全查询意图，提升检索效果。A项无法补充语义；B项适用于复杂问题拆解；C项HyDE主要用于缓解词汇不匹配，对极短查询易生成无关内容。故D最合适。"},{"gid":"960827d9-bd88-4f8d-9211-3b898b0e7f47","type":"单选题","q":"你正在尝试使用大模型 Qwen-72B 完成一个用户反馈分类任务，但效果不佳，以下选项中，你应首先考虑的策略是？","options":[{"t":"换用 Qwen-14B模型","ok":false},{"t":"微调大模型（Fine-tuning）","ok":false},{"t":"改进提示词（Prompt Engineering）","ok":true},{"t":"调整模型的温度参数（Temperature）","ok":false}],"analysis":"答案：C\n\n解析：大模型应用优化应遵循“成本由低到高”原则。改进提示词（Prompt Engineering）成本最低、见效最快，通过优化指令、提供示例或约束输出格式，通常能显著提升分类效果，是首选策略。微调（B）成本高、周期长，应在提示词优化遇瓶颈后考虑；调整温度（D）对分类任务上限提升有限；72B效果不佳时换用更小的14B（A）通常效果更差。故选C。"},{"gid":"5ad2fc3f-33bd-4878-bf7d-ea44b254fe0d","type":"单选题","q":"你准备了一批 txt 格式的公司制度文档，准备将其用于 RAG，若要让 RAG 后续能快速进行相似度检索，下列哪项是必需的？","options":[{"t":"手动把 txt 文件改为 JSON 格式","ok":false},{"t":"对文本进行嵌入（embedding）并将向量存进向量数据库","ok":true},{"t":"先对这些 txt 文件进行加密存储","ok":false},{"t":"在检索时把 txt 文件原样拼给大模型","ok":false}],"analysis":"答案：B\n\n解析：\nRAG实现快速相似度检索的核心是将文本转化为高维向量。通过嵌入（Embedding）模型把txt文档转为向量，并存入专为相似度计算优化的向量数据库，才能在海量数据中实现高效的语义检索。更改JSON格式或加密存储无助于检索；原样拼接文本不仅无法实现快速检索，还会超出大模型的上下文限制。因此B是必需步骤。"},{"gid":"e43465c9-6b8c-42c4-ac7b-371d20703a50","type":"单选题","q":"在开发过程中，你发现大模型调用某工具函数时常因输入参数格式错误而失败，最可能的原因是？","options":[{"t":"大模型运行时受到系统资源限制（如内存或处理延迟）影响，导致在处理复杂输入文本时发生数据截断或错误，生成错误的参数格式。","ok":false},{"t":"用户输入中可能包含非标准符号或格式不规范的内容，误导大模型在调用参数时产生偏差。","ok":false},{"t":"工具函数发生了变化，造成数据传输时自动转换格式出现问题，从而影响参数的正确生成。","ok":false},{"t":"工具函数的参数描述信息不足，未明确规定输入参数的具体格式，导致大模型生成调用参数时出现偏差 。","ok":true}],"analysis":"答案：D\n\n解析：大模型调用工具时，主要依赖工具的描述信息（Schema）来构造参数。若参数描述不足或未明确规定具体格式（如日期格式、枚举值等），大模型无法准确推断，极易生成错误格式。A项通常导致输出截断或超时；B项虽可能干扰意图，但大模型具备较强鲁棒性；C项属于工程传输Bug，非模型生成偏差的主因。因此，完善参数描述是解决该问题的核心。"},{"gid":"e225b604-65d0-4e64-95e4-2d7d2b5cbb3d","type":"单选题","q":"你是某公司 IT 部门主管，想使用大模型生成符合公司内部编码规范的 Java 代码模板，请问以下哪个提示词更合适？","options":[{"t":"请帮我生成一份 java代码，用于......","ok":false},{"t":"请帮我生成一份 java 代码，需求是：要求是：符合下列编码规范","ok":true},{"t":"请逐步分析需求，然后生成一份 java 代码，需求是：......","ok":false},{"t":"请参考开源社区流行的编码风格，生成一份 java 代码......","ok":false}],"analysis":"答案：B\n\n解析：本题核心需求是生成符合“公司内部编码规范”的代码。选项B明确提出“符合下列编码规范”，便于后续输入具体的内部规范细节，精准契合题意。选项A和C均未对编码规范作出限制；选项D要求参考“开源社区风格”，与公司内部规范相悖。故选B。"},{"gid":"32515bf0-3d69-40db-b9d0-c73b85669110","type":"单选题","q":"当我们发现使用的模型在大数计算时表现不佳，哪个措施提升最大？","options":[{"t":"改进提示词","ok":false},{"t":"微调模型，让它学会在大数计算时使用计算器插件","ok":true},{"t":"提供大数计算样例","ok":false},{"t":"使用微调提高模型的逻辑推理能力","ok":false}],"analysis":"答案：B\n\n解析：大语言模型本质是概率预测，缺乏精确算术能力。改进提示词(A)或提供样例(C)对大数计算提升有限；微调逻辑推理(D)难以让其掌握底层算术规则且成本高。微调模型使用计算器插件(B)即引入工具调用，让模型将计算交由外部专业程序执行，能从根本上解决大数计算的精度问题，是提升最大、最可靠的措施。"},{"gid":"c6bf75a4-3ad5-48c4-a570-dcfb3ac70b7f","type":"单选题","q":"某公司更新了组织架构，但知识库还是旧文档，查询结果经常过时。为避免回答陈旧信息，最合适的方式是？","options":[{"t":"定期同步最新文档并重建索引","ok":true},{"t":"调整 Node Parser 切片长度","ok":false},{"t":"对旧知识不做任何处理","ok":false},{"t":"增大模型温度让其自由生成","ok":false}],"analysis":"答案：A\n\n解析：查询结果过时的根本原因是底层数据未更新。定期同步最新文档并重建索引（A）能确保检索系统获取最新数据，从源头解决信息陈旧问题。调整切片长度（B）仅影响文本分块效果，无法更新内容；不处理旧知识（C）会延续错误；增大模型温度（D）会增加生成随机性，导致严重的“幻觉”。因此，保持数据源时效性并更新索引是最有效的方式。"},{"gid":"efec5b3e-3071-42ec-b0db-a94ca90ac7ec","type":"单选题","q":"某企业计划通过阿里云百炼平台构建一个大模型应用，用于处理对实时性要求不高的任务（如离线招生生成、批量内容摘要提取等）。为了在满足业务需求的同时降低运行成本，以下哪种措施可以最有效地优化成本？","options":[{"t":"引入流式输出，降低模型推理成本","ok":false},{"t":"调用最新且参数大的模型（如 Qwen-max）通过更好的技术降低计算成本","ok":false},{"t":"使用批量推理服务，离线方式处理数据","ok":true},{"t":"调用支持上下文缓存（Context Cache）的模型减少重复请求的计算开销","ok":false}],"analysis":"答案：C\n\n解析：题目明确任务“对实时性要求不高”且为“批量处理”。阿里云百炼的批量推理服务（Batch）专为此类异步离线任务设计，通过错峰利用算力，其价格通常远低于实时推理（如低至半价），是降本最有效的措施。A项流式输出仅优化体验不降成本；B项大参数模型调用成本更高；D项上下文缓存适用于重复前缀场景，针对离线批量任务不如C项直接有效。"},{"gid":"486723ad-9d74-447c-b6a3-ad2721674488","type":"多选题","q":"以下哪些选项属于流式输出相比于非流式输出的优势？","options":[{"t":"能够提升大模型回复的效果","ok":false},{"t":"能够给用户带来良好的阅读体验","ok":true},{"t":"能够加快大模型回复的速度","ok":false},{"t":"在网络连接时不会造成可能存在的超时错误","ok":true}],"analysis":"答案：B、D\n\n解析：\n流式输出仅改变传输方式，不影响模型生成质量，故A错。它允许用户边生成边阅读，减少等待焦虑，体验更佳（B对）；首字响应时间大幅缩短，用户感知的回复速度更快,但整体生成耗时并未缩短(C 错)；持续的数据传输能保持连接活跃，有效避免因生成耗时过长触发的网络超时错误（D对）。"},{"gid":"2bc1f330-1122-43e5-bf6c-f81547111f86","type":"多选题","q":"以下哪些选项是 abstract_generator 函数中提示词模板的关键组成部分？pythondef abstract_generator(document):prompt_template=\"\"\"【角色背景】你是一个专业的审稿人，你将阅读文稿，并生成摘要 【任务要求】你将看到一篇文章。请提取文章的主旨。 【输出要求】请以json格式输出，不要输出其他内容如{\"abstract\":\"xxx\"}摘要本身的内容不超过40个字 【用户输入】以下是用户输入，请审阅：\"\"\"query=prompt_template+documentQ_S(system,query)","options":[{"t":"任务要求描述","ok":true},{"t":"角色背景设定","ok":true},{"t":"输出格式要求","ok":true},{"t":"错误处理机制","ok":false},{"t":"用户输入示例","ok":false}],"analysis":"答案：A、B、C\n\n解析：\n代码中的`prompt_template`明确划分了三个模块：“【角色背景】”对应角色背景设定（B），“【任务要求】”对应任务要求描述（A），“【输出要求】”对应输出格式要求（C）。模板中未包含任何异常捕获等错误处理机制（排除D），且“【用户输入】”仅为上下文引导语，并未提供具体的输入示例（排除E）。故选ABC。"},{"gid":"de321fb2-3922-466b-9077-43c741eec5ad","type":"多选题","q":"以下选项中属于使用分隔符的主要目的有哪些？","options":[{"t":"规范化文档格式","ok":true},{"t":"明确提示词各要素之间的界限","ok":true},{"t":"使文档看起来更复杂","ok":false},{"t":"增加文字数量","ok":false},{"t":"随意分割文本","ok":false},{"t":"提高模型的运行速度","ok":false}],"analysis":"**正确答案：A、B**\n\n**解析：**\n在提示词工程中，使用分隔符（如“###”、“---”等）的核心目的是**明确提示词各要素之间的界限**（选项B），帮助大模型精准区分指令、背景信息和输入数据，避免语义混淆。同时，它也能**规范化文档格式**（选项A），使文本结构更清晰，提升模型解析的准确度。分隔符并非为了增加字数、随意分割或使文档复杂化，也不能直接提高模型的底层运行速度，故C、D、E、F均错误。"},{"gid":"92a96d6c-2287-4a28-82cd-3607e97f6ee2","type":"多选题","q":"以下哪些场景适合使用流式对话 LLM_MODEL.stream_chat (messages)？","options":[{"t":"实时聊天机器人，需要立即响应用户输入。","ok":true},{"t":"需要对大模型的输出进行实时监控和干预的场景。","ok":true},{"t":"用户需要快速获得初步结果，后续可以继续补充信息完善结果。","ok":true},{"t":"只需要一次性返回完整结果的简单任务，例如翻译单个单词。","ok":false},{"t":"需要处理长文本输入的场景，可以逐步返回结果，避免超时。","ok":true}],"analysis":"**答案**：A, B, C, E\n\n**解析**：\n流式对话的核心优势是边生成边返回，降低首字延迟。A项实时聊天需低延迟，流式可提升体验；B项逐步返回便于实时监控与中断干预；C项能快速展示初步结果，满足渐进交互；E项长文本任务耗时久，流式持续返回数据可防止连接超时。D项简单短任务耗时极短，用普通接口即可，流式反增网络开销。"},{"gid":"0c744523-32c7-43a8-adb5-e84fbd0084b7","type":"多选题","q":"以下哪些措施可以提高大模型在私域场景下的安全性？","options":[{"t":"对相关人员进行安全培训","ok":true},{"t":"建立完善的安全 incident 响应机制","ok":true},{"t":"使用开源的数据管理软件","ok":false},{"t":"将所有数据存储在云端","ok":false},{"t":"定期更新大模型和相关软件","ok":true},{"t":"对大模型进行持续的安全评估和测试","ok":true}],"analysis":"正确答案：A、B、E、F\n\n解析：A项人员培训可防范内部人为风险；B项响应机制确保安全事故快速止损；E项定期更新能修复系统与模型已知漏洞；F项持续评估测试可及时发现潜在威胁。C项开源软件未必安全；D项数据全上云违背私域“数据不出域”原则，反增泄露风险。"},{"gid":"4a9ddb07-0a8b-4988-a165-6428f9d63771","type":"多选题","q":"Assistant API 的 Assistant 类的各项功能中涵盖了以下哪些操作？","options":[{"t":"删除","ok":true},{"t":"更新","ok":true},{"t":"剪切","ok":false},{"t":"创建","ok":true},{"t":"复制","ok":false},{"t":"列举","ok":true}],"analysis":"**答案**：A、B、D、F\n\n**解析**：\n在OpenAI的Assistant API中，Assistant类主要用于管理助手对象，其功能围绕标准的资源管理操作展开。具体支持：创建（Create）新助手、更新（Modify）助手配置、删除（Delete）已有助手，以及列举（List）账户下的助手列表。API作为后端接口，并未提供“剪切”或“复制”这类属于前端图形界面的编辑操作。因此涵盖的操作为删除、更新、创建和列举。"},{"gid":"cef632d9-c568-4972-99f4-b6cf29702ea6","type":"多选题","q":"你为跨境电商平台开发了新功能:用户上传商品照片后，系统可以自动找到商品并向用户介绍商品特点。但上线后出现以下现象:1.图片能正常在文件存储控制台查看2.前端始终显示描述\"生成中\"3.模型服务监控显示无调用记录 你可以检查的技术要点是?","options":[{"t":"解码器的自注意力权重分布是否异常","ok":false},{"t":"完成图片上传后，后端是否正确调用图像理解的API接口","ok":true},{"t":"模型服务监控的日志接口是否正确绑定","ok":true},{"t":"多模态特征融合的门控机制激活阈值是否过高","ok":false}],"analysis":"正确答案：B、C\n\n解析：\n图片上传成功但前端卡住且模型无调用记录，表明问题出在业务调用链路或监控配置上。选B：后端可能未正确触发图像理解API，导致模型未被请求，前端持续等待；选C：可能模型实际已被调用，但监控日志接口未正确绑定，导致监控面板无记录。排除A、D：两者均为模型内部算法机制问题，在请求未到达模型（无调用记录）的阶段无需排查。"},{"gid":"f9fe9896-3f51-41ee-b321-1755f0297d6f","type":"多选题","q":"一家教育科技公司想开发人工智能教学产品。哪些方案能利用AI实现个性化、智能化和普惠教育?","options":[{"t":"方言识别系统辅助少数民族学生练习普通话","ok":true},{"t":"根据学习进度和学生兴趣生成课后实验，如电路故障排查等","ok":true},{"t":"考试时在线抽取选择题，实时自动判卷，对每个人的错误选项提供标准解析","ok":false},{"t":"自适应学习平台根据学生水平动态调整题库","ok":true}],"analysis":"答案：A、B、D\n\n解析：\nA项利用AI语音识别打破语言障碍，体现普惠教育；B项结合进度与兴趣生成实验，D项自适应动态调整题库，均深度利用AI实现个性化与智能化教学。C项虽能自动判卷体现智能化，但提供的是“标准解析”，缺乏针对学生个体认知差异的个性化指导，未完全契合题意。故选ABD。"},{"gid":"e188d5de-3001-4385-8820-ebc2cd3fe1b3","type":"多选题","q":"您负责一个新上线的AI语音助手。在一次市场推广活动中，流量瞬间飙升500%，导致大量用户反馈语音请求后收到“服务无法理解您的请求”的错误。事后排查，系统瓶颈在于语音转文本(ASR)模型服务无法承载瞬时洪峰流量。为了保障未来能优雅地应对此类流量洪峰，同时兼顾日常运营成本，以下哪些架构优化措施组合最为关键?","options":[{"t":"在客户端实现一个重试机制，一旦应答质量不佳或出现错误，立即自动重新发起整个语音请求。","ok":false},{"t":"引入消息队列(如Kafka/Pulsar)实现请求的削峰填谷。","ok":true},{"t":"部署一个轻量级的“看门人”模型，前置于核心ASR模型，用于快速过滤无效或格式错误的音频。","ok":true},{"t":"为所有内部服务问调用强制启用mTLS(双向认证)，确保通信链路的绝对安全。","ok":false}],"analysis":"答案：B、C\n\n解析：应对流量洪峰，B选项引入消息队列可削峰填谷，平滑ASR服务压力，防系统崩溃；C选项前置轻量级模型能快速拦截无效音频，减少核心ASR算力消耗，兼顾降本增效。A选项在洪峰时重试会加剧后端压力引发雪崩；D选项mTLS属安全机制，无助于缓解流量压力且增加计算开销。故BC为最佳组合。"},{"gid":"73a7aa70-0c75-45bf-aa82-600ef14e7008","type":"单选题","q":"你在需要构建公文智能处理系统，用户上传PDF文件后，系统需自动识别文本内容并生成摘要。以下哪\n种架构设计比较合理?","options":[{"t":"前端调用百炼模型直接解析PDF，模型将文件与结果存入网络存储，AI应用返回访问链接","ok":false},{"t":"前端上传文件至网络存储，触发AI应用解析文本，随后调用百炼模型生成全文摘要，结果存入数据库并返回前端","ok":true},{"t":"前端上传文件至AI应用，AI应用调用文本理解服务提取文本后存入数据库，再由百炼模型返回文本链接","ok":false},{"t":"由AI应用按页拆分PDF，依次由大模型生成页吸摘要并保存，最后合并页级摘要，通过深度思考生成全局摘要","ok":false}],"analysis":"答案：B\n\n解析：B架构最合理。A前端直连模型易泄露密钥且难处理大文件；C模型返回链接不符常规；D按页拆分会破坏公文跨页语义连贯性。B采用前后端分离，文件先存入网络存储（如OSS）以减轻服务器压力，再由后端安全调用大模型生成摘要并持久化。该设计兼顾了安全性、高可用与系统解耦，符合企业级工程最佳实践。"},{"gid":"65e5f605-0a87-4c1d-9155-8744f14028f8","type":"单选题","q":"【单选题】在回答“某技术方案的优点”时，模型常常忘记关键点，原因是相关信息分散在多个切片中。为提升回答的完整度，你会优先尝试哪种方案?","options":[{"t":"使用滑动窗口作为切片策略","ok":true},{"t":"提高大模型的presence_penalty","ok":false},{"t":"将所有文档整合成一段文本","ok":false},{"t":"固定随机种子 seed=42","ok":false}],"analysis":"答案：A\n\n解析：本题核心问题是“切片导致信息分散与语义割裂”。A选项“滑动窗口切片”通过设置文本重叠区域，能有效保留相邻切片的上下文连贯性，避免硬截断造成的关键信息丢失，是提升RAG检索完整度的优先策略。B选项用于控制生成文本的多样性；C选项极易超出模型的上下文窗口限制；D选项仅用于保证输出结果的可重复性，三者均无法解决信息分散问题。"},{"gid":"124fb207-c43d-43c3-b5a1-849ad930d909","type":"单选题","q":"[单选题]当RAG应用无法检索到相关信息时，大模型常常编造答案。以下哪种方法相对更有助于减少“幻觉\"?","options":[{"t":"使用更小参数量的模型","ok":false},{"t":"提示词明确要求“信息不足则回答无法解答","ok":true},{"t":"提高temperature","ok":false},{"t":"提高top_P","ok":false}],"analysis":"答案：B\n\n解析：在RAG应用中，若未检索到相关信息，大模型易凭自身参数“脑补”产生幻觉。通过提示词明确约束“信息不足则回答无法解答”（B），能有效限制模型在缺乏上下文时的自由发挥，显著减少幻觉。相反，小参数模型（A）理解力弱，更易产生幻觉；提高temperature（C）或top_P（D）会增加生成的随机性与发散性，反而会加剧幻觉问题。"},{"gid":"1a63735f-b83a-412b-9b11-a393f0920f7f","type":"多选题","q":"你负责的短视频平台在接入多模态技术后出现故障:\n1.用户输入\"生成夏日海滩vlog背景\"时，系统返回静态图片而非视频\n2.视频自动剪辑功能无法识别冲浪板等特定物体\n3.添加的AI解说语音与画面动作不同步\n需要重点检查的技术环节是?","options":[{"t":"视频编辑时是否设置了正确的时间轴","ok":true},{"t":"用户输入提示词是否包含精确时间标记","ok":false},{"t":"仅使用了文生图模型来生成完整视频","ok":true},{"t":"图像理解模型可能缺少对特定场景的训练数据","ok":true}],"analysis":"答案：A、C、D\n\n解析：\n故障1返回静态图片，需排查是否仅调用了文生图模型而未接入文生视频模型（C）；故障2无法识别冲浪板，说明图像理解模型可能缺少对该特定物体的训练数据（D）；故障3音画不同步，需检查音视频合成时是否正确设置了时间轴（A）。多模态系统应自动处理时序，无需用户输入精确时间标记，故B不是重点排查环节。"},{"gid":"ec20a897-0d3d-4a82-973e-42302fd7e025","type":"多选题","q":"你为跨境电商平台开发了新功能:用户上传商品图片后，系统应自动生成多语言商品描述。但上线后出现以下现象:\n1.图片能正常在OSS控制台查看\n2.前端始终显示\"描述生成中\"\n3.函数计算FC监控显示无调用记录\n你可以检查的技术要点是?(多选","options":[{"t":".OSS存储桶与FC函数是否部署在不同地域","ok":true},{"t":"函数计算FC的执行角色是否有OSS读取权限","ok":false},{"t":"百炼模型服务的API配额余额是否用尽","ok":false},{"t":"OSS存储桶是否配置FC触发器的事件通知","ok":true}],"analysis":"答案：A、D\n\n解析：\n核心现象是“FC无调用记录”，说明函数根本未被触发。\nD项：OSS需配置事件触发器才能联动FC，未配置或配置失效是无调用的直接原因，必查。\nA项：阿里云规定OSS触发器与FC函数须部署在同一地域，跨地域会导致触发失败，需排查。\nB、C项影响的是FC触发后的内部执行逻辑（读取文件、调用大模型），既然FC未被触发，故排除。"},{"gid":"622fb406-f37a-4bfc-8aa6-e300f858dec0","type":"多选题","q":"在多轮对话场景中，以下哪些方案，更有利于保障用户体验的同时，降低大模型使用成本？","options":[{"t":"在多轮对话场景中使用支持长上下文缓存的大模型 API","ok":true},{"t":"每次对话仅保留最近 2 轮历史，避免携带过长的上下文","ok":false},{"t":"按照 100 的长度，对历史对话取截断，避免携带上下文过长","ok":false},{"t":"在多轮对话场景中，避免始终传入完整的历史对话，而是用最早的历史对话做总结处理后携带在对话中","ok":true}],"analysis":"答案：A、D\n\n解析：\nA项利用上下文缓存复用已计算前缀，保留完整记忆且降低计算与Token成本；D项通过摘要压缩早期历史，在保留核心语境的同时大幅减少输入Token。两者均兼顾体验与成本。而B、C项采用机械截断或丢弃策略，虽能降本但会导致模型“失忆”，严重破坏对话连贯性，损害用户体验。故选AD。"},{"gid":"f8c54bd2-d73d-4731-af49-e4bc48e688b7","type":"多选题","q":"你在构建一个 RAG 应用，以下哪些提示词模板是合理的？","options":[{"t":"检索到的相关内容为，{检索到的文本段}用户的问题是，{用户问题}请结合以上信息，给出准确且简洁的回答。","ok":true},{"t":"以下是用户的问题，{用户问题}","ok":false},{"t":"以下是与问题相关的背景信息，{检索到的文本段}问题是，{用户问题}请基于背景信息，提供一个合理且完整的答案。","ok":true},{"t":"以下是检索到的内容，{检索到的文本段}","ok":false}],"analysis":"答案：A、C\n\n解析：RAG的核心是将“检索到的知识”与“用户问题”结合，并引导模型基于上下文作答。选项A和C均完整包含了检索文本、用户问题及明确的生成指令，能有效约束模型基于给定信息回答，减少幻觉，是合理的RAG模板。选项B缺失检索内容，仅为普通问答；选项D缺失用户问题和指令，无法引导模型生成有效回答。"},{"gid":"c44859ae-da3e-4822-a9a7-621201fda721","type":"多选题","q":"把 API Key 配置到环境变量里有哪些优点？","options":[{"t":"提高大模型的回复速度","ok":false},{"t":"提高大模型的回复准确率","ok":false},{"t":"降低泄漏风险","ok":true},{"t":"在其它代码中也可以直接加载环境变量，无需记住又长又复杂的 API Key","ok":true}],"analysis":"**答案**：C、D\n\n**解析**：\n将API Key配置到环境变量主要出于安全与便捷考虑。一方面，避免将密钥硬编码在代码中，能有效防止代码提交至公开仓库时引发的密钥泄漏风险（C正确）。另一方面，环境变量可被不同代码或脚本直接读取，开发者无需记忆或反复复制长串密钥，提升了开发效率（D正确）。而API Key的本地存储方式与大模型服务端的推理速度及回复准确率毫无关系（A、B错误）。"},{"gid":"ff284c5b-69f6-4e75-bad8-78b759681dcc","type":"多选题","q":"对于 RAG 应用的理解，以下哪两项描述是正确的？","options":[{"t":"RAG 中的“R”(Retrieval，检索)通常依赖专门的检索模块，从外部知识库中提取与输入问题最相关的文本信 息，为后续解答提供依据","ok":true},{"t":"在 RAG 框架中，大模型仅起信息汇总作用，即便其本身不熟悉某些领域的知识，也一定可以凭借总结能力准确回答问题","ok":false},{"t":"RAG 的“G”( Generation，生成)，指的是大模型在得到参考知识与输入问题后进行回答的过程","ok":true},{"t":"RAG的“A”(Augmented，增强)，是通过提示词来实时训练模型，达到增强模型的效果","ok":false}],"analysis":"答案：A、C\n\n解析：\nA正确，“R”指利用检索模块从外部知识库提取相关文本；C正确，“G”指大模型结合检索知识与问题生成回答。B错误，大模型不仅做汇总还需推理，且若检索信息有误或缺失仍会出错，并非“一定准确”。D错误，“A”指用检索到的外部知识增强提示词上下文，不涉及实时训练或更新模型权重。"},{"gid":"4de58885-773d-4ee4-8e34-ee8f37b217a4","type":"多选题","q":"你负责的短视频平台在接入多模态技术后出现故障。1：用户输入 “生成夏日海滩 vlog 背景” 时，系统返回静态图片而非视频2：视频自动剪辑功能无法识别冲浪板等特定物体3：添加的 AI 解说语音与动画动作不同步需要重点检查的技术环节是？","options":[{"t":"视频编辑时是否设置了正确的时间轴","ok":true},{"t":"图像理解模型可能缺少对特定场景的训练数据","ok":true},{"t":"仅使用了文生图模型来生成完整视频","ok":true},{"t":"语音合成模型采样率不合适导致视频音画不同步","ok":false}],"analysis":"答案：A、B、C\n\n解析：\n故障1返回静态图片，是因为系统仅调用了文生图模型而未使用文生视频模型（选C）；故障2无法识别冲浪板，是因为图像理解模型缺乏对该特定物体和场景的训练数据（选B）；故障3音画不同步，核心在于视频编辑合成时时间轴未正确对齐（选A）。D选项中，采样率不合适主要导致音频失真或变调，并非音画不同步的直接原因，故排除。"},{"gid":"28b45c3b-ccd8-4a3b-9579-21cb7ea62883","type":"多选题","q":"在决定模型微调前，你应该考虑以下哪些事情？","options":[{"t":"训练数据量是否达到微调的最低标准","ok":true},{"t":"该任务是否更适合使用 RAG","ok":true},{"t":"提示词工程是否能达到预期效果","ok":true},{"t":"训练服务器资源的成本","ok":true}],"analysis":"答案：A, B, C, D\n\n解析：微调成本高，决策前需全面评估。首先应尝试成本最低的提示词工程(C)；若任务侧重动态外部知识，RAG(B)通常比微调更合适且能减少幻觉；其次，微调依赖数据，需确认数据量达标(A)以避免过拟合；最后，必须核算算力等服务器资源成本(D)，评估投入产出比。这四项是微调前必须权衡的核心要素。"},{"gid":"7b73aae3-bb2a-44df-ba77-6e49008a6eea","type":"多选题","q":"某教育问答系统上线后，你通过监控日志发现模型有时会返回个人隐私信息，为防止此类敏感信息泄露，可以采取以下哪三项措施？","options":[{"t":"过滤用户提问，避免诱导性问题","ok":true},{"t":"在问答系统流式返回内容时，实时检测并过滤敏感信息","ok":true},{"t":"增加知识库内容的多样性，减少隐私信息被召回的概率","ok":false},{"t":"对教育知识库的内容进行脱敏处理","ok":true}],"analysis":"答案：A、B、D\n\n解析：\n防泄露需从输入、输出和数据源三端防护。A项在输入端拦截诱导提问，防止恶意套取信息；B项在输出端实时检测过滤，作为最后防线拦截敏感内容；D项在数据源端对知识库脱敏，从根源消除隐私数据。C项增加多样性无法根本避免隐私召回，且可能引入新风险，故不选。"},{"gid":"69dad41d-e3b4-4988-9506-1c9eec51ef94","type":"多选题","q":"哪种形式可以用作提示词的分隔符？","options":[{"t":"XML 标签","ok":true},{"t":"\u003c|CO|\u003e","ok":true},{"t":"大大","ok":false},{"t":"&hellip;","ok":false},{"t":"##","ok":true}],"analysis":"**答案**：A、B、E\n\n**解析**：\n提示词分隔符用于清晰界定指令与数据，防止模型混淆。A项XML标签（如`\u003ctag\u003e`）结构严谨，是主流推荐格式；B项`\u003c|CO|\u003e`属特殊Token标记，常用于特定模型或框架界定边界；E项`##`等Markdown符号常用于划分内容层级。C项“大大”属常规词汇，易与正文冲突；D项`&hellip;`为HTML省略号实体，两者均不具备良好的分隔功能，故排除。"},{"gid":"c1a1ce2d-c228-401b-a7c6-98dad1849e31","type":"多选题","q":"faithfulness、answer_relevancy、context_recall、context_precision 这些指标中，哪些指标仅评估检索阶段的性能？","options":[{"t":"context_precision","ok":true},{"t":"answer_relevancy","ok":false},{"t":"context_recall","ok":true},{"t":"faithfulness","ok":false}],"analysis":"答案：A、C\n\n解析：在RAG评估中，context_precision（上下文精确度）衡量检索内容中相关信息的排序质量；context_recall（上下文召回率）衡量检索内容是否覆盖了回答问题所需的全部信息，两者均仅评估**检索阶段**性能。而faithfulness（忠实度）评估答案是否忠于上下文无幻觉，answer_relevancy（答案相关性）评估答案与问题的契合度，两者均评估**生成阶段**性能。故选A、C。"},{"gid":"ffd7d8a7-a01f-4de6-be62-62674a0effca","type":"单选题","q":"以下代码片段中，temperature 参数设置为 0.6，其主要作用是什么？\nplaintext\n{\n\"do_sample\": true,\n\"temperature\": 0.6,\n\"top_p\": 0.9,\n}\n\u003c other parameters\n...","options":[{"t":"控制模型使用的 GPU 数量。","ok":false},{"t":"控制模型加载的权重数量。","ok":false},{"t":"控制模型生成文本的多样性。","ok":t
