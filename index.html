rue},{"t":"控制模型生成文本的长度。","ok":false}],"analysis":"答案：C\n\n解析：\n在大语言模型中，`temperature`（温度）参数主要用于控制生成文本的随机性与多样性。配合 `do_sample=True`，温度值越低（如0.6），模型输出越集中、保守；温度越高，输出越随机、发散。选项A、B属于硬件与模型加载配置，选项D（文本长度）通常由 `max_length` 等参数控制。因此，该参数的核心作用是调节生成内容的多样性。"},{"gid":"9c052d03-281c-4622-8a32-b22d29b012e3","type":"单选题","q":"在微调大语言模型的数据预处理流程中，哪一步骤旨在减少文本中的噪声，提高数据质量？","options":[{"t":"序列填充","ok":false},{"t":"文本清洗","ok":true},{"t":"特征选择","ok":false},{"t":"数据增强","ok":false}],"analysis":"答案：B\n\n解析：文本清洗旨在去除HTML标签、乱码、无关符号等噪声，直接提升数据质量，故选B。序列填充用于统一输入序列长度以满足模型张量计算需求；特征选择多用于传统机器学习降维，非大模型去噪步骤；数据增强旨在通过回译、改写等方式扩充数据规模，而非去噪。因此，减少文本噪声的核心步骤是文本清洗。"},{"gid":"cae76ab5-937d-4a2b-a690-22df4e64fbd6","type":"单选题","q":"以下代码片段中，哪一个是用于计算模型预测结果（前向传播）的？","options":[{"t":"optimizer.zero_grad()","ok":false},{"t":"outputs = model(inputs)","ok":true},{"t":"loss = criterion(outputs, labels)","ok":false},{"t":"optimizer.step()","ok":false}],"analysis":"答案：B\n\n解析：在PyTorch等框架中，`outputs = model(inputs)` 将输入数据传入模型，执行前向传播以计算预测结果。A选项 `optimizer.zero_grad()` 用于清空历史梯度；C选项 `loss = criterion(...)` 用于计算预测值与真实标签间的损失；D选项 `optimizer.step()` 用于根据梯度更新模型参数。故选B。"},{"gid":"c99ab2d1-c645-47a7-b8f4-c6f0594f17b1","type":"单选题","q":"在使用 Qwen-Max 辅助内容生成的过程中，以下哪个操作是正确的？","options":[{"t":"让 Qwen-Max 执行编程代码","ok":false},{"t":"利用 Qwen-Max 生成课程脚本","ok":true},{"t":"应用 Qwen-Max 进行视频剪辑任务","ok":false},{"t":"直接使用 Qwen-Max 进行图像设计","ok":false}],"analysis":"答案：B\n\n解析：\nQwen-Max 是大型语言模型，核心优势在于文本理解与生成。生成课程脚本属于典型的文本创作任务，完全在其能力范围内，故B正确。虽然它能编写代码，但本身无法直接“执行”代码（A错）；同时，作为语言模型，它不具备直接处理视频剪辑（C错）和图像设计（D错）的多媒体处理能力，这些任务需依赖专门的视觉模型或专业软件。"},{"gid":"10fd1169-8e30-4bd0-9f10-b723f71b1dad","type":"单选题","q":"在检测文档内容中是否存在营销性表达时，下列哪种方法可以更全面地识别问题？","options":[{"t":"识别所有内容错误的部分","ok":false},{"t":"让大模型自动修改内容","ok":false},{"t":"逐条单独识别营销词汇","ok":false},{"t":"一次性生成所有类型的识别结果","ok":true}],"analysis":"答案：D\n\n解析：营销性表达不仅依赖特定词汇，更与上下文语境和整体意图密切相关。逐条单独识别容易脱离语境导致误判或漏判；识别内容错误和自动修改不属于“识别营销”的范畴。一次性生成所有类型的识别结果，能促使模型综合全局上下文，从词汇、句式、语义和意图等多维度进行全面分析，从而更准确、全面地识别出营销性表达。"},{"gid":"97a75d99-a353-4ed6-8f8d-ccad3c330ef2","type":"单选题","q":"以下哪段代码设置了模型训练过程中的学习率？","options":[{"t":"optimizer = torch.optim.Adam(model.parameters(), lr=learning_rate)","ok":true},{"t":"criterion = nn.CrossEntropyLoss()","ok":false},{"t":"scheduler = torch.optim.lr_scheduler.StepLR(optimizer, step_size=100, gamma=0.1)","ok":false},{"t":"learning_rate = 0.001","ok":false}],"analysis":"答案：A\n\n解析：在PyTorch中，训练学习率需在优化器中设置。选项A在初始化Adam优化器时，通过`lr`参数将学习率传入，直接决定了模型参数更新的步长，是真正设置训练学习率的代码。选项B用于定义损失函数；选项C是学习率调度器，用于在训练中动态调整学习率，而非初始设置；选项D仅定义了一个普通变量，未将其应用到模型训练中。故选A。"},{"gid":"049c5d27-8d8d-4bd1-b3cc-d78d339e42c3","type":"单选题","q":"以下哪种方式不符合 RAG 优化的最佳实践？","options":[{"t":"使用 DashScopeParse 解析文档，提取文本和图片信息。","ok":false},{"t":"根据图片内容的复杂程度，选择性地使用视觉模型进行深层次解析。","ok":false},{"t":"直接将原始 PDF 文档内容输入向量数据库，不进行任何预处理。","ok":true},{"t":"使用语义千问 API 润色目录层级，补全缺失信息。","ok":false}],"analysis":"答案：C\n\n解析：\nRAG的效果高度依赖数据预处理质量。选项C直接将原始PDF输入向量数据库而不做预处理，会引入大量排版噪音和结构混乱，导致文本分块破碎，严重降低检索准确率与生成质量。而A、B、D选项通过专业工具、视觉模型和大模型对文档进行多模态提取与结构优化，能有效提升上下文质量，均符合RAG最佳实践。"},{"gid":"fa50bb65-a296-4ba5-9416-4876692be2cb","type":"单选题","q":"实现早停法（early stopping）时，通常在哪种情况下停止训练？","options":[{"t":"验证集损失连续 n 轮不再下降","ok":true},{"t":"验证集准确率达到 100%","ok":false},{"t":"训练集损失达到最小值","ok":false},{"t":"训练集准确率连续 n 轮上升","ok":false}],"analysis":"答案：A\n\n解析：\n早停法主要用于防止模型过拟合。训练时，训练集损失通常持续下降，但过拟合会导致验证集损失停止下降甚至上升。因此，早停法通过监控验证集表现，当验证集损失连续 n 轮（即 patience 参数）不再下降时提前终止训练，从而保留泛化能力最佳的模型参数。选项B不切实际，选项C和D仅关注训练集，无法有效判断过拟合，故选A。"},{"gid":"d926ddf8-79b7-4b36-a7da-8a0922523590","type":"多选题","q":"以下哪些任务可以使用 ffmpeg 完成？","options":[{"t":"提取视频中的音频。","ok":true},{"t":"调整视频的分辨率。","ok":true},{"t":"训练一个语音识别模型。","ok":false},{"t":"将多个视频片段合并成一个视频。","ok":true},{"t":"为视频添加水印。","ok":true},{"t":"转换视频格式（例如 mp4 到 avi）","ok":true}],"analysis":"答案：A、B、D、E、F\n\n解析：FFmpeg是强大的开源音视频处理工具。选项A、B、D、E、F均属于其核心的音视频编解码、滤镜处理及流操作功能，可通过特定参数或滤镜（如scale、concat、overlay）轻松实现。而选项C（训练语音识别模型）属于人工智能与深度学习领域，需依赖PyTorch、TensorFlow等机器学习框架，超出了FFmpeg的音视频处理范畴。"},{"gid":"727c28e0-753a-4504-b6e0-a7d512b433b6","type":"多选题","q":"在 qwen-plus 对 messages 进行回答后，如果你想按照当前对话基础继续提问，需要怎么做? LLM_MODEL=DashScope(model name=\"qwen-plus\")messages=[ChatMessage(role=MessageRole.SYSTEM,content=\" 你负责教育内容开发公司的答疑，你的名字叫公司小蜜，你要回答学员的问题。\"),ChatMessage(role=MessageRole.USER,content=\" 你好\")]","options":[{"t":"将大模型生成的Assistant Message添加到messages列表中","ok":true},{"t":"对话历史跟着模型名称走，所以只要继续指定模型为qwen-plus 就可以了","ok":false},{"t":"大模型不支持多轮对话","ok":false},{"t":"将新的User Message添加到messages列表中","ok":true}],"analysis":"**答案**：A、D\n\n**解析**：\n大模型是无状态的，不会自动记忆历史。实现多轮对话需手动维护上下文：模型生成回复后，需将该回复（Assistant Message）追加到 `messages` 列表中（A正确）；随后将用户的新提问（User Message）也追加进去（D正确），再将完整列表发给模型。模型不自动绑定历史（B错），且原生支持多轮对话（C错）。"},{"gid":"63a257cb-b643-4db2-a49b-a299830dfc8b","type":"单选题","q":"在大模型调用外部 API 工具时，工具函数的描述（description）起到的关键作用是什么？","options":[{"t":"帮助大模型理解何时以及如何调用该函数","ok":true},{"t":"减少 API 调用过程中的内存占用","ok":false},{"t":"加密 API 请求中的敏感数据","ok":false},{"t":"提高 API 调用的速度","ok":false}],"analysis":"答案：A\n\n解析：在大模型调用外部工具（如Function Calling）时，函数的描述（description）是模型理解工具功能的文本依据。它说明了工具的作用和适用场景，引导大模型准确判断“何时”触发该工具；同时结合参数描述，指导模型正确构造参数以决定“如何”调用。描述属于提示词范畴，与内存占用、数据加密及网络调用速度等底层系统性能或安全机制无关，故排除B、C、D。"},{"gid":"933b3431-2fe7-46c8-967a-f9706591ec85","type":"单选题","q":"梯度下降算法中，如果学习率设置过大可能导致？","options":[{"t":"在最优解附近震荡","ok":true},{"t":"需要更多迭代次数才能收敛","ok":false},{"t":"收敛速度过慢","ok":false},{"t":"参数更新幅度不足","ok":false}],"analysis":"答案：A\n\n解析：在梯度下降算法中，学习率决定了参数更新的步长。若学习率过大，每次更新幅度过大，容易直接跨越最优解，导致损失函数在最优解附近来回震荡甚至发散无法收敛（选A）。相反，若学习率过小，才会导致参数更新幅度不足（D）、收敛速度过慢（C），进而需要更多迭代次数才能收敛（B）。"},{"gid":"8037d4e4-8f65-460e-8e75-35ada8ec50cd","type":"单选题","q":"你需要借助大模型为小学生写一篇关于 “保护环境” 的科普短文，但输出的内容过于学术化（频繁使用 “碳达峰”“生物降解” 等术语）。以下哪个提示词优化方向能最直接解决该问题？","options":[{"t":"定义角色与受众：以 “小学科学老师” 身份，用比喻和故事向 “6 - 12 岁学生” 讲解","ok":true},{"t":"提供样例：附上一篇《如何节约用水》的短文（语言平实，包含互动问答）","ok":false},{"t":"补充任务目标：要求文章包含 “垃圾分类对社区的影响” 案例","ok":false},{"t":"扩展上下文：添加背景 “当前城市垃圾填埋占比超过 60%”","ok":false}],"analysis":"答案：A\n\n解析：题干核心痛点是“语言过于学术化，不符合小学生认知”。选项A通过设定“小学科学老师”角色与“6-12岁学生”受众，并指定“比喻和故事”的表达方式，能最直接、精准地约束大模型的语言风格，有效消除生涩术语。选项B的样例主题不符且不如直接设定受众高效；选项C和D侧重补充内容与背景，无法解决语言风格问题，甚至可能加剧学术化。故选A。"},{"gid":"36f36dd2-5846-4a24-a445-ddac74b8e06e","type":"单选题","q":"以下哪种方式有助于在大模型多轮对话场景中，保障生成内容质量的同时，降低成本，并提升响应速度？","options":[{"t":"使用 Batch API","ok":false},{"t":"并行调用大模型 API","ok":false},{"t":"使用支持上下文缓存的大模型 API","ok":true},{"t":"使用经过量化的模型","ok":false}],"analysis":"答案：C\n\n解析：在多轮对话中，历史上下文会重复输入。使用支持上下文缓存的API可复用已计算的上下文，避免重复处理。这能大幅减少Token消耗以降低成本，显著缩短首字响应时间，且不改变模型参数，完美保障生成质量。相比之下，A项Batch API牺牲了实时性；B项并行调用无法降低单次成本；D项模型量化虽提速降本，但会损失一定的生成质量。"},{"gid":"1478fa43-9c81-4ac9-9c3c-1df4b5e71958","type":"单选题","q":"你使用阿里云百炼平台的通义千问 API 开发了聊天机器人，用户反馈：提问某地天气时模型总是无法回答。如何快速解决这个问题？","options":[{"t":"提前设置话术，在面对类似问题时可以直接将话术返回给用户","ok":false},{"t":"通过复杂的工程手段，对用户的输入提取关键词，集成第三方搜索引擎，并将搜索结果返回给大模型","ok":false},{"t":"设置 enable_search（联网搜索）参数，为通义千问 API 引入联网能力","ok":true},{"t":"在聊天界面显眼位置标注限制，不建议用户输入类似问题","ok":false}],"analysis":"答案：C\n\n解析：大模型自身无法获取实时天气等最新信息。在阿里云百炼平台中，最快捷的方案是在调用通义千问 API 时设置 `enable_search` 参数为 `true`。这能直接为模型引入官方内置的联网搜索能力，自动检索实时数据并生成准确回答。选项A和D属于逃避问题，未满足用户诉求；选项B开发成本高，不符合“快速解决”的要求。"},{"gid":"aaa9f573-3ea9-445d-96d4-3c79b5b0cd54","type":"单选题","q":"在 RAG 的建立索引过程中，以下哪一点是将源知识文件分割成文本段的主要原因？","options":[{"t":"让大模型输出更加多样","ok":false},{"t":"提高检索精度，更快速定位相关段落","ok":true},{"t":"减少数据存储空间","ok":false},{"t":"减少索引构建时间","ok":false}],"analysis":"答案：B\n\n解析：在RAG中，将源文件分割成文本段（Chunking）的核心目的是**提高检索精度**。长文本语义易被稀释，导致向量表示不准；切分成语义聚焦的短文本段，能生成更精准的向量嵌入，使系统更快速、准确地匹配和定位相关段落。同时，这能避免向大模型输入无关信息，节省上下文窗口。文本分割不会减少存储空间或索引构建时间，也与大模型输出的多样性无关。"},{"gid":"4c702f01-ea4d-43c2-be70-7a48e5958dd1","type":"单选题","q":"某医疗知识问答应用，需要高度准确且专业的回答。开发者使用了一套自动化指标来评估回答质量，但业务专家坚持仍需亲自审阅部分问答样本，来确认自动化评测不会产生与预期违背的结果。为何需要专家审核?","options":[{"t":"因为自动化评测的成本太高","ok":false},{"t":"因为医疗领域专业性强，容错率低","ok":true},{"t":"因为自动化评测无法评估幻觉","ok":false},{"t":"因为专家更关心系统响应速度","ok":false}],"analysis":"答案：B\n\n解析：医疗领域专业性强且容错率极低，错误回答可能危及生命。自动化评测多基于文本表面特征，难以准确判断深层医学逻辑与事实，易出现“指标高但内容错”等违背预期的情况。因此，必须引入专家审核以弥补机器在专业语义理解上的局限，确保回答的安全与可靠。A、D不符常理，C仅为技术局限表象，B指出了必须人工介入的根本业务原因。"},{"gid":"0371ca54-c253-421b-8267-a29fe079975d","type":"多选题","q":"在创建 APIAssistantAgent 的过程中，将 functions 参数作为字典传入的解释正确的有哪些？","options":[{"t":"这样可以方便地根据函数名来动态调用对应的函数","ok":true},{"t":"由于 Python 中的类只能接收一个类型的参数，字典是唯一选择","ok":false},{"t":"为了让智能体能够调用不同的函数来满足用户的请求","ok":true},{"t":"该结构为智能体的多任务处理提供了更高的可扩展性","ok":true},{"t":"因为字典结构可以提供键值对，便于存储函数的信息","ok":true},{"t":"字典可以支持函数参数的动态传递，提高灵活性","ok":true}],"analysis":"**答案**：A、C、D、E、F\n\n**解析**：\n将`functions`作为字典传入时，键值对结构便于存储函数名与函数对象的映射信息（E），使Agent能根据大模型输出的函数名快速查找并动态调用（A），从而灵活满足不同用户请求（C）。此外，字典易于增删键值对，为多任务处理提供了高可扩展性。使用字典结构可以非常方便地在运行时动态构建、修改或传递参数组合（如根据用户上下文动态添加必填项、默认值或根据不同场景组装不同的函数 Schema），而无需硬编码静态函数声明,提高灵活性所以F对。B项错误，Python支持多种参数类型"},{"gid":"6ac631f7-d773-4ef7-a884-c3268307b43d","type":"多选题","q":"以下哪些方法有助于你减少大模型应用的输出结果等待时间？","options":[{"t":"使用支持上下文缓存的模型 API","ok":true},{"t":"使用参数量更大的模型","ok":false},{"t":"提前生成和复用内容","ok":true},{"t":"减少输入 Token 数量","ok":true}],"analysis":"**正确答案：A、C、D**\n\n**解析：**\nA项：上下文缓存可复用已计算的长文本特征，显著降低首字响应延迟。\nB项：参数量更大的模型计算复杂度更高，推理更慢，反而会增加等待时间。\nC项：提前生成和复用内容（如语义缓存）可直接返回结果，免去实时推理耗时。\nD项：减少输入Token能缩短模型预处理（Prefill）时间，加快整体响应速度。"},{"gid":"f3e18779-9643-4afe-ad94-83b5c55bb68c","type":"多选题","q":"某游戏平台上线了一个辅助聊天机器人，可帮助玩家完成游戏内交易、提交客服工单，以及获取实时游戏分析。有玩家发现机器人时常在简单客服请求时错误调用 analytics 工具。为改进这个多智能体系统的工具使用准确性，应该怎么做？","options":[{"t":"删除 analytics 相关 Agent","ok":false},{"t":"在 Agent 指令中进一步明确各 Agent 的功能边界","ok":true},{"t":"改进 Planner Agent 的决策逻辑，精细化路由","ok":true},{"t":"将游戏的所有代码库交给聊天机器人学习","ok":false}],"analysis":"答案：B、C\n\n解析：\nA项因噎废食，会丧失分析功能；D项学习全量代码成本高且易引发幻觉，无法解决路由错误。B项通过明确指令和功能边界，能有效减少Agent间的职责混淆；C项优化Planner Agent的决策与路由逻辑，可精准匹配意图与工具，直接解决误调问题。二者均能有效提升多智能体系统的工具调用准确性。"},{"gid":"3d335324-5965-4eb4-8773-fc83e8fc8a42","type":"多选题","q":"你和同事在设计一个知识库答疑机器人，他提出了以下路线，哪两个是合理的？","options":[{"t":"大模型能力很强，我们把所有知识文件的内容丢给大模型让它总结。","ok":false},{"t":"我们可以通过人工与大模型对公司的知识文件生成很多问答对，再使用问答对微调大模型，使大模型了解我们公司的知识。","ok":true},{"t":"相信大模型的能力，无需外部知识库支持，因为大模型已经预训练了海量数据。","ok":false},{"t":"大模型最大输入长度有限，应该使用 RAG，先召回最相关的文本段，将文本段与输入问题进行拼接后输入大模型。","ok":true}],"analysis":"答案：B、D\n\n解析：\nA错，大模型有上下文长度限制，无法一次性输入所有文件。C错，大模型缺乏公司私有知识且易产生幻觉，需外部知识库支持。B对，利用问答对微调大模型，能有效将公司私有知识内化，提升专业问答能力。D对，RAG（检索增强生成）可突破输入长度限制，精准召回相关知识片段辅助大模型生成准确回答，是企业知识库的主流方案。"},{"gid":"54d5788f-0755-4e8a-82a3-0b6cddb42761","type":"多选题","q":"qwen2.5-1.5b 模型训练过程中较大的 batch size 会带来哪些影响？","options":[{"t":"帮助模型充分地学习训练集","ok":false},{"t":"可能导致模型泛化性能下降","ok":true},{"t":"加速训练过程","ok":true},{"t":"GPU 显存消耗更大","ok":true}],"analysis":"**答案**：B, C, D\n\n**解析**：\n较大batch size能提升GPU并行计算效率，减少参数更新次数，从而**加速训练(C)**；同时需存储更多中间变量，导致**显存消耗更大(D)**。但大batch会减少梯度的随机噪声，易使模型陷入尖锐极小值，导致**泛化性能下降(B)**。相反，较小batch引入的噪声反而有助于模型探索参数空间、更充分地学习特征，故A不选。"},{"gid":"68195c9b-6a93-48b4-babf-b8c601516bbf","type":"多选题","q":"你发现检索到的切片里常常遗漏上下文，导致回答片段化。下列哪些是有效且合理的改进措施？","options":[{"t":"改用 “句子窗口切片” 或 “滑动窗口检索”","ok":true},{"t":"增大 chunk_overlap","ok":true},{"t":"避免切片，将文档完整的拼接到提示词中","ok":false},{"t":"适当调大召回文档切片数量（例如从 Top3 调整为 Top5）","ok":true}],"analysis":"答案：A、B、D\n\n解析：\nA项“句子窗口/滑动窗口”能在检索时动态扩展上下文，直接解决片段化；B项增大chunk_overlap可增加相邻切片的重叠信息，减少语义截断；D项调大Top-K能召回更多相关切片，补充缺失上下文。C项不合理，完整文档拼接极易超出大模型上下文窗口限制，导致“迷失在中间”现象并大幅增加计算成本。因此选ABD。"},{"gid":"56044479-673e-44e1-a958-27b54185ff59","type":"多选题","q":"如果将 RAG 与开卷考试相类比，下列哪两项描述最符合它们的相同之处？","options":[{"t":"都是通过引入外部知识来增强输出","ok":true},{"t":"人的思维与大模型的权重参数，都会随着外部知识的输入而发生改变","ok":false},{"t":"都需要提前对知识作出标记，来帮助检索","ok":true},{"t":"都不需要对问题本身进行理解即可回答","ok":false}],"analysis":"**答案**：A、C\n\n**解析**：\nA正确：RAG与开卷考试均依赖外部资料（知识库或书本）弥补自身知识盲区，提升回答质量。\nC正确：RAG需对知识进行向量化索引，开卷考试需对书本做标签笔记，两者均需提前“标记”以加速检索。\nB错误：检索外部知识不会改变大模型权重或人的固有思维（微调或深度学习才会）。\nD错误：两者都必须先准确理解问题，才能进行有效检索并作答。"},{"gid":"344e004a-2d2a-4236-9174-0bf1349d60e4","type":"多选题","q":"在开发一款基于大语言模型的会议纪要生成工具时，团队发现模型在处理会议记录时经常遗漏关键决议内容，导致生成的纪要不够准确和全面。以下哪两个选项能较低成本地解决这一问题？","options":[{"t":"增加模型的训练数据量，特别是包含更多会议记录样本的数据集","ok":false},{"t":"要求模型在输出纪要时使用特定格式（如紫色字体或表格形式）","ok":false},{"t":"在提示词中明确角色定义，例如 “你是一名专业秘书，负责从会议记录中提取所有关键决议和行动项”","ok":true},{"t":"要求模型先对会议记录中的行动项和决议进行逐句摘要标记，再生成最终的纪要","ok":true}],"analysis":"答案：C、D\n\n解析：\nA项增加训练数据成本高昂；B项改变输出格式无法解决内容遗漏问题。C项利用提示词工程明确角色与任务，能引导模型聚焦关键决议，成本极低；D项运用思维链（CoT）技巧，让模型先标记后总结，分步处理可显著减少信息遗漏并提升准确性，且仅需修改提示词，实施成本低。C和D均通过优化提示词以极低成本提升了模型表现。"},{"gid":"573b2d03-cf93-4989-9abd-874b5d0cc25a","type":"单选题","q":"你希望你所构建的大模型客服应用能保障合规性的同时，也要确保用户使用体验，以下哪个技术方案更可靠且不明显影响体验？","options":[{"t":"在大模型生成答案后，使用正则表达式过滤器，检测并替换敏感关键词","ok":false},{"t":"结合内容安全服务，对大模型流式输出实施实时合规扫描，违规片段内容进行替换","ok":true},{"t":"基于关键词实时匹配触发拦截机制，高危内容直接终止响应并提示用户","ok":false},{"t":"部署混合模型架构：大模型生成回答后，立即调用专用小模型进行合规性重写","ok":false}],"analysis":"答案：B\n\n解析：A项正则匹配易误杀且缺乏语义理解，可靠性低；C项直接终止响应会严重打断对话，体验极差；D项串行调用小模型重写会显著增加响应延迟。B项结合专业内容安全服务，语义识别准确率高，保障合规可靠性；同时对流式输出进行实时扫描与局部替换，不增加首字延迟，能平滑处理违规内容，在合规与体验间取得最佳平衡。"},{"gid":"323d4797-6f08-41ce-9828-55e536e2185f","type":"单选题","q":"某团队需要翻译一份文档，其中包含 30 条机构内部术语的英文缩写，为了确保翻译的高准确性，以下哪种方案能解决这一问题？","options":[{"t":"在提示词中提供 30 条对应术语缩写与翻译示例","ok":true},{"t":"提供前 5 条翻译示例，要求模型类推处理剩余条目","ok":false},{"t":"直接让大模型翻译，大模型能够完成这类任务","ok":false},{"t":"使用支持联网搜索的大模型 API 完成此任务","ok":false}],"analysis":"答案：A\n\n解析：机构内部术语属于大模型未知的私有知识，直接翻译(C)或少量示例类推(B)极易产生幻觉。内部术语通常不公开，联网搜索(D)无效。在提示词中完整提供30条术语及翻译示例(A)，通过注入外部知识和少样本提示，能精准约束模型输出，是确保高准确性的最有效方案。"},{"gid":"214916b7-28d4-4eca-9ff9-422207eb543f","type":"单选题","q":"相比直接使用大模型的 API，使用百炼的 Assistant API 构建 Agent 的主要优势是什么？","options":[{"t":"能够绕过一些 API 调用限制，使得开发出的 Agent 功能更强大","ok":false},{"t":"能够完全控制模型底层训练过程","ok":false},{"t":"自带了会话管理和联网搜索等工具，简化 Agent 开发工作","ok":true},{"t":"能够修改一些大模型 API 不直接提供的参数，使得开发 Agent 的过程更灵活","ok":false}],"analysis":"答案：C\n\n解析：直接使用大模型API需开发者自行实现上下文记忆、工具调用等复杂逻辑。百炼的Assistant API封装了会话管理、知识库检索、联网搜索等内置工具与状态管理功能。开发者无需从零编写这些底层逻辑，只需关注业务编排，大幅简化了Agent开发工作并降低了代码量。选项A、B、D均不符合其实际定位与功能。"},{"gid":"ece93903-b5ac-43bf-8649-72a245203e78","type":"单选题","q":"你在开发一个旅途规划系统，希望该系统能够帮助用户规划出行交通方式、具体景点行程、以及住宿安排，并且将总预算控制在指定范围内。以下哪种设计方案更为合理：","options":[{"t":"设计一个多 Agent 系统，主 Agent 拆分任务\u003e子 Agent 独立执行\u003e基于模板汇总子 Agent 执行结果","ok":false},{"t":"设计一个单 Agent 系统，依次调用对应服务 API，在代码中写好预算分配规则，最终基于模板汇总信息形成规划表格","ok":false},{"t":"设计一个多 Agent 系统，规划 Agent 规划拆分任务\u003e子 Agent 并行执行\u003e汇总 Agent 校验冲突（如或酒店与交通预订时间冲突）","ok":true},{"t":"基于工作流，按照常用顺序（交通\u003e 景点\u003e住宿），依次调用对应服务 API\u003e基于模板汇总子 Agent 执行结果","ok":false}],"analysis":"正确答案：C\n\n解析：旅途规划中的交通、景点和住宿存在强耦合，极易产生时间或预算冲突。C选项的多Agent架构不仅通过规划Agent拆分任务、子Agent并行执行以提高效率，更关键的是引入汇总Agent进行全局冲突校验与协调，能有效保障行程的可行性。相比之下，A缺乏冲突校验，B硬编码规则缺乏灵活性，D固定工作流缺乏动态反馈与调整机制，均难以应对复杂的规划需求。"},{"gid":"585fc397-dde8-40c4-9042-447ca34426f5","type":"单选题","q":"某大学为学生提供一款问答机器人，能回答课程安排和考试时间，学校想新增自助预定自习室功能，需要查询并预定教室资源。要使这个功能能与现有问答无缝集成，合适的做法是什么？","options":[{"t":"在模型系统消息中提供大量备用的数据","ok":false},{"t":"使用一个专门的 Agent 调用内部预定 API","ok":true},{"t":"仅通过提示让模型推测当前可用教室","ok":false},{"t":"在 Prompt 中写死可预约教室列表","ok":false}],"analysis":"答案：B\n\n解析：教室状态是实时动态变化的，且“预定”需执行实际的系统操作。选项A和D将数据写死在提示词中，无法反映实时状态且无法执行预定动作；选项C依赖模型推测会产生幻觉。使用专门的Agent调用内部API（选项B），可通过工具调用实时查询教室状态并完成预定，是处理动态数据与外部系统交互的标准做法，能实现无缝集成。"},{"gid":"4b8f1053-21e2-4342-b74c-cf4b17e32ead","type":"单选题","q":"你开发了一个专用于医疗场景问答的 RAG 应用，许多用户都反馈说关于疾病症的回答总是得不到正确答案，你应该首先检查哪一环节？","options":[{"t":"检查检索环节的 embedding 模型是否能分辨相似的文本段","ok":false},{"t":"检查训练集的内容是否存在于知识库中","ok":true},{"t":"检查计算资源是否充足","ok":false},{"t":"检查大模型是否能根据知识内容对问题进行正确解答","ok":false}],"analysis":"在 RAG（检索增强生成）系统中，回答的准确性首先依赖于知识库中是否包含相关知识。根据阿里云百炼 RAG 效果优化文档，当出现“检索无效：没有找到相关知识”的情况时，首要解决方案是确认知识库中是否包含相关知识；若知识库中没有相关知识，大模型大概率无法回答相关问题，此时应更新知识库补充内容。只有在确认知识已存在但召回不准确时，才需要进一步排查 embedding 模型分辨能力、切分策略或大模型生成能力等环节\n。计算资源充足与否主要影响响应速度和并发能力，不直接导致回答内容错误。"},{"gid":"9a2c91cd-d582-4dee-9c59-52d6171722ef","type":"单选题","q":"在开发一个需要调用大模型 API 的应用时，为了保护敏感信息不被泄露，以下哪种方式是处理 API Key 的安全做法？","options":[{"t":"在代码中写入 API Key","ok":false},{"t":"将 API Key 存储到环境变量中","ok":true},{"t":"在代码注释中记录 API Key","ok":false},{"t":"将 API Key 保存在公开的配置文件中","ok":false}],"analysis":"答案：B\n\n解析：\n将API Key硬编码在代码（A）、注释（C）或公开配置文件（D）中，极易随代码提交到版本控制系统或被外部直接访问，导致密钥泄露。将API Key存储在环境变量（B）中，可实现代码与敏感配置分离。应用运行时动态读取环境变量，既保证密钥不暴露在代码库中，又方便在不同环境（开发、生产等）灵活切换，是业界公认的安全最佳实践。"},{"gid":"614cae7f-b688-47d4-bb3f-b34e0c84a377","type":"单选题","q":"某律所希望开发一个基于 RAG 的合同审阅系统，已通过 POC（Proof of Concept，是针对客户具体应用的验证性测试）验证了系统对于一些常见问题的准确性和效率。下一步应该优先做什么？","options":[{"t":"降低相似度阈值，增加召回文本段个数","ok":false},{"t":"对前端界面进行优化","ok":false},{"t":"针对 POC测试中的问题进行反复优化","ok":false},{"t":"请法律专家参与构建评测集","ok":true}],"analysis":"答案：D\n\n解析：POC已验证常见问题，系统迈向生产前需进行全面、专业的评估。法律领域严谨复杂，优先请法律专家构建高质量评测集，能为后续深度优化提供科学依据。盲目调参（A）或优化前端（B）非当前核心，仅针对POC问题优化（C）易过拟合且缺乏全局标准。因此选D。"},{"gid":"bb73e3a2-6d00-4449-bd42-e1b6fa4d9963","type":"单选题","q":"某连锁咖啡品牌采用视觉理解模型巡检门店以节约成本，但发现任务完成率不理想。故升级为大小模型搭配智能体协同:小模型负责图像定位与抠图，大模型负责状态判定。然而监测显示，大模型仍频繁处理原始图像，导\n致资源浪费。应重点优化:","options":[{"t":"在Planner Agent中优先将图像识别任务分配给小模型，仅将复杂状态判断交由大模型处理","ok":true},{"t":"扩展GPU服务器集群规模，以提升大模型的运算速度","ok":false},{"t":"为大模型添加更多低价值任务的训练数据，提高其对区域定位任务的专用性","ok":false},{"t":"要求门店员工预先标注监控画面中的关键区域，从而减少系统对自动区域定位的依赖","ok":false}],"analysis":"答案：A\n\n解析：题干痛点是大模型频繁处理原始图像导致资源浪费，说明大小模型协同的任务分配机制失效。A项通过优化Planner Agent调度，确保小模型优先完成图像定位与抠图，大模型仅基于抠图结果进行复杂状态判定，直接解决资源浪费，符合协同初衷。B项仅提速未解决分配问题；C项让大模型做基础任务违背初衷；D项增加人工成本，违背节约成本目的。"},{"gid":"55fb972f-d98f-4e3a-9876-3f8cae18a6c4","type":"多选题","q":"用户反馈你开发的客服机器人连续返回乱码，排查发现:\n1.用户语音上传OSS成功\n2.FC函数被触发但日志显示「模型解析失败」\n3.独立部署的模型服务的监控显示QPS突增500%\n哪些项是可能的原因?","options":[{"t":"独立部署的模型服务不支持自动扩缩容，高并发下服务崩溃","ok":true},{"t":"前端上传数据时参数未进行编码转换，传输了非标准格式或结构异常的参数","ok":false},{"t":"OSS存储桶权限配置错误，导致函数计算FC和模型服务无法读取音频文件","ok":false},{"t":"函数计算FC调用模型服务时未设置超时机制，部分请求被重复提交","ok":true}],"analysis":"**答案：A、D**\n\n**解析：**\n语音上传OSS成功可排除C。模型QPS突增500%说明请求暴增，D项中FC未设超时机制导致请求被重复提交，是QPS突增的直接原因；A项中模型服务不支持自动扩缩容，在QPS突增的高并发下崩溃，返回异常数据（如HTML错误页），导致FC解析时报“模型解析失败”及用户端显示乱码。B项语音文件多为二进制流，不涉及参数编码转换，且无法解释QPS突增现象，故排除。"},{"gid":"178761e3-96a6-4016-b740-ceec1b237b0e","type":"单选题","q":"模型微调适合解决哪种任务？","options":[{"t":"数据量极小的任务","ok":false},{"t":"需要学习庞大知识库的任务","ok":false},{"t":"需要模型学习专业领域知识的任务","ok":true},{"t":"数据分布剧烈漂移的任务","ok":false}],"analysis":"答案：C\n\n解析：微调最适合让模型学习专业领域知识、特定输出格式或语言风格（C正确）。数据量极小（A）时微调易过拟合，更适合少样本提示；学习庞大知识库（B）成本高且易产生幻觉，更适合检索增强生成（RAG）；数据分布剧烈漂移（D）时微调易导致灾难性遗忘，通常需要重新训练或引入持续学习机制。因此选C。"},{"gid":"27cb80d5-d681-4d3a-bb61-a56f0a0777ff","type":"单选题","q":"你希望大模型客服在处理模糊请求时（如用户说 “我想订票”），能主动追问必要信息（如时间、地点），以下哪种提示词设计最有效？","options":[{"t":"你是一个订票客服人员。请根据用户提供的信息来回答问题或进行订票。","ok":false},{"t":"你是一个订票客服人员。对于订票问题，如果信息不完整，应询问用户，直到获取了完整的出发地、目的地、时间信息。如果是其他票务问题，则正常回答。","ok":true},{"t":"你是一个细心的订票客服人员。注意每次回复后必须追加一个问题，例如 “请问需要补充什么信息？”","ok":false},{"t":"你是一个订票客服人员。对于订票问题，如果信息不完整，请向用户主动询问订票相关信息。如果是其他票务问题，则正常回答。","ok":false}],"analysis":"答案：B\n\n解析：B选项最有效。它明确了触发条件（信息不完整）、具体追问目标（出发地、目的地、时间）及业务边界（其他问题正常回答），指令清晰，能引导模型精准追问。A缺乏追问机制；C会导致每次盲目追问，体验差；D未明确需收集的具体要素，模型可能追问不全。B的约束最严谨具体，效果最佳。"},{"gid":"d3e64597-16f5-4358-bc7b-c48bd1f5e67f","type":"单选题","q":"游戏公司开发 AI 数字人 NPC 时，以下哪项技术要求目前最难实现？","options":[{"t":"根据玩家情绪调整对话语气","ok":false},{"t":"识别语音指令执行简单任务","ok":false},{"t":"实时生成符合角色设定的剧情分支","ok":true},{"t":"通过动作捕捉复现预设舞蹈动作","ok":false}],"analysis":"答案：C\n\n解析：A项情感语音合成、B项语音识别与任务执行、D项动作捕捉均为已成熟或广泛商用的技术。C项要求大模型在实时交互中，既要保持角色设定不崩塌（避免幻觉），又要生成逻辑严密且能与游戏底层状态机联动的剧情分支。这涉及极高的生成延迟控制、长上下文逻辑一致性以及AI与游戏引擎的深度耦合，是目前业界公认的技术瓶颈与最大难点。"},{"gid":"ef85d5e6-b545-45af-97e3-8116bb8b3b9f","type":"单选题","q":"在 qwen2.5 - 1.5b 模型微调时，训练损失和验证损失在快速下降，以下说法正确的是？\n选项：","options":[{"t":"说明模型已收敛，可停止训练","ok":false},{"t":"说明模型开始过拟合，需立即停止","ok":false},{"t":"说明学习率设置过高，需调小","ok":false},{"t":"说明训练策略有效，应继续训练","ok":true}],"analysis":"答案：D\n\n解析：训练损失和验证损失同时快速下降，表明模型正在有效学习数据特征且未出现过拟合（排除B）。损失仍在“快速”下降说明模型尚未收敛，不应停止（排除A）。若学习率过高，通常会导致损失曲线震荡或发散，而非平稳下降（排除C）。因此，这说明当前训练策略有效，应继续训练，直至损失趋于平缓或验证损失开始反弹。"},{"gid":"ee05be34-1f5f-4a76-bf7b-ed250712bbdb","type":"单选题","q":"你想使用 Qwen - Max 从一段冗长的课程文本中提炼出关键信息，用于创建 PPT 脚本。以下哪个提示词最合适？","options":[{"t":"用更少的字概括这段文字","ok":false},{"t":"缩短这段文字","ok":false},{"t":"从以下课程文本中提取关键信息，生成一个简洁的 PPT 脚本大纲，突出重点内容，并控制在 5 个要点以内。","ok":true},{"t":"把这段文字变成 PPT","ok":false}],"analysis":"答案：C\n\n解析：\nC选项最符合提示词工程的最佳实践。它明确了具体任务（提取关键信息、生成PPT脚本大纲），设定了清晰的标准（简洁、突出重点），并给出了量化约束（5个要点以内）。相比之下，A、B选项过于宽泛，缺乏具体场景和目标；D选项指令模糊，大模型无法直接生成PPT文件且未明确提炼要求。C选项能引导模型输出最精准、结构化的结果。"},{"gid":"e6ce7dc0-558a-45aa-b894-8d341d4dcc4f","type":"单选题","q":"在设定大语言模型的训练参数时，哪个参数可以影响模型每次更新时所考虑的数据量，并间接影响到模型收敛速度和内存使用？","options":[{"t":"学习率","ok":false},{"t":"正则化","ok":false},{"t":"批大小","ok":true},{"t":"动态学习率策略","ok":false}],"analysis":"答案：C\n\n解析：批大小（Batch Size）决定了模型每次参数更新前处理的样本数量，即每次考虑的数据量。增大批大小会显著增加内存（显存）消耗，同时提供更稳定的梯度估计，进而影响模型的收敛速度。学习率控制参数更新步长，正则化用于防止过拟合，动态学习率策略仅调整学习率，三者均不决定每次更新的数据量。因此选C。"},{"gid":"f44144fb-a179-4788-8001-5708e1d4e9aa","type":"单选题","q":"在下列哪项任务中，大模型可能不是最佳工具选择？","options":[{"t":"分析用户反馈，识别产品改进建议的主题。","ok":false},{"t":"确定两种药物治疗效果是否有统计学上的显著差异。","ok":true},{"t":"自动为新闻文章分配合适的标签类别。","ok":false},{"t":"从大量日志数据中自动检测异常登录行为","ok":false}],"analysis":"答案：B\n\n解析：大模型擅长自然语言处理，如主题提取（A）和文本分类（C）。但大模型本质是概率模型，不擅长精确数学计算与严谨的统计推断。确定药物疗效的统计学显著差异（B）需严格的假设检验和精确计算，传统统计软件更准确可靠，大模型易产生计算幻觉。虽然日志异常检测（D）用传统算法更高效，但B涉及严格统计计算，是大模型的绝对短板，故不是最佳选择。"},{"gid":"3cc32004-79bf-49b1-91e4-5dde45e51f43","type":"单选题","q":"检查以下代码，如果需要添加一个新的意图类别，例如 “入职流程”，需要修改哪一部分代码？python# 获取用户意图的核心算法def get_purpose(document):prompt_template=\"【角色背景】你是一个专业的管理者，你将阅读一条用户的问题并进行用户意图分类【任务要求】我们需要将用户的意图分成如下几类：请假政策，福利待遇，绩效考核，工作职责，开发规范【输出要求】请以json格式输出，不要输出其他内容格式如{\"purpose\":\"请假政策\",\"query\":\"请假流程是怎样的，需要提前多久申请？\"}其中，purpose是你识别出的意图，query是用户输入的原始文本【用户输入】以下是用户输入，请审阅：\"query = prompt_template + document","options":[{"t":"只需要修改输入的用户 query 列表","ok":false},{"t":"需要修改输出格式要求。","ok":false},{"t":"需要修改 prompt_template 中的【任务要求】部分，以及可能需要更新 get_purpose 函数中的逻辑。","ok":true},{"t":"只需要修改 大模型 query 函数 Q_S_Line","ok":false}],"analysis":"答案：C\n\n解析：\n添加新意图“入职流程”，必须修改`prompt_template`的【任务要求】，将新类别补充到提示词中，大模型才能识别并输出该意图。同时，若`get_purpose`函数或下游业务中存在针对已知意图的硬编码校验或路由分发逻辑，也需同步更新以支持新类别。选项A、B、D均未触及提示词的核心分类定义，故C最准确全面。"},{"gid":"b1fce2c3-5633-41ee-a8ce-b1b15bcbf2a3","type":"单选题","q":"在创建一个消息（Message）时，需要传递哪个参数来指定线程 ID？","options":[{"t":"thread.id","ok":true},{"t":"message.id","ok":false},{"t":"content","ok":false},{"t":"assistant.id","ok":false}],"analysis":"答案：A\n\n解析：\n在AI助手API（如OpenAI Threads API）中，消息（Message）必须依附于特定的线程（Thread）。创建消息时，需传递 `thread.id`（线程ID）来指定该消息归属的线程。选项C的 `content` 用于传递消息的具体文本内容；选项D的 `assistant.id` 用于指定处理该线程的助手；选项B的 `message.id` 是消息创建后系统自动生成的唯一标识，无需在创建时传递。因此选A。"},{"gid":"df87dc4d-d314-42d3-b779-ac7380316a55","type":"单选题","q":"在大模型对话的 API 中，assistant 角色的作用是什么？","options":[{"t":"提供用户输入","ok":false},{"t":"监控对话的安全性","ok":false},{"t":"设定对话的背景信息","ok":false},{"t":"代表模型本身，返回生成的回复","ok":true}],"analysis":"答案：D\n\n解析：在大模型对话API中，消息通常包含三种核心角色：`system`用于设定对话背景与系统指令（选项C）；`user`代表人类，提供用户输入（选项A）；`assistant`代表模型本身，用于返回生成的回复，或在上下文中提供历史回复示例以引导输出风格。监控安全性（选项B）通常由独立的安全审核机制负责。因此，assistant的作用是代表模型返回回复。"},{"gid":"702e25a6-7baf-469c-aa56-7f3ae31a8254","type":"多选题","q":"打造一款面向故宫等大型历史文化景区的“沉浸式Al导游”，允许游客使用手机或专用设备实时理解游客眼前的景象（如某个宫殿、文物），并结合游客的语音提问，提供流畅、低延迟、富有情感的语音讲解。一个关键的现实约束是：景区内人流密集，移动网络信号可能非常不稳定或时断时续。以下哪些架构设计和技术选型组合最为关键和高效？","options":[{"t":"建立高清视频通道，将语音识别、视觉分析、LM推理、语音合成全部放在云端服务器执行，以确保最高质量的回答。","ok":false},{"t":"部署一个能完美覆盖、无缝漫游且能承载数万并发用户高质量连接的Wi-Fi网络，要求用户必须连接到景区提供的专用Wi-Fi,通过服务质量（QoS）保障，强制所有数据流通过该稳定信道进行传输。","ok":false},{"t":"在设备端预置高质量的TTS（文本转语音）语音包和核心景点的多媒体资料，由LLM在云端生成讲解文本后，指令设备端进行本地合成与播放。","ok":true},{"t":"优先在设备端部署轻量级视觉模型进行快速目标识别，并将识别出的实体ID（如“太和殿”）而非原始图像帧上传，以降低网络负载。","ok":true}],"analysis":"答案：C、D\n\n解析：\n核心约束是“网络不稳定”与“低延迟”。A项全云端处理需传输高清视频，弱网必卡顿；B项在古建密集景区实现“完美覆盖”Wi-Fi违背现实物理与成本约束；C项将TTS下沉至端侧，云端仅传文本，极大降低下行带宽，保障语音流畅；D项端侧视觉识别仅上传实体ID，避免传视频流，大幅降低上行负载。CD组合通过“端云协同”有效破解弱网难题。"},{"gid":"f319b195-d865-4e65-8dd8-917b75b2d71e","type":"单选题","q":"通过 LlamaIndex 创建 RAG 应用时，rerank 的作用是？","options":[{"t":"替换 embedding model","ok":false},{"t":"设置召回文本段个数","ok":false},{"t":"根据用户的输入去向量数据库进行检索","ok":false},{"t":"对向量数据库的检索结果进行重新排序","ok":true}],"analysis":"答案：D\n\n解析：在RAG流程中，初步向量检索（选项C）追求高召回率，但结果可能包含噪声。Rerank（重排序）的作用是对初步召回的文本段与用户查询进行更深度的语义匹配，从而**对检索结果进行重新排序**，将最相关的内容置顶，提升大模型生成的准确性。选项A属于嵌入模型功能，选项B由Top-K参数控制。"},{"gid":"45582cf3-0228-476a-bea1-00b7fb69702c","type":"单选题","q":"在 RAG 应用中，为什么需要将文本转化为向量表示？","options":[{"t":"提高向量在前端界面的显示效果","ok":false},{"t":"减少存储空间","ok":false},{"t":"方便人工阅读","ok":false},{"t":"便于计算语义相似度","ok":true}],"analysis":"答案：D\n\n解析：在RAG应用中，核心机制是“检索”与“生成”。将文本转化为向量（Embedding）能将非结构化文本映射到高维空间，捕捉其深层语义信息。转化后，系统可通过计算向量间的数学距离（如余弦相似度），快速且精准地检索出与用户问题语义最相关的文档片段，为大模型提供准确的上下文。文本向量化并非为了前端展示、压缩存储或方便人工阅读（高维向量对人类不直观），因此选D。"},{"gid":"4d0d3387-5d05-419c-9b44-72397e4108e6","type":"单选题","q":"在大语言模型微调的数据准备阶段，哪个操作是为了将文本拆分成单词或词汇单元?","options":[{"t":"文本翻译","ok":false},{"t":"数据去重","ok":false},{"t":"分词(Tokenization)","ok":true},{"t":"文本摘要","ok":false}],"analysis":"答案：C：分词(Tokenization)\n\n解析：在大语言模型微调中，分词（Tokenization）是将连续文本切分为模型可处理的离散单元（如单词、子词或字符）的基础步骤。文本翻译用于语言转换，数据去重旨在清理重复样本，文本摘要则是提取核心内容，三者均不涉及文本拆分操作。因此选C。"},{"gid":"d031972f-1693-4fc3-8d43-d984318b34e9","type":"单选题","q":"大模型在处理输入文本时，第一步通常执行的操作是？","options":[{"t":"计算候选 Token 概率","ok":false},{"t":"Token 可量化","ok":false},{"t":"计算 Embedding 后的向量","ok":false},{"t":"对输入文本进行分词（Tokenize）","ok":true}],"analysis":"**答案：D**\n\n**解析：**\n大模型无法直接理解自然语言，必须先将其转化为数字序列。因此，处理输入文本的第一步是**分词（Tokenize）**，即将文本切分为模型词汇表中的基本单元（Token）。随后，这些Token才会被转化为Embedding向量（选项C）输入神经网络，并在输出阶段计算候选Token概率（选项A）。选项B并非标准处理步骤。故第一步为分词。"},{"gid":"ef8a4d36-f94f-4361-b04d-962b60451b4c","type":"单选题","q":"你需要大模型对用户输入的新闻内容进行分类（体育 / 经济 / 娱乐三种），为提升易懂性且便于程序解析，以下哪个提示词更合理？","options":[{"t":"请根据下面提供的内容判断其类别（体育 / 经济 / 娱乐），只输出判断结果。内容是","ok":false},{"t":"请根据下面提供的内容判断其类别（体育 / 经济 / 娱乐）。先输出思考过程，再在最后一行用 “结论.” 开头写明类别。内容是","ok":false},{"t":"请根据下面提供的内容判断其类别（体育 / 经济 / 娱乐），以 JSON 格式输出，\"reason\" 原因，\"type\" 类别。如 [体育 / 经济 / 娱乐] 内容是","ok":true},{"t":"请根据下面提供的内容判断其类别（体育 / 经济 / 娱乐），用符号分隔.思考过程 | 类别结果。内容是...","ok":false}],"analysis":"答案：C\n\n解析：C选项采用JSON格式，这是程序解析最标准、稳定的结构化格式，能极大降低代码提取成本；同时要求输出“reason”（原因），保留了思维链（CoT），既提升了模型分类准确率，又让人类易于理解分类依据，完美兼顾“易懂性”与“便于程序解析”。A缺乏解释；B和D的非标准格式在解析时易因文本包含特定字符而报错。"},{"gid":"db7c5a28-9a15-4607-a381-e1b0e71ba9dc","type":"单选题","q":"你已经开发了可以用于聊天的大模型应用，可以实现多轮对话、流式输出等功能。用户反馈希望在回答特定领域问题时要参考内部知识库，其他情况下不用。你应该怎么满足这个需求？","options":[{"t":"首先在检索功能中融入多轮对话改写机制，然后加入意图识别功能，判断该轮对话是否需要进行 RAG","ok":true},{"t":"需要从 0 到 1 实现文档加载、内容分割、文本向量化、索引存储等复杂的功能","ok":false},{"t":"调整代码，在每一轮对话时检索相关内部知识文档片段，并组装到提示词模板中","ok":false},{"t":"要求用户在输入问题之外，还需要输入相关的文本段","ok":false}],"analysis":"答案：A\n\n解析：本题核心在于“按需检索”与“多轮对话”。A选项通过意图识别判断是否触发RAG，满足“特定领域参考，其他不用”的需求，避免无效检索；同时多轮对话改写能补全上下文指代，提升检索准确度。B项无需从零开发，可用成熟框架；C项每轮均检索违背了按需原则；D项需用户手动输入，体验极差。故选A。"},{"gid":"3694a9de-33c5-4cff-893a-7a99630a1c4e","type":"单选题","q":"以下哪个用户查询语句无法有效地指导大模型进行文本摘要？","options":[{"t":"请总结以下文章的主要内容：...","ok":false},{"t":"提取以下文本的关键词：...","ok":false},{"t":"请翻译以下文章：...","ok":true},{"t":"将以下文章压缩到 100 字以内：...","ok":false},{"t":"用一句话概括以下文字：","ok":false}],"analysis":"答案：C\n\n解析：文本摘要的核心任务是提炼文本核心信息并缩减篇幅。选项A（总结）、D（压缩）和E（概括）均直接要求提炼和缩短内容，是标准摘要指令；选项B（提取关键词）属于信息浓缩，可视为广义摘要。而选项C（翻译）旨在进行跨语言语义转换，不涉及内容的提炼与篇幅缩减，完全偏离了摘要任务目标，故无法有效指导大模型进行文本摘要。"},{"gid":"179eed6f-9fce-44f0-807b-f20db83cf0db","type":"单选题","q":"在调用百炼大模型接口时，如何指定用户的输入内容？","options":[{"t":"将用户输入内容作为'messages'列表中字典的'content'字段的值传入","ok":true},{"t":"将用户输入内容作为model参数的值传入","ok":false},{"t":"将用户输入内容作为api_key参数的值传入","ok":false},{"t":"将用户输入内容作为base_url参数的值传入","ok":false}],"analysis":"答案：A\n\n解析：\n调用百炼大模型接口时，对话内容通过`messages`参数传递。该参数是一个列表，内部包含多个字典，每个字典代表一条消息，需指定`role`（如\"user\"）和`content`。因此，用户输入应作为`content`字段的值传入。其他选项中，`model`用于指定模型版本，`api_key`用于身份鉴权，`base_url`用于配置API请求地址，均与传递用户输入无关。"},{"gid":"a0ca598a-9bf6-4e2f-8d81-297b8fc5721e","type":"单选题","q":"通过 LlamaIndex 创建 RAG 应用时，node_postprocessors 的作用是？","options":[{"t":"设置召回文本段个数","ok":false},{"t":"修改 prompt 模板","ok":false},{"t":"开启句子窗口检索","ok":false},{"t":"进行后处理，如相似度阈值、rerank 等","ok":true}],"analysis":"答案：D\n\n解析：在LlamaIndex中，`node_postprocessors`（节点后处理器）用于在检索出文本节点后、送入大模型前进行二次筛选与优化。其核心作用包括基于相似度阈值过滤低质节点、使用Rerank模型重排序等（D正确）。设置召回个数（A）由检索器的`top_k`参数控制；修改prompt（B）通过提示词模板配置；句子窗口检索（C）属于节点解析策略，均非后处理器功能。"},{"gid":"5233fa89-0568-4b90-b7c8-e41d39ec8e77","type":"单选题","q":"在使用 Assistant API 时，如何验证 API 请求是否成功？","options":[{"t":"if response.status_code ==HTTPStatus.CREATED:","ok":false},{"t":"if response.status_code ==HTTPStatus.BAD_REQUEST:","ok":false},{"t":"if response.status_code ==HTTPStatus.OK:","ok":true},{"t":"if response.status_code==HTTPStatus.NOT_FOUND:","ok":false}],"analysis":"答案：C\n\n解析：在HTTP协议中，200（HTTPStatus.OK）表示请求成功。OpenAI的Assistant API在设计上，无论是查询、创建还是更新资源，成功响应均统一返回200 OK状态码。选项A（201）虽在标准RESTful中表创建成功，但OpenAI并未采用；选项B（400）和D（404）分别代表客户端错误和资源未找到，均表示请求失败。因此验证成功应选C。"},{"gid":"9ceac342-501d-43a8-9fcd-baf2f7ddff48","type":"单选题","q":"你想针对一篇两岸性的论文对 RAG 应用进行提问，可回答效果不好，你发现后台日志中召回的文本段出现一句话没有说完就被另一句话截断的现象，问题可能出在哪里了？","options":[{"t":"embedding 模型在检索过程中将解析好的文本打乱顺序","ok":false},{"t":"rerank 模型对字符进行重排序导致语义不通","ok":false},{"t":"文档解析模块未正确处理分栏式 PDF 的版面结构，导致文本流顺序错乱","ok":true},{"t":"大模型无法准确还原论文的原本内容","ok":false}],"analysis":"答案：C\n\n解析：题干“两岸性”实为“双栏式”的误写。召回文本“一句话没说完被截断”是典型的PDF分栏解析错误。若解析模块未识别双栏版面，会按物理行横向读取，导致左栏句子读一半直接拼上右栏内容，造成文本流错乱。Embedding和Rerank处理的是文本块级别的向量化与排序，不会打乱块内字符顺序；且截断发生在“召回阶段”而非大模型“生成阶段”，故排除A、B、D。"},{"gid":"bc7b3361-d62a-4a2f-ab53-c36de4d9749a","type":"多选题","q":"以下哪些因素会影响 RAG 系统的性能？","options":[{"t":"硬件资源的限制","ok":true},{"t":"文档的质量和数量","ok":true},{"t":"向量数据库的类型和配置","ok":true},{"t":"查询语句的表达方式","ok":true},{"t":"所使用的预训练语言模型的大小和性能","ok":true},{"t":"切片方法的选择","ok":true}],"analysis":"**答案**：A, B, C, D, E, F\n\n**解析**：\nRAG性能受全链路因素影响。硬件(A)决定推理速度；文档质量与数量(B)及切片方法(F)决定知识库准确性与检索粒度；向量数据库(C)影响检索效率与召回率；查询表达(D)关系意图匹配精度；大模型(E)决定最终生成质量。数据、检索与生成各环节均显著影响整体表现。"},{"gid":"f0423a06-ee2e-4d52-ad84-54c6fe9eee13","type":"单选题","q":"你需要大模型输出 “公式化、格式固定” 的答案，不希望因随机因素导致格式或内容风格频繁变化。为在此场景下控制大模型的输出 “一致性”，以下哪种做法更合适？","options":[{"t":"调高 temperature 并增大 presence_penalty","ok":false},{"t":"将 temperature 调低并设置固定 seed","ok":true},{"t":"将 temperature、top_k 调高","ok":false},{"t":"将 temperature、top_p 调高","ok":false}],"analysis":"答案：B\n\n解析：要控制大模型输出的一致性，必须降低生成的随机性。temperature控制采样随机度，调低它可使模型倾向选择高概率词汇，减少风格波动。设置固定的seed能确保相同输入下生成完全一致的随机数序列，实现输出格式与内容的绝对固定。而调高temperature、top_k、top_p等均会增加输出的随机性与多样性，与需求背道而驰。"},{"gid":"7d83c645-18a8-4e6a-83da-4af139de1418","type":"单选题","q":"在大模型调用外部 API 工具时，你发现 agent 经常调用错误的工具。经过调查，最可能的原因是什么？","options":[{"t":"大模型缺乏足够的并行处理能力","ok":false},{"t":"网络延迟导致工具调用超时","ok":false},{"t":"工具函数调用过程中存在严重的内存泄漏","ok":false},{"t":"工具函数描述信息不够明确，未能准确说明调用时机和用途","ok":true}],"analysis":"答案：D\n\n解析：大模型选择工具主要依赖工具的元数据（名称、描述、参数说明）。若描述信息模糊、未明确适用场景或不同工具描述相似度过高，模型便无法准确区分，导致选错工具。选项A、B、C分别影响执行效率、响应速度和系统稳定性，均不会直接导致模型在逻辑决策上选错工具。因此，完善工具描述是解决该问题的核心。"},{"gid":"d36e33c3-0fed-497f-ab54-cbe858c7a8f0","type":"单选题","q":"你发现 RAG 应用召回的切片内容虽然和问题相关，但并不包含真实答案。最优先的排查和改进方向是什么？","options":[{"t":"检查 Embedding模型的类型及版本","ok":true},{"t":"尝试调低 top_k，减少召回范围","ok":false},{"t":"优先在弱关联层隐藏检索结果，只呈现大模型的最终回答","ok":false},{"t":"为每一条切片附详细的前置叙述，希望大模型自动补齐缺失内容","ok":false}],"analysis":"答案：A\n\n解析：召回内容“相关但无答案”多因Embedding模型对问答语义匹配能力不足，仅捕捉了表面相关性。优先检查并更换为针对QA优化的Embedding模型，可从根本上提升检索精准度。B项调低top_k会减少召回，适得其反；C项隐藏结果属掩耳盗铃，未解决大模型缺上下文的问题；D项依赖大模型“脑补”违背RAG基于事实的初衷，极易引发幻觉。"},{"gid":"101f47e5-7e78-4561-be26-fc81b4de0c03","type":"单选题","q":"你想在面向高中生的技术分享里，用大模型生动地解释阿里云弹性容器实例（ECI）的基本原理。下列哪种提示词最能实现 “易懂、形象化” 的效果？","options":[{"t":"请以高中生能理解的方式，使用生动比喻讲解 ECI 原理。","ok":true},{"t":"简短介绍 ECI 功能即可。","ok":false},{"t":"写一篇详尽 ECI 论文，全部使用专业术语。","ok":false},{"t":"仅列出 ECI 命令和参数列表。","ok":false}],"analysis":"答案：A\n\n解析：本题考查提示词设计中的受众定位与表达约束。选项A明确指定了目标受众（高中生）和表达策略（生动比喻），能引导大模型将抽象技术转化为贴近生活的具象场景，完美契合“易懂、形象化”需求。选项B缺乏形象化约束；选项C堆砌专业术语，认知门槛高；选项D仅罗列参数，枯燥且未解释原理。故A最佳。"},{"gid":"f7cd632d-b12e-4b13-b06d-14c10e94d494","type":"单选题","q":"如果你基于网页版的大模型写了以下提示词.（请你生成一份一季度财务报告）。以下哪些建议是合理的，可以帮助改进这个提示词？","options":[{"t":"提供公司特有的财务报告格式模板或示例，以确保生成的报告符合格式要求。","ok":false},{"t":"提供具体的财务数据和关键指标，以便模型能够准确地填充报告。","ok":false},{"t":"指定该报告的期望长度。","ok":false},{"t":"以上所有","ok":true}],"analysis":"答案：D\n\n解析：原提示词过于模糊。A项提供格式模板可规范报告结构，确保符合公司要求；B项提供真实财务数据是核心，能避免大模型凭空捏造数据产生“幻觉”；C项指定长度可控制输出篇幅，提升实用性。这三项建议分别从结构、内容准确性和篇幅控制三个维度完善了提示词，能显著提升大模型生成报告的质量与可用性，因此A、B、C均合理，故选D。"},{"gid":"b631e3c7-e733-46f3-b627-4880a1de79c4","type":"单选题","q":"有用户使用 “找张伟” 这类极简搜索，RAG 系统经常没能检索到所需文档，最合理的技术改进是什么？","options":[{"t":"将所有文档发布成内部 Wiki","ok":false},{"t":"在回答时修改用户的问题","ok":false},{"t":"在检索前先用大模型进行问题改写扩充","ok":true},{"t":"让用户输入更多关键词","ok":false}],"analysis":"答案：C\n\n解析：“找张伟”等极简查询缺乏上下文，导致检索召回率低。选项C在检索前用大模型进行问题改写扩充（Query Expansion），可自动补全隐含意图（如扩充为“张伟的简历、负责项目”），显著提升检索准确率，是RAG的标准优化方案。A不解决匹配问题；B时机太晚，检索已失败；D增加用户负担，体验差。故选C。"},{"gid":"be490e39-5a80-4367-84ee-0479843e82cc","type":"单选题","q":"用户只说 “想了解工作职责”，但没说明具体岗位。RAG 检索到多个岗位职责信息都可能匹配。最合理的做法是？","options":[{"t":"使用 HyDE生成假想文档","ok":false},{"t":"将问题改写为多步查询","ok":false},{"t":"提示词中设定用户提供信息不足时，向用户反问需要哪个岗位","ok":true},{"t":"返回所有岗位的职责","ok":false}],"analysis":"答案：C\n\n解析：本题核心在于处理查询意图模糊与信息缺失。当查询缺乏关键实体（具体岗位）导致检索发散时，HyDE（解决语义鸿沟）和多步查询（拆解复杂逻辑）均无法弥补信息缺失；直接返回所有结果会导致信息过载。最合理的做法是通过提示词设定反问机制，引导用户补充信息以精准定位需求。这是多轮对话中处理模糊查询、提升用户体验的标准且高效的策略。"},{"gid":"8fca1605-75dd-4e61-a938-4583258c4ca4","type":"单选题","q":"某大模型客服系统被攻击者通过提示词注入获取机密数据，以下哪个措施能更有效防范这一问题？","options":[{"t":"改进提示词，让大模型避免回答这类问题","ok":false},{"t":"改进提示词，确保模型在回答问题时避免回答列表形式的内容","ok":false},{"t":"在知识检索阶段严格控制用户的查询访问权限，过滤掉非法请求并报警","ok":true},{"t":"改进提示词，并且在输入阶段过滤掉敏感关键词","ok":false}],"analysis":"答案：C\n\n解析：提示词注入旨在绕过系统指令。仅靠优化提示词（A、D）或限制输出格式（B）极易被变形或编码绕过，防御脆弱。C选项从系统架构层面入手，在知识检索阶段实施严格的访问控制与请求过滤。这种“硬防御”确保了即使大模型指令被成功注入，攻击者也因无权限而无法检索到机密数据，从根本上阻断了泄露路径，是最有效且治本的防范措施。"},{"gid":"ecc79482-a60d-4cd0-9a9d-0dd862245311","type":"单选题","q":"构建 RAG 应用时，建立索引阶段的正确顺序是？","options":[{"t":"文档加载 - 文本向量化 - 向量分割 - 索引存储","ok":false},{"t":"内容分割 - 文本向量化 - 索引存储","ok":false},{"t":"文档加载 - 文本向量化 - 索引存储","ok":false},{"t":"文档加载 - 内容分割 - 文本向量化 - 索引存储","ok":true}],"analysis":"答案：D\n\n解析：构建RAG索引的标准流程为：首先进行**文档加载**，读取各类原始数据；其次进行**内容分割**，将长文本切分为较小的文本块，以提升检索精度并避免超出模型Token限制；接着进行**文本向量化**，利用Embedding模型将文本块转化为高维向量；最后进行**索引存储**，将向量及原文本存入向量数据库。选项D流程完整且顺序正确。"},{"gid":"b3db0322-dd14-4c02-922a-b84a91d3da18","type":"单选题","q":"你开发了一个 RAG 应用，用户反馈说回复效果不佳。你通过后台日志发现用户的输入有时缺少信息，如 “教研部”、“请假”，你应该优先进行哪方面的优化？","options":[{"t":"优化文档切分策略","ok":false},{"t":"更换检索速度更快的向量数据库","ok":false},{"t":"调整大模型的 top_p 参数","ok":false},{"t":"结合历史常见问题，使用大模型对 query 进行改写","ok":true}],"analysis":"答案：D\n\n解析：\n题干明确指出痛点是“用户输入缺少信息”（如仅输入短语），导致检索意图不明确。A、B选项针对文档处理与检索性能，C选项控制生成随机性，均无法解决输入缺失问题。D选项通过大模型结合历史上下文对Query进行改写与补全，能有效丰富用户意图，提升检索准确率，是直接针对该问题的最优解。"},{"gid":"a14f183a-6860-45dc-8347-118393c7bfe6","type":"单选题","q":"假设你正在使用一个大语言模型开发智能客服系统，希望生成的回复尽量简短，以适应短信通知的长度限制，要求短信语义完整。以下哪种方式更有可能实现这一目标？","options":[{"t":"通过明确提示词引导，在提示词中写明 “请将答案控制在 100 字以内”。","ok":true},{"t":"通过模型微调优化，对模型进行专门训练，使其具备生成短文本的能力。","ok":false},{"t":"通过 API 参数限制，设置 max_token=100 以约束生成文本的长度。","ok":false},{"t":"在后端逻辑中使用正则表达式方法对生成结果进行后处理。","ok":false}],"analysis":"在要求“语义完整”的前提下，提示词引导是唯一能让模型自主规划内容结构并在限定长度内完成完整表达的方式。根据大模型服务平台百炼文档，优化提示词（如对输出内容进行限定、添加示例）可直接影响模型生成行为，使其按预期格式和长度输出\n其他选项的局限性如下：\n\nB 微调：成本高、周期长，且短文本生成能力可通过提示词实现时，微调并非首选方案。\nC max_tokens：该参数限制的是 Token 数量而非字符数，且强制截断会导致语义不完整；百炼文档明确指出 max_tokens 设置过小会使模型返回被截断的内容，需通过续写机制才能恢复语义完整性\n。\nD 正则后处理：属于机械截断，无法保证语义完整性，与题目要求直接冲突。"},{"gid":"12a75ad6-96ab-4b0f-ada6-90988989846a","type":"单选题","q":"你正在使用 Qwen-Plus 生成商品介绍文档，完整的提示词是 “请帮我生成我们公司最新智能手表的产品介绍”。但你发现生成的内容是介绍其他公司的产品。以下策略中，应首先尝试的是？","options":[{"t":"调低 Top-p 值缩小候选词范围","ok":false},{"t":"调低温度参数（Temperature）以降低随机性","ok":false},{"t":"提高 Top-p 值扩大候选词范围","ok":false},{"t":"改进提示词（明确产品信息、文档主题和结构）","ok":true}],"analysis":"答案：D\n\n解析：模型生成其他公司产品，是因为提示词缺乏具体的品牌、型号等上下文，导致模型用训练数据中的已知产品“脑补”（产生幻觉）。调整Temperature或Top-p等参数仅能控制生成的随机性，无法凭空提供缺失的特定事实。因此，首要策略是改进提示词，补充明确的产品细节、主题和结构，提供充足上下文以引导模型生成准确内容。"},{"gid":"322722b1-9116-4831-9c0f-141ca3ebb8fa","type":"单选题","q":"某企业开发了一款面向医疗领域的 RAG 应用，用户反馈称生成的诊断建议经常不准确，且回答内容缺乏针对性。经过初步分析，发现检索模块召回的相关文档质量较低，同时生成模块对复杂医学术语的理解能力不足。作为开发者，你认为以下哪种优化策略最有效？","options":[{"t":"增加计算资源，提升大模型的推理速度，确保快速生成回答。","ok":false},{"t":"针对每个用户的反馈逐一调整生成结果，确保满足个性化需求。","ok":false},{"t":"通过修改 prompt 模板来引导模型生成更准确的回答。","ok":false},{"t":"总结用户反馈中的常见问题，通过多维度评测指标（如准确性、相关性）找到回复质量较低的原因并进行针对性优化。","ok":true}],"analysis":"正确答案：D\n\n解析：A项提升速度无法解决准确性问题；B项逐一调整成本高且无法泛化，治标不治本；C项仅修改prompt无法根本解决检索质量低和术语理解不足的底层缺陷。D项通过多维度评测系统性定位根因，进而对检索模块（如优化召回策略）和生成模块（如领域微调）进行针对性优化，是解决RAG应用质量问题最科学、有效的工程化策略。"},{"gid":"5ad90f2a-25cf-42bd-90c7-032021a1520b","type":"单选题","q":"在优化检索效果时，若知识库内容充足但精确率低，以下哪种方法是合理的？","options":[{"t":"增加查询请求的并发量以加快响应速度","ok":false},{"t":"增加知识库文档","ok":false},{"t":"降低相似度阈值","ok":false},{"t":"加入 rerank 的步骤","ok":true}],"analysis":"答案：D\n\n解析：知识库充足但精确率低，说明初步检索召回了较多不相关文档。A项仅提升响应速度；B项无需再增加文档；C项降低阈值会召回更多结果，反而可能进一步降低精确率。D项加入rerank（重排序）步骤，可通过更精细的模型对初召结果进行二次打分与重新排序，有效过滤噪音，将最相关的文档排在前列，从而显著提升检索精确率。故选D。"},{"gid":"b39391c7-7236-437f-990b-8f002a2d381d","type":"单选题","q":"你在开发一个内部 IT 系统，希望能够自动处理员工的请求.“我的投影仪故障了，请安排维修并通知下午会议改线上”。以下哪种技术方案有效、且能尽量减少人力投入？","options":[{"t":"通过提示词引导大模型拆解任务为多步骤，然后自动调用维修系统和会议系统 API 完成操作。","ok":true},{"t":"通过提示词引导大模型直接生成维修工单和会议调整结果，无需调用现有系统。","ok":false},{"t":"通过大模型判断接单人，自动将任务指派给接单人，通知其创建维修工单并调整会议。","ok":false},{"t":"识别请求中的关键字（如 “投影仪故障”“会议改线上”），匹配规则系统后调用 API 完成任务。","ok":false}],"analysis":"答案：A\n\n解析：A项利用大模型（如Agent/Function Calling）理解语义、拆解任务并自动调用API，实现全流程自动化，有效且人力投入最少。B项未对接现有系统，无法真正执行操作；C项仍需人工接单处理，未减少人力投入；D项关键字规则缺乏语义理解，面对多样化表述易失效，鲁棒性差。故A为最优解。"},{"gid":"0b738e89-52bc-4ea9-ad55-30de45fc5894","type":"单选题","q":"在大语言模型微调的训练循环中，哪个步骤负责计算模型输出与真实标签之间的差异？","options":[{"t":"梯度更新","ok":false},{"t":"参数初始化","ok":false},{"t":"反向传播","ok":false},{"t":"正向传播","ok":true}],"analysis":"答案：D\n\n解析：在模型训练循环中，正向传播负责将输入数据送入模型得到预测输出，并计算该输出与真实标签之间的差异（即损失值Loss）。反向传播则是根据损失值计算各参数的梯度；梯度更新利用梯度调整模型权重；参数初始化是训练前的准备步骤。因此，计算差异属于正向传播阶段。"},{"gid":"17788dd3-3122-4c56-a506-ff3120b7c8a0","type":"单选题","q":"你正在使用大模型逐条输出检测结果。以下哪种数据结构最适合存储和处理这些结果？","options":[{"t":"列表（List）","ok":false},{"t":"集合（Set）","ok":false},{"t":"字符串","ok":false},{"t":"字典（Dictionary），键为检测项，值为检测结果和描述","ok":true}],"analysis":"答案：D\n\n解析：大模型输出的检测结果通常包含检测项、结果和描述等结构化信息。字典（Dictionary）采用键值对结构，以检测项为键，能清晰存储这些复杂数据，并支持通过键进行快速查找、更新和后续处理。相比之下，列表查找特定项效率低，集合不支持键值映射，字符串缺乏结构化特征。因此，字典是最适合的数据结构。"},{"gid":"b7d89737-7a10-45dc-9c67-d3d705199faa","type":"单选题","q":"以下哪种文本切片方法最有可能保留完整的语义信息？","options":[{"t":"按标点符号分割，例如句号、问号等。","ok":false},{"t":"按字符数分割，每 50 个字符为一个 chunk。","ok":false},{"t":"按 token 长度分割，每 100 个 token 为一个 chunk。","ok":false},{"t":"使用专门的语义分割模型将文本分割成语义完整的段落。","ok":true}],"analysis":"答案：D\n\n解析：B和C按固定字符或token数机械切分，极易截断词句，破坏语义；A按标点切分虽稍好，但仍可能割裂跨句的逻辑关联。D使用专门的语义分割模型，能理解文本内在逻辑，按主题或语义边界进行智能划分，最大程度保留上下文连贯性与完整语义，因此最有可能保留完整的语义信息。"},{"gid":"185a1633-74ab-42fd-b0ef-a3d4434192b3","type":"单选题","q":"以下哪个向量数据库不适合用于存储和检索文本向量？","options":[{"t":"Milvus","ok":false},{"t":"FAISS","ok":false},{"t":"MySQL","ok":true},{"t":"Pinecone","ok":false}],"analysis":"答案：C\n\n解析：MySQL是传统关系型数据库，主要用于处理结构化数据，缺乏对高维向量进行高效索引和近似最近邻检索的原生支持，不适合存储和检索文本向量。而Milvus、FAISS和Pinecone均为专业的向量数据库或检索库，专为高维向量设计，具备强大的向量索引与相似度计算能力，非常适合处理文本等非结构化数据的向量化存储与高效检索。"},{"gid":"4b9af130-0025-4b48-81f2-eb4d8108d26a","type":"单选题","q":"你使用 Qwen-Max 生成了课程内容，现在需要将其转换为 Marp 格式的 Markdown。以下哪个 Qwen-Max 的提示词最有效","options":[{"t":"把这些内容转换成 Markdown","ok":false},{"t":"用 Markdown 写个幻灯片","ok":false},{"t":"将以下内容转换为适合 Marp 幻灯片演示的 Markdown 格式，并包含标题、列表和代码块等元素。","ok":true},{"t":"“帮我转换成 PPT”","ok":false}],"analysis":"答案：C\n\n解析：优质提示词需具备明确目标与具体约束。选项C不仅精准指定了“Marp幻灯片”和“Markdown”格式，还细化了“标题、列表、代码块”等元素要求，能引导模型输出最精准的结果。选项A、B未明确Marp特定格式，选项D则完全偏离了Markdown要求，故C最有效。"},{"gid":"7ca87e5d-54d2-4e4a-8dd8-d00d96b9fb65","type":"单选题","q":"在 qwen2.5 - 1.5b 模型训练时，当训练损失持续下降但验证损失开始上升时，说明模型处于什么状态？","options":[{"t":"欠拟合","ok":false},{"t":"过拟合","ok":true},{"t":"训练失败","ok":false},{"t":"训练成功","ok":false}],"analysis":"答案：B\n\n解析：当训练损失持续下降而验证损失开始上升时，这是典型的**过拟合**现象。这表明模型在训练集上过度学习，甚至“死记硬背”了数据中的噪声和特定细节，导致其在未见过的验证集上泛化能力变差。此时模型并非欠拟合（欠拟合表现为两者损失均高），也非训练失败或成功，通常需要引入早停、正则化或增加训练数据等策略来缓解该问题。"},{"gid":"bab19bc3-f6ae-4142-b36a-d30ddd9359b3","type":"单选题","q":"LoRA 微调对数据量要求的说法错误的是？","options":[{"t":"微调数据量较小时，应增大 LoRA 的秩以提升模型表达能力","ok":true},{"t":"在数据质量有保障时，增大数据量、多样化通常能提升微调效果","ok":false},{"t":"LoRA 微调需求数据量比预训练要小","ok":false},{"t":"同等数据量下（1000 条），LoRA 微调效果接近全参微调","ok":false}],"analysis":"答案：A\n\n解析：A错误。微调数据量较小时，增大LoRA的秩会增加可训练参数，极易导致过拟合。此时应使用较小的秩（如4或8）来限制模型复杂度，提升泛化能力。B正确，符合机器学习基本规律；C正确，LoRA作为参数高效微调方法，数据需求远小于预训练；D正确，在少量数据下全参微调易过拟合，而LoRA通过低秩约束能有效缓解该问题，效果通常接近全参微调。"},{"gid":"6d4fcece-aa49-4df1-ad9c-7ee66b6d5d6d","type":"单选题","q":"开发过程中，你注意到系统日志显示大模型对某工具函数调用频率异常高，但调用结果经常出错，最可能原因是什么？","options":[{"t":"大模型的计算资源不足","ok":false},{"t":"该工具函数的调用接口存在安全漏洞","ok":false},{"t":"该工具函数的描述过于宽泛，导致大模型误以为适用于多种任务","ok":true},{"t":"用户输入错误导致大模型误调用该工具","ok":false}],"analysis":"答案：C\n\n解析：大模型选择工具主要依赖工具描述。若描述过于宽泛，模型会误以为其适用于多种不相关任务，导致调用频率异常升高；同时因实际功能与描述不符，参数或场景不匹配，导致结果频繁出错。资源不足影响响应速度，安全漏洞涉及系统风险，用户输入错误多为偶发，均无法解释“高频且常错”的现象。"},{"gid":"c56a7b5e-c8c4-41f8-acff-c4c556b96d4d","type":"单选题","q":"以下哪项是流式输出的主要优势？","options":[{"t":"降低模型推理错误率","ok":false},{"t":"避免使用负载均衡","ok":false},{"t":"提升用户感知的响应速度","ok":true},{"t":"减少服务器计算资源消耗","ok":false}],"analysis":"答案：C\n\n解析：流式输出的核心机制是“边生成边返回”。在模型推理等耗时任务中，它无需等待全部内容生成完毕，而是将已生成的片段实时推送给客户端。这虽不改变模型的实际计算总耗时与资源消耗（排除D），也不影响推理准确率（排除A）或负载均衡策略（排除B），但能让用户第一时间看到部分结果，大幅降低首字等待时间，从而显著提升用户感知的响应速度与交互体验。"},{"gid":"482be783-ae1a-4ea6-aadf-e5846454e1d5","type":"单选题","q":"你维护了一个开发者社区的大模型问答助手，但你发现有人通过上传一些恶意的文章，诱导大模型生成恶意代码。从长期防护角度，最根本的解决措施是？","options":[{"t":"输出阶段调用代码静态分析工具","ok":false},{"t":"在知识库上传阶段扫描文档安全性","ok":true},{"t":"限制模型生成可执行代码","ok":false},{"t":"为知识库文档添加数字签名","ok":false}],"analysis":"答案：B\n\n解析：攻击者上传恶意文章属于数据投毒（知识库污染）。A项输出拦截是末端防御，未解决源头污染；C项限制生成代码会破坏助手核心功能；D项数字签名仅保证来源和完整性，无法识别内容恶意性。B项在上传阶段扫描文档，从源头阻断恶意数据进入知识库，是防范此类投毒攻击最根本的长期解决措施。"},{"gid":"adc2228e-1c77-4e33-9ace-54808fd96871","type":"多选题","q":"在评测机制里，你发现自动化评分一直偏高，但实际用户反馈一般。以下哪三项有可能提高评测的可信度？","options":[{"t":"在构建测试集时，增加业务专家的打分环节","ok":true},{"t":"调整自动化评测工程的提示词及阈值，让其更接近真实用户判断标注","ok":true},{"t":"基于现有的评测集，增加自动化评测的频次","ok":false},{"t":"根据线上用户问题类型的分布，修正测试样本集的问题分布","ok":true}],"analysis":"答案：A、B、D\n\n解析：\n自动化评分偏高说明评测标准或样本与真实场景脱节。A项引入专家打分可建立高质量基准来校准模型；B项优化提示词和阈值能直接修正自动化评分的“宽容度”，对齐真实用户体感；D项修正样本分布可消除因测试集不具代表性导致的虚高，使评测更贴近线上真实场景。C项仅增加频次，无法解决标准偏差和样本失真问题，不能提升可信度。"},{"gid":"d0332a25-0e76-4ae7-9845-74ad74cc2c9f","type":"多选题","q":"一家金融公司基于RAG系统搭建自研交易模型查询功能，出现检索结果常返回通用文档、而非知识库中交易模型的高级解决方案，想系统性解决此问题，架构师应优先选择哪两项措施?","options":[{"t":"实施混合检索融合模型(如BM25模型)与向量搜索","ok":true},{"t":"引入Cross-Encoder模型进行检索结果重排序","ok":false},{"t":"调整分块重叠分块大小优化文本切片效果","ok":true},{"t":"建立“查询-理想文档”的“黄金标准”评测集","ok":false}],"analysis":"A、实施混合检索融合模型（如BM25）与向量搜索：金融交易模型查询通常包含特定术语（如模型名称、策略代号），纯向量检索可能因语义泛化而丢失关键词精确匹配。混合检索结合稀疏（BM25）与稠密（向量）检索，能同时兼顾关键词精准性和语义泛化能力，有效提升专业文档召回率。\nC、调整分块重叠和分块大小优化文本切片效果：若知识库中文档切片过小或未保留足够上下文，可能导致高级策略的关键信息被割裂，影响嵌入表示和召回效果。合理设置分块大小（如600–1024 tokens）与重叠（100–200 tokens）可确保策略章节的完整性，提升相关片段被召回的概率。\n选项B（Cross-Encoder重排序）属于精排阶段优化，应在召回质量基本达标后使用；选项D（黄金标准评测集）用于评估，不直接改善召回结果。"},{"gid":"c8d6e86e-7d97-4ac9-990e-2e20eb7fa838","type":"单选题","q":"以下哪个场景最适合使用规则匹配的文本合规检测？","options":[{"t":"理解用户提问的深层含义","ok":false},{"t":"判断用户评论是否包含特定品牌的广告信息","ok":false},{"t":"识别文章中蕴含的复杂情感","ok":false},{"t":"检测用户上传的文本是否包含明确的违禁词汇","ok":true}],"analysis":"答案：D\n\n解析：规则匹配基于预设关键词或正则表达式，擅长处理特征明确、无需复杂语义理解的场景。D项“明确的违禁词汇”可通过违禁词库进行高效、精准的匹配，最契合该技术。而A项（深层含义）和C项（复杂情感）需要深度的自然语言理解模型；B项（广告信息）常涉及上下文与语义变体，单纯规则匹配易误判。因此D最适合。"},{"gid":"84be47e3-cdfa-4aaf-a57f-c6435a7e91a3","type":"单选题","q":"运行以下代码等待任务结束时，不属于终止状态的是哪一项？pythonfrom dashscope import Runsrun = Runs.wait(run_id, thread_id='thread_id')","options":[{"t":"completed","ok":false},{"t":"failed","ok":false},{"t":"cancelled","ok":false},{"t":"in_progress","ok":true}],"analysis":"答案：D\n\n解析：\n在DashScope的Runs API中，终止状态指任务已结束且状态不再改变，主要包括completed（完成）、failed（失败）、cancelled（取消）和expired（过期）。而in_progress表示任务正在执行中，属于中间状态，并非终止状态。因此选D。"},{"gid":"640b5335-6895-4a0a-994a-1a5fcf8e8bfb","type":"单选题","q":"以下哪个步骤不是 RAG 工作流程中 “建立索引” 阶段的一部分？","options":[{"t":"将用户问题转换为向量表示","ok":true},{"t":"将长文本切成更小的片段","ok":false},{"t":"将文档解析为纯文本","ok":false},{"t":"将文本片段转换为向量表示","ok":false}],"analysis":"答案：A\n\n解析：RAG工作流程主要分为“建立索引”和“检索与生成”两个阶段。“建立索引”是离线数据准备过程，包括将文档解析为纯文本（C）、长文本分块（B）以及将文本片段向量化并存入数据库（D）。而“将用户问题转换为向量表示”（A）发生在用户提问后的在线“检索”阶段，用于在数据库中匹配相关文本片段，不属于建立索引阶段。因此选A。"},{"gid":"3164f76f-a3b7-4003-9b7e-eae47249c179","type":"单选题","q":"为了将不同长度的文本序列调整为统一长度以便模型处理，通常会采取哪种措施？","options":[{"t":"删除过长的句子","ok":false},{"t":"忽略长度差异","ok":false},{"t":"截断过短的句子","ok":false},{"t":"填充序列到固定长度（Paddin","ok":true}],"analysis":"答案：D\n\n解析：\n在深度学习中，数据通常以批次（Batch）形式输入，要求同一批次内的张量维度必须一致。因此，需将不同长度的文本序列调整为统一长度。对于较短的序列，通常使用特殊的填充标记（如`[PAD]`）进行补齐（Padding）；对于过长的序列则进行截断。选项D准确描述了这一标准操作，是保证模型正常进行矩阵运算的必要措施。"},{"gid":"824d3bcb-3419-47ae-88a0-ab54dab3b0da","type":"单选题","q":"以下哪种情况最适合将文档拆分成更小的分块？","options":[{"t":"文档格式简单，例如纯文本文件。","ok":false},{"t":"文档内容包含多个主题，信息量较大。","ok":true},{"t":"文档内容非常简短，总共只有几句话。","ok":false},{"t":"文档内容高度相关，主题单一 。","ok":false}],"analysis":"答案：B\n\n解析：文档分块（Chunking）主要用于处理长文本，以提升大模型处理或向量检索的效果。当文档包含多个主题且信息量较大时，拆分成小分块能有效避免上下文超载，减少检索时引入的无关噪声，使每个分块聚焦单一语义，从而大幅提高问答和检索的准确性。而内容简短或主题高度单一的文档，通常无需过度拆分。"},{"gid":"b0f89bfa-8a05-4c3a-9707-5c2d37137bb8","type":"单选题","q":"API AssistantAgent 示例代码 verify_status_code 函数的作用是什么？pythondef verify_status_code(res):if res.status_code !=HTTPStatus.OK:print(\"Failed:\")print(res)sys.exit(res.status_code)","options":[{"t":"验证 function call 的参数是否正确","ok":false},{"t":"验证用户输入的 query 是否合法","ok":false},{"t":"验证 Assistant 是否成功创建","ok":false},{"t":"验证 Thread 是否成功创建","ok":false},{"t":"验证模型返回的答案是否符合预期","ok":false},{"t":"验证 API 调用的返回状态码是否为 200","ok":true}],"analysis":"答案：F\n\n解析：\n该函数通过检查响应对象 `res` 的 `status_code` 属性是否等于 `HTTPStatus.OK`（即 HTTP 状态码 200），来判断 API 请求是否成功。若状态码非 200，则打印错误信息并退出程序。因此，其核心作用是验证 API 调用的返回状态码是否为 200，而非验证参数、输入、创建结果或模型答案的具体内容。"},{"gid":"1f6e43c2-1ddb-4a64-8408-48297e3c2fc0","type":"单选题","q":"大语言模型微调时，通过调节哪个参数可以直接控制模型学习新知识的速度？","options":[{"t":"批大小","ok":false},{"t":"学习率","ok":true},{"t":"训练轮数","ok":false},{"t":"正则化系数","ok":false}],"analysis":"答案：B\n\n解析：学习率决定了模型在每次参数更新时的步长大小，直接控制模型吸收新知识和收敛的速度。学习率过大会导致模型震荡不收敛或产生“灾难性遗忘”，过小则学习极慢。相比之下，批大小影响梯度估计的稳定性，训练轮数决定遍历数据集的次数，正则化系数主要用于防止过拟合，这三者均不直接控制模型的学习速度。"},{"gid":"8348c7a7-a4b1-41d9-9b44-67435a7c6b6e","type":"单选题","q":"在 LlamaIndex 中，默认情况下，加载的数据是如何存储的？","options":[{"t":"存储在云服务中","ok":false},{"t":"存储在文件系统中的特定目录","ok":false},{"t":"直接写入数据库","ok":false},{"t":"存储在内存中作为一系列向量嵌入","ok":true}],"analysis":"答案：D\n\n解析：在LlamaIndex中，若未显式配置外部向量数据库，系统默认使用内存向量存储（InMemoryVectorStore）。加载的文档会被模型转换为向量嵌入（Embeddings），并直接存储在程序运行的内存中。这种方式便于快速构建和测试索引，但程序结束后数据会丢失。如需持久化，需额外配置文件系统或外部数据库。因此，默认情况下数据是作为向量嵌入存储在内存中的。"},{"gid":"e85cf0c1-3946-4755-8651-101eb0398384","type":"单选题","q":"如何从百炼大模型的接口返回结果中获取模型生成的文本？","options":[{"t":"pythonpythonprint(completion.message.content)","ok":false},{"t":"pythonpythonprint(completion.choices[0].message)","ok":false},{"t":"pythonpythonprint(completion.choices.message.content)","ok":false},{"t":"pythonpythonprint(completion.choices[0].message.content)","ok":true}],"analysis":"正确答案：D\n\n解析：\n百炼大模型（兼容OpenAI接口）的返回结果中，生成的文本存储在`choices`列表中。通常我们获取第一个候选结果，即`choices[0]`。在该元素下，对话信息封装在`message`对象中，而具体的文本内容则位于`message`的`content`属性内。因此，完整的提取路径为`completion.choices[0].message.content`，选项D正确。"},{"gid":"2d0e0dfd-4f2f-485a-943c-55c5ce6ba1d0","type":"单选题","q":"大语言模型预训练与微调之间的关系是什么？","options":[{"t":"微调发生在预训练之前，用于准备数据","ok":false},{"t":"预训练和微调是相互独立的过程","ok":false},{"t":"微调是对预训练模型的初次训练","ok":false},{"t":"微调是在预训练模型基础上进行的调整优化","ok":true}],"analysis":"答案：D\n\n解析：大语言模型的训练分为预训练和微调两阶段。预训练是基础，模型在海量无标注数据上学习通用语言规律，获得泛化能力；微调发生在预训练之后，是在预训练模型的基础上，利用特定领域或任务的标注数据进行针对性的调整与优化，以提升其在具体下游任务上的表现。两者先后承接，并非独立，微调也非初次训练或数据准备。故选D。"},{"gid":"d2a26b46-26a4-4733-87b9-609810274e68","type":"单选题","q":"在大语言模型微调训练中，哪一步骤涉及到计算损失函数关于模型参数的梯度？","options":[{"t":"正向传播","ok":false},{"t":"批标准化","ok":false},{"t":"优化算法选择","ok":false},{"t":"反向传播","ok":true}],"analysis":"答案：D\n\n解析：\n在大语言模型微调中，**反向传播**是计算损失函数关于模型参数梯度的核心步骤。正向传播用于计算模型的预测输出和损失值；而反向传播则利用微积分中的链式法则，从输出层向输入层逐层传递误差，精确计算出每个参数对总损失的贡献程度（即梯度）。随后，优化算法才会利用这些计算出的梯度来更新模型参数。因此选D。"},{"gid":"ce9672d1-eddd-4e29-ad6e-b0dfc54cdae0","type":"单选题","q":"如果一款大模型无法理解复杂图片中的信息，应该采取什么策略？","options":[{"t":"手动提取图片信息。","ok":false},{"t":"使用其他开源 OCR 工具再次尝试识别。","ok":false},{"t":"放弃使用该图片。","ok":false},{"t":"使用语义空间 API 的视觉理解模型对图片进行更深层次的分析。","ok":true}],"analysis":"答案：D\n\n解析：当大模型无法理解复杂图片时，手动提取(A)效率低，放弃(C)太消极。开源OCR(B)仅限文字识别，难解图表等复杂信息。最佳策略是调用语义空间API的视觉理解模型(D)，利用专业多模态模型进行深层次语义分析。这能有效弥补原模型视觉能力短板，高效精准地提取复杂图片信息，是AI应用中最合理的解决方案。"},{"gid":"5c7bf9e6-a34f-4316-9f1d-062efb3ab7e7","type":"单选题","q":"下列哪项不属于大语言模型微调可能带来的挑战？","options":[{"t":"需要足够高质量的特定领域数据","ok":false},{"t":"微调过程可能引入偏见","ok":false},{"t":"模型大小和复杂度降低","ok":true},{"t":"过拟合特定任务，泛化能力下降","ok":false}],"analysis":"答案：C\n\n解析：大语言模型微调是在预训练模型基础上更新参数，模型的大小和架构复杂度通常保持不变，不会因此降低，故C项不属于挑战。而微调需要获取大量高质量的特定领域数据（A项）；若微调数据存在偏差，模型会学习并放大偏见（B项）；此外，过度针对特定任务易导致过拟合，损害模型的通用泛化能力（D项）。A、B、D均为微调面临的实际挑战。"},{"gid":"df8117e3-b210-4f58-9801-21f243a34f79","type":"单选题","q":"大语言模型微调相比重头训练的主要优势是什么？","options":[{"t":"训练时间更长","ok":false},{"t":"可以利用预训练学到的通用知识","ok":true},{"t":"需要更多计算资源","ok":false},{"t":"对特定任务的表现不如从头训练的模型","ok":false}],"analysis":"答案：B\n\n解析：\n大语言模型微调的核心优势是“站在巨人的肩膀上”。预训练模型已在海量数据中学习了丰富的语言规律和通用知识。微调只需在特定任务的小规模数据上调整参数，即可让模型快速适应新任务。这不仅大幅缩短了训练时间（排除A），显著降低了计算资源消耗（排除C），还能在特定任务上取得优异表现（排除D）。因此，利用预训练学到的通用知识是其最大优势。"},{"gid":"ae7db11e-bf8d-4ee9-a36c-cf52f0d99eaf","type":"单选题","q":"在 RAG 系统中，将文档拆分成多个分块（chunks）的主要目的是什么？","options":[{"t":"适配大模型的输入限制，并提高检索的准确性和相关性。","ok":true},{"t":"减小存储空间，提高检索效率。","ok":false},{"t":"方便用户浏览，提升用户体验。","ok":false},{"t":"简化文档预处理流程，降低开发成本。","ok":false}],"analysis":"答案：A\n\n解析：在RAG系统中，大模型存在上下文窗口限制，文档分块可确保检索到的内容不超出模型的输入长度。同时，细粒度的分块能减少无关信息的干扰，使向量检索更精准地匹配用户问题，从而显著提高检索的准确性与生成内容的相关性。分块不仅不会减小存储空间，反而增加了预处理复杂度，且与前端用户浏览体验无关。"},{"gid":"00ba3e36-0059-4675-a454-fd8b937f2690","type":"单选题","q":"数据预处理中，将分类任务的标签转化为模型可理解的数字形式称为什么？","options":[{"t":"文本标准化","ok":false},{"t":"词嵌入（Word Embedding）","ok":false},{"t":"特征缩放","ok":false},{"t":"标签编码（Label Encoding）","ok":true}],"analysis":"答案：D\n\n解析：\n在机器学习中，模型通常只能处理数值型数据。标签编码（Label Encoding）专门用于将分类任务中的非数值型标签（如文本类别）转换为模型可理解的整数形式（如0, 1, 2）。选项A用于文本清理；选项B用于将词语映射为稠密向量；选项C用于对数值特征进行归一化或标准化，均不符合题意。因此选D。"},{"gid":"8b984514-d691-4535-a1c4-6d36555c5d79","type":"单选题","q":"发现机器人输出的内容包含不安全信息，以下哪种做法不推荐？","options":[{"t":"记录不安全信息，用于后续模型改进和安全策略优化。","ok":false},{"t":"直接将原始输出返回给用户。","ok":true},{"t":"过滤掉不安全信息，返回剩余安全内容。","ok":false},{"t":"向用户返回提示信息，告知其输出内容存在风险。","ok":false}],"analysis":"答案：B\n\n解析：当机器人输出包含不安全信息时，直接将其返回给用户（选项B）会导致有害内容传播，违反安全合规原则，可能对用户造成误导或伤害，因此极不推荐。正确的处理方式应包括：记录问题数据以优化模型安全策略（A）、过滤拦截不安全内容（C）或明确提示用户存在风险（D），从而在保障信息安全的前提下维护良好的交互体验。"},{"gid":"90281c96-72e7-4169-b5ca-2e88e578d914","type":"单选题","q":"你需要使用 Qwen-Max 生成一个关于 “Python 基础” 的课程脚本。以下哪种请求方式最合适？","options":[{"t":"向 Qwen-Max 发送一条包含 “Python 基础课程脚本” 的请求，并附加一些示例代码。","ok":false},{"t":"向 Qwen-Max 发送一条详细描述课程目标和内容的请求，例如：“请生成一个 Python 基础课程脚本，包含变量、数据类型、运算符、控制流等内容。”","ok":true},{"t":"向 Qwen-Max 发送多条分别包含 “Python 变量”、“Python 数据类型”、“Python 运算符” 等关键词的请求。","ok":false},{"t":"向 Qwen-Max 发送一条包含 “Python” 关键词的请求 。","ok":false}],"analysis":"答案：B\n\n解析：在使用大模型时，提示词需清晰、具体且上下文充分。选项B明确了任务目标（生成脚本）和具体内容大纲（变量、数据类型等），能引导模型生成结构完整、连贯的课程脚本。选项A附加代码易限制模型发挥；选项C拆分请求会破坏脚本的整体连贯性；选项D过于宽泛，缺乏具体指导。因此B最合适。"},{"gid":"de424642-0855-46b9-a297-184af3b4fc69","type":"单选题","q":"以下哪个任务最适合使用大语言模型？","options":[{"t":"对一组图像进行精确的像素级分割","ok":false},{"t":"计算一组数据的标准差","ok":false},{"t":"在一个大型数据集上训练一个复杂的机器学习模型（例如，深度神经网络）","ok":false},{"t":"检测一组销售数据中的异常值","ok":true}],"analysis":"答案：D\n\n解析：大语言模型擅长逻辑推理与代码生成。A项是计算机视觉任务，需专用视觉模型；B项需精确数值计算，LLM易出错，传统工具更佳；C项是模型训练工程，需依赖专业框架与算力，LLM无法直接执行。D项中，LLM可结合业务上下文进行逻辑推理，或生成代码来辅助检测销售数据异常，是最适合发挥其综合分析与代码辅助能力的任务。"},{"gid":"5222e7af-541e-474c-b6d7-19c485f77e8c","type":"单选题","q":"使用模型检查点（checkpointing）保存模型时，一般会保存哪种情况下的模型？","options":[{"t":"验证集性能最好的模型","ok":true},{"t":"训练结束时的模型","ok":false},{"t":"每次迭代后的模型","ok":false},{"t":"训练初期的模型","ok":false}],"analysis":"答案：A\n\n解析：在模型训练中，使用检查点（checkpointing）的核心目的是防止过拟合并获取泛化能力最强的模型。验证集用于评估模型在未见数据上的表现，因此保存**验证集性能最好**的模型能确保获得最优的泛化效果。训练结束时的模型可能已过拟合；每次迭代都保存会极大浪费存储空间；训练初期的模型尚未收敛，性能较差。因此，通常选择保存验证集表现最佳的模型。"},{"gid":"3f440e70-d1f8-427b-9b0b-91acf374c36e","type":"单选题","q":"公司新发了《远程办公规定》，你想让现有答疑机器人掌握这份规定的内容。基于已经搭建好的 RAG 应用，你应该怎么做？","options":[{"t":"在提示词模板中增加远程办公规定的内容","ok":false},{"t":"将新文档分块后更新向量数据库","ok":true},{"t":"微调大模型以确保大模型能理解新规定的内容","ok":false},{"t":"使用纯规则引擎匹配","ok":false}],"analysis":"答案：B\n\n解析：RAG的核心优势是无需重训模型即可动态更新知识。新增文档的标准流程是将其分块并转化为向量，更新至向量数据库。A选项受限于大模型上下文窗口，不适合长文档；C选项微调成本高、周期长，违背了RAG免微调的初衷；D选项纯规则引擎缺乏语义理解，无法处理自然语言问答。因此，更新向量数据库是最高效且符合RAG架构的做法。"},{"gid":"0874d380-e790-4c6b-9434-78f05357be25","type":"单选题","q":"你开发了一个聊天机器人，用户反馈每次提问后总是要等很久才能看到回复，你应该怎么做？","options":[{"t":"降低temperature值","ok":false},{"t":"采用流式输出","ok":true},{"t":"在生成间隙通过前端界面展示动画，减少用户等待的疲惫感","ok":false},{"t":"提醒用户输入尽量少的提示词","ok":false}],"analysis":"答案：B\n\n解析：大模型生成完整回复耗时较长。采用流式输出（Streaming）能将生成的文本逐字实时推送到前端展示，让用户无需等待全部生成即可看到内容，极大降低体感延迟，是业界标准解法。A项主要影响生成随机性而非速度；C项展示动画治标不治本，未解决实质等待问题；D项限制输入会严重损害用户体验。"},{"gid":"86943b46-a8a8-4870-be09-6b5f73be7229","type":"单选题","q":"以下哪种哪种场景适合使用阿里云百炼上提供的大模型BatchAPI（批量处理接口）来优化成本或效率？","options":[{"t":"在实时在线客服对话中，使用BatchAPI同时处理多个用户的并发请求，以提高响应速度","ok":false},{"t":"在会议直播场景中，使用BatchAPI让大模型将主讲人的的发言实时翻译成多个语种","ok":false},{"t":"将BatchAPI与流式传输（Streaming）结合，逐步返回批量处理中的部分结果给用户","ok":false},{"t":"收集一周内的数千条产品用户反馈信息，打包后一次性提交给大模型生成分析总结报告","ok":true}],"analysis":"答案：D\n\n解析：阿里云百炼的Batch API采用异步处理机制，具有成本更低、吞吐量更大的优势，但不支持实时响应和流式输出（排除A、B、C）。它专为非实时、大批量的离线数据处理设计。选项D中处理数千条历史反馈并生成报告，对实时性要求低且数据量大，完美契合Batch API异步提交、统一获取结果的特性，能有效优化成本与效率。"},{"gid":"a0aa11fc-95e0-41e8-bd18-58c4212e70e6","type":"单选题","q":"公司文档规模可达数百万条，需7x24小时高可用的RAG服务。下列哪种向量存储方式最适合？","options":[{"t":"存为Excel","ok":false},{"t":"本地部署Milvus/Qdrant","ok":false},{"t":"阿里云向量检索服务（DashVector)等云方案","ok":true},{"t":"内存向量存储","ok":false}],"analysis":"答案：C\n\n解析：\nA项Excel不支持向量检索；D项内存存储受限于单机容量，无法支撑百万级数据且无高可用保障。B项本地部署Milvus等虽支持大规模，但保障7x24小时高可用需极高的运维与硬件成本。C项云向量服务（如DashVector）天然支持海量数据与弹性扩容，由云厂商提供SLA保障，免运维即可轻松实现7x24小时高可用，是企业级生产环境的最优解。"},{"gid":"b46bfac4-1434-4f64-846a-ef43e2947654","type":"单选题","q":"你开发了一个RAG应用，发现其在回答内部流程问题（如“报销系统登录方式”）时准确率高，但回答通识性问题（如“如何修复Excel公式错误”）时质量差。应该优先尝试以下哪个改进方案？","options":[{"t":"结合意图识别，公司内部问题才执行检索增强","ok":true},{"t":"扩大RAG检索范围，加入公开技术文档","ok":false},{"t":"调整温度参数（Temperature=0.5）平衡回答稳定性","ok":false},{"t":"禁用RAG，所有问题依赖大模型回答","ok":false}],"analysis":"答案：A\n\n解析：内部问题准确率高说明现有RAG对内部知识库有效。通识问题质量差是因为大模型本身具备丰富通识，强制RAG检索反而易引入无关噪声干扰生成。A选项通过意图识别进行路由，内部问题走RAG，通识问题直接交由大模型回答，既保持内部问答优势，又发挥大模型通识能力。B会增加检索噪声与成本，C治标不治本，D会丧失内部问答准确率。"},{"gid":"c3480f1e-833f-404a-86b9-b36fcb70b274","type":"单选题","q":"你开发了一个用药咨询应用，因图片OCR错误将“药品副作用：轻微头痛”识别为“严重头痛”，导致生成误导性回答。以下哪种方案更能系统性减少这类问题？","options":[{"t":"禁止用户输入图片，要求用户用文字输入药物信息","ok":false},{"t":"对视觉理解结果添加人工复核，避免图片不清晰导致的识别错误","ok":false},{"t":"在识别结果旁添加“可能存在误差”的免责声明","ok":false},{"t":"从图像中提取药物信息后，结合药品知识库校验提取的信息","ok":true}],"analysis":"答案：D\n\n解析：A项牺牲用户体验；B项人工复核成本高、难规模化；C项仅规避风险，未解决错误。D项结合药品知识库校验，能利用权威数据自动纠正OCR的语义错误（如“轻微”变“严重”）。该方案既保持了自动化的高效性，又从系统架构层面利用领域知识兜底，根本性降低了医疗误导风险，是最优的系统性解决方案。"},{"gid":"6655d625-6adc-4ddb-9b5e-309c539f6978","type":"单选题","q":"如果想要自定义 langchain 的 LLM 对象，理论上只需要准备以下哪个要素？","options":[{"t":"一个 API Key","ok":false},{"t":"一个 Model name","ok":false},{"t":"一个 JSON，直接加载即可","ok":false},{"t":"一个输入为字符串，输出为字符串的函数","ok":true}],"analysis":"答案：D\n\n解析：\n在 LangChain 中，自定义 LLM 的核心是实现文本到文本的生成逻辑。理论上，只需继承 LLM 基类并实现 `_call` 方法，该方法本质上就是一个接收字符串（Prompt）并返回字符串（生成结果）的函数。API Key 和 Model name 仅是调用特定第三方模型（如 OpenAI）的参数，而 JSON 并非自定义 LLM 的标准配置方式。因此，最核心的要素是输入输出均为字符串的函数。"},{"gid":"61d4a467-b4e4-4520-bfe7-c1acf3a8f1fb","type":"单选题","q":"LlamaIndex 在创建 RAG 应用时，第一步 SimpleDirectoryReader 是将知识文件解析为？","options":[{"t":"Document 对象","ok":false},{"t":"元素为 Document 对象的列表","ok":true},{"t":"索引 index","ok":false},{"t":"包含所有文字信息的字符串","ok":false}],"analysis":"答案：B\n\n解析：在LlamaIndex中，`SimpleDirectoryReader`用于加载本地目录文件。调用其`load_data()`方法时，它会将目录下的每个文件分别解析并封装为独立的`Document`对象，最终返回一个由这些`Document`对象组成的列表（`List[Document]`）。它不会直接返回单一对象、纯字符串或构建索引（索引是后续步骤）。该列表将作为后续节点切分和构建索引的基础数据。"},{"gid":"9936272b-34b0-4a5d-8e02-d7ce4374c534","type":"单选题","q":"你在调用通义千问 API 时设置了 temperature（温度）参数，以下哪种说法是正确的？","options":[{"t":"温度参数越高，候选 Token 的概率值之间的差距会变大，从而带来更高的随机性","ok":false},{"t":"温度参数越高，低概率的候选 Token 有概率超过高概率的候选 Token 的概率","ok":false},{"t":"温度参数越高，候选 Token 的概率值会越接近，从而带来更高的随机性","ok":true},{"t":"温度参数越高，越适合撰写技术报告、代码等有较高确定性需求的场景","ok":false}],"analysis":"答案：C\n\n解析：Temperature（温度）参数用于控制生成的随机性。在概率计算中，温度越高，候选Token的原始得分被压缩，使得最终的概率分布更平滑，各Token的概率值越接近，从而提升随机性与多样性。反之，温度越低，概率分布越集中，确定性越高，才更适合代码或技术报告等严谨场景。因此C正确，A、B、D均错误。"},{"gid":"60e9457a-7226-4493-ad73-47324a95ab0c","type":"单选题","q":"你在开发一个基于RAG的智能客服系统，用于回答用户关于产品功能的技术问题。为了提升回答的准确性，你调整了检索模块的相似度阀值，从默认的0.7提高到了0.95。然而，测试后发现，部分用户的提问得不到满意的回答。可能的原因是什么？","options":[{"t":"检索模块的计算复杂度增加，导致大模型推理速度变慢","ok":false},{"t":"用户提问的语言风格与产品文档内容不一致，导致检索失败","ok":false},{"t":"回答准确但不全面，因为过于严格的检索条件过滤掉了部分有用的上下文信息","ok":true},{"t":"系统成功过滤掉了所有无用数据，回答的准确性和完整度都得到了显著提升","ok":false}],"analysis":"答案：C\n\n解析：在RAG系统中，将相似度阈值从0.7大幅提高至0.95，会使检索条件过于严格。这虽能提升精确度，但会显著降低召回率。许多相关但语义表达略有差异、相似度未达标的有用上下文会被过滤掉。大模型因缺乏充足信息，生成的回答往往不全面甚至无法作答，导致用户不满意。A项不增加计算复杂度；B项非直接原因；D项与题干矛盾。"},{"gid":"bdcba43f-b365-4d67-977e-934a8e19e5f4","type":"单选题","q":"某RAG系统回答“张伟是哪个部门的”时，总是只检索到一个无关切片，导致答案不准确。为改进检索效果，下列哪种做法有助于改善这个问题？","options":[{"t":"换用更大参数量的大模型","ok":false},{"t":"提高检索时的召回数量（TopK）","ok":true},{"t":"放弃知识库，全部“对话式”推理","ok":false},{"t":"修改前端界面外观","ok":false}],"analysis":"答案：B\n\n解析：本题中RAG系统回答错误是因为检索阶段未召回相关切片。提高召回数量（TopK）能增加返回的切片数，从而提高命中正确信息的概率，直接改善检索效果。换大模型（A）仅提升生成能力，不解决检索问题；放弃知识库（C）会引发幻觉，违背RAG初衷；修改前端（D）与底层检索逻辑无关。故选B。"},{"gid":"4bb1083e-4bf3-4a58-a6cd-c0148c183ffe","type":"单选题","q":"你在开发一个可以自动回答客户问题的客服平台，除了回答产品知识问题外，你希望它还能执行与账户相关的操作（例如实时查询用户订单状态、修改账户绑定的手机号、提交工单或退款申请）。你应该考虑引I入什么技术来扩展大模型的能力？","options":[{"t":"RAG (Retrieval Augmented Generation)","ok":false},{"t":"Agent(智能体）","ok":true},{"t":"大模型微调","ok":false},{"t":"数据増强","ok":false}],"analysis":"答案：B\n\n解析：题目要求大模型不仅能回答问题，还要能“执行”查订单、改手机号等具体操作。Agent（智能体）具备自主规划和工具调用能力，可让大模型通过API与外部业务系统交互，完成实际操作。而RAG主要用于检索外部知识辅助生成；微调侧重于改变模型内在知识或风格；数据增强用于扩充训练数据。因此，赋予大模型执行复杂任务的能力应引入Agent。"},{"gid":"6c45f5d4-8728-479b-9e59-fa0c88aab282","type":"单选题","q":"你是某金融APP的智能投顾系统负责人，发现用户存在恶意咨询的情况，如涉及“内幕消息”等敏感词为了在检测到敏感词时立即返回固定话术，以下哪种方案最能满足需求？","options":[{"t":"在生成回答后追加合规性二次审核","ok":false},{"t":"对知识库文档进行预筛查标记","ok":false},{"t":"在用户提问时启用敏感词实时检测","ok":true},{"t":"通过模型微调降低风险话题生成概率","ok":false}],"analysis":"答案：C\n\n解析：题干核心需求是“检测到敏感词时立即返回固定话术”。C选项在用户输入阶段实时拦截，命中即返回固定话术，响应最快且节省大模型算力。A选项生成后审核有延迟且浪费算力；B选项针对知识库而非用户提问；D选项模型微调无法保证100%拦截，且不能直接触发固定话术。故C方案最精准高效。"},{"gid":"3ac28c89-95e9-4490-aa04-ecd352c3f36d","type":"单选题","q":"模型微调最适合以下解决哪种问题？","options":[{"t":"需要实时检索最新互联网信息的任务","ok":false},{"t":"需要提升模型在特定任务的表现","ok":true},{"t":"需要快速响应简单问答的任务","ok":false},{"t":"需要结合用户界面操作的任务","ok":false}],"analysis":"答案：B\n\n解析：模型微调的核心目的是在预训练模型基础上，利用特定领域数据进行进一步训练，从而显著提升模型在特定任务（如专业问答、特定风格生成等）上的表现与准确度。选项A适合检索增强生成（RAG）技术；选项C基础模型即可胜任；选项D适合智能体（Agent）技术。因此，微调最适合解决提升特定任务表现的问题。"},{"gid":"58280b90-a953-4ebd-8be6-13c0db4ab3f6","type":"单选题","q":"梯度下降算法中学习率的作用是？","options":[{"t":"决定梯度计算频率","ok":false},{"t":"调节参数更新步幅","ok":true},{"t":"控制参数更新方向","ok":false},{"t":"调整梯度大小","ok":false}],"analysis":"答案：B\n\n解析：在梯度下降中，参数更新公式为θ=θ-α∇J(θ)，α即学习率。其核心作用是调节每次参数更新的步幅大小。学习率过大易导致模型震荡不收敛，过小则收敛极慢。梯度计算频率由批次大小决定，更新方向由梯度反方向决定，梯度大小由损失函数本身决定，故A、C、D错误。"},{"gid":"5a5b5b57-6c6c-4ddd-b68a-c83f8afa3e5e","type":"多选题","q":"如果你需要自行部署大模型用于推理服务，以下哪些方案有助于提升推理速度？","options":[{"t":"对于长文本生成场景，启用KVCache","ok":true},{"t":"使用CPU集群替代GPU，利用多线程并行处理请求","ok":false},{"t":"使用经过量化的模型，并且评测确认嵯多量化后的模型效果符合业务需求","ok":true},{"t":"任何场景，始终优先使用大参数量模型","ok":false}],"analysis":"答案：A、C\n\n解析：\nA正确：KV Cache通过缓存历史Token的键值对避免重复计算，显著提升长文本生成速度。\nC正确：模型量化（如INT8/INT4）能降低显存占用和内存带宽压力，有效加速推理。\nB错误：GPU的并行矩阵运算能力远超CPU，用CPU替代会大幅降低推理速度。\nD错误：大参数模型计算量大、推理慢，应按需平衡效果与速度，而非盲目追求大参数。"},{"gid":"ff5fe3ab-16b7-4c86-888f-0e8edc9f0f44","type":"多选题","q":"以下哪些方法，有助于降低大模型使用成本？","options":[{"t":"精简输入提示词篇幅，同时要求大模型输出精简的内容","ok":true},{"t":"根据任务复杂度，选择参数量合适的大模型","ok":true},{"t":"对于任何任务，始终选择参数量较大的模型","ok":false},{"t":"对于可以通过预定义逻辑、固定模板或经典算法高效完成的任务，不使用大模型处理","ok":true}],"analysis":"**答案**：A、B、D\n\n**解析**：\n大模型多按Token计费，精简提示词与输出（A）能直接减少Token消耗；大参数模型推理成本高，按任务复杂度匹配模型（B）可避免算力浪费；传统算法或规则（D）处理简单任务成本极低，应避免大模型滥用。始终选用大模型（C）会造成严重的资源浪费与成本飙升，故排除。"},{"gid":"12bcb32b-8633-4d13-bd15-c0ca7cac8afb","type":"多选题","q":"你正在对大模型进行LORA微调，但在训练过程中发现模型开始过拟合可采取的优化措施包括？","options":[{"t":"使用早停法及时终止训练","ok":true},{"t":"增加训练数据的多样性和数量","ok":true},{"t":"适当增大 batch size","ok":false},{"t":"适当增大 lora_rank 值","ok":false}],"analysis":"答案：A、B\n\n解析：A项早停法可在验证集损失不再下降时终止训练，直接防止过拟合；B项增加数据量和多样性能提升模型泛化能力，从根源缓解过拟合。C项增大batch size会减少梯度更新的随机噪声，削弱正则化效果，反易加剧过拟合（通常应减小）；D项增大lora_rank会增加可训练参数量，提高模型复杂度，同样会加剧过拟合（应减小）。故选AB。"},{"gid":"33a74ca6-91eb-4ec0-bf4a-1a84f48a265c","type":"多选题","q":"一家教育科技公司拟开发高级AI教学产品，旨在实现个性化、智能化、普惠教育。从多智能体协作与自适应教学系统设计的角度，以下哪些系统架构方案是达成其核心目标的有效策略？","options":[{"t":"依赖人工专家团队进行实时干预，作为教学策略调整的主要驱动力。","ok":false},{"t":"部署基于共享内存的黑板（Blackboard）系统，实现各智能体间实时信息交换与决策。","ok":true},{"t":"要求用户统一购买经过认证的高性能设备，将所有核心AI推理功能部署在用户设备上，避免隐私风险。","ok":false},{"t":"设计分层智能体架构，由策略智能体、教学智能体和评估智能体协同规划学习路径。","ok":true}],"analysis":"答案：B、D\n\n解析：A项依赖人工干预成本高，违背“普惠”与“智能化”目标；C项强制购买高性能设备提高用户门槛，违背“普惠”初衷。B项的黑板系统是多智能体协作经典架构，能高效实现复杂教学场景下的信息共享与协同决策；D项的分层智能体架构通过策略、教学、评估等智能体分工协作，精准规划个性化学习路径。B、D均完美契合多智能体协作与自适应教学的设计要求。"},{"gid":"d376d5d7-6a17-48a1-97c9-1254b808eb6b","type":"多选题","q":"一家律所计划构建一个AI助手，辅助律师基于内部案件数据库（用于RAG）起草法律文书。为从技术架构层面有效缓解客户信息泄露风险，应集成哪些设计？","options":[{"t":"部署端到端加密存储方案，对案件数据库中的客户隐私信息（如身份信息、涉案细节）进行加密处理，仅授权进程可解密调用","ok":true},{"t":"构建精细化RBAC权限体系，按律师所属业务线、案件参与权限划分数据访问范围，禁止跨案件、跨权限查询客户敏感数据","ok":true},{"t":"集成数据脱敏引擎，在RAG检索、大模型生成法律文书的过程中，自动屏蔽客户身份证号、手机号、住址等敏感字段（如用\"”替换关键字符）","ok":true},{"t":"新增操作审计日志模块，记录AI助手的所有数据访问、文书生成操作，包含访问人、访问时间、数据范围等信息，支持异常行为追溯","ok":true}],"analysis":"答案：A, B, C, D\n\n解析：四选项均属于有效的技术架构安全设计。A项加密存储保障静态数据安全，防底层泄露；B项RBAC权限控制实现逻辑隔离，防越权访问；C项数据脱敏防止RAG检索与大模型推理时的敏感信息外泄；D项审计日志提供行为监控与事后追溯能力。四者涵盖存储、访问、处理与审计环节，构成完整的安全防护闭环，全面缓解泄露风险。"},{"gid":"3c5f6a41-d727-4253-a511-2c3b649e39ca","type":"单选题","q":"你在开发公司内部制度问答机器人时，将所有制度文件都输入到大模型中，导致输入超长报错。应优先采用哪种方案？","options":[{"t":"使用RAG，检索最相关的文本段后再输入到大模型","ok":true},{"t":"增加生成Token的数量","ok":false},{"t":"降低temperature值","ok":false},{"t":"通过参数调整大模型的最大输入长度","ok":false}],"analysis":"答案：A\n\n解析：输入超长报错是因文本超出模型上下文窗口限制。RAG（检索增强生成）通过检索最相关的文本段输入模型，不仅解决超长问题，还能降低成本并提升回答准确率，是知识库问答的最优解。B、C项分别控制输出长度和生成随机性，与输入无关。D项受限于模型物理上限，且全量输入会导致成本高昂及“注意力迷失”，非优先方案。"},{"gid":"c2f8090b-468f-4b4c-ba29-3cdec89024f8","type":"单选题","q":"你在使用本地部署的qwen2.5-14b模型，输入提示词：“请用适合简报的形式，以每篇100字的篇幅总结今早的十大新闻”，但发现无法按照预期给出正确的结果，这是为什么？","options":[{"t":"输出长度受限，10篇新闻过多","ok":false},{"t":"要求列出10个项目意味着处理结构化数据，而LLM对此不擅长","ok":false},{"t":"由于知识截止限制，LLM无法获取最新新闻","ok":true},{"t":"指令需要明确简报类型（科技、综合新闻等）","ok":false}],"analysis":"答案：C\n\n解析：本地部署的qwen2.5-14b模型仅依赖预训练数据，存在知识截止日期，且默认不具备实时联网搜索能力。因此，它无法获取“今早”的最新新闻，只能产生幻觉或输出旧闻。A项千字输出未超模型限制；B项LLM擅长列表生成；D项细化指令无法解决缺乏实时数据的根本问题。故选C。"},{"gid":"fb6cd76a-61d6-4b29-b4a0-236fb79c1c7e","type":"单选题","q":"你设计了一个车载场景的智能对话助手，它可以帮乘客调整座椅、打开空调等。某次测试中，用户输入“把靠背调低一点”，助手却打开了空调。经过分析，发现是因为调整座椅工具的描述（description）过于简单，导致助手误判了用户意图。以下哪个调整座椅工具的描述信息可以使助手提高调用工具的准确率？","options":[{"t":"请根据用户的输入判断是否需要调整座椅，然后调用对应的工具。","ok":false},{"t":"如果用户要调整座椅，请调用aa工具；如果用户要打开空调，请调用bb工具。","ok":false},{"t":"你擅长理解用户的多样化需求，可以通过语义分析选择正确的工具。","ok":false},{"t":"当用户希望调整座椅靠背或前后位置时使用此工具。该工具接收两个参数：前后（单位为厘米）、角度（单位为度）。","ok":true}],"analysis":"答案：D\n\n解析：工具描述的核心是让模型明确功能边界与参数细节。D选项清晰界定了触发场景（调整靠背或前后位置），并详细说明参数（前后、角度）及单位，使模型能精准将“靠背调低”映射到“角度”参数，避免与空调等工具混淆。A、C过于笼统缺乏细节；B属于系统级路由指令，而非单一工具的描述。因此D最能提升调用准确率。"},{"gid":"c49367c1-c530-44ea-a989-c2c62b9e3b8e","type":"单选题","q":"在优化检索效果时，以下哪些是调整similarity_top_k参数的好处?","options":[{"t":"增加召回的文档切片数量","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：在向量检索或RAG（检索增强生成）中，`similarity_top_k`参数用于控制从数据库中返回与查询最相似的前K个文档切片。因此，调整（增大）该参数的直接作用是增加召回的文档切片数量，从而为模型提供更丰富的上下文。该参数仅影响检索返回的结果数量，与模型的训练数据、参数数量无关，且增大该值通常会增加而非减少推理时间。"},{"gid":"b778ddba-2710-41ec-99dc-b49982597938","type":"单选题","q":"以下代码片段中，StorageContext 的作用是什么？\npython\nstorage_context = StorageContext.from_defaults(persist_dir=PERSIST_DIR)\nindex = load_index_from_storage(storage_context)","options":[{"t":"加载存储在内存中的索引。","ok":false},{"t":"创建新的索引。","ok":false},{"t":"执行查询操作。","ok":false},{"t":"提供加载持久化索引所需的上下文信息。","ok":true}],"analysis":"答案：D\n\n解析：\n代码中 `StorageContext.from_defaults(persist_dir=...)` 创建了存储上下文并指定了持久化目录。随后 `load_index_from_storage` 利用该上下文从磁盘加载已保存的索引。因此，`StorageContext` 的作用是封装并提供加载持久化索引所需的路径和存储配置等上下文信息。A错在“内存”（实为磁盘持久化），B和C与代码的“加载”行为不符，故选D。"},{"gid":"1d6817a4-bb54-4d80-9579-dd4318d84ff2","type":"单选题","q":"以下哪种方法不属于常见的文档切片方法？","options":[{"t":"按词性分割","ok":true},{"t":"按 token 长度分割","ok":false},{"t":"按语义分割","ok":false},{"t":"按字符分割","ok":false}],"analysis":"答案：A\n\n解析：在NLP和RAG（检索增强生成）中，常见的文档切片方法包括按字符分割（如固定长度或特定分隔符）、按token长度分割（适配模型上下文窗口）以及按语义分割（保持段落上下文完整性）。而“按词性分割”主要用于句法分析、信息抽取等微观层面的语言处理任务，不用于宏观的文档文本块切分。因此A不属于常见的文档切片方法。"},{"gid":"07ca675d-43da-4e17-9ae7-2f51fea987ae","type":"单选题","q":"以下哪种方式不符合 Multi-Agent 的处理思想？","options":[{"t":"将文档的标题改写、表格单元格改写和语义分割都交给同一个大模型一次性完成。","ok":true},{"t":"使用 DashScopeParse 解析文档结构，再使用通义千问 API 润色文本。","ok":false},{"t":"使用规则引擎处理简单的文本格式转换，使用大模型处理复杂的语义理解任务。","ok":false},{"t":"根据不同的子任务需求，选择不同的模型类型和参数。","ok":false}],"analysis":"答案：A\n\n解析：Multi-Agent的核心思想是任务分解与分工协作，将复杂任务拆分为多个子任务，由不同专长的智能体协同完成。选项B、C、D均体现了根据子任务需求调用不同工具、模型或规则进行分工协作的理念。而选项A将所有子任务交给同一个大模型“一次性”完成，属于典型的单智能体（Single-Agent）模式，缺乏任务拆解与多角色协作，不符合Multi-Agent思想。"},{"gid":"36fcf791-c4d1-452c-b390-3fb709180ca0","type":"单选题","q":"以下哪种文档切片方法能够更好地保持句子的完整性？","options":[{"t":"基于语义的切片，通过 markdown 文档结构进行","ok":false},{"t":"基于句子的切片","ok":true},{"t":"随机切片","ok":false},{"t":"基于语义的切片，通过嵌入模型计算语义断点","ok":false},{"t":"基于字符切片","ok":false},{"t":"基于固定 token 长度切片","ok":false}],"analysis":"答案：B\n\n解析：\n基于句子的切片以自然语言的标点符号（如句号、问号）为边界进行切分，能确保句子不被从中截断，最直接且完美地保持句子的完整性。相比之下，字符切片和固定token切片极易在句子中间强行截断；随机切片毫无规律；而基于Markdown结构或语义模型的切片，主要侧重于保持段落、章节或宏观语义的完整性，在“句子”这一微观级别的精准控制上不如基于句子的切片。"},{"gid":"5ab43c5c-9145-47cb-b768-b555ae0ccc1a","type":"单选题","q":"以下哪个提示词示例最有效地利用了分隔符来区分不同的要素？","options":[{"t":"plaintext...## 任务目标写一首关于春天的诗## 受众儿童## 输出格式四行诗","ok":true},{"t":"plaintext...任务目标是写一首关于春天的诗，受众是儿童，输出格式是四行诗。","ok":false},{"t":"plaintext...任务目标，写一首关于春天的诗，受众，儿童，输出格式，四行诗","ok":false},{"t":"plaintext...任务目标写一首关于春天的诗受众儿童输出格式四行诗","ok":false}],"analysis":"答案：A\n\n解析：在提示词工程中，使用特殊符号（如“##”、“---”等）作为分隔符，能有效帮助大模型精准区分不同要素。选项A利用“##”将任务目标、受众和输出格式清晰隔离，结构化程度最高，可避免模型混淆。选项B、C仅依赖自然语言标点，分隔界限模糊；选项D完全缺失分隔符，极易导致语义粘连和理解偏差。因此，A选项最有效地利用了分隔符。"},{"gid":"e5fb4d85-804a-4bfa-b6c2-5d0d92a2dead","type":"单选题","q":"如果让你从 faithfulness,context_recall,context_precision,answer_correctness 中选择一个最能代表 RAG 应用整体性能的指标，你会选哪个？","options":[{"t":"context_precision","ok":false},{"t":"context_recall","ok":false},{"t":"answer_correctness","ok":true},{"t":"faithfulness","ok":false}],"analysis":"答案：C\n\n解析：\nRAG的最终目标是提供正确答案。answer_correctness（答案正确性）直接衡量生成答案与标准答案的匹配度，是检索与生成端到端效果的最终体现。若检索不佳或生成错误，该指标均会降低。而context_recall和precision仅评估检索阶段，faithfulness仅评估答案是否忠于上下文（不保证答案本身正确）。因此，它最能代表整体性能。"},{"gid":"25051ee4-ae62-4b74-a0b3-795f090938f3","type":"单选题","q":"以下代码片段实现了哪种文本合规检查方法？python...import re def check_text(text):pattern = r\"假货|劣质|骗子\"if re.search(pattern, text):return \"包含敏感词\"else:return \"文本安全\"text = \"这个产品质量很好，不像其他假货\"result = check_text(text)print(result) # 输出：包含敏感词...","options":[{"t":"语义分析","ok":false},{"t":"模式匹配","ok":true},{"t":"机器学习","ok":false},{"t":"词性匹配","ok":false}],"analysis":"答案：B\n\n解析：代码使用Python的`re`模块进行正则表达式匹配。正则表达式通过预定义的字符模式（如“假货|劣质|骗子”）在文本中直接搜索特定字符串，属于典型的**模式匹配**。该方法基于固定规则，不涉及上下文语义理解（排除A），不依赖数据训练模型（排除C），也不分析词语的语法属性（排除D）。因此选B。"},{"gid":"495fe811-6174-433b-ad00-08199f055c63","type":"单选题","q":"以下哪种参数组合会使得模型生成结果最具多样性？","options":[{"t":"temperature = 0.1, top_p = 0.9","ok":false},{"t":"temperature = 0.1, top_p = 0.1","ok":false},{"t":"temperature = 0.9, top_p = 0.1","ok":false},{"t":"temperature = 0.9, top_p = 0.9","ok":true}],"analysis":"答案：D\n\n解析：\n在模型生成中，`temperature`和`top_p`均用于控制输出的随机性。`temperature`值越高，概率分布越平滑，模型越倾向选择低概率词；`top_p`值越高，采样的候选词池越大。两者数值越大，生成结果的多样性就越强。选项D中两个参数均取最高值0.9，因此能最大程度增加随机性，使生成结果最具多样性。"},{"gid":"3945eaec-aa79-4b43-85fb-510ef81f92ed","type":"单选题","q":"在文档审阅中，为什么不建议一次输出所有的结果？","options":[{"t":"只需关注营销表达","ok":false},{"t":"大模型可能会漏掉一些错误","ok":true},{"t":"内容错误不需要处理","ok":false},{"t":"信息量过大，难以理解","ok":false}],"analysis":"答案：B\n\n解析：在文档审阅中，大模型的注意力机制在处理长文本或复杂指令时容易分散。若一次性要求输出所有审阅结果，模型往往会“顾此失彼”，导致漏掉部分错别字、语法或逻辑等细节错误。因此，不建议一次性输出所有结果。最佳实践是采用分步骤、分类别的策略（如先检查拼写，再审查逻辑），引导模型逐步深入，从而有效提升审阅的准确率与全面性。"},{"gid":"71165d83-4cda-48fc-8592-96d4c906ed09","type":"单选题","q":"在优化检索效果时，以下哪种方法可以提升大模型对参考信息的理解？","options":[{"t":"使用结构化的文档格式","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：在检索增强生成（RAG）场景中，使用结构化的文档格式（如Markdown、清晰的标题层级等）能为大模型提供明确的逻辑框架和语义边界。这有效降低了模型解析复杂文本的认知负担，使其更精准地提取和理解参考信息。选项B和D属于模型底层的训练与架构升级，并非针对检索场景的直接优化；选项C仅影响生成速度，与理解能力无关。因此选A。"}]}</script>
<script>
(function(){
  "use strict";

  var BANK = JSON.parse(document.getElementById('bankdata').textContent);
  var QS = BANK.questions;
  var BY = Object.create(null);
  QS.forEach(function(q){ BY[q.gid] = q; });

  var LS = 'offline_tiku_' + (BANK.key || 'bank') + '_v1';

  /* 低于这个时长的作答不计入「平均用时」统计：
     通常是手滑连点，不代表真实思考时间。
     但也别设太高（比如 800ms），否则快速作答的题永远进不了统计。 */
  var MIN_T_MS = 300;

  /* 选项文本里出现这些前缀，说明它指向「其它选项」。
     一旦打乱顺序，「以上所有」「上述均不正确」就指向了错的选项。
     这类题必须保持选项原顺序。 */
  var ORDER_DEPENDENT_RE = /^(以上|上述|前[一二三四五六七八九1-9]项)/;

  /* 判断一道题的选项是否可以打乱 */
  function canShuffleOptions(q){
    for(var i=0;i<q.options.length;i++){
      if(ORDER_DEPENDENT_RE.test(String(q.options[i].t || '').trim())) return false;
    }
    return true;
  }

  /* ============================================================
     选项打乱
     难点：解析正文里大量用「A 对」「B 错」「选项 A」「故选 B」指代选项。
     直接打乱会让解析和选项对不上，比不打乱更糟。
     所以：打乱选项的同时，把解析里所有引用字母重映射。
     ============================================================ */

  /* 用题号做种子，同一道题每次都得到同一个排列（不会刷新就变） */
  function seededShuffle(arr, seed){
    var a = arr.slice();
    var s = seed >>> 0;
    if(s === 0) s = 0x9e3779b9;
    for(var i=a.length-1;i>0;i--){
      /* xorshift32，简单且确定性好 */
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;
      var j = s % (i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* 把字符串里作为「选项代号」出现的字母替换掉。
     只换真正的代号，不碰普通英文单词里的字母。 */
  function remapLetters(text, map){
    var t = String(text || '');
    if(!t || !map) return t;
    function L(i){ return String.fromCharCode(65 + i); }
    function M(letter){
      var i = letter.charCodeAt(0) - 65;
      var ni = map[i];
      return (ni == null) ? letter : L(ni);
    }

    /* 关键：不能一条条规则去改同一个字符串。
       因为第一条规则把 A 改成 B 之后，第二条规则会把新出现的 B 当成原字母再改一遍，
       造成级联替换（A→B→C）。
       做法：一次性用一个正则把所有「选项代号位置」标出来，
       在回调里统一替换，全程只扫一遍原文。 */

    /* 一个字母算「选项代号」必须满足以下任一上下文：
         · 「选项A」「选项 A」「A选项」「A 选项」
         · 「A对/错/正确/错误」
         · 「（A对）」「(A错)」
         · 「故选A」「应选A」「选A」
         · 「答案：A」「答案：A、B」
         · 并列列表 A、B / A,B
       其它位置的 A-F（比如 API、ABC、CPU）一律不动。 */
    var RE = new RegExp(
      '(选项\\s*)([A-F])' +                                    // 选项A
      '|([A-F])(\\s*选项)' +                                     // A选项
      '|([（(]\\s*)([A-F])(\\s*)([对错])(\\s*[）)])' +            // （A对）
      '|(故选|应选|选)(\\s*)([A-F])' +                            // 故选A
      '|(答案[:：]\\s*)([A-F](?:\\s*[、,，]\\s*[A-F])*)' +          // 答案：A、B
      '|([A-F])(\\s*)(对|错|正确|错误|不正确)' +                   // A对
      '|([A-F](?:\\s*[、,，]\\s*[A-F])+)'                          // A、B
    , 'g');

    return t.replace(RE, function(){
      var m = arguments;
      /* 各分支按捕获组位置处理 */
      if(m[1] !== undefined) return m[1] + M(m[2]);              // 选项A
      if(m[3] !== undefined) return M(m[3]) + m[4];              // A选项
      if(m[5] !== undefined) return m[5] + M(m[6]) + m[7] + m[8] + m[9]; // （A对）
      if(m[10] !== undefined) return m[10] + m[11] + M(m[12]);   // 故选A
      if(m[13] !== undefined) return m[13] + m[14].replace(/[A-F]/g, M); // 答案：A、B
      if(m[15] !== undefined) return M(m[15]) + m[16] + m[17];   // A对
      if(m[18] !== undefined) return m[18].replace(/[A-F]/g, M); // A、B 列表
      return m[0];
    });
  }

  /* 取一道题在当前模式下的选项显示顺序
     返回 { order: [原索引...], q: 使用该顺序的题目对象 }
     order[i] = 显示在第 i 位的选项在原数据中的下标 */
  function optionView(q){
    /* 考试中（及交卷后看解析）：用开考时固定下来的顺序 */
    if(S.exam && S.exam.optOrder && S.exam.optOrder[q.gid]){
      return { order: S.exam.optOrder[q.gid].slice(), shuffled: true };
    }

    /* 依赖选项位置的题（「以上所有」等）永远不打乱 */
    if(!canShuffleOptions(q)){
      return { order: q.options.map(function(_, i){ return i; }), shuffled: false };
    }

    /* 练习模式下是否打乱：
         · 顺序刷题：按「轮次」打乱 —— 每重置一次换一套排列
         · 随机刷题：同样打乱，但开关可以关掉退回原始顺序
         · 错题本 / 收藏 / 搜索：跟顺序刷题共用同一套排列，
           保证同一道题在不同页面看到的选项位置一致 */
    var shuffle = (S.mode === 'random') ? (S.shuffleOpt !== false) : true;
    if(!shuffle){
      return { order: q.options.map(function(_, i){ return i; }), shuffled: false };
    }

    /* 种子 = gid 哈希 + 轮次。
       轮次 S.optRound 每次「重置」时 +1，同一道题就换一个排列。
       不重置的话，同一题永远同一个排列（刷新、切页面都不变）。 */
    var seed = 2166136261;
    var g = q.gid || '';
    for(var k=0;k<g.length;k++){
      seed ^= g.charCodeAt(k);
      seed = (seed * 16777619) >>> 0;
    }
    seed = (seed ^ (((S.optRound || 0) * 2654435761) >>> 0)) >>> 0;
    var idx = q.options.map(function(_, i){ return i; });
    var out = seededShuffle(idx, seed);
    /* 小概率（40题中约2题）打乱后恰好还是原序，那就白打乱了。
       检测到这种情况就整体旋转一位，保证「说打乱就真的打乱了」。 */
    var same = true;
    for(var t=0;t<out.length;t++){ if(out[t] !== t){ same = false; break; } }
    if(same && out.length > 1){ out.push(out.shift()); }
    return { order: out, shuffled: true };
  }

  /* 把「原下标集合」转成「显示位置集合」 */
  function toDisplayIdx(origIdxList, order){
    var out = [];
    for(var i=0;i<order.length;i++){
      if(origIdxList.indexOf(order[i]) >= 0) out.push(i);
    }
    return out;
  }
  /* 反向：显示位置 → 原下标 */
  function toOrigIdx(displayIdx, order){
    return order[displayIdx];
  }

  /* 把解析正文里的选项字母，按当前显示顺序重写。
     map: dispOf[原始下标] = 显示位置 */
  function analysisText(q, body, dispOf, shuffled){
    if(!shuffled || !body) return body;
    return remapLetters(body, dispOf);
  }

  /* 题库自带的「答案：D」行，也要跟着重写（否则标题与选项对不上） */
  function analysisAnswerLetters(sp, dispOf, shuffled){
    var s = sp.ans || '';
    if(!shuffled || !s) return s;
    return remapLetters(s, dispOf);
  }

  /* ============================================================
     状态
     ============================================================ */
  /* 板块隔离（2026-10-22）
     ------------------------------------------------------------
     原来所有板块共用一份 S.ans —— 顺序刷题答过的题，到单选专项里也显示「已作答」；
     模拟考试交卷更狠，75 道题的作答记录直接并进 S.ans，于是考试一考完，
     顺序/随机/专项/错题本全都「做过了」，错题本还一口气多出几十道。
     用户要的是「每个板块各刷各的」，所以按板块拆开存。

     存储结构：S.ansAll = { seq:{gid:rec}, random:{...}, single:{...}, ... }
     每个板块只读自己那一份，于是互不点亮。

     但仍然需要「跨板块汇总」的地方（不然就变成了 9 个孤立小工具）：
       · 顶栏「已练 N 题 / 正确率」  → aggregateAns() 合并所有板块
       · 统计页按题型/难度          → aggregateAns()
       · 错题本 / 收藏 / 错次 / 掌握度 → 本来就只有一份，全站共享（汇总口径）
     这样既能各刷各的，又不会把「我到底练了多少」拆成九份。

     boardKey(mode) = 当前板块的存储键：
       seq / random / wrong / star / search / single / multi / hard
     「模拟考试」不在其中 —— 考试的作答存在 S.exam.ans 里，
     交卷时只把错题记进错题本，绝不写进任何练习板块。
     ============================================================ */
  var BOARD_KEYS = ['seq','random','wrong','star','search','single','multi','hard'];

  var S = {
    mode:'seq',
    pos:{seq:0,random:0,wrong:0,star:0,search:0},
    order:[],
    /* 按板块分开的作答记录：board -> { gid: {sel,ok,t} } */
    ansAll:{ seq:{}, random:{}, wrong:{}, star:{}, search:{},
             single:{}, multi:{}, hard:{} },
    wrong:[],      // 答错过的题（答对后自动移出）—— 全站汇总，不分板块
    star:[],       // 收藏
    wcnt:{},       // gid -> 累计答错次数（错题排行用）
    wlast:{},      // gid -> 最后一次答错的时间戳
    memorizing:false,
    /* 单题临时「揭示答案」：gid -> true
       只影响这一道题，切题或重做就失效，不写进持久化。
       用它替代原来「点一次查看答案就把全局 memorizing 永久开成 true」的错误行为。 */
    reveal:{},
    exam:null,
    examReview:null,
    /* 多选题**未提交**的临时勾选：board -> { gid: [原始下标...] }
       【真实缺陷修复】原来是一个全局的 gid -> 下标表，不分板块。
       于是在顺序刷题勾了 2 个选项（没提交）再切到错题本，
       如果同一道题也在错题本里，打开就看到它已被勾上 ——
       用户原话：「我在顺序刷题和随机刷题，选过的选项，直接在错题就被选择了」。
       现在按板块分开，跨板块互不可见。 */
    pendAll:{ seq:{}, random:{}, wrong:{}, star:{}, search:{},
              single:{}, multi:{}, hard:{} },
    /* 答对「移出错题本」后临时保留该题，用于展示解析。
       只影响一次渲染，切题/切板块即清空。见 noteRight 的说明。 */
    keepAfterRemove:null,
    keepAfterRemoveMode:null,   /* 上面那条保留记录属于哪个板块 */
    search:'',
    examSize:50,
    examLimit:false,          // 考试是否限时
    stats:{ day:'', dayMs:0, totalMs:0 },
    statsTab:'type',          // 统计页维度：type（题型） / diff（难度）
    rankSize:20,              // 错题排行显示条数
    shuffleOpt:true,          // 随机刷题时是否同时打乱选项
    optRound:0,               // 选项排列轮次：每次重置 +1，换一套选项位置
    streak:{},                // gid -> 连续答对次数（答错归零），用于判断「是否真的掌握」
    /* 三个专项练习各自的进度与随机状态，互不干扰 */
    drill:{
      single:{pos:0, order:null, shuffleSeq:false, round:0},
      multi: {pos:0, order:null, shuffleSeq:false, round:0},
      hard:  {pos:0, order:null, shuffleSeq:false, round:0}
    },

    /* 真实考试规格：50 单选×1分 + 25 多选×2分 = 100 分，120 分钟，80 分及格 */
    examSpec:{
      singleCount: 50,
      singlePoint: 1,
      multiCount: 25,
      multiPoint: 2,
      limitMin: 120,
      passScore: 80
    },
    /* 考试历史：每次交卷追加一条，用于「成绩走势」 */
    examHistory:[],           // [{at, score, full, rate, right, total, rightCount, ms, pass, shortfall}]
    /* 每日答题记录：用于「最近几天正确率」 */
    daily:{},                 // 'YYYY-MM-DD' -> {ans, right, ms, examN}
  };

  /* ============================================================
     计时器
     - sessMs      本次打开页面的累计练习时长（刷新即归零）
     - qGid/qMs    当前这道题的累计时长
     - stats.dayMs  今日累计（跨刷新保留）
     - stats.totalMs 总累计（跨刷新保留）
     ============================================================ */
  var TMR = {
    sessMs: 0,
    qGid: null,
    qMs: 0,
    running: true,       // 是否在计时（用户可暂停）
    lastTick: Date.now(),
    lastSave: 0
  };

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function ensureDay(){
    var k = todayKey();
    if(S.stats.day !== k){ S.stats.day = k; S.stats.dayMs = 0; }
  }

  /* 00:00 / 0:00:00 */
  function fmtDur(ms){
    if(ms == null || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    if(h > 0) return h + ':' + pad2(m) + ':' + pad2(ss);
    return pad2(m) + ':' + pad2(ss);
  }
  /* 18 秒 / 1 分 20 秒 */
  function fmtShort(ms){
    if(ms == null || ms < 0) ms = 0;
    var s = Math.round(ms / 1000);
    if(s < 60) return s + ' 秒';
    var m = Math.floor(s / 60), ss = s % 60;
    return m + ' 分' + (ss ? ' ' + ss + ' 秒' : '');
  }

  /* 平均每题用时：只统计真正记录过时间的题（至少 3 题才有参考意义）
     跨板块汇总口径 —— 平均用时是「我这个人做题多快」，不该按板块拆开看。 */
  function avgMs(){
    var n = 0, sum = 0;
    var agg = aggregateAns();
    for(var g in agg){
      var r = agg[g];
      if(r && typeof r.t === 'number' && r.t > MIN_T_MS){ sum += r.t; n++; }
    }
    if(n < 3) return null;
    return sum / n;
  }

  /* ============================================================
     统计：按题型 / 难度聚合
     注意：原始题库只有【题型】一个可用分类字段，没有章节/知识点信息，
     所以这里不做「按章节统计」——那是编不出来的东西。
     难度也不是题库提供的，而是用作答表现推导出来的，UI 上会明确标注。
     ============================================================ */
  /* 难度推导规则（基于你自己的作答表现，不是题库官方难度）：
       未做过                              -> 未练
       ［看历史］错过 2 次以上 -> 较难；错过 1 次 -> 一般
       ［看本次］首次接触时用时远超平均 -> 较难；否则 -> 简单

     重要：先看「历史错过次数」再看「本次对错」，
     这样一道「以前错过、今天答对了」的题会被归为「一般/较难」，
     而不是被洗成「简单」，否则统计就没意义了。 */
  function difficultyOf(q){
    var r = aggregateAns()[q.gid];
    if(!r) return '未练';
    var c = S.wcnt[q.gid] || 0;
    if(c >= 2) return '较难';
    if(c === 1) return '一般';
    var avg = avgMs();
    if(avg && typeof r.t === 'number' && r.t > avg * 1.5) return '较难';
    return r.ok ? '简单' : '一般';
  }

  /* 分组聚合：返回 [{key, total, done, right, wrong, ms, avgMs, rate}]
     跨板块汇总口径：统计页看的是「整体学得怎么样」，不分哪个板块。 */
  function groupStats(getKey){
    var map = Object.create(null);
    var agg = aggregateAns();
    for(var i=0;i<QS.length;i++){
      var q = QS[i];
      var k = getKey(q) || '未分组';
      if(!map[k]) map[k] = { key:k, total:0, done:0, right:0, wrong:0, ms:0, tN:0 };
      var g = map[k];
      g.total++;
      var r = agg[q.gid];
      if(r){
        g.done++;
        if(r.ok) g.right++;
        if(typeof r.t === 'number' && r.t > MIN_T_MS){ g.ms += r.t; g.tN++; }
      }
      g.wrong += (S.wcnt[q.gid] || 0) > 0 ? 1 : 0;
    }
    var out = [];
    for(var key in map){
      var x = map[key];
      x.rate = x.done ? Math.round(x.right / x.done * 100) : null;
      x.avgMs = x.tN ? Math.round(x.ms / x.tN) : null;
      delete x.ms;
      delete x.tN;
      out.push(x);
    }
    return out;
  }

  /* 错题排行：按累计答错次数降序，次数相同则最近错的在前 */
  function wrongRank(){
    var out = [];
    for(var g in S.wcnt){
      var n = S.wcnt[g] || 0;
      if(n <= 0) continue;
      var q = BY[g];
      if(!q) continue;
      out.push({ gid:g, q:q, n:n, last:S.wlast[g] || 0 });
    }
    out.sort(function(a, b){
      if(b.n !== a.n) return b.n - a.n;
      return (b.last || 0) - (a.last || 0);
    });
    return out;
  }
  /* rankAll 就是 wrongRank 的别名，保持调用处可读 */
  function rankAll(){ return wrongRank(); }
