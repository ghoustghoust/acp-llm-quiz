<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>阿里云 ACP 大模型 · 离线题库</title>
<style>
  /* ============ 设计变量：白底 / 黑字 / 蓝着重 ============ */
  :root{
    --bg:#ffffff;
    --fg:#14171c;            /* 正文近黑 */
    --fg2:#3f4753;           /* 次级文字 */
    --muted:#8b939e;         /* 弱化文字 */
    --pri:#1668ff;           /* 蓝色着重 */
    --pri-hi:#0b4fd1;        /* 深蓝（悬停/按下） */
    --pri-soft:#f0f5ff;      /* 淡蓝底 */
    --pri-line:#cfe0ff;      /* 淡蓝描边 */
    --ok:#0b8a4d;
    --ok-soft:#edf9f2;
    --ok-line:#b7e6cc;
    --bad:#d3242f;
    --bad-soft:#fdefef;
    --bad-line:#f6c9cc;
    --line:#e8ebef;
    --line-2:#f2f4f7;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
    --shadow-hi:0 2px 6px rgba(22,104,255,.14), 0 10px 30px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  b,strong{font-weight:650}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 96px}

  /* ============ 顶栏 ============ */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  /* 顶部蓝色细条 */
  header::before{
    content:"";position:absolute;left:0;right:0;top:0;height:2.5px;
    background:linear-gradient(90deg,var(--pri) 0%,#4d94ff 55%,#9cc4ff 100%);
  }
  .hdr{max-width:900px;margin:0 auto;padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
  .brand{min-width:0;flex:1}
  .brand h1{
    margin:0;font-size:16px;font-weight:700;letter-spacing:.15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);
  }
  .brand .sub{
    margin-top:3px;font-size:11.5px;color:var(--muted);
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  }
  .brand .sub b{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}
  .brand .sub i{font-style:normal;opacity:.45}

  .iconbtn{
    flex:none;border:1px solid var(--line);background:#fff;color:var(--fg2);
    height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    white-space:nowrap;transition:.15s;
  }
  .iconbtn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .iconbtn.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .iconbtn.on:hover{background:var(--pri-hi);color:#fff}

  /* ============ 计时条 ============ */
  .clock-outer{
    max-width:900px;margin:0 auto;padding:0 16px 9px;
    display:flex;align-items:center;gap:12px;
  }
  /* 数字区：宽屏一行放得下；窄屏由下面的 media query 改成换行。
     不要再依赖「隐藏滚动条的横向滚动」—— 鼠标滚轮滚不动它。 */
  .clock{
    display:flex;align-items:center;gap:16px;
    flex-wrap:wrap;row-gap:5px;flex:1;min-width:0;
  }
  .clock-i{display:flex;align-items:baseline;gap:5px;flex:none}
  .clock-lb{font-size:11px;color:var(--muted);letter-spacing:.3px}
  .clock-v{
    font-size:14.5px;font-weight:700;color:var(--pri);
    font-variant-numeric:tabular-nums;
  }
  .clock-v.dim{color:var(--muted)}
  .clock-v.warn{color:var(--bad)}
  .clock-sep{flex:none;width:1px;height:12px;background:var(--line)}
  .clock-btn{
    flex:none;border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:11.5px;padding:3px 10px;border-radius:7px;
    cursor:pointer;transition:.15s;font-weight:500;
  }
  .clock-btn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .clock-btn.paused{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri);font-weight:600}

  /* ============ 进度条 + 标签 ============ */
  /* 在 header 外面（不在吸顶区），所以需要自己的白底和分隔线 */
  .bar{
    max-width:900px;margin:0 auto;padding:9px 16px 0;
    background:var(--bg);border-bottom:1px solid var(--line);
  }
  .bar .track{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:9px}
  .bar .fill{height:100%;width:0;background:var(--pri);border-radius:2px;transition:width .3s cubic-bezier(.4,0,.2,1)}
  /* 标签栏：12 个标签在手机上横排排不下，改成**自动换行**
     （原来用 overflow-x:auto + 隐藏滚动条，手机上能划动，
       但电脑上鼠标滚轮不横向滚，后面的标签直接点不到 —— 已改成换行） */
  .tabs{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 11px}
  /* 宽屏（≥700px）用 6 列网格：12 个标签正好排成 2 行，
     而且每格等宽，不会出现「第一行挤 9 个、第二行只剩 3 个」的难看排布。
     minmax(0,1fr) 里的 0 很关键 —— 默认是 minmax(auto,1fr)，
     会被内容撑破导致整个标签栏横向溢出（实测 390px 下溢出到 470px）。 */
  @media (min-width:700px){
    .tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
    .tab{
      min-width:0;padding:8px 4px;text-align:center;
      border-radius:10px;justify-self:stretch;
    }
    .tab .n{margin-left:3px}
  }
  .tab{
    flex:none;border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:500;
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .tab:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(22,104,255,.22)}
  .tab.on:hover{background:var(--pri-hi);color:#fff}
  .tab .n{opacity:.72;font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums}

  /* ============ 卡片 ============ */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:15px;
    box-shadow:var(--shadow);padding:20px 20px 18px;margin-bottom:14px;
  }
  .qhead{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .badge{
    font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line);
  }
  .badge.t2{background:#fff8ec;color:#a56a00;border-color:#f5e0b8}
  .qidx{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qidx b{color:var(--pri);font-weight:700}
  /* 板块正确率：紧跟在「第 N / M 题」右边的小徽标。
     不用负边距、不换行（在 .qhead 这个 flex 行里），所以不影响原有布局。 */
  .qrate{
    font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    background:var(--line-2);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px;white-space:nowrap;
    display:inline-flex;align-items:baseline;gap:4px;
  }
  .qrate b{color:var(--fg2);font-weight:700}
  .qrate i{font-style:normal;opacity:.7;font-size:10.5px}
  .spacer{flex:1}
  .qclock{
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:center;gap:5px;
  }
  /* 用 CSS 画的小圆环代替 emoji 秒表，任何字体下都能稳定显示 */
  .qclock::before{
    content:"";width:8px;height:8px;border-radius:50%;
    border:2px solid var(--pri);opacity:.85;flex:none;
  }
  .qclock b{color:var(--pri);font-weight:700}
  .star{
    background:none;border:0;cursor:pointer;font-size:19px;line-height:1;padding:2px 4px;
    color:#c9d1de;transition:.15s;
  }
  .star:hover{color:#f0b429;transform:scale(1.1)}
  .star.on{color:#f0b429}
  .qtext{
    font-size:17px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
    margin:0 0 18px;color:var(--fg);font-weight:450;
  }

  /* ============ 选项 ============ */
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1.5px solid var(--line);background:#fff;color:var(--fg);
    border-radius:11px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;
    font:inherit;line-height:1.6;transition:.14s;
  }
  .opt:hover:not(.locked){border-color:var(--pri-line);background:var(--pri-soft)}
  .opt .k{
    flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;
    color:var(--muted);margin-top:1px;transition:.14s;
  }
  .opt .v{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
  .opt.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(22,104,255,.07)}
  .opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
  .opt.sel .v{color:var(--pri-hi);font-weight:500}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.ok .v{color:#0a6e3f;font-weight:500}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.bad .v{color:#a81a23}
  .opt.locked{cursor:default}

  /* ============ 按钮 ============ */
  .actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:9px 18px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:.14s;font-family:inherit;
  }
  .btn:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .btn.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--pri-hi);border-color:var(--pri-hi);color:#fff;box-shadow:var(--shadow-hi)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--line);color:var(--fg2);background:#fff;box-shadow:none}
  .btn.primary:disabled:hover{background:var(--pri);border-color:var(--pri);color:#fff;opacity:.4}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--pri-soft);color:var(--pri);border-color:transparent}

  /* ============ 答案 / 解析 ============ */
  .result{
    margin-top:18px;border-radius:12px;padding:15px 17px;
    border:1px solid var(--line);background:var(--line-2);
  }
  .result .rt{
    display:flex;align-items:center;gap:8px;font-weight:700;
    font-size:15px;margin-bottom:7px;
  }
  .result.ok{border-color:var(--ok-line);background:var(--ok-soft)}
  .result.bad{border-color:var(--bad-line);background:var(--bad-soft)}
  .result.ok .rt{color:var(--ok)}
  .result.bad .rt{color:var(--bad)}
  .result.plain .rt{color:var(--pri)}
  .ansline{font-size:13.5px;color:var(--fg2);margin-top:4px;line-height:1.7}
  .ansline b{color:var(--pri);font-weight:700;font-size:14.5px;letter-spacing:.5px}
  .ansline.wrong b{color:var(--bad)}
  .tline{
    display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-top:9px;padding:5px 11px;border-radius:8px;
    background:#fff;border:1px solid var(--line);
    font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;
  }
  .tline b{color:var(--pri);font-weight:700;font-size:13px}
  .tline .tag{
    font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;
    background:var(--pri-soft);color:var(--pri);
  }
  .tline .tag.slow{background:#fff8ec;color:#a56a00}
  .ana{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line);
    font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;
    color:var(--fg);padding-left:13px;border-left:3px solid var(--pri-line);
    border-top:0;margin-left:-2px;
  }
  .ana .lb{
    display:block;font-size:11.5px;font-weight:700;color:var(--pri);
    margin-bottom:5px;letter-spacing:1px;
  }

  /* ============ 空状态 / 杂项 ============ */
  .empty{text-align:center;padding:64px 20px;color:var(--muted)}
  .empty .big{font-size:38px;margin-bottom:12px;opacity:.5}
  .empty h3{margin:0 0 7px;font-size:16.5px;color:var(--fg);font-weight:650}
  .empty p{margin:0 0 18px;font-size:13.5px;line-height:1.7}
  .jump{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;color:var(--muted)}
  .jump input{
    width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--fg);font:inherit;font-size:12.5px;text-align:center;
    font-variant-numeric:tabular-nums;transition:.14s;
  }
  .jump input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(22,104,255,.1)}
  .srch{display:flex;gap:9px;margin-bottom:15px}
  .srch input{
    flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--fg);font:inherit;font-size:14.5px;transition:.14s;
  }
  .srch input:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(22,104,255,.1)}
  .srch input::placeholder{color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);text-align:center;padding:24px 0 0;line-height:1.8}
  kbd{
    display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;background:var(--line-2);font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2);
  }

  /* ============ 模拟考试 ============ */
  .examsetup{display:flex;flex-direction:column;gap:16px;align-items:flex-start;width:100%}
  .setup-row{display:flex;flex-direction:column;gap:8px;width:100%}
  .setup-lb{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    padding:8px 17px;border-radius:999px;font-size:13.5px;cursor:pointer;
    transition:.14s;font-family:inherit;font-weight:500;
  }
  .chip:hover{border-color:var(--pri-line);color:var(--pri);background:var(--pri-soft)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
  .chip.on:hover{background:var(--pri-hi);color:#fff}
  .score{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .score .big{
    font-size:44px;font-weight:750;color:var(--pri);
    font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-1px;
  }
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:14px 0}
  .stat{
    background:var(--line-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;text-align:center;
  }
  .stat .v{font-size:18px;font-weight:750;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .review{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-height:380px;overflow:auto}
  .rrow{
    display:flex;gap:10px;align-items:center;padding:9px 12px;
    border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:#fff;
    transition:.13s;
  }
  .rrow:hover{border-color:var(--pri-line);background:var(--pri-soft)}
  .rrow .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .rrow .dot.o{background:var(--ok)} .rrow .dot.x{background:var(--bad)} .rrow .dot.n{background:#cfd6df}
  .rrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .tm{color:var(--pri);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  .rrow .r{color:var(--muted);font-size:11.5px;flex:none;min-width:28px;text-align:right}
  .rrow .r.ok{color:var(--ok);font-weight:600}
  .rrow .r.x{color:var(--bad);font-weight:600}

  /* ============ 统计页 ============ */
  .statwrap{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .statrow{
    display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;
    padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;
  }
  .statrow .sname{font-size:14.5px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px}
  .statrow .sname .tag{
    font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;
    background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line);
  }
  .statrow .srate{font-size:19px;font-weight:750;color:var(--pri);font-variant-numeric:tabular-nums}
  .statrow .srate.none{color:var(--muted);font-size:15px;font-weight:600}
  .bar2{grid-column:1/-1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
  .bar2 i{display:block;height:100%;border-radius:3px;background:var(--pri);transition:width .3s}
  .bar2 i.low{background:var(--bad)}
  .bar2 i.mid{background:#e8a33d}
  .smeta{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .smeta b{color:var(--fg2);font-weight:650;font-variant-numeric:tabular-nums}
  .smeta .w b{color:var(--bad)}

  /* ============ 错题排行 ============ */
  .rank{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .rk{
    display:flex;align-items:center;gap:11px;padding:10px 13px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    cursor:pointer;transition:.13s;text-align:left;width:100%;font:inherit;
  }
  .rk:hover{border-color:var(--pri-line);background:var(--pri-soft)}
  .rk .no{
    flex:none;width:24px;height:24px;border-radius:7px;
    display:grid;place-items:center;font-size:11.5px;font-weight:700;
    background:var(--line-2);color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .rk.top1 .no{background:var(--bad);color:#fff}
  .rk.top2 .no{background:#e8a33d;color:#fff}
  .rk.top3 .no{background:#d8b04a;color:#fff}
  .rk .body{flex:1;min-width:0}
  .rk .qt{
    font-size:13.5px;line-height:1.5;color:var(--fg);
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .rk .mt{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .rk .mt .badge-s{color:var(--pri);border:1px solid var(--pri-line);background:var(--pri-soft);padding:0 5px;border-radius:4px}
  .rk .cnt{
    flex:none;font-size:15px;font-weight:750;color:var(--bad);
    font-variant-numeric:tabular-nums;min-width:44px;text-align:right;
  }
  .rk .cnt small{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:1px}

  /* ============ 专项练习 ============ */
  .drilltop{padding-bottom:14px}
  .drillnums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 12px}
  .drillnums .dn{
    border-radius:11px;padding:12px 8px;text-align:center;
    border:1px solid var(--line);background:var(--line-2);
  }
  .drillnums .dnv{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15}
  .drillnums .dnl{font-size:11px;color:var(--muted);margin-top:3px}
  .drillnums .n1 .dnv{color:var(--pri)}
  .drillnums .n2 .dnv{color:var(--ok)}
  .drillnums .n3 .dnv{color:var(--bad)}
  .drillnums .n2{border-color:var(--ok-line);background:var(--ok-soft)}
  .drillnums .n3{border-color:var(--bad-line);background:var(--bad-soft)}

  .drillprog{margin:2px 0 10px}
  .dpbar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
  .dpbar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
  .dplb{font-size:12px;color:var(--muted);margin-top:6px}
  .dplb b{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}

  .hardbar{
    font-size:12.5px;color:var(--fg2);line-height:1.6;
    background:#fff8ec;border:1px solid #f5e0b8;border-radius:9px;
    padding:9px 12px;margin-top:4px;
  }
  .hardbar b{color:#a56a00;font-weight:700}

  .drillctrl{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2);
  }

  /* ============ 轮次标记 ============ */
  .roundbadge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;color:var(--muted);
    padding:5px 12px;border-radius:999px;
    background:var(--line-2);border:1px solid var(--line);
  }
  .roundbadge b{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}

  /* ============ 分段按钮 ============ */
  .seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--line-2);gap:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 13px;border-radius:7px;cursor:pointer;font-weight:500;transition:.13s;
  }
  .seg button:hover{color:var(--fg2)}
  .seg button.on{background:#fff;color:var(--pri);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.08)}

  /* ============ 备份 / 恢复按钮 ============ */
  .backup{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    background:var(--line-2);margin-top:12px;
  }
  .backup .bk-lb{font-size:12px;color:var(--muted);flex:1;min-width:120px}
  .backup .bk-lb b{color:var(--fg2);font-weight:600}
  .btn.sm{padding:6px 13px;font-size:13px;border-radius:8px}

  /* ============ 考试规格表 ============ */
  .examspec{
    display:flex;flex-direction:column;gap:0;
    border:1px solid var(--line);border-radius:11px;overflow:hidden;
    margin:14px 0;background:#fff;
  }
  .specrow{
    display:flex;align-items:center;gap:10px;padding:9px 14px;
    border-bottom:1px solid var(--line-2);font-size:13.5px;
  }
  .specrow:last-child{border-bottom:0}
  .specrow .sk{color:var(--fg2);font-weight:600;min-width:72px}
  .specrow .sv{flex:1;color:var(--muted);font-size:12.5px}
  .specrow .sp{color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums}

  /* 本题分值标签 */
  .ptbadge{
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;
    background:var(--pri);color:#fff;font-variant-numeric:tabular-nums;
  }
  .rrow .pt{
    color:var(--pri);font-size:11px;font-weight:700;flex:none;
    background:var(--pri-soft);border:1px solid var(--pri-line);
    padding:0 5px;border-radius:4px;
  }

  /* ============ 成绩单 ============ */
  .score .sc-of{font-size:15px;color:var(--muted);font-weight:600}
  .verdict{
    display:inline-block;font-size:14px;font-weight:700;
    padding:5px 14px;border-radius:8px;margin:2px 0 12px;
  }
  .verdict.pass{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
  .verdict.fail{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
  .comment{
    border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.7;
    border-left:3px solid var(--pri);
    background:var(--pri-soft);color:var(--fg2);margin:10px 0 14px;
  }
  .comment.warn{border-left-color:#e8a33d;background:#fff8ec;color:#7a5200}
  .comment.good{border-left-color:var(--ok);background:var(--ok-soft);color:#0a6e3f}

  .scorebreak{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .sbrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .sbname{width:52px;color:var(--fg2);font-weight:600;flex:none}
  .sbbar{flex:1;height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
  .sbbar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
  .sbnum{width:62px;text-align:right;color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums;flex:none}

  /* ============ 鼓励卡 ============ */
  .enc{border-left:4px solid var(--pri)}
  .enc.great{border-left-color:var(--ok);background:linear-gradient(180deg,var(--ok-soft),#fff 70%)}
  .enc.good{border-left-color:var(--pri);background:linear-gradient(180deg,var(--pri-soft),#fff 70%)}
  .enc.ok{border-left-color:#e8a33d;background:linear-gradient(180deg,#fff8ec,#fff 70%)}
  .enc.warn{border-left-color:#e8a33d}
  .enc.low{border-left-color:var(--bad);background:linear-gradient(180deg,var(--bad-soft),#fff 70%)}
  .enc.idle{border-left-color:var(--line)}
  .enctitle{
    display:flex;align-items:center;gap:8px;
    font-size:15.5px;font-weight:700;color:var(--fg);margin-bottom:7px;
  }
  .encdot{width:8px;height:8px;border-radius:50%;background:var(--pri);flex:none}
  .enc.great .encdot{background:var(--ok)}
  .enc.low .encdot{background:var(--bad)}
  .enc.ok .encdot,.enc.warn .encdot{background:#e8a33d}
  .enctext{font-size:13.5px;line-height:1.75;color:var(--fg2)}

  /* ============ 每日正确率图 ============ */
  .daychart{
    display:flex;gap:6px;align-items:flex-end;
    margin:16px 0 6px;height:150px;
    padding:0 2px;
  }
  .dcol{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
    height:100%;gap:0;
  }
  .dcol .dtrack{
    flex:1;width:100%;max-width:46px;
    background:var(--line-2);border-radius:6px 6px 0 0;
    display:flex;align-items:flex-end;
    position:relative;overflow:hidden;
  }
  .dcol .dtrack i{
    display:block;width:100%;border-radius:5px 5px 0 0;
    transition:height .35s cubic-bezier(.4,0,.2,1);
  }
  .dcol .dtrack i.hi{background:linear-gradient(180deg,#34c06a,var(--ok))}
  .dcol .dtrack i.mid{background:linear-gradient(180deg,#f0b74a,#e8a33d)}
  .dcol .dtrack i.low{background:linear-gradient(180deg,#f0736a,var(--bad))}
  .dcol .dtrack i.none{background:var(--line)}
  .dcol .dv{
    font-size:11px;font-weight:700;color:var(--pri);
    font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap;
  }
  .dcol .dl{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .dcol .dw{font-size:10px;color:#c2c9d4}
  .dcol .dn{font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
  .dcol.today .dv{color:var(--pri)}
  .dcol.today .dl{color:var(--pri);font-weight:700}
  .dcol.today .dtrack{box-shadow:0 0 0 2px var(--pri-soft)}

  /* ============ 明细列表 ============ */
  .daylist{display:flex;flex-direction:column;gap:0;margin-top:14px;border-top:1px solid var(--line-2)}
  .drow{
    display:flex;align-items:center;gap:10px;padding:9px 2px;
    border-bottom:1px solid var(--line-2);font-size:12.5px;
  }
  .drow.today{background:var(--pri-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
  .drow .ddate{width:96px;flex:none;color:var(--fg2);font-weight:600;font-variant-numeric:tabular-nums}
  .drow .dstat{flex:1;min-width:0;color:var(--muted);line-height:1.5}
  .drow .dstat b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}
  .passmark{color:var(--ok);font-weight:700}
  .failmark{color:var(--bad);font-weight:650}

  /* ============ 趋势标签 ============ */
  .trendtag{
    display:inline-block;font-size:11.5px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:12px 0 8px;
  }
  .trendtag.up{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
  .trendtag.down{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
  .trendtag.flat{background:var(--pri-soft);color:var(--pri);border:1px solid var(--pri-line)}
  .trendnote{font-size:13.5px;line-height:1.75;color:var(--fg2)}

  /* ============ 考试历史柱状图 ============ */
  .examhist{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
  .histlb{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .histbars{display:flex;gap:5px;align-items:flex-end;height:110px}
  .histbars.wide{height:140px;margin:14px 0 8px}
  .hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}
  .hbtrack{
    flex:1;width:100%;max-width:40px;background:var(--line-2);
    border-radius:5px 5px 0 0;position:relative;
    display:flex;align-items:flex-end;overflow:hidden;
  }
  .hbtrack i{display:block;width:100%;border-radius:4px 4px 0 0;transition:height .3s}
  .hbtrack i.pass{background:linear-gradient(180deg,#34c06a,var(--ok))}
  .hbtrack i.fail{background:linear-gradient(180deg,#f0736a,var(--bad))}
  .hbpass{
    position:absolute;left:0;right:0;height:0;
    border-top:1.5px dashed rgba(22,104,255,.5);
    pointer-events:none;
  }
  .hbv{
    font-size:10.5px;font-weight:700;color:var(--fg2);
    font-variant-numeric:tabular-nums;margin-top:4px;
  }
  .hb.ok .hbv{color:var(--ok)}

  /* ============ 提示条 ============ */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
    background:#14171c;color:#fff;padding:11px 22px;border-radius:11px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.24s cubic-bezier(.4,0,.2,1);z-index:99;
    box-shadow:0 10px 30px rgba(0,0,0,.22);font-weight:500;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ 响应式 ============ */
  @media (max-width:600px){
    .wrap{padding:0 12px 84px}
    .hdr{padding:11px 13px 9px;gap:8px}
    .brand h1{font-size:14.5px}
    .brand .sub{font-size:11px}
    .clock-outer{padding:0 13px 8px;gap:6px}
    /* 手机上计时条也要换行：原来靠隐藏滚动条的横向滚动，
       鼠标滚轮滚不动（笔记本触控板可以，外接鼠标不行）。
       但换行会把「平均 / 暂停」挤到第二行、多占 20px，
       所以这里把字号和间距收得足够小，让 4 组数字 + 暂停按钮尽量待在一行。 */
    .clock{flex-wrap:wrap;gap:10px;row-gap:4px;overflow-x:visible}
    .clock-i{gap:3px}
    .clock-v{font-size:13px}
    .clock-lb{font-size:10.5px}
    .clock-sep{display:none}          /* 窄屏去掉竖分隔线，省 4×7px */
    .clock-btn{padding:3px 7px;font-size:11px}
    .bar{padding:0 13px}
    /* 标签换行后每行能放 3 个左右；缩小内边距和字号，
       否则 12 个标签在手机上要占 4–5 行，吸顶 header 会吃掉半屏。 */
    .tabs{gap:6px;padding-bottom:9px}
    .tab{padding:6px 11px;font-size:12.5px}
    .tab .n{font-size:10.5px;margin-left:3px}
    .card{padding:16px 15px 14px;border-radius:13px}
    .qtext{font-size:16px;line-height:1.72}
    .opt{padding:11px 12px;gap:10px}
    .opt .v{font-size:15px}
    .iconbtn{height:32px;padding:0 10px;font-size:12px}
    .result{padding:13px 14px}
    .ana{font-size:14px}
    .score .big{font-size:38px}
    .actions{gap:8px}
    .btn{padding:9px 15px;font-size:13.5px}
  }
  /* 窄屏（≤380px，如 iPhone SE）：标签再缩一档，保证一行至少 3 个 */
  @media (max-width:380px){
    .tabs{gap:5px}
    .tab{padding:5px 9px;font-size:12px;border-radius:8px}
    .tab .n{display:none}          /* 数字徽标在极窄屏上隐藏，避免挤压文字 */
    .clock-lb{font-size:10px}
    .clock-v{font-size:12.5px}
  }
</style>
</head>

<header>
  <div class="hdr">
    <div class="brand">
      <h1 id="ttl">阿里云 ACP 大模型</h1>
      <div class="sub">
        <span>共 <b id="total">0</b> 题</span>
        <i>·</i>
        <span>已练 <b id="done">0</b></span>
        <i>·</i>
        <span>正确率 <b id="rate">—</b></span>
      </div>
    </div>
    <button class="iconbtn" id="btMemorize" title="开启后直接显示答案与解析">背题</button>
    <button class="iconbtn" id="btReset" title="清空全部练习进度与计时统计">重置</button>
  </div>

  <!-- 计时条 -->
  <div class="clock-outer">
  <div class="clock">
    <div class="clock-i">
      <span class="clock-lb" id="lbSession">本次</span>
      <span class="clock-v" id="tmSession">00:00</span>
    </div>
    <span class="clock-sep"></span>
    <div class="clock-i">
      <span class="clock-lb">本题</span>
      <span class="clock-v dim" id="tmQuestion">—</span>
    </div>
    <span class="clock-sep"></span>
    <div class="clock-i">
      <span class="clock-lb">今日</span>
      <span class="clock-v" id="tmToday">00:00</span>
    </div>
    <span class="clock-sep"></span>
    <div class="clock-i">
      <span class="clock-lb">平均</span>
      <span class="clock-v" id="tmAvg">—</span>
    </div>
  </div>
  <button class="clock-btn" id="btPause" title="暂停 / 继续计时（空格键）">暂停</button>
  </div>
</header>

<!-- 进度条 + 标签栏：**不要**放进吸顶 header。
     12 个标签换行后要占 2–3 行，塞进 sticky 会让吸顶区高达 230px（占手机屏 1/4），
     往下翻时正文可看区域被吃掉太多。放在 header 外面，滚动时会自然滚走。 -->
<div class="bar">
  <div class="track"><div class="fill" id="prog"></div></div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap">
  <main id="main"></main>
  <div class="hint" id="hint"></div>
</div>

","f828647b-0593-4619-a3c2-13ec0305681e","479db9f5-d4f7-4363-97ce-f795e222e15f","d36e33c3-0fed-497f-ab54-cbe858c7a8f0","0522a76f-f1d8-4784-89e5-5a12f3bcc89d","de424642-0855-46b9-a297-184af3b4fc69","1d917ce3-9f5e-4553-8110-a8a35146c381","2d878486-5262-4b46-ba12-5812ae3794b5","9a81a8da-1ad2-4043-af6a-0804df2f9990","7e4f3801-f742-4e9d-9f91-c04ba88dadd1","7bed5ce5-4e5c-4ff4-9adc-36c84a44ae67","b29b1f16-ca8c-43d6-baf5-9b2ec6e3a99a","4274821b-758b-4332-b7ea-8b554bd3503f","aa94fca8-fe51-4caf-a566-3c128c85dc6f","37c8cc47-cb1c-4f93-87dd-1f4e7bda38d6","54d5788f-0755-4e8a-82a3-0b6cddb42761","7c9b1ecd-d547-491d-9e87-70b98305e35a","86943b46-a8a8-4870-be09-6b5f73be7229","5ab43c5c-9145-47cb-b768-b555ae0ccc1a","4b8f1053-21e2-4342-b74c-cf4b17e32ead","c99ab2d1-c645-47a7-b8f4-c6f0594f17b1","2595c480-a404-4202-9843-2a5ecba48e80","7539d966-3de2-4602-8114-3acedd55f788"],"shuffleSeq":true,"round":4}}},"questions":[{"gid":"dbacee5b-f296-4cff-a766-fda08f609f73","type":"单选题","q":"以下哪个提示词要素用于约束大模型的应答风格，使其符合特定人群的阅读习惯？","options":[{"t":"角色（Role）","ok":false},{"t":"输出格式（Output Fomat）","ok":false},{"t":"上下文（Context）","ok":false},{"t":"受众（Audience）","ok":true}],"analysis":"答案：D\n\n解析：\n“受众（Audience）”用于明确目标读者群体（如儿童、专家等）。大模型会据此自动调整词汇难度、句式长短和语气，确保内容符合特定人群的认知水平与阅读习惯。相比之下，“角色”设定AI自身身份，“输出格式”规范排版结构，“上下文”提供任务背景。因此，直接约束应答风格以适应读者阅读习惯的要素是受众。"},{"gid":"254aa192-3277-458b-b6ee-576270abf919","type":"单选题","q":"以下关于LoRA的描述，哪一项是错误的？","options":[{"t":"LoRA可以有效降低微调大型语言模型的成本。","ok":false},{"t":"LoRA会修改被微调模型的原始权重。","ok":true},{"t":"LoRA的实现相对简单，易于集成。","ok":false},{"t":"LoRA微调的结果可以方便地回退。","ok":false}],"analysis":"答案：B\n\n解析：\nLoRA的核心思想是**冻结预训练模型的原始权重**，不对其进行修改。它通过旁路注入可训练的低秩矩阵来模拟参数更新，大幅减少训练参数量，降低微调成本（A对）。因不改变原模型架构，其实现简单、易于集成（C对）。由于原始权重未变，只需移除LoRA模块即可无缝回退到基础模型（D对）。因此，B选项称其“会修改原始权重”是错误的。"},{"gid":"07ce4704-c0b7-4ae6-9b01-ceb05f281977","type":"单选题","q":"在优化检索效果时，以下哪些是调整similarity_topk参数的好处？","options":[{"t":"增加召回的文档切片数量","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：在向量检索或RAG系统中，`similarity_topk`参数用于控制相似度搜索时返回的最相关文档切片数量。调大该参数能直接增加召回的文档切片数，为大模型提供更丰富的上下文，从而优化检索与生成效果。该参数仅影响检索阶段的返回结果，不涉及增加训练数据（B错），增大topk通常会增加而非减少推理时间（C错），也绝不会改变模型自身的参数数量（D错）。故选A。"},{"gid":"15153eef-e4c2-4f6b-b265-77873607fb8c","type":"单选题","q":"RAG(Retrieval Augmented Generation)的主要目的是什么？","options":[{"t":"增加模型的训练数据","ok":false},{"t":"为大模型提供参考资料以提高回答质量","ok":true},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：B\n\n解析：RAG（检索增强生成）的核心是在大模型生成回答前，先从外部知识库检索相关信息，并作为上下文输入给模型。这能有效弥补模型知识滞后和易产生“幻觉”的缺陷，通过提供准确的外部参考资料，显著提升回答的准确性与可靠性。它不改变模型参数，不增加训练数据，且因增加检索步骤通常不会减少推理时间。"},{"gid":"92649efc-0114-4b65-918e-0a364772590b","type":"单选题","q":"在文档切片过程中，以下哪种切片方法适合刚开始接触RAG的用户？","options":[{"t":"句子切片","ok":true},{"t":"Token 切片","ok":false},{"t":"句子窗口切片","ok":false},{"t":"语义切片","ok":false}],"analysis":"答案：A\n\n解析：对于RAG初学者，**句子切片**是最适合的入门方法。它按句子边界切分，既保证了基础语义的完整性，避免了Token切片生硬截断句子的缺陷，又无需像语义切片那样依赖复杂的Embedding模型，实现简单且效果稳定。句子窗口和语义切片虽能提升检索效果，但配置复杂、计算成本高，更适合进阶使用。句子切片完美平衡了实现难度与基础效果，是新手的首选。"},{"gid":"ed1c50eb-e1d3-4cea-9d08-bca543cbf372","type":"单选题","q":"在优化context recall（上下文召回）指标时，以下哪种方法可以提升召回的准确率？","options":[{"t":"使用大模型改写query","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：在RAG等检索场景中，Context Recall（上下文召回）的核心是精准匹配用户意图与知识库。使用大模型改写Query（选项A）能消除原始查询的歧义、补充缺失语义并扩展关键词，使检索条件更清晰，从而直接且显著地提升召回准确率。而增加训练数据（B）和参数数量（D）主要提升模型的生成与泛化能力，减少推理时间（C）优化的是系统延迟，三者均不直接解决检索匹配问题。"},{"gid":"b9cac065-63ca-4182-b4b9-22ac9cf62588","type":"单选题","q":"在以下代码片段中，temperature=0.1的作用是什么？","options":[{"t":"使输出更具确定性","ok":true},{"t":"使输出更具创造性","ok":false},{"t":"增加输出的多样性","ok":false},{"t":"减少输出的长度","ok":false}],"analysis":"答案：A\n\n解析：\n在大语言模型中，`temperature`参数用于控制生成文本的随机性。当`temperature`值较低（如0.1）时，模型会倾向于选择概率最高的词，大幅降低随机性，从而使输出结果更具确定性、一致性和可预测性。相反，较高的值会增加随机性，提升输出的创造性与多样性（排除B、C）。此外，该参数不影响输出长度（排除D，长度通常由max_tokens控制）。故选A。"},{"gid":"182c8f85-a8ae-48b9-ab2e-124ca9b56aa4","type":"单选题","q":"在切片向量化与存储阶段，以下哪种模型用于将文本转换为高维向量？","options":[{"t":"Embedding","ok":true},{"t":"模型","ok":false},{"t":"大模型","ok":false},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false}],"analysis":"答案：A\n\n解析：在RAG（检索增强生成）等自然语言处理流程中，文本切片后需进行向量化。Embedding（嵌入）模型专门用于将离散的文本数据映射为连续的高维稠密向量，以捕捉深层语义信息，并将其存储在向量数据库中供后续相似度检索使用。选项B、C指代过于宽泛，D、E属于优化策略而非具体模型类型。因此选A。"},{"gid":"ba97769f-56c3-4c79-9641-b33aa8c93ba5","type":"单选题","q":"在Llamalndex的默认提示词模板中，context_str表示什么？","options":[{"t":"从向量库中检索到的上下文信息","ok":true},{"t":"用户的问题","ok":false},{"t":"大模型的角色","ok":false},{"t":"输出的格式","ok":false}],"analysis":"答案：A\n\n解析：在LlamaIndex的默认问答提示词模板中，`context_str`专门用于填充从向量库等索引中检索到的相关文档片段，即“上下文信息”，供大模型参考作答。而“用户的问题”通常由变量`query_str`表示；“大模型角色”和“输出格式”则属于系统提示词（System Prompt）或输出解析器的配置范畴。因此，正确选项为A。"},{"gid":"da61dcef-0d2e-45df-9ddb-258467a741fc","type":"单选题","q":"在以下代码片段中，model=\"qwen-plus\"的作用是什么？","options":[{"t":"指定使用的模型","ok":true},{"t":"增加输出的多样性","ok":false},{"t":"使输出更具确定性","ok":false},{"t":"控制输出长度","ok":false}],"analysis":"答案：A\n\n解析：在调用大语言模型API时，`model`参数用于指定具体要使用的模型版本。`\"qwen-plus\"`是通义千问系列中的一个具体模型名称，因此`model=\"qwen-plus\"`的作用就是明确指定当前请求所调用的模型。增加或降低输出多样性通常由`temperature`参数控制，而控制输出长度则由`max_tokens`参数负责。"},{"gid":"91eeaf4d-eb90-4ac0-b6c7-f0044ad05cab","type":"单选题","q":"如果answer correctness（答案正确性）指标得分较低，而context recall（上下文召回率）和contextprecision（上下文精准率）得分较高，以下哪种优化措施是可行的?","options":[{"t":"优化 prompt","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：在RAG（检索增强生成）系统中，上下文召回率和精准率高说明检索阶段表现优异，已准确找回所需信息。答案正确性低则表明问题出在“生成阶段”，即模型未能有效利用上下文生成正确答案。此时最直接有效的措施是优化Prompt，通过改进提示词指令，引导模型更准确地基于给定上下文进行回答并减少幻觉。其他选项成本过高或不针对生成阶段问题。"},{"gid":"00a559a9-3b12-466d-a8ca-b98777b29a40","type":"单选题","q":"在控制大模型生成内容的随机性时，top_p参数的作用是什么？","options":[{"t":"调整候选Token的概率分布","ok":false},{"t":"筛选出累计概率达到阀值的候选Token","ok":true},{"t":"增加候选Token的数量","ok":false},{"t":"减少候选Token的数量","ok":false}],"analysis":"**答案：B**\n\n**解析：**\ntop_p（核采样）的核心机制是将候选Token按概率降序排列并累加，直到累计概率达到设定的阈值（p值），模型仅从该筛选集合中进行采样。这能动态截断低概率的长尾Token，在控制随机性的同时保留生成多样性。选项A通常是Temperature参数的作用；C和D只是采样后可能产生的结果，并非其核心机制。"},{"gid":"8772c5e5-9435-4e00-960c-9b1ea3422d10","type":"单选题","q":"在自定义提示词模板中，以下哪项是用于约束大模型行为的注意事项？","options":[{"t":"根据上下文信息而非先验知识来回答问题","ok":true},{"t":"增加模型的训练数据","ok":false},{"t":"减少模型的推理时间","ok":false},{"t":"增加模型的参数数量","ok":false}],"analysis":"答案：A\n\n解析：提示词模板通过文本指令引导和约束模型输出。选项A“根据上下文而非先验知识回答”是典型的提示词约束规则，旨在防止模型产生“幻觉”，确保回答忠于给定材料。而选项B（训练数据）、C（推理时间）和D（参数数量）均属于模型训练、推理优化及底层架构层面的技术操作，无法通过提示词模板来改变或控制。因此，只有A属于提示词中的注意事项。"},{"gid":"f45d0351-c59a-4fc9-b820-565bb729e2c0","type":"单选题","q":"你在需要构建公文智能处理系统，用户上传 PDF 文件，系统需自动识别文本内容并生成摘要。以下哪种架构设计比较合理？","options":[{"t":"前端上传文件至 FC，FC 调用 OCR 服务提取文本并存入 OSS，再由百炼模型提供结果链接","ok":false},{"t":"前端直接调用百炼模型解析 PDF，模型将原始文件和分析结果存入 OSS，通过访问链接提供结果的访问链接","ok":false},{"t":"OSS 仅存储最终摘要文件，原始 PDF 通过 FC 直传至百炼模型服务进行全流程处理","ok":false},{"t":"前端上传 PDF 至 OSS，触发 FC 解析文本，FC 调用百炼模型生成摘要，结果存入 OSS 并前端下载","ok":true}],"analysis":"答案：D\n\n解析：D选项采用经典的Serverless异步架构。前端上传PDF至OSS适合大文件存储；利用OSS事件触发FC，实现存算解耦，避免前端超时等待；FC调度文本解析与百炼模型生成摘要，职责清晰；结果与原件均存入OSS，符合公文留存合规要求。其他选项存在大文件直传FC或模型易超时、前端直调模型有密钥泄露风险、或未留存原件等缺陷。"},{"gid":"75392dda-6cab-44cc-ab6f-ff552b5390f8","type":"单选题","q":"在设计一个电商推荐系统的RAG模块时，团队决定优化检索的精确率（contextprecision），以确保每次推荐的商品都相关。然而，过度追求精确率可能会带来一些负面影响，以下哪种现象最有可能出现？","options":[{"t":"系统召回的商品数量过少，用户难以找到足够的选择。","ok":true},{"t":"用户收到大量与查询无关的商品推荐，导致体验下降。","ok":false},{"t":"推荐商品的颜色多为用户不喜欢的类型，导致满意度下降。","ok":false},{"t":"系统响应时间显著增加，导致用户体验变差。","ok":false}],"analysis":"答案：A\n\n解析：在信息检索中，精确率与召回率通常呈此消彼长的关系。精确率衡量检索结果中相关内容的比例，召回率衡量所有相关内容被检索出的比例。过度追求高精确率，系统会设置更严格的过滤条件，只返回“绝对确信”相关的商品。这会导致大量潜在相关的商品被漏掉，从而显著降低召回率，使得系统最终召回的商品数量过少，限制了用户的选择范围。"},{"gid":"80259777-e6e1-4bc8-b452-a18030597600","type":"单选题","q":"你正在开发一款面向客户的智能客服助手，主要功能包括产品咨询、订单查询和售后服务支持。在初步开发阶段，应该优先针对哪方面进行评测？","options":[{"t":"系统对高峰期并发请求的处理能力","ok":false},{"t":"大模型对用户的意图理解准确率","ok":true},{"t":"界面交互设计的友好程度","ok":false},{"t":"客户提问响应的时间","ok":false}],"analysis":"答案：B\n\n解析：在初步开发阶段，核心目标是验证产品基础功能的可行性。智能客服的核心价值在于准确理解用户需求并提供正确解答。若大模型意图理解准确率不达标，系统将无法提供有效服务，此时优化并发处理（A）、响应时间（D）或界面设计（C）均失去意义。性能与体验测试通常在核心功能跑通后的中后期进行，因此初期必须优先评测意图理解准确率。"},{"gid":"69eea902-b2fa-4264-bf40-f23e7b73a78f","type":"单选题","q":"某律所在优化法律问答机器人应用时，发现它总是无法准确回答交通法的内容，应优先采取哪项措施？","options":[{"t":"优化文档切分策略","ok":false},{"t":"进行query 的改写","ok":false},{"t":"检查知识库中是否有交通法的知识内","ok":true},{"t":"在大模型提示词中强调要准确回答交通法内容","ok":false}],"analysis":"答案：C\n\n解析：在知识库问答系统中，模型回答高度依赖底层数据。机器人无法回答交通法问题，首要排查的是知识库是否包含该领域知识（巧妇难为无米之炊）。若知识库缺失交通法数据，优化文档切分、改写query或调整提示词都无法凭空生成准确答案。因此，优先检查并补充知识库内容是最基础且最有效的措施，其他优化手段均须建立在知识完备的前提下。"},{"gid":"d15fd1f7-edfa-41a5-a9af-f9f6eaffc8fe","type":"单选题","q":"在开发智能餐厅点餐助手时，测试发现用户语音下单（如“来一份宫保鸡丁，数量两份”）时系统生成错误的调用参数，导致订单出错。经排查，原因在于“下单工具”描述中未明确规定输入参数（如“菜品名称”和“数量”）的类型、属性及必选要求。请问哪项改进最能提高调用参数的准确性？","options":[{"t":"在工具描述中详细定义parameters字段，明确说明相关参数的类型、属性描述及必选要求","ok":true},{"t":"修改工具返回数据格式，使其自动生成标准订单编号","ok":false},{"t":"写功能介绍是“让工具更诱人”，没解决参数怎么填的问题；","ok":false},{"t":"限制调用次数是“防重复下单”，和参数准不准无关。","ok":false}],"analysis":"答案：A\n\n解析：题干明确指出错误原因是工具描述中“未明确规定输入参数的类型、属性及必选要求”。选项A通过详细定义`parameters`字段，精准补齐了参数类型、描述和必填约束，能直接引导大模型准确提取并生成正确的调用参数，直击痛点。选项B优化的是返回结果；选项C和D分别涉及功能包装和防重复限制，均未解决输入参数定义缺失的核心问题。故选A。"},{"gid":"fcb1a95b-d7e0-4963-8903-916ee113c29d","type":"单选题","q":"某连锁咖啡品牌采用视觉理解模型巡检门店以节约成本，但任务完成率不理想。升级为大小模型+智能体协同方案：小模型负责图像定位与抠图，大模型负责状态判定。但监测发现大模型仍频繁处理原始图像（导致资源浪费），应重点优化哪项？","options":[{"t":"为大模型添加更多低价值任务（区域定位）的训练数据，提升其对定位任务的专用性","ok":false},{"t":"扩展GPU服务器集群规模，提升大模型运算速度","ok":false},{"t":"要求门店员工预先标注监控关键区域，减少系统自动区域定位的依赖","ok":false},{"t":"在PlannerAgent中，优先将图像识别任务分配给小模型，仅让大模型处理复杂状态判断","ok":true}],"analysis":"答案：D\n\n解析：题干痛点是大模型频繁处理原始图像导致算力浪费，违背了大小模型协同初衷。小模型适合低算力的图像定位与抠图，大模型应专注复杂状态判定。此现象说明任务路由机制存在缺陷。因此，需优化PlannerAgent（规划智能体）的任务分配逻辑，优先将基础图像识别与定位任务分配给小模型，仅让大模型处理抠图后的复杂状态判断，从而精准匹配模型能力，最大化节约算力资源。"},{"gid":"9cf42ba7-2df9-45df-be84-3202713fffec","type":"单选题","q":"同一份文档，使用百炼上的text-embedding-v2与text-embedding-v3进行索引l。实际测试发现v3的检索效果更佳，哪项最合理解释了这种现象？","options":[{"t":"v3版本对相似度表示更精细","ok":true},{"t":"v3无法适应长文本","ok":false},{"t":"v2模型只支持英文语料","ok":false},{"t":"v3模型版本号更大","ok":false}],"analysis":"答案：A\n\n解析：text-embedding-v3相比v2在模型架构与训练数据上全面升级，能更精准捕捉深层语义，对相似度的表示与计算更精细，从而提升检索效果。B错，v3支持更长上下文（8192 tokens）；C错，v2也支持中文；D错，版本号大仅为表象，非技术根因。故选A。"},{"gid":"d813b0b3-a49b-4511-85c2-d3c77de1ad66","type":"单选题","q":"下列代码片段的作用是？pythonfrom keras.preprocessing.sequence import pad_sequencespadded_seqs=pad_sequences(sequences,maxlen=max_len,padding='post',truncating='post')","options":[{"t":"序列填充到固定长度","ok":true},{"t":"文本摘要生成","ok":false},{"t":"特征缩放","ok":false},{"t":"文本向量化","ok":false}],"analysis":"答案：A\n\n解析：\n代码调用了Keras的`pad_sequences`函数，核心作用是将长度不一的序列（如文本索引列表）截断或填充至统一的固定长度（由`maxlen`指定）。参数`padding='post'`与`truncating='post'`表明补零填充和截断操作均在序列末尾进行。这是深度学习处理变长序列数据的标准预处理步骤，不涉及摘要生成、特征缩放或文本向量化，因此选A。"},{"gid":"90fb38af-b5d5-40e4-b57d-b644fc2eb4ca","type":"单选题","q":"作为应用开发者，如果想要让大模型避免回答与个人隐私相关的问题，最推荐在哪个角色中设置相应的限制？","options":[{"t":"user","ok":false},{"t":"assistant","ok":false},{"t":"任何角色都可以","ok":false},{"t":"system","ok":true}],"analysis":"答案：D\n\n解析：在大模型架构中，`system`角色专门用于设定全局行为准则和安全约束。将“保护隐私”的限制设在`system`提示词中，能确保模型在整个对话中始终遵循该规则，有效防止用户通过提示词注入绕过限制。相比之下，`user`代表用户输入，`assistant`代表模型回复，均不具备全局约束力。因此，最推荐在`system`角色中设置限制。"},{"gid":"4080555d-4a55-4f69-a64a-d1171271eda2","type":"单选题","q":"微调大语言模型的基本步骤不包括以下哪一项？","options":[{"t":"评估微调后模型在特定任务上的表现","ok":false},{"t":"选择或设计特定任务的数据集","ok":false},{"t":"使用特定任务数据对预训练模型进行再训练","ok":false},{"t":"对预训练模型的所有参数进行随机初始化","ok":true}],"analysis":"答案：D\n\n解析：微调的核心在于保留预训练模型已学到的通用知识（即预训练权重），并使用特定任务数据继续训练（C）以适应下游任务。因此，准备数据集（B）和评估效果（A）均是标准步骤。若对所有参数进行随机初始化（D），会彻底抹除预训练阶段学到的知识，这属于“从头训练”（Train from scratch），完全违背了微调的初衷。故D不属于微调步骤。"},{"gid":"f4e0567a-679b-494a-a97a-29b5d939c967","type":"单选题","q":"你希望对于同一个提示词，让大模型每次都尽最大可能返回相同结果，可以调整哪个参数？","options":[{"t":"stream","ok":false},{"t":"max_token","ok":false},{"t":"api_key","ok":false},{"t":"seed","ok":true}],"analysis":"答案：D\n\n解析：`seed`（随机种子）参数用于控制模型生成时的随机性。设置相同的`seed`值，可以使模型在相同的提示词下，尽最大可能保持采样过程的确定性，从而返回相同或高度一致的结果。选项A `stream` 控制是否流式返回数据；选项B `max_token` 限制生成的最大文本长度；选项C `api_key` 是用于身份验证的密钥，这三者均与生成结果的确定性无关。因此正确答案为D。"},{"gid":"d5e510cd-7a0b-485e-92ae-bc9979fc01ba","type":"单选题","q":"你为某大型企业开发内部问答机器人时，员工 A 查询 “法务接口人” 时，机器人总是返回其他部门的法务接口人信息。以下哪种方案优化该问题最有效？","options":[{"t":"增加召回片段数量","ok":false},{"t":"减少召回片段数量","ok":false},{"t":"结合读取的员工部门信息，对 query 进行改写","ok":true},{"t":"对用户 query 重复检索 3 次后返回结果","ok":false}],"analysis":"答案：C\n\n解析：问题核心在于机器人缺乏用户上下文，导致检索不精准。员工查询“法务接口人”隐含了“本部门”需求。选项C通过读取员工部门信息对query进行改写（如补全为“XX部门法务接口人”），能有效补全上下文语义，实现精准匹配。单纯调整召回数量（A、B）或重复检索（D）均无法解决语义和上下文缺失问题，故C最有效。"},{"gid":"0afd7a8a-2f88-49b0-a0ad-f870aca3d473","type":"单选题","q":"在优化检索效果时，若知识库内容充足但召回率低，以下哪种方法是合理的？","options":[{"t":"增加查询请求的并发量以加快响应速度","ok":false},{"t":"提高相似度阈值","ok":false},{"t":"增加知识库文档","ok":false},{"t":"更换 embedding 模型","ok":true}],"analysis":"答案：D\n\n解析：知识库充足但召回率低，说明相关文档未被有效检索。A项增加并发仅提升速度，不影响召回；B项提高相似度阈值会过滤更多结果，使召回率更低；C项内容已充足，增加文档无法解决检索不准问题。D项更换embedding模型可改善文本向量表示质量，提升语义匹配准确度，让相关文档更容易被检索到，从而有效提高召回率，是最合理的选择。"},{"gid":"a01ac6b6-b724-4171-9450-d2cf3dd0b464","type":"单选题","q":"你在为一个创意写作工具调整大模型生成内容，以下哪个参数可以用来控制生成内容的多样性？","options":[{"t":"temperature","ok":true},{"t":"stream","ok":false},{"t":"max_token","ok":false},{"t":"api_key","ok":false}],"analysis":"答案：A\n\n解析：在大模型中，`temperature`（温度）参数专门用于控制生成内容的随机性与多样性。较高的值会使输出更具创意和发散性，非常适合创意写作；较低的值则使输出更严谨集中。而`stream`用于控制是否流式返回数据，`max_token`用于限制生成的最大文本长度，`api_key`则是用于身份验证的密钥，这三者均无法控制内容的多样性。因此正确答案为A。"},{"gid":"35ed5072-9ff8-4967-9720-76e669e9822b","type":"单选题","q":"在一个电商问答系统中，用户提问 “百炼 X1 手机的电池容量是多少？” 后又问 “充CC吗？”。如果直接用第二轮的问题进行检索，可能会出现什么现象？","options":[{"t":"由于 embedding 擅长处理短文本，因此检索结果更为精确","ok":false},{"t":"embedding 模型不擅长处理短文本，导致检索精度下降","ok":false},{"t":"向量数据库自带上下文记忆功能，可以准确判断第二轮的问题是关于 \"百炼 X1 手机\"的","ok":false},{"t":"检索结果不准确，丢失“百炼X1手机\"这一历史对话信息","ok":true}],"analysis":"**答案：D**\n\n**解析：**\n在多轮对话中，用户的后续提问常省略主语（如“充CC吗”省略了“百炼X1手机”）。若直接用第二轮问题检索，由于缺乏上下文，系统无法识别用户询问的具体实体。向量数据库本身不具备上下文记忆和指代消解功能，需依赖大模型进行问题重写。因此，直接检索会丢失历史对话中的核心实体信息，导致检索结果不准确。"},{"gid":"b29b1f16-ca8c-43d6-baf5-9b2ec6e3a99a","type":"单选题","q":"通过 LlamaIndex 创建 RAG 应用时，一份知识文件是如何传入 RAG 应用的，请选择顺序：","options":[{"t":"Node 对象 - query_engine-Document 对象 - index","ok":false},{"t":"Document 对象 - Node 对象 - index-query_engine","ok":true},{"t":"Node 对象 - Document 对象 - index-query_engine","ok":false},{"t":"Document 对象 - index-Node 对象 - query_engine","ok":false}],"analysis":"答案：B\n\n解析：\n在LlamaIndex中，构建RAG应用的数据流转顺序为：首先，通过加载器将原始知识文件读取并封装为**Document对象**；其次，为适配大模型上下文及提升检索精度，将Document切分为更小的**Node对象**；接着，将Node对象向量化并存储，构建出**Index（索引）**；最后，基于Index创建**query_engine（查询引擎）** 来执行问答。因此选B。"},{"gid":"c18c93bc-c0bb-49c8-bdbf-581bf800f26b","type":"单选题","q":"如果要修改摘要生成函数，使其生成的摘要不超过 80 个字，应该如何修改？","options":[{"t":"假设生成结果为 query，生成结果后添加 query=query [:80]。","ok":false},{"t":"以上修改方法均不正确。","ok":false},{"t":"在提示词部分明确写出摘要本身的内容不超过 80 个字。","ok":true},{"t":"假设输入的文档为 document，在函数开头添加","ok":false}],"analysis":"答案：C\n\n解析：控制大模型输出字数最合理的方式是通过提示词（Prompt）约束。选项C在提示词中明确限制字数，能引导模型生成语义完整且符合要求的摘要。选项A直接截断生成结果会导致句子不完整、语义丢失；选项D截断输入文档不仅会丢失原文信息，也无法精确控制最终的输出字数。因此，通过提示词限制是正确做法。"},{"gid":"22172736-0a4f-4dd5-83e3-ba23d3ecfced","type":"单选题","q":"以下哪种方法最适合用于解析 PDF 和 Word 文档中的文本内容，以便进行后续的 RAG 处理？","options":[{"t":"使用正则表达式直接提取文本。","ok":false},{"t":"手动复制粘贴文本内容。","ok":false},{"t":"使用光学字符识别（OCR）技术。","ok":false},{"t":"使用专门的库，例如 Python 的 PyPDF2 和 python - docx。","ok":true}],"analysis":"答案：D\n\n解析：RAG需高效自动化处理大量文档。A项正则无法解析PDF/Word复杂的底层结构；B项手动复制无法自动化，效率极低；C项OCR主要针对扫描版或图片，对原生文档效率低且易引入识别错误。D项使用PyPDF2和python-docx等专用库，能直接解析文档结构，精准提取文本，且易于代码集成，是构建RAG数据管道最通用、最适合的方法。"},{"gid":"5926840d-e230-4d06-8555-1639a7f2cf04","type":"单选题","q":"关于输入数据的描述，以下哪项是正确的？","options":[{"t":"输入数据应当明确具体含义及其用途","ok":true},{"t":"输入数据不影响模型输出格式","ok":false},{"t":"输入数据是可选的","ok":false},{"t":"输入数据仅用于生成样例","ok":false},{"t":"输入数据无需说明","ok":false},{"t":"输入数据可以通过模糊的引导词来定义其作用","ok":false}],"analysis":"正确答案：A\n\n解析：在大模型提示词工程中，输入数据是模型处理的核心对象。明确说明输入数据的具体含义和用途，能帮助模型准确理解上下文与任务目标，从而生成精准、高质量的输出。模糊的描述、不加说明或认为其不影响输出，均会导致模型理解偏差或结果不可控。因此，输入数据的描述必须清晰、具体且必要。"},{"gid":"8aecb4f7-8b30-4a5a-ae6c-7d9c834f067a","type":"单选题","q":"以下关于基于规则的文本合规检查方法的描述，哪一项是不正确的？","options":[{"t":"对于特定高风险场景效果显著。","ok":false},{"t":"需要维护一个规则库，例如包含正则表达式、敏感词或模式。","ok":false},{"t":"规则更新可能不及时，人工维护成本较高。","ok":false},{"t":"具有很强的数据泛化能力，可以有效识别新的变种。","ok":true}],"analysis":"答案：D\n\n解析：基于规则的方法依赖预设的敏感词或正则表达式等规则库（B对），在已知高风险场景中匹配精准（A对）。但其高度依赖人工维护，面对翻新的违规手段，更新易滞后且成本高（C对）。该方法的核心局限是缺乏语义理解与数据泛化能力，难以有效识别谐音、拆字或语义替换等未见过的新型变种，这正是AI模型的优势。故D项描述错误。"},{"gid":"8c50d018-69db-4382-aada-4863afb48d82","type":"单选题","q":"用户向基于 RAG 的智能答疑机器人提交了一张包含敏感信息的图片进行咨询。根据最佳实践，最早应该在哪个阶段进行内容安全合规检查以阻止敏感信息泄露？","options":[{"t":"机器人根据用户图片检索时","ok":false},{"t":"机器人响应返回答案之后检查","ok":false},{"t":"在机器人处理图片之前检查","ok":true},{"t":"将答案返回给用户之前检查","ok":false}],"analysis":"正确答案：C\n\n解析：内容安全检查应遵循“尽早拦截”原则（输入护栏）。在机器人处理图片（如OCR识别、特征提取、向量化或记录日志）之前进行检查，能从根本上防止敏感信息进入系统内部流转、落盘或被第三方大模型读取。若在检索时或返回答案前检查，敏感数据可能已被系统存储或外发，存在极大的泄露隐患。因此，最早且最安全的阶段是在处理图片之前。"},{"gid":"f1f44597-93aa-4293-b369-a520ea3827ef","type":"单选题","q":"在提示词构建中，哪个要素用于指定大模型的回应风格或语气？","options":[{"t":"输出格式","ok":false},{"t":"样例","ok":false},{"t":"任务目标","ok":false},{"t":"上下文","ok":false},{"t":"输入数据","ok":false},{"t":"角色","ok":true}],"analysis":"答案：F\n\n解析：在提示词构建中，“角色”要素通过赋予模型特定身份（如“严谨的律师”或“幽默的作家”），直接决定其回应的风格、语气和表达习惯。相比之下，“输出格式”规定排版结构，“任务目标”明确核心指令，“上下文”和“输入数据”提供背景与素材，“样例”提供示例参考。因此，指定风格与语气最对应的要素是“角色”。"},{"gid":"0ef443ec-0280-4579-b593-ffc079cc4a24","type":"单选题","q":"以下哪种说法最能体现 RAG 的核心思想？","options":[{"t":"RAG是一种利用大语言模型进行知识图谱构建的技术。","ok":false},{"t":"RAG是一种通过微调大语言模型来适应特定领域问答的技术。","ok":false},{"t":"RAG是一种利用大语言模型直接生成最终答案的技术。","ok":false},{"t":"RAG是一种将大语言模型与外部知识库结合，提升模型问答能力的技术","ok":true}],"analysis":"答案：D\n\n解析：RAG（检索增强生成）的核心在于“检索+生成”。它通过在生成回答前，从外部知识库中检索相关信息并作为上下文输入给大语言模型，有效缓解模型“幻觉”，提升回答的准确性与时效性。A项是知识图谱构建，B项是模型微调（Fine-tuning），C项是传统纯生成模式，均未体现外部知识检索与模型生成的结合。因此D项最准确。"},{"gid":"e3712af3-b1b0-4bd6-bd20-96b75d31f2b6","type":"单选题","q":"下哪种做法不能 “保证关键数据的语义独立性与完整性”？","options":[{"t":"对不同的数据类型（例如文本、表格、图片）采用不同的处理方式。","ok":false},{"t":"将标题下的所有文本合并成一个段落。","ok":true},{"t":"针对表格中每一行单元格的数据，扩写加上各级标题、表格头部的字段说明","ok":false},{"t":"确保每个语义单元都有清晰的边界和完整的上下文信息。","ok":false}],"analysis":"答案：B\n\n解析：保证语义独立性与完整性要求数据块脱离原文仍能准确表达完整含义。选项B将标题下所有文本合并为一个段落，会破坏原有文档的层级结构，导致不同主题内容混杂，丢失逻辑边界，从而损害语义独立性。而A、C、D选项分别通过差异化处理、补充上下文（如添加表头和各级标题）以及明确语义边界，均能有效增强和保证数据的语义独立性与完整性。"},{"gid":"9c3ad63e-8294-4a79-86ee-5bcded95c00f","type":"多选题","q":"在RAGAS中 ，answer_correctness由哪些指标共同计算得来?","options":[{"t":"answer 与 context 的语义相似度；","ok":false},{"t":"answer 与 ground_truth 的语义相似度；","ok":true},{"t":"answer 与 query 的一致性；","ok":false},{"t":"基于 ground_truth 与 answer 计算 answer 的事实准确性；","ok":true}],"analysis":"答案：B、D\n\n解析：\n在RAGAS中，`answer_correctness`用于评估生成答案与标准答案（ground_truth）的综合匹配度，由两部分加权计算：\n1. **语义相似度**：计算answer与ground_truth在向量空间的语义相似度（选项B）；\n2. **事实准确性**：将两者拆解为独立陈述，计算事实重叠度（类似F1分数）（选项D）。\n选项A属于上下文相关性，选项C属于答案相关性。"},{"gid":"1d917ce3-9f5e-4553-8110-a8a35146c381","type":"多选题","q":"在实现大模型辅助的新员工帮助应用中，以下哪些建议有助于提升用户体验?","options":[{"t":"为每个任务定制详细的系统提示词，确保大模型理解上下文。","ok":true},{"t":"限制用户查询长度，因为长文本可能导致响应延迟或理解错误。","ok":false},{"t":"引入多轮对话机制，允许用户基于大模型的初步回应进一步细化需求。","ok":true},{"t":"由于大模型的准确性极高，无需提供反馈或修正机制。","ok":false},{"t":"实现自动检测用户查询类型并调用相应的大模型处理策略，无需用户指定任务类型。","ok":true}],"analysis":"**答案**：A、C、E\n\n**解析**：\nA正确：定制系统提示词能精准控制输出，提升回答质量。\nC正确：多轮对话允许用户澄清和细化需求，增强交互体验。\nE正确：自动意图识别能降低操作门槛，提供无缝体验。\nB错误：限制长度会阻碍用户完整表达，长文本问题应通过RAG等技术解决。\nD错误：大模型存在“幻觉”，必须提供反馈修正机制以保障准确性。"},{"gid":"89f00bc6-7b61-4509-a12c-8f609f781611","type":"多选题","q":"关于图片合规检查的技术手段，下列说法正确的有哪些?","options":[{"t":"可以使用目标检测算法如 YOLO 系列检测图片中的敏感物体，例如武器。","ok":true},{"t":"OCR 技术可以用于提取图片中的文字信息，用于后续的文本合规检测。","ok":true},{"t":"水印和品牌标志检查与合规性无关，不需要进行检测。","ok":false},{"t":"图片内容检测只能依靠人工审核，无法使用深度学习模型进行自动化分类。","ok":false},{"t":"PHash 算法可以用于版权检查，通过比较图像指纹识别相似图像。","ok":true},{"t":"卷积神经网络（CNN）可以用于对图片内容的合规性进行分类，例如识别暴力内容。","ok":true}],"analysis":"答案：A、B、E、F\n\n解析：A正确，YOLO等目标检测可定位敏感物体；B正确，OCR提取图片文字以便进行文本合规检测；E正确，PHash通过图像指纹比对排查版权侵权；F正确，CNN等深度学习模型可自动分类暴力等违规内容。C错误，水印和品牌涉及版权合规，需检测；D错误，深度学习已广泛用于图像自动化审核，并非仅靠人工。"},{"gid":"2595c480-a404-4202-9843-2a5ecba48e80","type":"多选题","q":"以下哪些代码片段可以有效地对用户输入进行清洗和预处理，以提高大模型应用的安全性?","options":[{"t":"将用户输入中的 emoji 表情符号替换为文本描述。","ok":false},{"t":"将用户输入转换为小写。","ok":false},{"t":"限制用户输入的长度。","ok":true},{"t":"去除用户输入中的 HTML 标签。","ok":true},{"t":"将用户输入中的 URL 替换为特殊的占位符。","ok":true},{"t":"先把英文全部翻译为中文。","ok":false}],"analysis":"**答案**：C, D, E\n\n**解析**：\nC限制输入长度可防止上下文窗口耗尽和拒绝服务攻击（DoS）；D去除HTML标签能有效防御跨站脚本（XSS）和代码注入；E替换URL可避免模型触发恶意链接（SSRF）、泄露数据或引入外部提示注入。A、B属于常规文本预处理，F与安全性无关。C、D、E是直接提升大模型应用安全性的核心清洗手段。"},{"gid":"4feabc9d-4da2-45e0-b5cb-0aa6f1c2d6d3","type":"多选题","q":"在大语言模型微调的训练循环中，哪些步骤是必须包含的?","options":[{"t":"超参数调整","ok":false},{"t":"模型保存","ok":false},{"t":"正向传播","ok":true},{"t":"梯度更新","ok":true},{"t":"梯度裁剪","ok":false},{"t":"反向传播","ok":true}],"analysis":"**答案**：C、D、F\n\n**解析**：\n大模型微调的单次训练循环核心在于参数优化，必须包含三个基础步骤：**正向传播**（计算预测值与损失）、**反向传播**（计算梯度）和**梯度更新**（更新模型权重）。超参数调整在循环外进行；模型保存通常按周期执行，非每次迭代必须；梯度裁剪虽常用于防止梯度爆炸，但并非理论上的绝对必须步骤。"},{"gid":"37c8cc47-cb1c-4f93-87dd-1f4e7bda38d6","type":"多选题","q":"优化 RAG 应用时，需要考虑哪些因素?","options":[{"t":"系统的可维护性和可扩展性。","ok":true},{"t":"最新的深度学习模型和算法。","ok":false},{"t":"文档的结构和内容特点。","ok":true},{"t":"大模型的解析方式和理解能力。","ok":true},{"t":"检索的效率和速度。","ok":true},{"t":"用户提问的习惯和可能的提问方式。","ok":true}],"analysis":"**答案**：A, C, D, E, F\n\n**解析**：\n优化RAG需全局考量：A保障工程落地与长期迭代；C决定数据清洗、分块与索引策略；D影响最终生成质量与提示词设计；E关乎检索性能与用户体验；F是优化查询重写与意图理解的前提。B为干扰项，RAG优化重在模型与业务场景的“适配性”和“稳定性”，而非盲目追求“最新”算法。"},{"gid":"9b5920a3-c48e-410b-96bb-50c2970395ef","type":"单选题","q":"RAG未检索到相关信息，但模型仍编造回答。下列哪种做法有助于减少这种幻觉？","options":[{"t":"提示词要求“若无匹配则回答无法解答”","ok":true},{"t":"把所有文档一次性放进模型上下文","ok":false},{"t":"改回I日版本embedding 模型","ok":false},{"t":"开启高温度让模型自由创造","ok":false}],"analysis":"答案：A\n\n解析：在RAG中，若未检索到信息，模型易利用自身知识编造答案产生幻觉。通过提示词明确约束“若无匹配则回答无法解答”，可强制模型仅基于检索内容作答，有效遏制幻觉。B项会导致上下文超载及无关信息干扰；C项降低检索质量，无法解决生成端幻觉；D项提高温度会增加输出随机性，反而加剧幻觉。因此选A。"},{"gid":"a2caa7de-5834-48ca-8cbf-9be4009b891a","type":"单选题","q":"你在帮跨境电商平台改造商品推荐系统，对方要求你做到：用户上传商品图片后，10秒内返回对应语言的商品描述和相似商品推荐。最合理的组件协作流程是？","options":[{"t":"前端上传图像到OSS→函数计算FC调用百炼生成多模态描述→函数计算FC调用商品推荐算法一结果聚合返回","ok":true},{"t":"前端直传图片到百炼模型→百炼生成描述后存入OSS→函数计算FC生成推荐商品列表","ok":false},{"t":"OSS保存图像后发送消息到Kafka通过Flink实时计算推荐结果一再通过百炼上的模型服务补全图像描述","ok":false},{"t":"函数计算FC接收图片后通过图像处理算法提取特征→图像特征存入OSS一启动定时任务批量生成推荐结果","ok":false}],"analysis":"答案：A\n\n解析：题目要求10秒内实时返回，排除C（流式异步）和D（定时批处理）。B选项前端直连大模型存在安全风险且流程割裂。A选项利用函数计算（FC）作为Serverless编排层，安全隔离API，并能高效调度百炼大模型与推荐算法，实现结果快速聚合返回，完美契合低延迟的实时业务需求。"},{"gid":"161fc345-0888-459c-b1c3-0647c93e5a87","type":"单选题","q":"一家SaaS公司提供LLM推理服务。为满足高级别安全合规，必须技术性地阻I止拥有主机root权限的员工访问运行时数据，并向客户提供一份由硬件生成的、可远程验证的加密报告以证明环境完整性。要实现此目标，哪项技术是不可或缺的？","options":[{"t":"使用eBPF等内核技术监控容器内所有系统调用","ok":false},{"t":"对所有LLM计算任务采用全同态加密（FHE）技术","ok":false},{"t":"基于硬件的可信执行环境（TEE）及其远程证明机制","ok":true},{"t":"采用硬件内存加密技术（如AMDSEV）加密整个虚拟机。","ok":false}],"analysis":"答案：C\n\n解析：本题核心需求是“防root访问运行时数据”与“硬件级远程证明”。可信执行环境（TEE）通过硬件级内存隔离，确保拥有root权限也无法窥探运行时数据；其远程证明机制可生成硬件签名的加密报告，供客户验证环境完整性。eBPF无法防范root权限；FHE性能极低且无硬件证明机制；单纯的内存加密缺乏完整的远程证明能力。故C最准确。"},{"gid":"fd823321-00d8-4d2d-b84b-df64b8a47e21","type":"单选题","q":"你在需要构建公文智能处理系统，用户上传PDF文件后，系统需自动识别文本内容并生成摘要。以下哪种架构设计比较合理？","options":[{"t":"用户前端将图片上传至OSS，触发函数计算FC执行预处理，FC调用百炼模型服务生成描述文本，最终结果返回前端","ok":true},{"t":"用户前端直接调用百炼模型服务生成文本，模型服务将原始图片存入OSS，函数计算FC只负责最终结果缓存","ok":false},{"t":"用户前端上传图片至OSS，函数计算FC直接读取图片内容进行分析，通过数字编解码技术解析文字信息，保存到OSS","ok":false},{"t":"用户前端上传图片至函数计算FC，FC调用百炼模型服务生成文本，并将图片和结果统一存入OSS","ok":false}],"analysis":"答案：A\n\n解析：A选项采用“OSS+FC+大模型”的经典Serverless架构。文件先传OSS可避免大文件直传FC导致超时；通过OSS事件触发FC，实现存储与计算解耦；FC调用百炼大模型生成摘要，充分发挥AI能力，安全高效。B选项前端直连模型易泄露API密钥；C选项未调用大模型且解析技术描述有误；D选项FC直接接收大文件上传易超时，且不适合做持久化存储。"},{"gid":"9276ce1a-0fc0-435e-9f97-f3775b05cc17","type":"单选题","q":"某社交平台需自动屏蔽违规评论，要求同时处理文字、图片。以下哪种方案更合理？","options":[{"t":"延迟显示所有 AI 生成内容等待人工审核","ok":false},{"t":"建立独立的关键词库分别过滤文本和图片","ok":false},{"t":"要求用户上传内容前手动选择内容分类标签","ok":false},{"t":"使用多模态模型拦截图文混合违规内容，如 qwen - v1 72b","ok":true}],"analysis":"答案：D\n\n解析：A项人工审核效率低，违背自动化与实时性要求；B项独立关键词库无法有效识别图片内容，且难以应对图文结合产生的隐性违规；C项依赖用户手动打标签，增加负担且易被恶意规避。D项使用多模态大模型，能联合理解图像与文本特征，精准拦截图文混合及复杂语境下的违规内容，兼顾了自动化、准确率与处理效率，是最合理的方案。"},{"gid":"9f982cea-3df5-4146-b5c0-492b650c6c06","type":"单选题","q":"某电商平台计划使用 RAG 模型构建智能客服系统，帮助用户查询商品信息。以下关于该系统的评测方法，哪一项是正确的？","options":[{"t":"生成模块是系统的核心，应优先优化生成阶段的知识总结能力。","ok":false},{"t":"应重点评估检索模块的表现，因为商品信息的准确性和相关性直接影响最终生成的结果。","ok":false},{"t":"应对检索阶段和生成阶段分别进行评测，以便全面优化系统性能。","ok":true},{"t":"评测时只需关注最终回答的准确性，因为用户的满意度主要取决于答案是否正确。","ok":false}],"analysis":"正确答案：C\n\n解析：RAG系统由检索和生成两个核心阶段组成。仅关注单一模块（选项A、B）或仅看最终结果（选项D）无法准确定位系统瓶颈。科学的评测应对检索阶段（如召回率、准确率）和生成阶段（如忠实度、相关性）分别进行独立评测。这既能全面评估系统表现，又能精准发现具体环节的问题，从而针对性地全面优化系统性能，故C正确。"},{"gid":"8842c86f-027a-451a-b245-9fadb6f71891","type":"单选题","q":"某公司推出了一款 “大小模型协同” 系统，使用小模型处理常规问答，大模型处理复杂推理或文档分析。系统还采用了多智能体架构，然而系统经常把一些简单 FAQ 也交给大模型处理，浪费了算力。为了解决该问题，以下哪种做法最有效？","options":[{"t":"在 Planner Agent 中增加任务复杂度判断逻辑，优先调用小模型处理简单 FAQ","ok":true},{"t":"对小模型进行额外训练，提升其对更多类型问题的处理能力，从而减轻大模型负担","ok":false},{"t":"在工具函数描述中添加更多示例，让大模型能更准确区分不同请求的复杂度","ok":false},{"t":"为 Summary Agent 提供更多训练数据，确保最终回答更加全面","ok":false}],"analysis":"答案：A\n\n解析：本题核心是“任务路由错误”导致算力浪费。在多智能体架构中，Planner Agent 负责规划与分发任务。在其内部增加复杂度判断逻辑，能从源头拦截简单 FAQ 并精准路由给小模型，直接解决算力浪费问题。B项未解决路由错误；C项让执行层的大模型做路由判断，违背架构设计且增加额外消耗；D项针对总结环节，与任务调度无关。故选A。"},{"gid":"aa94fca8-fe51-4caf-a566-3c128c85dc6f","type":"单选题","q":"在构建微调数据集时，以下哪个方面的考量是错误的？","options":[{"t":"数据集要根据微调效果持续迭代","ok":false},{"t":"要包括任务全场景","ok":false},{"t":"测试集内容要包含在训练集中","ok":true},{"t":"要确保数据集准确、内容相关","ok":false}],"analysis":"答案：C\n\n解析：\n在构建微调数据集时，测试集必须与训练集严格隔离。若将测试集内容包含在训练集中，会导致“数据泄露”，使模型评估结果虚高，无法客观反映其真实的泛化能力。而A、B、D均为正确做法：数据集需根据效果持续迭代，覆盖任务全场景以提升泛化性，并确保数据准确且相关。因此C选项错误。"},{"gid":"2e275b97-a545-4020-a72a-0602284e2513","type":"单选题","q":"在一个电商客服 RAG 系统中，如果过度追求召回率，可能会导致哪些问题？","options":[{"t":"检索结果数量不足，用户无法获得足够推荐。","ok":false},{"t":"检索结果过少，用户找不到相关商品。","ok":false},{"t":"检索条件过于严格，用户查询失败率增加。","ok":false},{"t":"检索结果包含大量无关商品信息，影响用户体验。","ok":true}],"analysis":"答案：D\n\n解析：在RAG系统中，召回率指检索出所有相关信息的能力。过度追求召回率需放宽检索条件，虽能减少漏检，但会导致准确率下降，引入大量不相关的噪声数据。在电商客服场景中，这会使得检索结果包含大量无关商品信息，增加大模型处理负担并生成偏离意图的回答，严重影响用户体验。A、B、C项均为召回率过低（条件过严）导致的问题。"},{"gid":"5d6592f4-1873-41db-a2ca-dd27d78128dd","type":"单选题","q":"某企业的文档（Markdown 格式）中，部门职责常落在多段文字里，检索时想精准定位，哪种切片策略最能减少 “职责信息” 被拆散的问题？","options":[{"t":"Token 切片","ok":false},{"t":"随机分段","ok":false},{"t":"句子切片","ok":false},{"t":"Markdown 结构化切片","ok":true}],"analysis":"答案：D\n\n解析：Markdown结构化切片利用文档的标题、列表等层级特征进行划分。由于“部门职责”通常从属于特定标题，该策略能将同一结构块内的多段文字作为整体保留，最大程度维持语义完整。相比之下，Token和句子切片易按固定长度或标点强行截断多段内容，随机分段则完全破坏逻辑，均会导致职责信息被拆散。"},{"gid":"03666f9d-6caa-467b-8426-798f2465bf90","type":"单选题","q":"你希望用阿里云百炼平台的通义千问大模型生成商品描述，但要求不同用户看到的内容略有差异，应如何实现？","options":[{"t":"启用 enable_search参数","ok":false},{"t":"保持 temperature=0.9 且不固定 seed","ok":true},{"t":"设置 temperature=0.0","ok":false},{"t":"使用完全相同的提示词","ok":false}],"analysis":"答案：B\n\n解析：在通义千问中，`temperature`控制生成的随机性，设为0.9可增加输出多样性。不固定`seed`（随机种子）能确保每次请求的随机序列不同，从而使生成的商品描述略有差异。A项用于联网搜索；C项会导致输出高度确定和重复；D项无法主动控制内容差异。故选B。"},{"gid":"bb2f40d2-9486-4a20-8335-43558e90066e","type":"单选题","q":"你在阿里云百炼上搭建了一个智能应用，为用户提供美食推荐服务，你希望智能体记住用户的喜好、避免推荐之前用户提及过的忌口食物。以下哪个方案能以低成本满足这一诉求？","options":[{"t":"构建独立的历史对话知识库，通过 RAG 在每次请求时检索用户全部聊天记录并持续维护知识库更新与索引优化","ok":false},{"t":"在应用侧硬编码用户提供忌口信息","ok":false},{"t":"构建基于向量数据库的实时对话语义检索系统，检索常见忌口信息","ok":false},{"t":"使用长期记忆功能，让智能体不断积累用户偏好信息","ok":true}],"analysis":"答案：D\n\n解析：阿里云百炼智能体提供原生的“长期记忆”功能，可自动提取并持久化用户偏好与忌口，无需额外开发，成本极低。选项A和C需额外构建并维护知识库或向量数据库，开发与算力成本高，且A每次检索全部记录会导致Token消耗过大；选项B硬编码缺乏灵活性，无法动态适应多用户的个性化需求。因此，D是最低成本且最直接的方案。"},{"gid":"07eb6cd0-7900-47f6-b717-ae70fa3ae8ac","type":"单选题","q":"你想通过语音命令操作网页，例如，用户说 “我想煮 2 杯咖啡”，系统转译语音后，根据用户位置和互动意图确定位置并点击 “下单” 按钮。由于 UI 复杂，哪项技术最适合精准锚点点击目标按钮？","options":[{"t":"引入安全审核机制，对所有操作进行预先校验，确保操作前先确定 UI 元素的合法性。","ok":false},{"t":"标注页面上的可交互元素，然后结合视觉理解大模型识别并构建应该做出的点击动作。","ok":true},{"t":"利用 RAG（检索增强生成）技术，动态检索界面说明文档来辅助识别目标按钮。","ok":false},{"t":"采用提示词工程技术，通过优化语言描述指导模型从文本中推断出应操作的 UI 元素。","ok":false}],"analysis":"答案：B\n\n解析：复杂UI精准点击的核心是“视觉定位”。选项B通过标注可交互元素提供空间参考，结合视觉大模型解析页面截图，能精准输出点击坐标，是当前GUI Agent的主流最优解。A项侧重安全校验，C项RAG侧重外部文档检索，D项纯文本提示词无法处理复杂的视觉空间布局，三者均无法解决复杂界面的视觉锚点精准定位问题。"},{"gid":"604ad215-0664-4a14-862b-e35b58ecc3a8","type":"单选题","q":"为什么我们要在微调中使用早停法？","options":[{"t":"因为模型微调容易出现过拟合现象","ok":true},{"t":"因为 eval_step 设计太大会导致过拟合","ok":false},{"t":"微调学习率太小导致模型参数更新太慢","ok":false},{"t":"微调轮次过少可能导致模型欠拟合","ok":false}],"analysis":"**答案**：A\n\n**解析**：\n早停法的核心目的是防止模型过拟合。在微调预训练模型时，模型已具备强大的特征提取能力，且微调数据集通常较小。若持续训练，模型极易“死记硬背”训练集噪声，导致验证集性能下降（即过拟合）。早停法通过监控验证集指标，在性能不再提升时及时终止训练，有效缓解此问题。B、C项与早停目的无关；D项描述的是欠拟合，而早停法正是为了防范过拟合。"},{"gid":"388beaf8-82f7-4ba2-b9a3-9cc4880db16a","type":"单选题","q":"你在开发 RAG 应用时，发现召回的文本段包含了回答所需的必要信息，但是回答效果很差，你可以怎么做？","options":[{"t":"更换向量数据库的选型","ok":false},{"t":"更换性能更好的大模型","ok":true},{"t":"更换性能更好的 embedding 模型","ok":false},{"t":"尝试使用 LlamaIndex 外的其它 RAG 开发框架","ok":false}],"analysis":"答案：B\n\n解析：RAG包含检索与生成两阶段。题目指出“召回文本包含必要信息”，说明检索阶段（涉及Embedding模型、向量数据库及框架检索组件）已成功。回答效果差的问题出在生成阶段，即大模型未能有效利用上下文生成优质回答。因此，应更换推理与生成能力更强的大模型（选项B）。选项A、C、D均旨在优化检索效果，无法解决当前的生成缺陷。"},{"gid":"9a81a8da-1ad2-4043-af6a-0804df2f9990","type":"单选题","q":"一家初创公司的AI客服，在安全审计中发现会泄露其他用户的个人信息（PII）。根因是其RAG知识库的数据源包含未经处理的生产工单数据库。在预算有限的约束下，以下哪个优化方案的成本效益最高？","options":[{"t":"要求运营团队手动标注工单，ETL流程仅抽取标记为“不含PII”的数据。","ok":false},{"t":"在模型回复的API出口处，部署一个基于规则的PII内容过滤器。","ok":false},{"t":"采购并部署商业级数据库防火墙，在数据查询时进行实时动态脱敏。","ok":false},{"t":"改造数据摄入流程，在数据向量化前进行自动化的PII识别与脱敏。","ok":true}],"analysis":"正确答案：D\n\n解析：A项人工标注成本极高且易错；C项采购商业防火墙费用高昂，均不符合“预算有限”。B项在API出口使用规则过滤，对非结构化文本识别率低，治标不治本。D项在数据摄入阶段引入自动化脱敏（如开源工具），从源头防止PII进入向量库，一次性解决知识库污染，开发成本低且效果彻底，是预算有限下的最优解。"},{"gid":"8726de3c-2682-418a-8781-54e35f167920","type":"单选题","q":"在微调大语言模型的过程中，什么是用来衡量模型在每个训练批次上表现的一个标准？","options":[{"t":"准确率","ok":false},{"t":"训练时间","ok":false},{"t":"测试误差","ok":false},{"t":"损失函数","ok":true}],"analysis":"答案：D\n\n解析：\n在微调大语言模型时，损失函数是衡量模型在每个训练批次上表现的核心标准。它量化了模型预测输出与真实标签之间的差异。每个批次训练后，模型通过计算损失值并利用反向传播更新参数，以不断优化模型。准确率多用于分类任务评估，训练时间是效率指标，测试误差则是在测试集上评估的，均不用于衡量单个训练批次的表现。因此选D。"},{"gid":"59a1594d-ff36-4ed0-9be0-0e75c163f720","type":"单选题","q":"以下哪种情况更适合使用代码解释器插件而不是直接使用大模型？","options":[{"t":"将一组文档按主题分类","ok":false},{"t":"分析一段文本的情感","ok":false},{"t":"从用户评论中提取关键信息","ok":false},{"t":"计算两组数据之间的皮尔逊相关系数","ok":true}],"analysis":"答案：D\n\n解析：大模型擅长自然语言处理，如文档分类（A）、情感分析（B）和提取信息（C），直接使用效果很好。而计算皮尔逊相关系数（D）需要精确的数学统计运算，大模型直接计算极易出错。代码解释器插件可通过编写并运行Python代码（如调用科学计算库）来执行复杂计算，确保结果的绝对精确与高效，因此D更适合使用代码解释器。"},{"gid":"756ec919-619f-4acf-b71b-ed74a1571d29","type":"单选题","q":"向量数据库的主要作用是什么？","options":[{"t":"存储和管理大量的关系型数据。","ok":false},{"t":"存储和管理大量的图像 。","ok":false},{"t":"存储和管理大量的向量数据，并提供高效的相似性检索。","ok":true},{"t":"存储和管理大量的文本数据，并提供全文检索功能。","ok":false}],"analysis":"答案：C\n\n解析：向量数据库专门用于存储和管理高维向量数据（由文本、图像等经AI模型转化而来）。其核心作用是利用近似最近邻（ANN）等算法，提供高效的相似性检索，广泛应用于大模型RAG、推荐系统等AI场景。A项是关系型数据库的作用，B项是对象存储的作用，D项是全文搜索引擎的作用。"},{"gid":"462dd0a6-7d73-486e-a07a-88063dbc1b0f","type":"单选题","q":"以下哪个数据结构更适合用于实现关键词匹配，以提高匹配效率","options":[{"t":"栈","ok":false},{"t":"数组","ok":false},{"t":"链表","ok":false},{"t":"字典树","ok":true}],"analysis":"答案：D\n\n解析：\n字典树（Trie）是专门用于处理字符串匹配的数据结构。它利用字符串的公共前缀来节约存储空间并减少无谓的字符比较，查询时间复杂度仅与关键词长度相关，能极大提高关键词匹配和搜索提示的效率。相比之下，栈主要用于后进先出场景；数组和链表在查找时通常需要逐个遍历比对，时间复杂度较高，不适合高效的关键词匹配。因此，字典树是最佳选择。"},{"gid":"801e9ad5-cda4-4055-bd1f-568de73ebbe3","type":"单选题","q":"以下哪种方法最适合用于明确指定大模型输出的格式和类型？","options":[{"t":"仅使用上下文（Context）","ok":false},{"t":"仅使用角色（Rol","ok":false},{"t":"仅使用任务目标（Object）","ok":false},{"t":"结合输出格式（Output Format）和样例（Sampl","ok":true}],"analysis":"答案：D\n\n解析：\n在提示词工程中，要精确控制大模型输出的格式（如JSON、表格）和类型，最直接有效的方法是直接指定“输出格式”并提供“样例”（Few-shot）。上下文、角色和任务目标主要用于界定背景、语气和核心任务，无法严格约束输出的具体结构。结合明确的格式说明与具体样例，能大幅降低模型的理解偏差，确保输出结果完美符合预期的排版与数据要求。"},{"gid":"bc394f47-c5be-4ca6-a9e4-f0ff3a067fe1","type":"单选题","q":"某智能客服系统，同时接入了多个不同来源的大模型（如通义、文心等），并通过多种渠道（App、微信等）对外提供服务。目前，安全团队通过为每个模型的每个渠道分别定制系统提示词（SystemPrompt）来实施安全策略。随着模型和渠道的增加，安全策略的同步和维护工作量呈指数级增长，一个新漏洞需要在所有组合上重复修复，极易出现遗漏。为了建立一个更健壮、可扩展且易于维护的防御体系，下一步应优先考虑哪种做法？","options":[{"t":"持续投入更多人力，对系统提示词进行更精细化的“雕刻”。","ok":false},{"t":"引入独立的AI安全中间件，将安全逻辑与业务逻辑解耦。","ok":true},{"t":"建立一个内部漏洞悬赏平台，激励员工寻找越狱方法。","ok":false},{"t":"暂停功能开发，集中资源对大模型本身进行为期半年的对抗性训练。","ok":false}],"analysis":"答案：B\n\n解析：当前痛点是“模型×渠道”组合爆炸导致安全策略维护成本极高且易遗漏。引入独立AI安全中间件，可在请求到达模型前统一拦截处理，实现安全与业务解耦。无论新增多少模型或渠道，只需在中间件维护一套安全策略，彻底解决组合爆炸问题，大幅提升系统的可扩展性与可维护性。A、C、D均未从架构层面解决策略同步与维护的根本痛点。"},{"gid":"7649f062-d500-40be-8dce-99994cb35091","type":"单选题","q":"一家影视制作公司计划推出一款虚拟主播，用于直播带货和互动娱乐场景。以下哪一种描述了实现虚拟主播的一种方法？","options":[{"t":"使用大语言模型生成剧本初稿，供编剧团队进一步修改和完善。","ok":false},{"t":"开发一个推荐系统，为观众推荐他们可能感兴趣的直播内容。","ok":false},{"t":"使用语音合成技术生成个性化配音，替代人工配音演员完成所有影视作品的配音工作。","ok":false},{"t":"利用图像理解技术对演员的面部表情进行捕捉，并将其映射到虚拟主播角色上，实现实时互动表演。","ok":true}],"analysis":"答案：D\n\n解析：虚拟主播的核心在于虚拟形象的实时驱动与互动。D选项利用图像理解技术捕捉真人表情并映射到虚拟角色上，是实现虚拟主播实时互动表演的核心方法。A项是文本生成，B项是推荐系统，均不涉及虚拟形象驱动；C项虽涉及语音合成，但针对的是影视配音，偏离了直播互动的核心场景。故选D。"},{"gid":"d7fee0c4-9329-489f-a316-898b8f4c0158","type":"单选题","q":"构建A1智能体时，以下哪种技术方案最适合实现“以自然流畅的方式与终端用户进行实时音视频通话”的需求？","options":[{"t":"引入语音识别模型，并结合文本生成模型生成文本回复内容，但仅输出文本回答","ok":false},{"t":"利用多模态大语言模型，结合实时音视频处理框架，实现端到端的交互能力","ok":true},{"t":"部署视频分析平台，支持文字聊天并允许用户手动上传图片或视频供分析","ok":false},{"t":"使用传统的基于规则的对话系统，结合预录制的音频和视频片段来模拟互动","ok":false}],"analysis":"答案：B\n\n解析：本题核心需求是“自然流畅”与“实时音视频通话”。A项仅输出文本，C项为异步图文交互，均不符合实时音视频要求；D项依赖规则和预录制片段，交互生硬死板。B项利用多模态大模型能深度理解和生成音视频内容，结合实时处理框架保障低延迟，端到端交互最大程度还原真实通话体验，完美契合需求，为最优方案。"},{"gid":"9dc7dfea-292f-415d-8e54-2c121c859435","type":"多选题","q":"在监控大语言模型训练性能时，哪些指标是常用的？","options":[{"t":"训练时间","ok":true},{"t":"生成速度","ok":false},{"t":"batch size","ok":false},{"t":"精准率","ok":true},{"t":"损失函数值","ok":true},{"t":"准确率","ok":true}],"analysis":"答案：A, D, E, F\n\n解析：监控大模型训练性能涵盖效率与效果两方面。A（训练时间）用于评估训练效率与进度；E（损失函数值）是最核心指标，反映模型收敛情况；D（精准率）和F（准确率）常用于监控验证集上的模型学习效果。B（生成速度）属于推理阶段指标，C（batch size）为预设超参数，均非训练过程的监控指标。"},{"gid":"c7b48486-1df8-4388-96e6-37b3c3ac7ac9","type":"单选题","q":"设计程序时，一般不会设计为调用一次大模型就处理完所有任务。下列关于如上说法的分析中，错误的是哪一项？","options":[{"t":"单个大模型无法处理多种格式的文件。","ok":true},{"t":"可以根据任务特点选择合适的模型和参数。","ok":false},{"t":"难以同时保证每项工作的质量。","ok":false},{"t":"可以分步优化，提高整体处理效率和成本。","ok":false}],"analysis":"答案：A\n\n解析：现代大模型（尤其是多模态模型）已具备处理文本、图像、音频等多种格式文件的能力，且可通过预处理转换格式，因此A项说法错误。程序分步调用大模型的真正原因是：复杂任务一次性处理易导致模型注意力分散、质量下降（C正确）；分步处理可针对具体子任务匹配最合适的模型与参数（B正确），从而优化整体效率并控制成本（D正确）。故选A。"},{"gid":"a7098de4-31eb-49d0-ba39-4c2e320fb1ac","type":"单选题","q":"你计划开发法律咨询AI助手，需平衡专业性与可解释性。以下最佳方案是：","options":[{"t":"支持多轮对话形式，但为了直奔主题，要求模型每轮回答不超过20个汉字","ok":false},{"t":"用流程图展示法律程序，拒绝提供明确的文字结论以避免责任风险","ok":false},{"t":"生成通俗解释后，附加相似案例做对比，并在关键结论处显示法条依据及置信度","ok":true},{"t":"仅输出法律条款原文，用高亮标注相关段落","ok":false}],"analysis":"答案：C\n\n解析：法律咨询AI需兼顾专业严谨与用户易懂。A项字数限制导致无法充分解释；B项拒绝结论丧失了助手的实用价值；D项仅输出法条，对非专业用户缺乏可解释性。C项通过通俗解释和案例对比提升可解释性，同时提供法条依据和置信度保障专业性，完美平衡了两者需求，为最佳方案。"},{"gid":"1f674e68-0a76-4a19-8202-ba5f3978b1f4","type":"多选题","q":"某大型公司对每位员工都有多条文档记录。RAG 在检索时只依赖 Embedding 相似度，有时召回了不匹配的 “同名员工” 信息。为提高准确度，你会如何处理？","options":[{"t":"给每条记录打标签（如部门、邮箱）并结合标签过滤","ok":true},{"t":"修改大模型为 qwen-max","ok":false},{"t":"改用 TokenTextSplitter","ok":false},{"t":"提高相似度阈值，过滤噪声","ok":true}],"analysis":"**答案**：A、D\n\n**解析**：\nRAG检索同名混淆需从检索策略优化。A选项引入元数据（部门、邮箱）进行前置过滤，能精准区分同名实体，是核心解法；D选项提高相似度阈值可过滤因同名但内容不相关产生的低分噪声，提升召回准确度。B选项修改大模型无法解决检索阶段的召回错误；C选项更改文本分块方式不能解决实体语义混淆问题。故选AD。"},{"gid":"b8fb946e-6468-416e-939d-a48d88b42f75","type":"多选题","q":"你开发了一个公司制度文件的 RAG 问答机器人。在测试时你发现提问 “公司几点上班”，召回的文本段包含公司福利等信息，作息信息由于排名靠后而没有被召回。以下哪两个措施更有助于解决这一问题？","options":[{"t":"更换一个性能更优秀的 Embedding 模型","ok":true},{"t":"优化生成阶段的提示词模板","ok":false},{"t":"使用重排（rerank）技术","ok":true},{"t":"更换一个性能更优秀的大模型","ok":false}],"analysis":"答案：A、C\n\n解析：本题痛点是相关文本因排名靠后未被Top-K截断召回，属于检索与排序问题。A项更换更优Embedding模型可提升语义匹配精度，提高初始召回排名；C项引入重排（Rerank）技术能对初召结果进行二次精准打分排序，将作息信息提至前列。B、D项均作用于生成阶段，无法改善前置的检索召回效果。"},{"gid":"42d9b4ec-e423-4ed7-985a-82f69f781339","type":"多选题","q":"大语言模型微调相比预训练的优势有哪些?","options":[{"t":"更容易发现和修正模型偏差","ok":true},{"t":"无需考虑模型的泛化能力","ok":false},{"t":"减少了对大量无标注数据的依赖","ok":true},{"t":"提高了模型在特定领域的准确性","ok":true},{"t":"减少了计算资源的需求","ok":true},{"t":"加快了模型收敛速度","ok":true}],"analysis":"**答案**：A, C, D, E, F\n\n**解析**：微调在预训练基础上进行，继承了通用知识，因此**收敛更快(F)**且**计算资源需求大幅减少(E)**。它主要使用少量高质量标注数据，**减少了对海量无标注数据的依赖(C)**，能针对性**提升特定领域的准确性(D)**。此外，通过引入人工反馈或高质量对齐数据，**更容易发现和修正模型偏差(A)**。微调仍需防止过拟合，必须考虑泛化能力，故B错误。"},{"gid":"7539d966-3de2-4602-8114-3acedd55f788","type":"多选题","q":"实现早停法 (early stopping) 策略时，考虑的条件可能包括：","options":[{"t":"验证损失连续n 轮不再下降","ok":true},{"t":"验证损失达到预设阈值","ok":true},{"t":"训练损失持续增加","ok":false},{"t":"验证准确率连续提高","ok":false},{"t":"训练准确率不再提高","ok":false},{"t":"迭代次数达到预定最大值","ok":true}],"analysis":"早停法（Early Stopping）是一种在模型训练过程中防止过拟合、节省计算资源的策略，其核心触发条件包括：\nA、验证损失连续 n 轮不再下降：这是早停法最常用的判断依据。当模型在验证集上的损失连续多个 epoch 没有改善时，说明模型可能已经收敛或开始过拟合，此时应停止训练。\nB、验证损失达到预设阈值：可以设定一个目标损失值，当验证损失低于该阈值时提前终止训练，表示模型已达到预期效果。\nF、迭代次数达到预定最大值：作为安全兜底机制，即使其他停止条件未触发，当训练轮次达到上限时也必须强制停止，防止无限训练。\n以下选项不属于早停法的常规考虑条件：\nC、训练损失持续增加：这通常意味着学习率过大或数据存在问题，属于训练异常而非正常的早停信号。\nD、验证准确率连续提高：这是模型正常学习的表现，不应触发停止；早停关注的是“不再提高”或“下降”。\nE、训练准确率不再提高：仅看训练集指标无法判断泛化能力，早停法必须基于验证集指标来决定是否停止"},{"gid":"86dae52f-9c1e-47f2-9bee-aa4c9407a72c","type":"多选题","q":"基于字符的文档切片方法有哪些潜在的缺点?","options":[{"t":"难以实现","ok":false},{"t":"可能导致语义分离","ok":true},{"t":"需要大量的存储空间","ok":false},{"t":"计算复杂度高","ok":false},{"t":"切片大小不均匀","ok":false},{"t":"可能导致上下文丢失","ok":true}],"analysis":"**答案：B、F**\n\n**解析：**\n基于字符的切片（如按固定字符数）实现简单、计算复杂度低且不额外消耗存储（排除A、C、D），固定长度下切片大小通常均匀（排除E）。其核心缺点在于机械的“硬切分”极易将完整的词句从中间截断，破坏内容完整性，导致**语义分离**（B）；同时，这种切分忽略了文本内在的逻辑结构，使相邻切片缺乏连贯性，进而**导致上下文丢失**（F）。"},{"gid":"268ca76b-315c-4311-99d6-041276ae9102","type":"多选题","q":"以下哪些选项体现了提示词要素中的“上下文 (Context)”?","options":[{"t":"用户喜欢历史文化景点，不喜欢游乐场。","ok":true},{"t":"请提供不少于三个景点的推荐。","ok":false},{"t":"输出格式为 JSON。","ok":false},{"t":"请你扮演一位资深旅游博主。","ok":false},{"t":"请根据用户提供的行程安排，推荐合适的旅游景点。","ok":false},{"t":"用户计划前往北京旅游，时间为一周。","ok":true}],"analysis":"**答案：A、F**\n\n**解析：**\n在提示词工程中，“上下文(Context)”指为模型提供任务相关的背景信息、环境条件或用户偏好，帮助其更精准地理解需求。选项A（用户偏好）和F（目的地与时间）均提供了具体的背景信息，属于上下文。而B是任务约束，C是输出格式，D是角色设定，E是具体任务指令，均不属于上下文要素。"},{"gid":"bc726526-f9a3-4592-b65a-cfb30bf3e701","type":"多选题","q":"通过Llamalndex创建 RAG应用，在修改默认prompt时，包含以下哪些步骤?","options":[{"t":"用index的 update_prompts方法将新的 prompt同步上去","ok":true},{"t":"定义新的 prompt字符串，将chunk和 query的位置空出来","ok":true},{"t":"对新的prompt进行保存，使得Llamalndex中的源码prompt 也变成中文","ok":false},{"t":"用新的 prompt初始化一个 PromptTemplate 对象","ok":true}],"analysis":"答案：A、B、D\n\n解析：在LlamaIndex中修改默认prompt，首先需定义包含上下文(chunk)和查询(query)占位符的新prompt字符串(B)；接着用该字符串实例化PromptTemplate对象(D)；最后通过索引的update_prompts方法将新对象同步更新(A)。该操作仅在运行时覆盖默认配置，无需修改或保存LlamaIndex底层源码(C错误)。"},{"gid":"cbd47dfb-2f48-4157-b7a1-22ffec5208b8","type":"多选题","q":"Assistant API中 Message 类包含了各类关于消息的函数，以下哪些选项属于Message 类中的函数?","options":[{"t":"update","ok":true},{"t":"search","ok":false},{"t":"retrieve","ok":true},{"t":"create","ok":true},{"t":"list","ok":true}],"analysis":"**答案**：A, C, D, E\n\n**解析**：\n在OpenAI Assistant API中，Message类主要用于管理线程（Thread）内的消息。其标准函数包括：`create`（创建/添加新消息）、`retrieve`（检索/获取单条消息详情）、`update`（更新消息的元数据等属性）和`list`（列出线程下的所有消息）。API并未提供`search`函数，相关的搜索功能（如File Search）是作为工具在Run（运行）层面实现的，而非Message类的方法。"},{"gid":"4e528010-7a9d-4679-927f-96182cc947ff","type":"单选题","q":"你负责的短视频平台计划优化内容审核系统，需要实现：1.自动识别视频中出现的违禁物品，2.对识别出的违禁画面自动生成马赛克覆盖，正确的技术路线是？","options":[{"t":"视频抽帧后用多模态大模型分析内容→文生图生成马赛克图案→合成新视频","ok":true},{"t":"使用语音合成分析音频→文本生成警告信息一视频编辑添加水印","ok":false},{"t":"文生图模型生成安全提示图一使用语音合成生成警告音频一自动下架视频","ok":false},{"t":"通过视频编辑手动提取关键帧→文本生成模型标注违禁词","ok":false}],"analysis":"答案：A\n\n解析：题目核心需求是“自动识别画面违禁物品”与“自动添加马赛克”。A选项通过视频抽帧与多模态大模型实现画面内容的自动分析识别，再通过图像生成与视频合成技术完成马赛克覆盖，完全契合需求。B、C选项侧重音频处理或视频下架，未解决画面马赛克问题；D选项“手动提取”违背自动化原则，且缺乏马赛克处理。因此A为正确路线。"},{"gid":"7e4f3801-f742-4e9d-9f91-c04ba88dadd1","type":"单选题","q":"你开发的AI客服系统出现以下异常：用户发送“我想看红色连衣裙的3D展示”时，系统返回文字描述但无图像，当用户发送产品视频时，系统无法提取关键参数，语音回复存在机械音且断句不自然，上述异常对应的技术缺陷依次是？","options":[{"t":"3D渲染超时→OCR识别失败→语音克隆失真","ok":false},{"t":"文本生成错误→视频合成中断→音频采样率异常","ok":false},{"t":"文生图失败→视频理解异常一语音合成缺陷","ok":true},{"t":"多模态融合故障一抽帧算法错误→TTS模型过拟合","ok":false}],"analysis":"答案：C\n\n解析：\n1. 请求3D展示仅返回文字，说明系统未能根据文本生成图像或3D模型，属于“文生图失败”。\n2. 无法从视频中提取参数，表明系统缺乏对视频内容的分析与特征提取能力，属于“视频理解异常”。\n3. 语音有机械音且断句不自然，是文本转语音（TTS）在音色和韵律生成上的质量问题，属于“语音合成缺陷”。\n综上，选项C完全对应上述缺陷。"},{"gid":"884f69c7-1c82-4634-9c8d-6f4eb79b803b","type":"单选题","q":"一家智能客服系统初期采用了昂贵的旗舰大模型（如GPT-N），虽然效果很好，但运营发现70%的用户问题都是“如何登录”“忘记密码”这类高频简单问题。为了节约API调用成本，团队应该优先采用哪种架构调整？","options":[{"t":"微调整旗舰大模型，使其能更快地回答这些高频问题","ok":false},{"t":"先用轻量级模型识别意图按任务路由，对复杂问题调用旗舰模型","ok":true},{"t":"选择价格更低的API服务套餐","ok":false},{"t":"限制每位用户的日均提问次数，并对超出部分进行收费","ok":false}],"analysis":"答案：B\n\n解析：\n本题考察大模型应用的降本架构。70%的简单问题无需动用昂贵算力。选项B采用“意图识别+模型路由”架构，用轻量级模型处理简单问题，仅将复杂问题路由给旗舰模型，可大幅削减API成本且保障体验。选项A微调后仍调用旗舰模型，成本未降；选项C治标不治本；选项D损害用户体验，非架构调整。故B为最优解。"},{"gid":"5beef979-c7ef-4b98-a7ca-2b2c806aa09d","type":"单选题","q":"你用多模态技术开发短视频智能剪辑工具时，提出以下四个方案步骤，其中不合理的步骤是?","options":[{"t":"用 RAG 增强技术提升视频的饱和度和对比度","ok":true},{"t":"用视频理解模型分析视频中的人物动作","ok":false},{"t":"用语音合成模型为合成视频添加官方解说","ok":false},{"t":"用文生图模型将新场景与原视频人物合成","ok":false}],"analysis":"答案：A\n\n解析：RAG（检索增强生成）是自然语言处理技术，主要用于结合外部知识库提升大模型的文本生成质量，无法用于调整视频饱和度、对比度等底层像素级的图像处理任务。而B项视频理解模型分析动作、C项语音合成模型添加解说、D项生成模型进行场景与人物合成，均属于多模态技术在视觉、音频和图像生成领域的合理应用。因此A选项不合理。"},{"gid":"6df41d2d-5dbf-4f5f-80f3-65d456fa748a","type":"单选题","q":"你在优化一个多语言翻译系统，发现文学翻译经常 “失去原文意境”，而技术文档翻译经常用词生硬、难以理解。现有提示词已包含 “保持专业性” 和 “语言流畅” 要求，并添加了示例  下一步最应优先尝试的策略是？","options":[{"t":"提高温度参数（Temperature=1.0）增强灵活性","ok":false},{"t":"要求模型分两次翻译：先直译再人工润色","ok":false},{"t":"在现有模板中增加更多诗歌和手册的对照示例","ok":false},{"t":"为文学和技术翻译分别设计专用提示词模板","ok":true}],"analysis":"答案：D\n\n解析：文学翻译重意境与情感，技术文档重准确与严谨，两者对提示词和参数的要求截然相反。在单一模板中混合要求或堆砌不同风格的示例（C），会导致模型目标冲突。提高温度（A）会损害技术翻译的准确性，引入人工润色（B）则违背系统自动化初衷。因此，将任务解耦，为文学和技术翻译分别设计专用提示词模板（D），能精准匹配各自场景需求，是最有效且应优先尝试的策略。"},{"gid":"f808d02b-bdb1-4080-8e9d-e1eb2f2104d1","type":"单选题","q":"向量检索召回了 10 条切片，但部分切片与问题相关度很低，干扰了大模型答案。哪种方式能更好地过滤掉低相关度切片？","options":[{"t":"简单把生成结果截断","ok":false},{"t":"使用高温度的模型进行生成","ok":false},{"t":"结合文本重排序模型（ReRank）并只保留 Top N","ok":true},{"t":"在大模型回答后再次让用户手动删除","ok":false}],"analysis":"答案：C\n\n解析：\n在RAG架构中，向量检索虽快但精度有限，易召回噪声切片。ReRank（重排序）模型能深入理解问题与切片的语义交互，对初召结果进行二次精准打分。通过ReRank过滤并仅保留Top N高相关切片输入大模型，可从源头消除干扰，显著提升答案准确性。截断结果、调高温度或人工删除均无法在生成前有效优化输入上下文。"},{"gid":"4274821b-758b-4332-b7ea-8b554bd3503f","type":"单选题","q":"你希望让 RAG 回答用户问题时，避免用户获取到超出其可访问权限的内容，以下哪种方案更合适?","options":[{"t":"使用提示词模板，将用户的身份信息(如部门名)拼接在模板合适的位置上","ok":false},{"t":"标量 +向量混合检索:基于用户身份在其有权限的文档范围内进行向量检索","ok":true},{"t":"通过提示词引导大模型结合用户身份来做出不同的回答","ok":false},{"t":"为每个用户动态生成并维护一个完全独立的向量索引库，实时更新所有用户索引","ok":false}],"analysis":"答案：B\n\n解析：RAG权限控制的关键在检索阶段隔离。A和C依赖提示词，若敏感文档已被召回进上下文，大模型仍可能泄露信息，不安全；D为每个用户建独立索引，存储与维护成本极高，无工程可行性。B采用标量（权限元数据）+向量混合检索，在检索时直接过滤无权限文档，从源头阻断敏感数据召回，既保证数据安全，又兼顾系统性能与扩展性，是最佳实践。"},{"gid":"c9d1637d-ad83-4aa6-9211-fa91786cfc67","type":"单选题","q":"RAG 应用在处理 IT 技术文档时表现不错，但在公司内部人事流程的问答中经常答非所问。最先应该检查哪方面？","options":[{"t":"问题必须拆成多次检索","ok":false},{"t":"大模型温度过高","ok":false},{"t":"是否缺少人事流程相关文档或索引","ok":true},{"t":"大模型计算资源不足","ok":false}],"analysis":"答案：C\n\n解析：RAG应用在IT文档表现良好，说明大模型参数（如温度）和计算资源正常，排除B、D。在特定领域（人事流程）答非所问，最根本原因通常是“无知识可检索”或“检索失败”。因此，最先应排查知识库是否缺失人事相关文档或索引构建异常（选C）。问题拆分（A）属于进阶优化策略，并非首要排查的基础问题。"},{"gid":"fac1531b-ba61-4279-b591-d7be2d0da9b3","type":"单选题","q":"某创业公司开发的 “AI 法律助手” 应用，能自动生成合同条款与诉讼风险评估报告。在正式上线应用商店前，必须完成的最关键合规步骤是哪个？","options":[{"t":"获取信息系统安全等级保护三级认证","ok":false},{"t":"建立用户投诉赔偿基金","ok":false},{"t":"通过国家网信部门的大模型算法备案","ok":true},{"t":"为 AI 生成内容申请知识产权保护","ok":false}],"analysis":"答案：C\n\n解析：根据《生成式人工智能服务管理暂行办法》等规定，提供生成式AI服务上线前必须依法履行算法备案手续。“AI法律助手”属于典型的大模型生成式应用，通过网信部门的大模型算法备案是其合法上线的强制性前置合规要求。等保三级并非所有AI应用的强制前置条件，而建立赔偿基金与申请AI知识产权保护均非法定强制合规步骤。"},{"gid":"08ae5b01-b7ba-4f39-a901-f0130f16cddf","type":"单选题","q":"在为多轮对话场景设计的 RAG 应用中，大模型参与了什么步骤？","options":[{"t":"检索步骤、Query 改写步骤","ok":false},{"t":"Query 改写步骤、生成步骤","ok":true},{"t":"检索步骤、Query 改写步骤、生成步骤","ok":false},{"t":"只有生成步骤","ok":false}],"analysis":"答案：B\n\n解析：在多轮对话RAG中，用户提问常有指代或省略。大模型需先参与**Query改写步骤**，结合历史记录将问题补全为独立完整的查询，以提升检索准确率。接着，检索引擎（如向量数据库）完成**检索步骤**并返回相关文档。最后，大模型参与**生成步骤**，结合检索到的上下文生成最终回答。底层检索主要由Embedding模型和检索引擎执行，大模型不直接参与。故选B。"},{"gid":"4d587602-8f1e-4e9e-aaf5-c1baa236bb1e","type":"单选题","q":"你作为一名医学检验研究员，需翻译存在大量 “NSC”（可能指 “神经干细胞” 或 “非小细胞癌”）缩写的文献。应如何设计提示词以消除歧义？","options":[{"t":"分配角色:“作为肿瘤科医生，严格匹配癌症相关术语”","ok":false},{"t":"要求输出格式:“所有缩写后需用括号标注全称","ok":false},{"t":"提供少量上下文关联示例:“在'干细胞培养'段落中，NSC→神经干细胞;在*肺癌病理'段落中，NSC→非小细胞 癌”","ok":true},{"t":"直接提问:“请优先将NSC翻译为神经干细胞","ok":false}],"analysis":"答案：C\n\n解析：消除缩写歧义的核心是让模型根据上下文动态判断。A和D选项“一刀切”会导致特定语境翻译错误；B选项仅规范格式，未解决语义判断问题。C选项采用少样本提示策略，通过提供上下文关联示例，引导模型学习“语境-含义”的映射关系，使其能在不同段落中准确识别“NSC”的真实指代，是消除歧义最有效的方法。"},{"gid":"1111d993-a9a4-4ca4-a21c-9a97b4845dca","type":"单选题","q":"你开发了一个专用于医疗场景问答的 RAG 应用，为了找到优化方向，需要对其进行评测。以下哪个是参与评测必不可少的群体？","options":[{"t":"算法工程师。只有算法工程师才可以更理解 RAG应用的设计过程与细节。","ok":false},{"t":"数据工程师。数据工程师对数据质量、数据管道和检索系统的底层逻辑有深刻理解。","ok":false},{"t":"医疗专家。医疗专家具备领域专业知识，能够从临床实践和医学指南的角度验证 RAG 生成答案的准确性、安全性和实用性。","ok":true},{"t":"前端工程师。只有前端工程师更理解用户的交互逻辑，是最懂用户需要的群体。","ok":false}],"analysis":"答案：C\n\n解析：医疗场景对信息的准确性和安全性要求极高，容错率极低。RAG生成的医疗问答必须严格符合医学指南与临床实践。算法、数据和前端工程师虽在系统构建与交互上发挥重要作用，但缺乏医学背景，无法准确判断内容的专业性与潜在风险。因此，具备专业知识的医疗专家是验证答案准确性、安全性和实用性的核心且必不可少的群体。"},{"gid":"d5bcd2d1-a891-4e17-9cb4-c0fac14f3215","type":"单选题","q":"在检索阶段，一般是如何找到知识库中最相关的文本段的？","options":[{"t":"通过 embedding 模型比较用户输入与各文本段的语义相似度","ok":true},{"t":"找出过往历史对话经常涉及的文本段，每次回复时都输入给大模型","ok":false},{"t":"比较用户输入与各文本段的重合字数","ok":false},{"t":"由大模型来判断哪个文本段最相关","ok":false}],"analysis":"答案：A\n\n解析：在RAG检索阶段，核心是利用Embedding模型将用户查询与知识库文本转化为高维向量，通过计算向量距离（如余弦相似度）来衡量语义相似度，从而召回最相关文本。B项属于记忆机制；C项是传统字面匹配，缺乏语义理解；D项用大模型直接判断成本极高且受上下文窗口限制，无法处理大规模知识库。故选A。"},{"gid":"1b0c4b02-94ad-4da5-891a-ee994f953850","type":"单选题","q":"你想让 RAG 应用同时支持多种类型的信息查询，有些问 “人名信息”，有些问 “技术细节”。哪种 “提示词模板” 策略更适合？","options":[{"t":"对所有疑问一概使用相同的通用模板，不区分问题类型","ok":false},{"t":"先把所有问题都改成 “人事类”，让技术类问题也以人事视角回答","ok":false},{"t":"让用户在输入问题时手动指定要用哪种模板","ok":false},{"t":"根据问题类型（人事类 / 技术类）自动选择对应模板","ok":true}],"analysis":"答案：D\n\n解析：在RAG应用中，人事与技术查询需不同的关注点与回答风格。A项通用模板缺乏针对性，降低回答质量；B项强行转换视角会导致技术回答失真；C项增加用户操作负担，体验差。D项通过意图识别自动路由至专属模板，既能精准匹配需求、提升回答专业度与准确性，又无需用户手动干预，保持了良好的交互体验，是多场景查询的最佳策略。"},{"gid":"9baf1102-cb11-42eb-91ae-6830c423668a","type":"单选题","q":"你让大模型为科技新闻生成标题，但输出标题过于平淡（如 “某公司发布新产品”）。以下哪种方法，更有助于生成你想要的标题：","options":[{"t":"调整输出格式：要求标题全部大写","ok":false},{"t":"通过多轮对话，明确告诉大模型不满意：“我觉得不好，再改改”","ok":false},{"t":"先增加上下文，补充产品关键信息，如果不好再会尝试增加一些样例","ok":true},{"t":"补充新闻稿中的发布会日期、会场地址和与会者人数","ok":false}],"analysis":"答案：C\n\n解析：标题平淡通常是因为缺乏核心亮点和风格指引。C选项补充产品关键信息能让模型抓住新闻核心，提供样例（Few-shot提示）能直观展示期望的标题风格，是提升质量的最有效方法。A仅改格式无助于内容丰富；B指令过于模糊，模型不知具体改进方向；D补充的日期、地址等属于次要细节，无法帮助提炼吸引人的标题亮点。"},{"gid":"e3280264-999f-4765-8708-95095212b83d","type":"单选题","q":"某团队使用通义干问 API开发智能问答应用，为了快速实现回答实时外部问题(如“今天的天气”)的能力，可以首先使用哪种方案?","options":[{"t":"指派资源，手动开发一个天气查询插件","ok":false},{"t":"升级到最新发布的更大参数规模的模型","ok":false},{"t":"启用平台提供的联网搜索功能","ok":true},{"t":"通过多轮对话设计，引导模型回答实时问题","ok":false}],"analysis":"答案：C\n\n解析：大模型本身无法获取实时数据。选项A手动开发插件耗时费力，不符合“快速”要求；选项B升级模型参数不能解决实时联网问题；选项D多轮对话无法让模型凭空获知实时信息。通义千问API等平台内置了联网搜索功能，直接启用即可赋予模型实时检索互联网信息（如天气）的能力，开发成本最低且见效最快，是首选方案。"},{"gid":"50eb8f31-03b1-49f0-86d8-9f119dc26d43","type":"单选题","q":"你在设计儿童教育类智能应用，客户要求需同时满足安全性和趣味性。以下哪种交互方案最合理?","options":[{"t":"所有教学内容仅以全屏视频展示，观看期间禁用物理按键，视频结束后弹出知识测验","ok":false},{"t":"采用卡通语音陪伴助手，敏感操作需家长手机端二次验证，错误操作时用震动+彩色光带提示","ok":true},{"t":"主界面设置 20 个高亮功能导航按钮，点击任意区域即时播放提示音，夜间自动切换深色模式","ok":false},{"t":"内置家长监控摄像头，孩子使用超过1小时自动锁屏并通过人脸识别判断是否成年用户","ok":false}],"analysis":"答案：B\n\n解析：B方案完美平衡了安全与趣味。卡通语音与多感官反馈（震动+光带）增强了互动趣味性，符合儿童认知；敏感操作家长验证保障了安全性。A方案禁用按键缺乏互动且有安全隐患；C方案按钮过多增加认知负荷，极易误触；D方案摄像头监控存在严重隐私风险，强制锁屏体验生硬。故B最合理。"},{"gid":"9bcf0294-d591-4045-8068-39d781f797ad","type":"单选题","q":"一家重型设备制造商，为现场技术员提供 AI维修指南，但架构师要求所有历史规范都必须保留用于合规审计。你担心如果 RAG 系统引用已废弃的设计规范，可能导致维修错误。你应如何解决这个问题?","options":[{"t":"优化系统提示词，指令模型忽略旧版本并解释其选择","ok":false},{"t":"建立与原有业务系统的实时数据同步，确保数据源的唯一性。","ok":false},{"t":"获取知识块时附加版本与元数据标签，并在检索时过滤","ok":true},{"t":"在应用层过滤，输出回答前，过滤掉过期文档索引","ok":false}],"analysis":"答案：C\n\n解析：题目要求保留历史规范以备审计，故不能删除旧数据（排除B）。依赖提示词让模型忽略旧版本不可靠（排除A）。在应用层输出前过滤会导致旧文档仍被检索，占用上下文并影响生成质量（排除D）。最佳方案是在数据入库时附加版本与状态等元数据标签，在检索阶段直接通过元数据过滤仅召回最新有效规范。这既满足合规保留历史数据的需求，又从源头避免引用废弃规范。"},{"gid":"876bb175-115e-4406-b4ce-3df14731a9f2","type":"单选题","q":"一家律所的 AI 助手在分析合同风险时，频繁引用一个已被新司法解释推翻的相似案例。系统目前仅采用向量检索召回 top-k 内容。为了更好地解决此问题，应采取哪项措施?","options":[{"t":"从向量索引中定期清除所有已被新司法解释覆盖的案例","ok":false},{"t":"切换到多向量检索，为文档内容和法律实体分别创建嵌入","ok":false},{"t":"增强提示词，指令模型在生成摘要时优先采信最新日期的文档","ok":false},{"t":"生成前先结合“实效性”等业务字段进一步重排和过滤","ok":true}],"analysis":"答案：D\n\n解析：向量检索仅基于语义相似度，无法识别法律效力状态。A项直接删除旧案例成本高且易丢失历史参考信息；B项多向量检索侧重实体匹配，不解决时效问题；C项仅靠提示词无法让模型准确判断复杂的法律推翻关系，且若召回全为旧案例则无效。D项结合“实效性”等元数据字段进行过滤和重排，能精准剔除或降权失效案例，是RAG架构中解决时效与业务规则约束的标准最优解。"},{"gid":"c1e3c503-c010-4359-bbb2-5920ca78a8be","type":"多选题","q":"微调 qwen2.5 - 1.5b 模型过程中发现模型开始欠拟合，可采取的优化措施包括？","options":[{"t":"增加训练数据量","ok":false}
